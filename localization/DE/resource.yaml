eßlich E-Mail-Adresse, Telefonnummer, ID im Sozialen Netzwerk, Benutzername und Passwort. \n11. Die Administration kann alle Informationen anfordern, die zur Organisation von Veranstaltungen im Onlinespiel erforderlich sind, wenn sich der Nutzer für die Teilnahme an einem Wettbewerb oder einer Veranstaltung anmeldet, die von der Administration initiiert wird.\n12. Wenn der Nutzer mit der Geschäftsführung in Schriftverkehr tritt, oder einen Problem-Bericht mit dem Onlinespiel oder einem Spielservice einreicht, behält sich die Administration das Recht vor, sämtlichen Schriftverkehr abzuspeichern.\n13. Die Administration kann den Nutzer bitten, an Umfragen teilzunehmen, bei welchen bestimmte Informationen angefordert werden. Dies ist aber nicht obligatorisch und der Nutzer hat das Recht, die Teilnahme abzulehnen.\n14. Die Administration darf die Transaktions- und Zahlungsinformationen des Nutzers erfassen und bearbeiten, wenn der Nutzer Gebrauch von kostenpflichtigen Serviceleistungen macht.\n15. Der Browser des Nutzers oder die Client-Software kann bestimmte, detaillierte Informationen an die Administration der besuchten Webseiten des Onlinespiels und des Spielservices übertragen, einschließlich Datenübertragungsangaben, Log-Dateien, Angaben zur geografischen Lage des Nutzers und zu seinen Funktionalitäten. Der Nutzer akzeptiert hiermit, das die Administration diese Informationen für Zwecke, gemäß dieser Richtlinien nutzen darf.\n16. Zur Ausführung einiger Aktionen darf die Administration beim Nutzer andere Informationen anfordern, wie z.B.: Alter, Geburtsdatum, Geschlecht und Spielvorlieben.\n17. Die Administration kann alle Informationen erfassen, sammeln, verwenden und weiterverarbeiten, die Vereinbarung des Spiels, und Bestandteil der EULA sind. \n\nZustimmung des Nutzers\n\n18.  Gibt der Nutzer in einem Registrierungsformular kostenpflichtiger, oder anderer Serviceleistungen des Spiels persönliche Daten bekannt bedeutet dies, das der Nutzer explizit seine direkte Zustimmungen zu den Richtlinien, sowie endgültige Zustimmung zur: Sammlung, Verarbeitung, Verwendung, Speicherung, Offenlegung, Übertragung, auch zum grenzüberschreitenden Transfer (Übertragung an Drittstaaten) und zur Vernichtung aller persönlichen Daten zum Zweck der Umsetzung dieser Richtlinien, die Vereinbarung aller Dokumente, die Bestandteil der Vereinbarung sind, gibt.\n19.  Personenbezogene Daten werden ausschließlich für rechtmäßige Informationen, und insbesondere aus den folgenden Gründen gesammelt:\nVerifizierung der Nutzerinformationen;\nRegistrierung von Benutzerkonten;\nWerbe- und Marketing-Aktionen; \nEinhaltung des geltenden Rechts;\nVom Unternehmen angebotene, qualitativ geeignete Bereitstellung zusätzlicher Serviceleistungen für den Nutzer, beispielsweise technischer Support für das Spiel; und\nLeistung und Erfüllung der Vereinbarung und aller Dokumente, die Bestandteil der Vereinbarung sind, und/oder durch das Unternehmen beauftragte Zulieferer oder Dritte, die  im Auftrag des Unternehmens handeln..\n20.  Die Administration ist berechtigt, Informationen, die laut den gesetzlichen Bestimmungen keine personenbezogenen Daten darstellen, zu erfassen und zu verwenden. Der Nutzer akzeptiert, dass das Unternehmen Daten, die nicht personenbezogen sind, auch an Dritte weiter gibt.\n21.  Der Nutzer ist berechtigt, der Verarbeitung und Erfassung personenbezogener Daten zu widersprechen und kann seine Zustimmung jederzeit widerrufen, wenn die gesetzlichen Bestimmungen nichts anderes vorschreiben. Widerruft der Nutzer seine Zustimmung, nimmt er bewusst negative Auswirkungen auf die Qualität des Spiels und Online-Systeme in Kauf und ebenso, dass der Zugang zum Spiel und/oder den Serviceleistungen des Spiels nicht mehr möglich ist. Der Nutzer stimmt hiermit ausdrücklich zu, dass das Unternehmen in diesem Fall nicht für Verluste und/oder die Beschädigung personenbezogener Daten haftet.\n\nVerwendung und Verarbeitung personenbezogener Daten\n\n22.  Der Nutzer berechtigt die Administration, personenbezogene Daten zu speichern und zu verarbeiten, wenn diese  aus Sicht des Unternehmens erforderlich sind, damit das Spiel verwendet werden kann. Der Nutzer stimmt außerdem zu, dass alle Aktivitäten des Spiels protokolliert werden.\n23.  Personenbezogene Daten, die durch Nutzer weitergegeben werden können, werden von der Administration zur Gewährleistung qualitativ hochwertiger Onlinespiele und Serviceleistungen im Hinblick auf ihre Entwicklung und Verbesserung, und zur Durchführung anderer Maßnahmen gemäß der Vereinbarung und dieser Richtlinien erfasst, und verarbeitet. Die Verwendung personenbezogener Daten durch die Administration wird durch die vorliegende Richtlinien geregelt. Unter Verarbeitung personenbezogener Daten wird folgendes verstanden: Die Erfassung, Aufzeichnung, Systematisierung, Akkumulation, Speicherung, Aktualisierung, Änderung, Gruppierung, Blockierung, Verwendung, Offenlegung, Weitergabe an Dritte, Verbreitung, Vernichtung, Löschung und andere Aktionen, die zur Erfüllung der Vereinbarung notwendig sind.\n24.   Die Administration verkauft keine personenbezogenen Nutzerdaten und offenbart diese Informationen nicht Dritten, es sei denn, dass dies von diesen Richtlinien vorgesehen ist. Die Administration darf demographische oder statistische Daten an Geschäftspartner oder Werbeträger weitergeben. Dies hat keinerlei Bezug auf personenbezogene Daten und ermöglicht keine Identifizierung einzelner Nutzer.\n25.   Zur ordnungsgemäßen Bereitstellungen von Serviceleistungen behält sich die Administration das Recht vor, personenbezogene Daten an Personen oder Organisationen weiterzugeben, die Hosting-Services, Zahlungsverkehr, Versenden von E-Mails und Moderationen anbieten. Diese Personen oder Organisationen haben das Recht, die erhaltenen Informationen ausschließlich zur Erbringung der Serviceleistungen für den Nutzer zu verwenden, und sind an die Bestimmung des sachgemäßen Umgangs mit personenbezogenen Daten gebunden.\n26.   Um die Vereinbarung der Richtlinien und Spielregeln einzuhalten, erklärt sich der Nutzer gegenüber dem Unternehmen als einverstanden, alle bereitgestellten personenbezogenen Angaben und Daten an alle Geschäftspartner, zum Zweck ordnungsgemäßer und hochqualitativer Versorgung, und Verbesserung des Spiel-Service, zu übertragen.\n27.   Sollte sich der Rechtsinhaber mit einem anderen Unternehmen durch Umstrukturierung, Fusion, Verkauf, Erwerb, Liquidation oder auf eine andere Art zusammenschließen, können personenbezogene Daten der Nutzer mit dem Unternehmen oder dessen Teil verkauft oder übergeben werden.\n28.   Der Nutzer erklärt sich damit einverstanden, dass das Unternehmen berechtigt und verpflichtet ist, personenbezogene Daten bekannt zu geben, wenn eine Verfügung gemäß den gesetzlichen Bestimmungen vorliegt und/oder einer zuständigen Gerichtsbarkeit, und/oder wenn eine Verfügung einer Regulierungsbehörde, und/oder eine Verfügung des Datenschutzbeauftragten vorliegt oder ein Ereignis, bei dem der Nutzer an kriminellen Delikten beteiligt ist, das direkt und/oder indirekt mit dem Spiel oder den Serviceleistungen des Unternehmens in Verbindung gebracht werden kann.\n29.   Der Nutzer erklärt sich damit einverstanden, dass im Falle von Beanstandungen Dritter (Rechteinhaber) über eine Verletzung von Rechten an im Onlinespiel oder im Spielservice verwendeten Material durch die Nutzer, die Administration Informationen über den Nutzer an Dritte (Rechteinhaber) übergeben darf.\n30.  Wenn der Nutzer über Webseiten Dritter Spielzugang, oder sich über Webseiten Dritter und/oder Partnerunternehmen registriert hat, kann der Dritte zum Zweck eines ordnungsgemäßen und hochqualitativen Service, persönliche Daten des Nutzers anfordern, erfassen und verarbeiten. In diesem Fall kommen die Datenschutz- und Cookie-Richtlinien Dritter zur Anwendung. Der Nutzer stimmt zu, dass die Administration berechtigt ist, persönliche Daten an Dritte zum Zweck der ordnungsgemäßen und hochqualitativen Bereitstellung von Serviceleistungen, des Spiel-Service, der Umsetzung der Vereinbarung der Spielregeln und dieser Richtlinien, zu übertragen.\n\nSpeicherung personbezogener Daten\n\n31.  Die Administration trifft alle Vorkehrungen, um personenbezogenen Daten des Nutzers sicher und gemäß der Richtlinien zu speichern. Alle Nutzerinformationen werden auf Servern der Administration aufbewahrt.\n32.   Die Administration verwendet Standardtechnologien, die Firewalls einschließen, um die Sicherheit für die personenbezogenen Daten des Nutzers zu gewährleisten.\n33.   Der Nutzer verpflichtet sich, seine Identifikationsdaten, mit denen er sich im Spiel angemeldet hat, nicht an Dritte weiterzugeben. Das gilt auch für Kontodaten, mit denen eine Anmeldung beim Onlinespiel möglich ist. Der Nutzer ist in vollem Umfang für eine sichere Aufbewahrung der Kontodaten verantwortlich, und haftbar.\n34.    Sollte der Nutzer erfahren, dass seine Kontodaten Dritten bekannt geworden sind, wird er aufgefordert, uns darüber umgehend in Kenntnis zu setzen, damit die Administration Sicherheitsvorkehrungen treffen kann. Der Nutzer stimmt zu, das im Falle des Diebstahls personenbezogener Kontodaten die Administration nicht mehr für die Sicherheit persönlicher Daten garantiert. Der Nutzer stimmt außerdem zu, dass die Administration im Zusammenhang mit der Verwendung personenbezogener Daten, schaden- und klagelos bleibt.\n35.  Wenn der Nutzer innerhalb des Onlinespiels oder Spielservices kommuniziert (per Chat, Forum, etc.), ist ihm bewusst, das die Kommunikation über die Server erfolgt. Der Nutzer erklärt sich damit einverstanden, das die Daten erfasst, gespeichert und von der Administration untersucht werden können. Die Administration haftet nicht für die Verwaltung personenbezogener Daten, welche der Nutzer über Spielservices und andere Dienste (Chat, Forum, soziales Netzwerk, etc.) für Dritte zugänglich gemacht hat! Diese Informationen gelten als allgemein zugänglich.\n\nCookies, IP-Adressen und Log-Dateien\n\n36.   Die Administration kann Angaben über den Rechner des Nutzers erfassen und verarbeiten, darunter Log-Dateien, einschl. IP-Adressen, Betriebssystem-, Browser-, und E-Mail-Client, Datenübertragungsvolumen, Datum und Uhrzeit, Spielservice-Aufrufdetails, Nutzeraktivität, Zugangsinformation, Einstellungen, Systemmeldungen. Das sind statistische Daten über Aktivitäten der Nutzer in Internet. Diese Daten identifizieren den Nutzer nicht, sind nicht personenbezogen, werden zur Systemverwaltung, zur Sicherstellung der Onlinespiel- und Spielservice-Funktionalität, der Sicherheit, der Schutzerhöhung, der Vereinheitlichung der Systeme (Abwendung von Hackerattacken, unbefugten Zugriffen usw.) erfasst, und verarbeitet.\n37.  Für eine ordnungsgemäße Funktion des Spiels verwendet die Administration Cookies. Cookies sind kleine Informations -Textdateien, die auf dem Computer und/oder anderen Geräten des Nutzers automatisch erstellt, und gespeichert werden. Mit Hilfe von Cookies (Im Folgenden als “Cookies” bezeichnet) können Aktivitäten des Nutzers erkannt, und der Nutzer identifiziert werden. Cookies enthalten typischerweise keine Namen und/oder E-Mail-Adressen und/oder persönliche Daten, sondern anonyme Informationen mit dem Ziel, die Funktionalität des Spiels und/oder der Serviceleistungen zu verbessern.\n38.   Die auf dem Computer/allen anderen Geräten des Nutzers gespeicherten Cookies, die der Nutzer im Spiel und/oder mit den Materialien verwendet, haben unter anderem, ohne darauf beschränkt zu sein, folgende Funktionen: \n    a. Die Bereitstellung des Zugangs zu sicheren Bereichen, die vom Nutzer angefordert werden, ist ohne Cookies nicht möglich. Folglich können Serviceleistungen wie sichere Anmeldebereiche, nicht bereitgestellt werden.\n    b.  Besucher-Cookies, die sich die Auswahl und/oder Einstellungen des Nutzers merken und den Nutzer erkennen, wenn er das Spiel verwendet. Ohne diese Cookies ist die Funktionalität des Spiels gestört.\n    c.  Cookies für Abstimmungen (Umfragen),sie erfassen die Punkte der Umfragen, für welche der Nutzer seine Stimme abgibt und und unterbinden die wiederholte Stimmabgabe in der gleichen Umfrage.\n    d. Session-Cookies für die Ladebalance, verbessern die Ladezeiten des Spiels, verteilen die Belastung und optimieren das Timing der Serviceleistungen im Spiels. Ohne diese Cookies kann das Spiel seine Funktionalität verlieren;\n  e. Cookies zur Anpassung der Benutzeroberfläche ermöglichen, die Benutzereinstellungen der Benutzeroberfläche für ein erneutes einloggen in das Spiel und die Serviceleistungen des Spiels, zu speichern.\n     f. Cookies, zur Daten-Synchronisierung der Nutzerdaten mit Sozialen Netzwerken.\n    g. Cookies, welche die Leistung (Analytics) bewerten, sammeln anonyme Informationen, wie der Nutzer das Spiel verwendet.\n   h.  Werbecookies bieten dem Nutzer einschlägige Werbeangebote und verbessern die Effizienz von Werbekampagnen. Der Nutzer akzeptiert und stimmt hiermit zu, dass die Administration diese Cookies für eigene Werbekampagnen nutzen kann. \n39.    Die Administration kann Dritten erlauben, Cookies für Web-Analytic und Werbung auf dem Endgerät des Nutzers für Analysezwecke zu platzieren und zu verwenden, um Informationen die über Interessen des Nutzers zum Zweck, die Qualität der Serviceleistungen zu verbessern. Die Administration garantiert, dass sie nur exklusiven und vertrauenswürdigen Dritten diese Nutzung erlaubt.\n40.   Dem Nutzer ist bewusst und bekannt, dass bei der Verwendung des Spiels über soziale Netzwerke wie Facebook eventuell andere Cookie-Richtlinien gelten. Der Nutzer stimmt zu, dass die Administration  für die Verwendung von Cookies Dritter oder anderer Webseiten, keine Haftung übernimmt.\n41.   Durch der Nutzung des Spiels und/oder der Internet-Einrichtungen, oder die Annahme der Vereinbarung (einschließlich dieser Richtlinien) durch anklicken auf  \"Bestätigen\" im Registrierungsformular, akzeptiert der Nutzer die Richtlinien und drückt  seine direkte und endgültige Zustimmung aus, dass die Administration Cookies auf dem Computer/dem Gerät, das der Nutzer für das Spiel und/oder dessen Material nutzt, ablegen, speichern und verwenden darf. Die Administration unterstellt, das der Nutzer den Richtlinien zustimmt, solange Cookies in den Browsereinstellungen, wie hier beschrieben, nicht deaktiviert werden. Mit seiner Zustimmung ermöglicht der Nutzer, unter Berücksichtigung der Nutzerinteressen, die Entwicklung, Qualität und das Serviceangebote des Spiels fortlaufend zu verbessern. Der Nutzer akzeptiert, dass das Spiel ohne die Aktivierung von Cookies nicht ordnungsgemäß funktioniert.\n43.  Die Administration garantiert, dass die gespeicherten Cookies für den Nutzer sicher und absolut notwendig für die Funktion des Spiels, der Serviceleistungen des Spiels, und  Serviceleistungen für den Nutzer, sind\n44.   Die Cookies werden nicht länger als ein Jahr gespeichert. Die Fristen für die Speicherung der Cookies durch Dritte, werden vom Dritten festgelegt.\n45.   Der Nutzer ist berechtigt, Cookies auf seinem Rechner abzulehnen oder  zu löschen, indem er die Browser-Einstellungen ändert. Dies kann die Qualität der Services für den Nutzer beeinträchtigen und den Zugriff auf einige Dienste für den Nutzer unmöglich machen. Der Nutzer stimmt zu, dass die Administration im Verlustfall und/oder Beschädigungen personenbezogener Daten aufgrund Cookie-Deaktivierung, nicht haftbar gemacht werden kann.\n\nAbrufen und Veränderung personenbezogener Daten\n\n46.   Der Nutzer ist berechtigt, eine Kopie der durch die Administration gespeicherten personenbezogenen Daten anzufordern, um gegebenenfalls Ungenauigkeiten zu korrigieren. Der Nutzer hat das Recht: Die Löschung, Richtigstellung, Veränderung oder Vervollständigung persönlicher Daten zu fordern. Für den Fall, das personenbezogene Daten abgefragt werden, muss der Nutzer die Administration per E-Mail help@tankionline.com. kontaktieren.\n\nVerweigerung der Bereitstellung personenbezogener Daten\n\n47.  Die Bereitstellung personenbezogener Nutzerdaten erfolgt freiwillig. Davon abgesehen kann die Administration nicht garantieren, dass das Spiel und/oder die Serviceleistungen des Spiels ordnungsgemäß funktionieren, und/oder überhaupt funktionieren, wenn die angeforderten persönlichen Daten nicht bereitgestellt werden.\n\nSoziale Netzwerke\n\n48.    Sie stimmen ausdrücklich zu, dass Sie bei der Nutzung des Spiels über Webseiten Sozialer Netzwerke oder Dritten, auch den dort geltenden Bestimmungen und Bedingungen unterliegen.\n\nVeränderungen der Richtlinien\n\n49.     Diese Richtlinien sind mit dem Datum der letzten Fassung gültig. Diese Richtlinen können geändert, ergänzt und jederzeit und in jeder Form ersetzt werden, ohne dass der Nutzer darüber vorher informiert wird. Dem Nutzer wird daher empfohlen die Richtlinien regelmäßig zu lesen, um sich über vorgenommene Änderungen auf dem Laufenden zu halten. Die weitere Nutzung des Onlinespieles und des Spielservices bedeutet die vorbehaltlose Zustimmung der geänderten Richtlinien.\n\nKontakt zur Administration\n\n50.     Nehmen Sie bei Fragen, Hinweisen, Beschwerden oder Kommentaren in Bezug auf diese Richtlinien bitte unter help@tankionline.com Kontakt zu uns auf. Wir bearbeiten Ihre Fragen so schnell wie möglich.\n51.     Die Administration ist berechtigt, unangemessen häufig wiederholte Anfragen, die einen unverhältnismäßig hohen Aufwand erfordern, die Privatsphäre anderer Nutzer gefährden oder extrem schwer auszuführen sind, abzulehnen.\n52.     Tritt der Nutzer in Kontakt mit der Administration oder sendet einen Fehlerbericht über Probleme mit dem Spiel oder mit den Serviceleistungen des Spiels, ist die Administration berechtigt, die gesamte Korrespondenz zu speichern."
