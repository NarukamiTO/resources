  GAME_PRIVACY_POLICY: "Datenschutz- und Cookie-Richtlinien\n\nDie APL Publishing Ltd, registration no. C 85285, registered under the laws of Malta, 157, Archbishop Street Valletta, VLT1440, Malta, (nachstehend \"Administration\", “Unternehmen”, genannt) ist ausschließlicher Rechtinhaber am Onlinespiel und achtet das Recht der Nutzer zum Schutz personenbezogener Daten. Die Administration ist sich über die Bedeutung der Daten, die sie von den Nutzern erhält, bewusst. Die Administration bestätigt die vorliegenden Datenschutz- und Cookie-Richtlinien (nachstehend \"Richtlinien\" genannt), welche die Nutzer über die Verwendung ihrer personenbezogenen Daten informiert.\n\nDie vorliegende Richtlinien beinhalten die Erfassung, Nutzung, Bearbeitung, Speicherung, Weitergabe und Löschung von personenbezogenen Daten der Nutzer; die Bestimmung über den Schutz der personenbezogenen Daten der Nutzer; die Bestimmung über die Art, den Zweck, die Platzierung und Löschung von Cookies auf den Geräten der Nutzer. Außerdem verdeutlichen die Richtlinien, wie personenbezogene Daten eingesehen, aktualisiert oder gelöscht werden können, sobald dies nötig werden sollte.\nDie Endbenutzer-Lizenzvereinbarung (im Folgenden als \"Vereinbarung\" bezeichnet), die Spielregeln sowie andere Dokumente, die innerhalb des Onlinespiels und der Spielservices platziert wurden, sind Bestandteil der vorliegenden Richtlinien. Die vorliegende Richtlinien ihrerseits sind Bestandteil der Vereinbarung, der Spielregeln, sowie anderer Dokumente des Onlinespiels und des Spielservices. Diese Richtlinien gelten nur für die Webseiten und Services des Onlinespiels, und nicht für andere Webseiten und Services.\n\nJegliche Nutzung des Onlinespiels und seiner Objekte bedeutet, dass Sie der unten aufgeführten Vereinbarung zustimmen, und deren Bestimmungen durch anklicken auf \"Bestätigen\", vorbehaltlos anerkennen.\n\nSollten Sie Mit einer Bestimmung dieser Richtlinien nicht einverstanden sein, haben Sie kein Recht auf die we