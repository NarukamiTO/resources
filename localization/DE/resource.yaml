ernehmen übernimmt keinerlei Gewährleistung. Der Nutzer trägt alle Risiken im Zusammenhang mit dem Zugriff und/oder dem Spielen ebenso, wie für die Nutzung des Online-Systems.\n2. Das Unternehmen bemüht sich, das Spiel und das Online-System jederzeit zugänglich zu machen. Das Unternehmen garantiert jedoch nicht, das Spiel und Online-System jederzeit zugänglich und fehlerfrei sind.\n \nMissbrauch der Webseite\n \n1. Die Webseite darf nur für gesetzmäßige Zwecke verwendet werden. Die Nutzung der Webseite für die Übertragung, den Vertrieb, die Veröffentlichung oder Speicherung von Material auf oder über die Webseite, die gegen geltendes Recht oder Vorschriften verstoßen, oder die Rechte Dritter verletzen, sind strengstens untersagt. Dazu zählen (ohne Einschränkung) die Übertragung, der Vertrieb, die Veröffentlichung oder Speicherung von Material auf der Webseite oder über die Webseite im Zusammenhang oder mit dem Zweck des Verstoßes gegen das Urheberrecht, im Zusammenhang mit Obszönitäten oder  Rechtsverletzungen Minderjähriger, oder von Aktivitäten, die illegal, belästigend, verleumderisch, diffamierend sind und gegen Datenschutzrechte verstoßen, betrügerisch sind, oder gegen Transaktions- und Glücksspielgesetze verstoßen.\n2. Bei Missbrauch und/oder Missbrauch der Webseite behält sich die Administration das Recht vor, das Benutzerkonto des Nutzers zu schließen, und ihn an der weiteren Nutzung und/oder dem Zugang zum Spiel\nund zur Webseite zu hindern, und/oder ein Verfahren oder andere rechtliche Schritte gegen den Nutzer einzuleiten, die das Unternehmen für angemessen erachtet.\n \n \nRegeln für das Chatten\n \n1. Das Forum, der Chat-Room und/oder die von Tanki-Online angebotenen Community-Serviceleistungen beabsichtigen, eine angenehme und unterhaltsame Atmosphäre und Umgebung bereit zu stellen. Obszöner und verletzender Sprachgebrauch wird deshalb nicht toleriert. Nutzern, die darauf bestehen, anstößiges und obszönes Vokabular zu verwenden, werden die Chat-Zugriffsrechte entzogen, und alle Benutzerkonten gestrichen.\n2. Dem Nutzer ist bekannt, dass persönliche Informationen, die er veröffentlicht oder auf die Webseite hochlädt, öffentlich und für andere Nutzer zugänglich ist. Tanki Online unterstützt diese Inhalte nicht, und haftet nicht für die Schäden, die durch die Veröffentlichung dieser Informationen entstehen. Den Nutzern sollte bewusst sein, dass Informationen, die sie auf der Webseite einstellen, auch offline ihr Leben beeinflussen können.\n3. Inhalte werden auf dem Server des Unternehmens nicht dauerhaft, oder lediglich temporär zu Archivzwecken gespeichert. Deshalb kann Tanki Online ohne dazu verpflichtet zu sein, Sicherungskopien aller, auf der Webseite eingestellten Materialien, erstellen. Das Unternehmen behält sich das Recht vor, den maximalen Speicherplatz jedes Benutzers zu begrenzen.\n4.Das Unternehmen behält sich das Recht vor, Inhalte nach alleinigen Ermessen zu löschen, zu verschieben oder zu bearbeiten, wenn es der Auffassung des Unternehmens nach anstößig ist, oder gegen Gesetze und/oder Vorschriften und/oder die Spielregeln verstoßen. Für den auf der Webseite eingestellten Inhalt haftet ausschließlich der Nutzer. Entfernt die Administration  bestimmtes Material nicht, bedeutet dies unter keinen Umständen, dass das  Material unterstützt, oder angenommen wird.\n \nBenutzerkonten\n \nEröffnung eines Benutzerkontos\n \n1. Das Benutzerkonto muss vom Nutzer persönlich registriert werden. Die Administration behält sich das Recht vor, die Registrierung eines Benutzerkontos auf der Webseite nach eigenen Ermessen und ohne vorherige Erläuterung, abzulehnen..\n2. Der Nutzer ist dafür verantwortlich, dass die Einträge im Spiel aktuell sind. Insbesondere gilt das für die E-Mail-Adresse. Der Nutzer ist verpflichtet, die Administration unverzüglich über Änderungen personenbezogener Daten zu informieren.\n3. Tanki Online untersagt dem Nutzer strengstens, das Benutzerkonto (Benutzerkonten) zu verkaufen, zu übertragen und/oder von anderen Nutzern Benutzerkonten zu erwerben. Es ist dem Nutzer untersagt, Mittel/Kristalle zwischen verschiedenen Benutzerkonten auszutauschen.\n4. Die Administration behält sich das Recht vor, die Registrierung eines Benutzerkontos zu verweigern und oder abzubrechen, wenn festgestellt wird, dass die angegebenen Informationen falsch, ungenau, vorsätzlich falsch oder unvollständig sind.\n \nBenutzernamen\n \n1. Bei der Registrierung des Benutzerkontos hat der Nutzer das Recht, einen Benutzernamen zu wählen. Die Administration behält sich das Recht vor, den Benutzernamen, nach eigenen Ermessen, vor, während und nachdem der Benutzername veröffentlicht oder genehmigt wurde, abzulehnen.\n2. Wenn das Benutzerkonto, abgesehen vom gewählten Benutzernamen, der EULA entspricht, gibt die Administration dem Nutzer die Möglichkeit, einen anderen Spitznamen und/oder Benutzernamen zu wählen.\n \nPasswort - Sicherheit\n \n1. Die Administration haftet nicht für mögliche Zugriffe Dritter auf das Benutzerkonto, und kann zudem nicht für eventuelle Verluste aufgrund unbefugter Verwendung des Nutzer-Logins und Nutzer-Passworts durch Zugriff Dritter, und/oder für Transaktionen, bei denen sich der Nutzer korrekt mit Login und Passwort angemeldet und registriert hat, in Haftung genommen werden.\n2. Das Unternehmen übernimmt keine Haftung, wenn der Nutzer sein Passwort vergisst, verlegt oder verliert, außer für den Fall, das der Verlust durch einen Fehler seitens des Unternehmens verursacht wurde. Das Unternehmen ist nicht verpflichtet, Login und Passwort während des Rechtsverhältnisses mit dem Nutzer zu speichern.\n \nSchließung des Benutzerkontos\n \n1. Der Nutzer ist berechtigt, sein Benutzerkonto zu schließen und die Vereinbarung jederzeit zu kündigen, indem er das Benutzerkonto schließt und/oder eine E-Mail an die Administration unter der E-Mail Adresse help@tankionline.com sendet.\n2. Meldet sich der Nutzer über einen Zeitraum von sechs (6) aufeinander folgenden Monaten nicht