piel kaufen, und in Anspruch nehmen. Der Kauf von Kristallen darf nur von autorisierten Dritten vorgenommen werden.\n2. Tanki Online untersagt  außerhalb des Spiels jegliche Übertragung virtuellen Eigentums/Kristallen. Der Verkauf, die Gewährung oder der Austausch aller Materialien, Kristallen und/oder Objekte des Spiels außerhalb der Spielumgebung, ist unzulässig\n3. Kostenpflichtige Serviceleistungen werden ab dem Moment der Übertragung der Kristalle auf das Benutzerkonto bereitgestellt. Dem Nutzer ist bekannt, dass er ab dem Moment der Kritall-Übertragung auf das Benutzerkonto sein  Widerrufsrecht verliert, und von den kostenpflichtigen Serviceleistungen nicht mehr zurückzutreten kann.\n \n \nKauf von Kristallen\n \nPreise\n \n1. Die Auflistung und Preisgestaltung kostenpflichtiger Serviceleistungen ist die alleinige Entscheidung des Unternehmens, und kann jederzeit geändert werden.\n2. Tanki Online haftet nicht für den Erhalt und/oder die Verarbeitung der Zahlungen der Nutzer, einschließlich Aufschüben, die durch Probleme beim Empfang der Zahlung auftreten. Alle Zahlungen des Nutzer sind freiwillig, endgültig, und können nicht zurückerstattet werden. \n \nZahlungsmethode\n \n1. Der Kauf von Kristallen erfolgt einzig über die Zahlstelle mit einer der folgenden Methoden und/oder anderen Methoden, die von der Webseite angeboten werden:\na. Kreditkarte;\nb. Prepaid-Karte;\nc. PayPal;\nd. SMS;\ne. Zahlung per mobile Geräte; und\nf. Sonstige.\n2. Der Nutzer bestätigt, dass die Mittel seines Benutzerkontos nicht aus illegalen Quellen stammen. Der Nutzer erklärt, dass er die Webseite und die Software nicht dazu verwendet, um illegale Mittel aus illegalen Quellen zu transferieren. Der Nutzer verwendet die Webseite und/oder das Spiel nicht für rechtswidrige oder betrügerische Aktivitäten (einschließlich Geldwäsche) und gemäß geltendem Recht aller Gerichtsbarkeiten, denen der Nutzer untersteht. Die Administration behält sich bis zur endgültigen Klärung eines diesbezüglichen Problems das Recht vor, jederzeit die Verwendung des Benutzerkontos zu unterbrechen, oder das Benutzerkonto (die Benutzerkonten) zu sperren, wenn  auch nur geringsten Zweifel an der Legalität, an den vom Nutzer verwendeten Quellen und  Mittel, bestehen.\n \nWährung der Zahlung\n \nAlle Zahlungen auf und vom Benutzerkonto müssen in der Währung, die von der Zahlstelle von Zeit zu Zeit angeboten wird, erfolgen. Alle Einzahlungen auf das Benutzerkonto müssen aus Zahlungsquellen stammen, deren Inhaber der Nutzer  ist.\n \n \n \nSchutz Minderjähriger\n \n1. Das Unternehmen garantiert, das es zum Schutz Minderjähriger verpflichtet ist. Das Unternehmen empfiehlt den Erziehungsberechtigten und/oder gesetzlichen Vertretern Minderjähriger, mehr Zeit mit ihren Kindern zu verbringen wenn sie im Internet sind, und die Nutzung des Spiels, der Webseite und des Benutzerkontos, aller Kommunikationsmittel und/oder Zahlungen für verfügbare Serviceleistungen, zu überwachen.\n2. Bei minderjährigen Nutzer, ist für die Registrierung eines Benutzerkontos die vorherige Einwilligung der Erziehungsberechtigten, oder/und gesetzlichen Vertreter erforderlich. Die Verwendung der auf der Webseite angebotenen Zahlungsmethoden durch Minderjährige, setzt diese Zustimmung voraus.\n3. Ist der Nutzer minderjährig, müssen die Erziehungsberechtigten oder gesetzlichen Vertreter, anstelle des Minderjährigen das Registrierungsverfahren für das Benutzerkonto beim Unternehmen durchführen. Die Erziehungsberechtigten oder der gesetzliche Vertreter stimmen hiermit zu, dass sie/er die volle Verantwortung für die aus der EULA entstandenen Verpflichtungen, und alle Aktivitäten des Minderjährigen in Bezug auf die Verwendung es Spiels, der Webseite und/oder des Benutzerkontos übernehmen. Dies umfasst ebenso jede indirekte Verwendung, einschließlich aller Zahlungen, die durch die Verwendung des Logins und/oder des Benutzerkontos wirksam werden.\n4. Das Unternehmen behält sich das Recht vor, von den Erziehungsberechtig