ischen dem Nutzer und des Unternehmens in Bezug auf den Gegenstand dar, und ersetzt alle vorherigen Vereinbarungen zwischen den Parteien in Bezug auf den Gegenstand.\n2. Die in der EULA enthaltenen Überschriften sind nur zur bequemen Bezugnahme eingefügt worden und nicht Teil der EULA. Sie beabsichtigen zudem nicht, die Bedeutung und Interpretation der Begriffe und Bestimmungen zu beeinflussen. Worte im Singular schließen den Plural ein und umgekehrt. Worte im männlichen Geschlecht schließen das weibliche ein- und umgekehrt.\n3. Im Fall, dass einer dieser Begriffe, Konditionen oder Bestimmungen von zuständigen Behörden für ungültig, nicht rechtmäßig oder nicht durchsetzbar erklärt wird, werden sie vom übrigen Text getrennt. Die übrigen Begriffe, Konditionen und Bestimmungen sind weiterhin, im rechtlichen zulässigen Maß in vollem Umfang rechtskräftig.\n \nKontakt zur Administration\n \n1. Nehmen Sie bei Fragen, Hinweisen, Beschwerden oder Kommentaren in Bezug auf diese Richtlinien bitte unter help@tankionline.com Kontakt zu uns auf. Wir bearbeiten Ihre Fragen so schnell wie möglich.\n2. Tritt der Nutzer in Kontakt mit der Administration oder sendet einen Fehlerbericht über Probleme mit dem Spiel oder mit den Serviceleistungen des Spiels, ist die Administration berechtigt, die gesamte Korrespondenz zu speichern.\n \n"
