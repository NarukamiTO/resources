nd Schäden, die dem Nutzer oder Dritten durch die Nutzung der Webseite, des Spiels oder des Online-Systems entstehen, einschließlich, jedoch nicht darauf beschränkt, für die Unfähigkeit das Spiel und das Online-System zu nutzen. Das Unternehmen haftet nicht für direkte oder indirekte Schäden, die durch Aktivitäten Dritter hervorgerufen werden, einschließlich anderer Nutzer des Spiels, fehlenden Zugang zum Internet, Diebstahl, Zerstörung von Material, Informationsverluste in Bezug auf das Benutzerkonto und jeglicher Verletzung der Ehre und Würde, sowie einer Geschäftsschädigung des Nutzers, die im Zusammenhang mit dem Spiel stehen.\n2. Wird das Unternehmen vom einem, für das Unternehmen zuständigen Gericht oder einer vergleichbaren rechtskräftigen und zuständigen Instanz zu Schadenersatz verurteilt, ist die Summe des Schadenersatzes auf eine Gesamthöhe von 100 EURO, für alle Ansprüche eines einzelnen Nutzers beschränkt.\n3. Der Nutzer übernimmt die volle Verantwortung/Haftung, für die von ihm im Spiel platzierten Materialien, oder die im Zusammenhang mit der Nutzung des Online-Systems stehen.\n4. Keine der Parteien haftet gegenüber der anderen Partei in Bezug auf Umstände, die abgesehen von dieser Bestimmung, einen Verstoß gegen die EULA darstellen, oder durch höhere Gewalt verursacht wurden. Explizit sind das Umstände, die außerhalb jeglicher Kontrolle aller Parteien stehen, einschließlich, jedoch nicht darauf beschränkt, höhere Gewalt, Gefahren der See- und Luftfahrt, Feuer, Überschwemmungen, Dürren, Explosionen, Sabotage, Unfälle, Boykott, Unruhen, Aufruhr, und/oder Handlungen staatliche Behörden wie Regierungsgesetze und Parlamentsbeschlüsse.\n5. Der Nutzer erhebt/fordert gegen das Unternehmen, und alle Partnerunternehmen keinerlei Schadenansprüche, die durch die Nutzung, den Zugang des Nutzers zum Spiel, und Online-System entstehen. \n \nStreitschlichtung und geltendes Recht\n \n1. Die Parteien sind sich einig, das für diese EULA, gemeinsam mit allen Dokumenten,