  GAME_RULES: "Kurzfassung der Spielregeln\n \nIm Spiel ist verboten:\n \n- Bots, Software von Drittanbietern und Bugs auszunutzen;\n- sich für die Administration auszugeben;\n- Hochleveln, andere Spielern zu behindern;\n- Werbung, politische Propaganda;\n- Missachtung gültiger Gesetze, darunter auch Urheberrechtsgesetze;\n- Verkauf und Weitergabe von Benutzerkonten;\n- Fraud (Betrug), andere betrügerische Aktivitäten\n \nIm Chat und Forum ist verboten:\n \n- Beleidigungen, Drohungen, Verleumdung;\n- Schimpfwörter, auch absichtlich versteckte;\n- Flood, Flame, Spam, mit Großbuchstaben schreiben (CAPS LOCK);\n- Entlocken von Passwörtern und anderen Benutzerdaten;\n- Trollen;\n- Anstiftung Dritter zu Regelverletzungen;\n- Öffentliche Diskussionen über Handlungen von Moderatoren und der Administration;\n- Publizierung von gesetzlich verbotenen Inhalten;\n- Publizierung von Links, die zur Ressourcen von Drittanbieter führen;\n- Diskriminierung in jeder Form.\n \nSpielregeln\n \nSie befinden sich im Spiel “Tanki Online”, in dem Menschen aus aller Welt Spaß haben, tonnenschwere Kampffahrzeuge bedienen um erbitterte Schlachten zu führen! Jeder Spieler kann für sich selbst auf die Schlachtfelder ziehen, oder sich zu Teams zusammenschließen, und Seite an Seite mit Freunden gemeinsam um den Sieg kämpfen, dabei kommunizieren und neue Kontakte knüpfen.\n„Tanki Online“ ist sowohl ein leicht bedienbares Multiplayer- Actionsspiel, als auch ein Schauplatz ernster Wettkämpfe und zudem eine Kommunikationsplattform mit netten Kontakten.\nNach der Registrierung wird jedem Spieler ein virtueller Panzer und 500 Kristalle (Spielgeld) zur Verfügung gestellt. Indem der Spieler Schlachten gewinnt, verbessert er sein Rating, erwirbt neue Ränge und bekommt weitere Kristalle.\nDie Kristalle können zur Beschaffung der im Kampf notwendigen Versorgungsgüter, und zum Kauf/Verbesserung von Waffen, Panzerrümpfen und Schutzfarben eingesetzt werden.\n“Tanki Online” ist nicht nur ein spannendes Spiel, sondern auch der Zusammenschluss von Menschen mit ähnlichen Interessen. Im Umgang miteinander legen wir viel Wert auf gegenseitigen Respekt und Höflichkeit, und befürworten keine Aktivitäten, die regelwidrig und für andere Nutzer beleidigend sind.\nDie Administration “Tanki Online” behält sich das Recht vor, Nutzer bei der Kommunikation einzuschränken, erworbene Punkte zu reduzieren und  Accounts zu blockieren, wenn die vorgegebenen Regeln verletzt werden.\n \n\n\n\nAllgemeine Bestimmungen\n \nDiese Spielregeln sind integrierter Bestandteil des Benutzer-Lizenzvertrags (im folgenden “Vertrag” genannt) und sonstiger Spielunterlagen und Spielservices.\nDer Vertrag, die Datenschutz- und Cookierichtlinien, sowie sonstige Unterlagen, die das Spiel oder die Spielservices beinhalten, sind ihrerseits integrierender Bestandteil dieser Regeln.\nAlle in diesen Regeln verwendeten  Bedingungen und Begriffe werden im Sinne des Vertrags verstanden. Durch die Nutzung des Spiels und/oder der Spielregistrierung, sowie beim Drücken auf “Bestätigen” wird vom Nutzer bestätigt, dass er diese Spielregeln gelesen und verstanden hat, damit einverstanden ist und alle Bedingungen vorbehaltlos akzeptiert.\nDiese Spielregeln sind verbindlich und müssen von allen Nutzern eingehalten werden. Wenn Sie mit den Bestimmungen dieser Spielregeln nicht einverstanden sind, haben Sie keine Berechtigung, das Spiel und die angebotenen Serviceleistungen zu nutzen und sind verpflichtet, die Webseite umgehend zu verlassen.\n \n \n1. Verboten sind Nicknamen (User-Namen) die:\n \n1.1. Kraftausdrücke, Schimpfwörter, Beleidigungen enthalten oder Beleidigungen provozieren (in Form von Wörtern, Abkürzungen, Ausdrücken oder Sätzen);\n1.2. rassistische, faschistische, beleidigende Elemente enthalten; Nicknamen, die nach nationalen oder religiösen Merkmalen ausgewählt wurden, oder Hass, Intoleranz und/oder internationale Auseinandersetzungen schüren;\n1.3. zu Gewalt, Terrorismus, Extremismus und/oder Massenunruhen aufrufen;\n1.4. politische Propaganda und politische Werbung jeglicher Art beinhalten;\n1.5. mit politischen Organisationen (Politikern) im direkten oder indirekten Zusammenhang stehen, darunter auch solche, die politische Verbrechen, Verbrechen gegen die die Menschheit oder Terroranschläge begangen haben;\n1.6. Diskriminierung aufgrund von Geschlecht, Alter, Religion oder anderen Merkmalen enthalten;\n1.7.direkte oder indirekte Propaganda und Aufrufe zum Konsum von alkohol- oder spriritushaltigen Produkten, Bier, Tabakwaren, Drogensubstanzen, toxischen, psychotropen und/oder betäubenden Mitteln und deren Bestandteilen oder Informationen über Orte und Methoden, zur Herstellung, den Anbau und Erwerb, sowie die Nutzung und Anwendung dieser Stoffe;\n1.8. Informationen und  Aufrufe zur Teilnahme an Glücksspielen, Prostitution, Landstreicherei und Bettlerei beinhalten;\n1.9. Informationen über  jegliche Arten des Suizid, Aufrufe zum Suizid, Gewalt oder andere lebens- und/oder gesundheitsbedrohende Handlungen beinhalten;\n1.10. Aufrufe zum rechtswidrigen Verhalten, Gewalt, Grausamkeit, Beschädigung fremden Eigentums, Anstiftung zur gesetzwidrigen Handlungen, rechtfertigen oder anregen;\n1.11. Teile von Administrator-Nicknamen oder Informationen, die dazu führen können, dass  Nutzer versehentlich für Administratoren gehalten werden, beinhalten;\n1.12. Kritik am Spiel, und/oder an den Administratoren oder Moderatoren beinhalten;\n1.13. direkte oder indirekte Verbindung zum Geschlechtsverkehr, Gewalt, Pornographie oder Pädophilie herstellen;\n1.14. im Zusammenhang mit der Beschreibung des Körpers und dessen biologischen Funktionen oder Reflexe stehen;\n1.15. Werbung oder Hyperlinks beinhalten;\n1.16. Hinweise auf Cheats, Cheat-Webseiten oder Ressourcen, durch die jegliche Rechte der Administration verletzt werden können, enthalten;\n1.17. aus schwer aussprechbaren, frei gewählten Buchstaben bestehen (Flood-Nicknamen);\n1.18. komplett oder teilweise, durch Autorenrecht geschützte und (oder) eingetragene Elemente von Handelsmarken beinhalten;\n1.19. andere Informationen, die durch folgende Regeln, den Vertrag, und/oder die geltende Gesetzgebung verboten sind, enthalten.\n1.20. Entspricht der Nutzer-Nickname im Spiel nicht diesen Anforderungen oder sonstigen Anforderungen, die durch diese Regeln, diesen Vertrag und/oder die geltende Gesetzgebung festgelegt wurden, sind die Administratoren, nach eigenen Ermessen berechtigt:\n-den Nutzer aufzufordern, seinen Spiel-Nicknamen durch einen zulässigen Nicknamen zu ersetzen, und den Nutzer-Account für die Zeit, die zur Änderung des Nicknamens erforderlich ist, zu sperren;\n -den Nutzer-Account unwiderruflich zu sperren.\n\n \n2. Es ist verboten und dem Nutzer droht (nach Ermessen der Administratoren) eine dauerhafte oder vorübergehende Sperrung seines Accounts, Verringerung aller virtuellen Werte im Spiel (Garage, Kristalle, Spielstatistik) in Höhe von 10% bis 100%, oder eine Account-Rücksetzung, dauerhafter oder vorübergehender Einschränkung des Zuganges zu den Spiel-Chats und zum Forum (Ban):\n \n2.1. Jede Form von unsportlichen oder unhöflichen Verhaltens im Spiel:\n \n2.1.1. Benutzen von Bots (Programme, die Nutzer-Aktivitäten im Spiel imitieren),  Click-Programme, Makros die Tastatur und Maus steuern sowie die Anwendung von Drittanbieter Software, durch die Vorteile im Spiel ermöglicht werden;\n2.1.2. Anwendung oder Verbreitung von Drittanbieter Software oder anderer Mittel zur Verbesserung/Automatisierung der Spielmöglichkeiten (sogenannte Bots oder Cheats), sowie Programme, die die Funktionen des Spiels verschlechtern können, elektronische Geräte Dritter;\n2.1.3. Programmfehler (Bugs) auszunutzen und Informationen ihrer Existenz an Dritte, außer an die Administration, weiterzugeben;\n2.1.4.  Punkteerhöhung mittels Inaktivität oder Hilfe von Spielern eines anderen Teams in den Spielmodi “Capture The Flag”, “Team Deathmatch” und \"Control Points\" oder Gegnern im Spielmodus “Deathmatch” (sog. Hochleveln);\n2.1.5. Kämpfe zwischen den Accounts eines Spielers durchzuführen;\n2.1.6. Ergänzende Accounts zu erstellen um den Hauptaccount hochzuleveln;\n2.1.7.  Nach Absprache mit anderen Spielern die Kämpfe nicht in voller Kraft auszuführen, um den eigenen Account hochzuleveln. Bei der Aufdeckung solcher Schlachten werden alle Spieler bestraft;\n2.1.8. Durchgeführte oder unterlassene Aktivitäten zum Zweck der Behinderung des eigenen Teams im CTF, TDM und CP-Modus. Aktivitäten, die gegen das eigene Team gerichtet sind und der Team schaden. Zerstörung der Panzer von Team-Mitgliedern, Verschwörung mit dem Gegner, Sabotage;\n2.1.9. Diskriminierung unerfahrener Nutzer (Noobs): Irreführung, Einschüchterung, Verspottung;\n2.1.10. Beleidigungen, Verleumdungen (bewusste Verbreitung falscher Informationen) gegenüber anderen Nutzern, Administratoren, Moderatoren und/oder anderen Personen;\n2.1.11. Jede Form der Spielmanipulation oder Verschwörung;\n2.1.12. Aktivitäten auszuüben, die sich negativ auf die Entwicklung des Spiels auswirken;\n2.1.13. Andere Formen unsportlichen Verhaltens, die den normalen Spielablauf behindern, und von den Administratoren als solche erkannt/anerkannt werden.\n \n \n2.2. Jede Form betrügerischer Handlungen, insbesondere:\n \n2.2.1. Das Spiel und/oder den Spielservice für betrügerische Handlungen zu benutzen. Darunter auch, aber nicht ausschließlich, betrügerische spielinterne Finanzoperationen, Betrug bei Transaktionen, Zahlungen, einschließlich  Rückerstattungen verbotener Transaktionen;\n2.2.2. Übergabe des Accounts oder anderer Spielwerte an Dritte; Informationen zu veröffentlichen, die das Vorhaben enthalten, den Account oder Spielwerte zu verkaufen, zu kaufen, oder zu übergeben, sowohl unentgeltlich, als auch gegen Kristalle oder Geld; zu solchen Handlungen anstiften;\n 2.2.3 Alle Versuche, das Passwort sowie andere Informationen zum Benutzerkonto oder andere persönliche Informationen von einem Nutzer und/oder von einem verwandten Service zu bekommen, auch in Form von Erpressung, Drohungen, moralischer, körperlicher oder technischer Einwirkung;\n2.2.4. Verbreitung persönlicher Informationen über andere Nutzer oder Dritte (falls solche Informationen nicht allgemein zugänglich sind);\n2.2.5. Fraud, der Erhalt spielinterner Währung mittels betrügerischer Methoden;\n2.2.6. Alle Versuche, sich für ehemalige oder aktive Administratoren oder Projekthelfer (Moderator, Konsultant usw.) auszugeben, darunter auch das Versenden von Nachrichten im Namen von Administratoren oder Moderatoren;\n2.2.7. Jegliche Art von Bettlelei, darunter auch Bitten, Geld zu überweisen und/oder Spielwerte oder Kristalle zu übergeben;\n2.2.8. Veröffentlichung von den Links für externe Ressourcen, die als offizielle Spielressourcen getarnt sind.\n \n \n2.3. Sonstiges Regelverstöße:\n \n2.3.1. Anwendung von Schimpfwörtern, Kraftausdrücken, anderen unhöflichen und/oder groben Wörtern (Ausdrücken), die nicht zu den Kraftausdrücken gehören (auch in verschleierter Form);\n2.3.2. Veröffentlichung von Informationen und Materialien sexueller, erotischer oder pornographischer Art. Darstellung oder Beschreibung vom Geschlechtsverkehr zwischen Menschen;\n2.3.3. Veröffentlichung von Informationen oder Symbolen, die Gefühle von Gläubigen beleidigen oder erniedrigen, Hass und Feindschaft, nationale oder ethische Auseinandersetzungen schüren, zu Intoleranz führen (einschließlich Beleidigungen, Auswahl von Nicknamen nach Rassen-, National-, Ethischen- oder Religionsprinzip), sowie Provokationen des Gesprächspartners zu solchen Handlungen;\n2.3.4. Propaganda oder Kundgebung nationalsozialistischer Vorbilder, Symbole, Abkürzungen oder Bezeichnungen, oder Namen nationalsozialistischer Funktionäre;\n2.3.5. Veröffentlichung von Informationen, in denen historische Ereignisse verneint werden;\n2.3.6. Veröffentlichung von Informationen, in denen Anzeichen zum Gewaltaufruf, Krieg, Terrorismus, Machtsturz; Extremismus und/oder Massenunruhen erkannt werden können;\n2.3.7. Veröffentlichung von Informationen über politische Organisationen (Politiker), die politische Verbrechen oder Verbrechen gegen die Menschheit begangen, Terroranschläge durchgeführt oder gegen die internationale Gesetzgebung auf eine andere Art verstoßen haben;\n2.3.8. Veröffentlichung von Informationen, die politische Propaganda, politische Werbung oder Wahlagitation jeglicher Art beinhalten;\n2.3.9. Diskussionen zu Fragen der modernen Politik zum bewussten Provozieren von Konflikten;\n2.3.10. Sämtliche Formen von Diskriminierungen nach Geschlechts-, Alters-, Religions,- oder anderen Merkmalen;\n2.3.11. Alle Arten von Drohungen die gegen Nutzer, Administratoren oder Dritte gerichtet sind;\n2.3.12. Informationen über Arten des Suizid, Aufrufe zum Suizid, Gewalt oder anderen lebens- oder gesundheitsbedrohlichen Handlungen, Beschreibung gefährlicher Kampfverfahren, Tricks, Waffen, Verfahren zur Herstellung von Waffen, Verfahrensbeschreibung zur Körpermodifizierung;\n2.3.13. Veröffentlichung von Informationen, die gesetzwidriges oder assoziales Verhalten, Verbrechen, Gewalt, Selbstverstümmelung, psychische oder körperliche Gewalt gegen  Menschen und Tiere, sowie Schäden an fremden Eigentum rechtfertigen;\n2.3.14. Veröffentlichung von Informationen, die bei Kindern Angst, Schrecken oder Panik auslösen. Insbesondere die Darstellung oder Beschreibung vom Tod, Krankheiten, Suizid, Unfällen oder Verkehrsunfällen, Katastrophen und/oder ihren Folgen, sonstige Informationen, die der Gesundheit oder der Entwicklung von Minderjährigen schaden können;\n2.3.15. Veröffentlichung von Informationen über Minderjährige, die unter gesetzwidrigen Handlungen (Unterlassungen) gelitten haben;\n2.3.16. Veröffentlichungen von Informationen, die direkte oder indirekte Propaganda, Aufrufe zum Konsum von alkohol- oder spriritushaltigen Produkten, Bier, Tabakwaren, Drogensubstanzen, toxischen, psychotropen und/oder betäubenden Mitteln, ihren Bestandteilen, oder Informationen zum Herstellungsverfahren und Orten, wo sie hergestellt, angebaut oder verwendet werden, beinhalten;\n2.3.17. Veröffentlichung von Informationen die das Bedürfnis auslösen können, an Glücksspielen teilzunehmen, Prostitution, Landstreicherei oder Bettelei, auszuüben;\n2.3.18. Jegliche Verwendung von Objekten geistigen Eigentums (Computerprogramme, Kunstgegenständen, Video, anderen Werken oder Teilen, Markenrechte u. a.), anderen Materialien ohne Erlaubnis des Rechtsinhabers; Links zu Raubkopien veröffentlichen; Löschen oder ändern von Informationen zum geistigen Eigentumsrecht, insbesondere Hinweise auf den Rechtsinhaber, Autoren und andere Nachweise, die das geistige Eigentumsrechts bestätigen;\n2.3.19. Veröffentlichung von Informations- und Werbematerial  ohne  vorherige Abstimmung mit den Administratoren;\n2.3.20. Veröffentlichung von Informationen, die dem Nutzer/den Administratoren schaden bzw. Schaden stiften können;\n2.3.21. destruktive Kritik des Spiels und/oder seiner Autoren/des Rechtsinhabers;\n2.3.22. Öffentliche Diskussionen über die Administratoren oder Moderatoren des Spiels und deren Arbeit, in offener oder verschleierter Form;\n2.3.23. Bereitstellung falscher und fiktiver Angaben, Unterlagen oder Beweise. Die Administration warnt alle Nutzer, dass für alle kriminellen Handlungen eine strafrechtliche Verantwortlichkeit besteht.\n2.3.24. Durchführung von Handlungen oder anstiften zu Aktivitäten (Passivitäten), die durch diese Regeln, diesen Vertrag und/oder die geltende Gesetzgebung verboten sind.\n \n \n3. Es ist verboten,Themen und/oder Mitteilungen im Spiel-Chat und/oder Forum zu erstellen, die:\n \n3.1 Vor kurzem besprochen wurden und/oder ihre Antworten in Infobereichen (Regeln, FAQ, Pläne usw.) vorhanden sind. Vergessen Sie bitte nicht, die Forum-Suchfunktion zu benutzen, um Antworten auf die für Sie interessanten Fragen zu finden. Sind Sie aufmerksam und lesen Sie vor dem Erstellen eines neuen Themas bereits vorhandene Themen;\n3.2. Nicht zum Thema/Bereich/Kategorie passen;\n3.3.Im Titel und/oder im Inhalt des Themas NUR, oder ZUM GROßen TeiL GROßBUCHSTABEN (CAPS LOCK) beinhalten;\n3.4. Im Thementitel und/oder Inhalt unbefugte oder wiederholte Symbole, Zeichen, Smileys, Mitteilungen, die das Verständnis eines Themas/Abschnittes erschweren, beinhalten oder keine Bedeutung haben (Flood), zum Beispiel, ==- Mein Thema -==;\n3.5. In der Schriftgröße größer als 24 geschrieben sind;\n3.6. Im Titelnamen oder der Themenbeschreibung wenig sinnvolle Informationen beinhalten und dem Wesen der gestellten Frage nicht nachgehen (beispielsweise „Hilfe“ oder „Vasya, antworte, bitte“;\n3.7. Ohne besondere Notwendigkeit zu große Texte und/oder Bilder aus vorigen Mitteilungen wiedergeben; (Overquoting);\n3.8.Die Diskussion der durch die Administration geschlossenen oder entfernten Themen fortzusetzen.(Nekroposting);\n3.9. Den Charakter einer persönlichen Botschaft an die Forumsmitglieder haben. Benutzen Sie für private Kommunikationen die Möglichkeit der Privaten Nachrichten. Persönliche Diskussionen parallel zu Problemlösungsvorschlägen sind nicht verboten;\n3.10. Spam beinhalten, d. h. verschicken von Informationen, die vom Empfänger nicht angefragt wurden, an deren Inhalt er nicht interessiert ist und/oder mit deren Inhalt er nicht einverstanden ist;\n3.11. Flaming beinhalten  („Streit um des Streites willen“, Austausch von Mitteilungen in netzbasierten Kommunikationen (Forum, Chat), der einem Wortkriegs ähnelt und häufig mit der ursprünglichen Ursache des Streits nichts mehr zu tun hat);\n3.12. Die als Trolling anzusehen sind -(die Communitymitglieder zu Handlungen anzustiften, die unangenehme Folgen für diese haben werden, Aktivitäten durchzuführen, die Konflikte auslösen und Communitymitglieder beleidigen können);\n3.13. Auf Provokation anderer Nutzer, Administratoren, Moderatoren sowie das Schaffen von\nKommunikationsbehinderungen im Forum und Spielchat, ausgerichtet sind;\n3.14. Werbelinks oder Cheat-Codes (addscore, Buy_krictals_in_the_panzer_) enthalten;\n3.15. Andere Informationen oder anderes Fehlverhalten beinhalten, die durch diese Regeln, Vertrag und/oder die gegenwärtige Gesetzgebung verboten sind.\n3.16. Für Verstöße seitens des Nutzers ist die Administration, nach eigenen Ermessen berechtigt, den Account des Nutzers vorübergehend oder dauerhaft zu sperren, den Zugang zum Forum und Chat (Ban) vorübergehend oder dauerhaft einzuschränken.\n3.17. Die Administration ist, nach eigenen Ermessen und ohne Vorwarnung berechtigt, jegliche Formen von Informationen oder Mitteilungen zu löschen, Themen, die in falschen Forum-Abschnitten erstellt wurden zu löschen, oder das Thema in andere Abschnitte zu verschieben.\n3.18. Private Nachrichten (Private Messages) dienen zur persönlichen Kommunikation der Nutzer in den Spielservices, und im Forum. Während der Überprüfung von Beschwerden hinsichtlich des Nichteinhalten der Regeln, werden Beschwerden über den privaten Nachrichtendienst von der Administration nicht berücksichtigt. Jeder Nutzer ist gegenüber anderen Nutzern berechtigt, den Empfang privater Nachrichten zu stoppen, und sie in die schwarze Liste, im jeweiligen Abschnitt seines Nutzer-Profils, einzutragen.\n \n \n4. Anwendung von Nutzer-Einschränkungen\n \n4.1. Wenn Nutzern gegen diese Regeln verstoßen ist die Administration berechtigt, die durch diesen Abschnitt vorgesehenen Einschränkungen, in Bezug auf jeden Nutzer, anzuwenden.\n \n4.2. Arten von Einschränkungen:\n \n4.2.1. Vorübergehendes oder dauerhaftes Sperren des Accounts – Sperren (Einschränkung) des Spielzugangs.\n4.2.2. Verringerung aller virtuellen Werte im Spiel (Garage, Kristalle, Spielstatistik) in Höhe von 10% bis 100% oder eine Account-Rücksetzung.\n4.2.3. Vorübergehende oder dauerhafte Einschränkung des Zugangs zum Spiel-Chat und  Forum (Ban). Die Einschränkung betrifft die Möglichkeit, Nachrichten in den Spielchats und im Forum zu schreiben.\n4.2.4. Löschen oder ändern jeglicher Informationen oder Nachrichten, die sich in allen Bereichen des Spiels oder der Spielservices befinden; Übertragen von Themen im Forum in andere Abschnitte, oder löschen dieser Themen;\n4.3. Die Einschränkungen können auf jeden Nutzer-Account angewendet werden, wenn diese Regeln verletzt werden.\n4.4. Die Administration ist nach eigenen Ermessen berechtigt, sowohl eine, als auch mehrere Einschränkungen gegenüber dem Nutzer anzuwenden, oder sich auf eine Vorwarnung beschränken.\n4.5. Bei der Wahl der Einschränkung muss die Administration die Art und  Anzahl der Verstöße, sowie frühere Verstöße des Nutzers gegen diese Regeln, berücksichtigen.\n4.6. Da es nicht immer möglich ist, diese oder jene Verstöße gegen die Regeln genau zu definieren, bleibt die endgültige Entscheidung immer der Administration überlassen.\n4.7. Verstößt der Nutzer gegen diese Regeln, kann eine sofortige Sperre des Spielservice, ohne vorherige Benachrichtigung ausgelöst werden. Die Serviceleistungen können teilweise, oder komplett eingeschränkt werden.\n4.8. Beim mehrmaligen und komplexen Missachtungen der Spielregeln ist die Administration,  nach eigenen Ermessen berechtigt, die für den Nutzer geltenden Einschränkungen zu wiederholen.\n4.9 Die Administration ist nicht haftbar für direkte oder indirekte Verluste der Benutzer oder dritter Personen , die aus der Nutzung der Website, des Spiels oder der Spieldienstleistungen hervorgehen. Dies schließt Verluste und Schäden, die durch die Unzugänglichkeit der Website, des Spiels oder Spieldienstleistungen, sowie Einschränkungen der Benutzer, die von der Administration verursacht wurden, ein. Ebenso nicht für direkte oder indirekte Verluste, die sich aus Handlungen von Dritten einschließlich anderer Nutzer des Spiels oder durch fehlenden Internetzugang oder Diebstahl ergeben, insbesondere dadurch verursachte Vernichtung von Materialien, Verluste von Informationen, -die mit den Benutzerkonten verknüpft sein können-  sowie allgemeine Verluste der Ehre, Würde und des beruflichen Rufs des Nutzers.\n \n \n5. Moderatoren\n \n5.1. Moderatoren sind Helfer der Administratoren. Sie werden von der Administration aus den Reihen der Spieler ausgewählt.\n5.2. Ein Moderator ist eine Person, die im Namen der Administration handelt und ihre Interessen vertritt. Der Moderator sorgt für Ordnung und die Aufrechterhaltung des Spiels in den Spielservices, im Forum und Chat.\n5.3. Der Moderator hat das Recht, Nutzern entsprechend dieser Spielregeln den Zugang für den Spiel-Chat und das Forum vorübergehend oder dauerhaft, einzuschränken (Ban).\n5.4. Der Moderator ist verpflichtet, seine Entscheidungen ehrlich und objektiv zu treffen, und die Bestimmungen dieser Regeln und des Vertrags einzuhalten, sich den Nutzern gegenüber korrekt zu verhalten, und seine Pflichten gewissenhaft und regelmäßig auszuüben.\n5.5. Den Moderatoren ist strengstens verboten, ihre Kompetenzen zu missbrauchen. Alle Aktivitäten der Moderatoren werden geloggt. Sollte ein Moderator das in ihn gesetzte Vertrauen missbrauchen, verlässt er seinen Posten, gemäß einer internen Entscheidung der Administratoren, ohne Diskussion oder Vorwarnung.\n5.6. Die Tätigkeit der Moderatoren erfolgt auf freiwilliger Basis. Die Nutzer sind nicht berechtigt, Moderatoren zur Anwendung irgendeiner Einschränkung zu zwingen.\n \n \n6. Beschwerden und Anfragen\n \n6.1. Die Nutzer sind berechtigt Chat- oder Forum-Moderatoren über Regelverstöße, mit Hilfe  privater Nachrichten zu informieren. In der Nachricht muss der Grund des Verstoßes genau angegeben werden, und ein Chat-Screenshot oder ein entsprechendes Video, auf denen der Verstoß deutlich erkannt werden kann, beigefügt werden.\n6.2. Der Nutzer ist berechtigt, Fragen, Kommentare oder Beschwerden, betreffend diese Regeln, an die E-Mail Adresse help@tankionline.com zu senden. Die Administration ist stets bemüht, alle Anfragen möglichst schnell zu bearbeiten.\n6.3. Bei allen Beschwerden muss der Nutzer die Situation möglichst detailliert und ausführlich beschreiben, sowie Beweise in Form von Screenshots u. ä. an die Mitteilung anhängen. Beschwerden über unbegründete Anwendungen von Sanktionen werden ausschließlich zum Zweck einer internen Bewertung, betreffend die Arbeit von Administratoren und Moderatoren, überprüft. Entscheidungen über die Anwendung von Einschränkungen unterliegen keiner Revision.\n6.4. Wenn ein Nutzer mit der Administration kommuniziert oder Berichte über Probleme mit dem Spiel zusendet, behält sich die Administration das Recht vor, die Korrespondenzen komplett zu speichern.\n \n \n \n7. Sonstige Bestimmungen:\n \n7.1. Die Administration leitet das Spiel ausschließlich nach eigenem Ermessen, hört aber auf die Meinung der Gemeinschaft.\n7.2. Die gegenwärtigen Spielregeln können von der Administration ohne jegliche vorzeitige Benachrichtigung geändert werden. Der Spieler ist verpflichtet, die gegebenen Spielregeln mindestens ein Mal in sieben Tagen (d. h. wöchentlich) zu überprüfen. Für den Fall, das die Überprüfung nicht rechtzeitig stattfindet, der Spieler aber weiterhin den Spielservice nutzt, wird angenommen, das der Spieler die gegebenen Spielregeln in der abgeänderten Form kennt und damit einverstanden ist.\n7.3. Die Administration übt eine Nulltoleranz-Strategie gegenüber unfairem Spiel und betrügerischen Aktivitäten aus. Ist die Administration der Auffassung, dass ein Nutzer die Administration oder andere Nutzer betrogen hat, oder zu betrügen versucht, falsche oder gefälschte Angaben, Unterlagen, Beweise bereitgestellt hat, oder auf sonstige Art und Weise gegen die geltende Gesetzgebung verstößt, behält sie sich das Recht vor, den Nutzer-\nAccount zu sperren, und die Informationen (zusammen mit den persönlichen Angaben des Nutzers) nach eigenen Ermessen an Dritte und/oder die jeweiligen Strafverfolgungsbehörden weiterzuleiten, wenn das von der Administration als Notwendigkeit eingestuft wird.\n7.4. Die Administration kann sonstige Bestimmungen und Einschränkungen in den Cyber-Sport-Regeln, Regeln zur Durchführung von Wettkämpfen, Turnieren und Meisterschaften, erlassen. Zugleich sind diese Regeln ein integrierender Bestandteil anderer Regeln, die von der Administration festgelegt werden."
