  GAME_RULES: "Règles Brèves \n\nLes activités ci-dessous sont interdites dans le jeu, dans les tchat/lobby de discussion, dans les forums et tous les autres endroits officiels de communication :\n\n– utilisation des bots, utilisation de logiciel de tierces parties, exploitation des bugs ;\n– personnifier un membre d'administration ou un de ses assistants ;\n– créer des obstacles contre d'autres utilisateurs ;\n– la publicité, propagande politique ;\n– violation des lois, y compris des lois de propriété intellectuelle ;\n– vente, achat, échange, transfert des comptes ou toute autre propriété du jeu ;\n– fraude ou d'autres actions malhonnêtes.\n– insultes, menaces, calomnie ;\n– langue obscène, incluant sous la forme implicite ;\n– Spam, agacement, écrire en majuscules (FONCTION MAJUSCULE) ;\n– mots de passe escroquant ou d'autres données de compte ;\n– inciter les autres à enfreindre les Règles de Jeu ;\n– publication d'information interdite par la législation ;\n– publication des liens à de ressources de tierces parties ;\n– toutes formes de discrimination.\n\n\nRègles du Jeu\n\nVous êtes dans Tanki Online, un jeu où les gens à travers le monde prennent plaisir d’être aux commandes d’énorme machines de guerre et participent aux batailles féroces ! Les joueurs peuvent combattre seuls ou s'associer pour lutter pour la victoire côte à côte. Ils/elles peuvent également socialiser et trouver de nouveaux amis.\n\nTanki Online est un jeu d'action multijoueur facile à jouer. Des batailles sérieuses sont au rendez-vous ainsi qu'un excellent réseau social.\n\nAprès avoir complété la procédure d'enregistrement, l'utilisateur reçoit un char de combat virtuel et 1000 cristaux (la monnaie dans le jeu). En gagnant des batailles, les utilisateurs augmentent leur classement général et reçoivent de nouveaux Grades et des cristaux. Les cristaux peuvent être employés pour acheter des équipements utile aussi bien que pour acheter ou améliorer des armes à feu, des chars ou des couche de peintures.\n\nTanki Online est plus que juste un jeu passionnant sur l’Internet. C'est une communauté des personnes qui partagent les mêmes intérêts. Nous encourageons le respect et la courtoisie mutuels et décourageons fortement le comportement offensif et/ou la violation d'autres droits d'utilisateurs. Les administrateurs se réservent le droit de limiter les capacités de communication des utilisateurs, d'abaisser leurs classements généraux, et/ou de bloquer leurs comptes s'ils/elles enfreint ces Règles de Jeu.\n\nTermes généraux\n\nLes Règles du Jeu sont une partie intégrante du contrat de licence utilisateur final (ci-après désigné sous le nom de « l'Accord » ou d'EULA) et d'autres documents du Jeu et des services fourni dans le Jeu. À leur tour, l'accord, et la politique de confidentialité ainsi que les témoins, aussi bien que d'autres documents édités dans le Jeu et les services fourni dans le Jeu, sont une partie intégrante de ces Règles de Jeu. Tous les termes et notions utilisés dans les Règles du Jeu ont la même signification que leur a été assigné dans l'accord. N'importe quelle utilisation du Jeu et ses équipements en ligne et/ou cliquer sur « Accepte » à la fiche signifie que vous êtes au courant et êtes d'accord avec les Règles de ce Jeu, et acceptez sans réserve tous ses termes. Les Règles du Jeu sont obligatoires pour tous les utilisateurs. Si vous êtes en désaccord avec n'importe quelles conditions de ces Règles de Jeu, vous n’avez pas droit à l'utilisation prolongé du Jeu et de ses services, quittez s’il vous plait ce site et ne faites pas usage du Jeu.\n\n\n1. Il est interdit de créer des pseudos (noms d'utilisateur) qui : \n\n1,1. Contiennent des mauvaises paroles ou des paroles grossières, insultes/provocations pour l'insulte (sous forme de mots, d'abréviations, d'expressions ou de phrases) ; \n1,2. Contiennent des éléments raciste, du fascisme, les insultes ou les pseudos basés sur l'identité raciale, nationale ou religieuse, ou ceux qui incite la haine, l’intolérance, la discorde ethnique ; \n1,3. Contiennent des appels à la violence, le terrorisme, l'extrémisme et/ou les perturbations de masse ; \n1,4. Contiennent la sollicitation politique, la propagande, des publicités politique de tout genre ; \n1,5. Sont directement ou indirectement liés aux organisations politiques (des individus), y compris ceux qui ont commis des crimes politiques ou des crimes contre l'humanité, des actes terroriste ;\n1.6. Contiennent la discrimination entre les sexes, l’âge, la religion ou d'autres caractéristiques ;\n1.7. Contiennent la propagande directe ou indirecte, l’appel à la consommation de substances alcooliques et des boissons contenant de l'alcool, de bière, de produits du tabac, de drogues, de produit toxique, psychotropes et/ou des substances d'ivresse, leurs précurseurs, contiennent des informations sur les endroits et les méthodes de leur production, acquisition, culture et utilisation ;\n1.8. Contiennent les informations sur des appels pour la participation dans des jeux de hasard, la prostitution, le vagabondage, la mendicité ;\n1.9. Contiennent des informations sur des méthodes pour commettre le suicide, les incitations pour commettre le suicide, la violence, ou d'autres actions qui constituent une menace pour la vie ou la santé ;\n1.10. Contiennent l'incitation au comportement illégal, crime, violence, la cruauté, infliction de mal qui incitent de commettre des actes interdites par des lois ;\n1.11. Contiennent les parties de noms de l'utilisateur des employés d'administration ou Contiennent l'information qui peut nécessiter la perception incorrecte de l'utilisateur comme représentant d'administration ;\n1.12. Contiennent la critique sur le jeu, de l'administration ou des modérateurs ;\n1.13. Directement ou indirectement sont reliés aux rapports sexuels, à la violation, à la pornographie, à la pédophilie, et à n'importe quelle autre forme de violence ou de pratique sexuelle, déviant ou autrement ;\n1.14. Contiennent les descriptions du corps et de ses fonctions biologiques sexuelles ;\n1.15. Contiennent la publicité et les liens hypertextes ;\n1.16. Contiennent les références aux codes de fraude, sites de fraude, les ressources qui violent les droites de l'administration ;\n1.17. Consistent d’ensembles de lettres aléatoires imprononçables (noms de l'utilisateur de spam) ;\n1.18. Consistent entièrement ou partiellement des éléments de marque déposée qui sont enregistrés et/ou sont protégés par loi sur les Droits d'Auteur ;\n1.19. Contiennent d'autres informations interdites par ces Règles de Jeu, l'accord et/ou les lois en vigueur.\n1.20. Si un nom d'utilisateur n'est pas conforme aux conditions ci-dessus, d'autres conditions qui sont spécifiées dans ces Règles de Jeu, l'accord, ou les lois en vigueur, l'administration aura le droit, à sa discrétion :\n– d’exiger à l'utilisateur de changer le nom d'utilisateur en un plus acceptable et de bloquer le compte de l'utilisateur pendant la période requise de changer le nom d'utilisateur ;\n– de bloquer irrévocablement le compte de l'utilisateur.\n\n\n2. Activités et comportements qui sont interdits pour les utilisateurs du jeu :\n\n2.1. Les actions qui mèneront (à la discrétion de l'administration) au blocage permanent ou provisoire d'un compte d'utilisateur :\n2.1.1. L'automatisation de la jouabilité, y compris l’usage de « bots » (l’utilisation du logiciel qui imite les actions des utilisateurs dans le jeu), l’utilisation des programmes de « clicker », les macros qui commandent la souris et le clavier, l’utilisation de logiciel de tierces parties pour obtenir des avantages dans le jeu ;\n2.1.2. Application ou distribution de logiciel de tierces parties ou autres moyens pour l'amélioration/automation des possibilités de jeu (bots, fraudes), aussi bien que les programmes qui peuvent détériorer le fonctionnement du jeu et/ou le fonctionnement des appareils électroniques des troisième personnes ;\n2.1.3. Informations d'exploitation des erreurs de programmation dans le jeu, et de transfert sur elles aux troisièmes personnes, excepté l'administration ;\n2.1.4. Batailles entre les comptes possédés par le même utilisateur ;\n2.1.5. Sabotage — n’importe quelle actes ou des omissions visant de créer des obstructions pour l'équipe dont l'utilisateur est un membre,  ce qui inclut les modes de CTF, de TDM et de CP, luttant contre l'équipe dont vous êtes un membre (sélection intentionnelle d'équipement faible, pauses fréquentes, inactivité ou manque intentionnel de se conformer aux conditions du mode de la carte ou du jeu, imitation des questions avec la connexion internet), endommager/détruire le char de combat d'un allié, combattant dans l'intérêt de l'équipe adversaire (conspiration) ;\n2.1.6. L'utilisation des services du jeu et/ou des services du jeu pour des actions frauduleuses, incluant des opérations financières frauduleuses sans limite dans le jeu, fraude au cours des transactions, paiements, y compris n'importe quel remboursement, et des transactions interdit ;\n2.1.7. Fraude — réception de la devise du jeu en utilisant des moyens frauduleux. L'administration avertit les utilisateurs que de telles activités peuvent mener à une poursuite pénales ou autre responsabilités ;\n2.1.8. Le transfert de compte ou d'autres valeurs de jeu aux troisième personnes ; la publication de n’importe quelle offre à vendre, achat, ou transférer la propriété de compte ou dans le jeu, gratuitement et pour des cristaux ou des fonds, aussi bien que des instigations sur les actions soulignées ;\n\n\n2.2. Actions qui mèneront (à la discrétion de l'administration) à une limitation permanente de l'accès aux tchat/lobby de discussion du jeu et au forum (interdiction) :\n\n2.2.1. Hameçonnage/escroquerie — actions qui ont pour but d’accéder aux données confidentielles des utilisateurs, telles que des identifiants et des mots de passe ;\n2.2.2. Publication de liens liés aux tierces parties qui sont déguisées en tant que ressources officielles du jeu ;\n2.2.3. Publication de liens liés aux ressources qui promettent des cristaux gratuits, des cristaux fournis par l'administration, ou expliquent ou décrivent l'exploitation des bugs de cristal, etc. ;\n2.2.4. Publication de sites/pages d’accueille contenant le logiciel de tierces parties (fraudes, programmes, clients, etc.), propager des liens pour des sites contenant le logiciel qui change la fonctionnalité ou promet de faire ainsi ;\n2.2.5. D'autres cas de fraude, destinés à voler les comptes d'utilisateurs.\n\n\n2.3. Actions qui mèneront (à la discrétion de l'administration) à une limitation provisoire de l'accès aux tchat/lobby de discussion du jeu et du forum s’élevant jusqu'à 6 mois (interdiction) :\n\n2.3.1. Discrimination envers les joueurs inexpérimentés (novice d’internautes) : information fausse, intimidation, moquerie ;\n2.3.2. Insultes, calomnie (diffusion des informations mensongères) par rapport à d'autres utilisateurs, administration, présidents, d'autres personnes ;\n2.3.3. Performance de toutes actions qui ont une influence négative sur le développement et l'image du jeu ;\n2.3.4. D'autres formes de comportement qui gênent le processus normal du jeu qui sera identifié en tant que tels par l'administration.\n2.3.5. Tentatives d'obtenir le mot de passe, d'autres information de compte ou toute autre information personnelle de tout autre utilisateur, incluant sous forme d'extorsion à l'aide des menaces morales, physiques ou techniques ;\n2.3.6. Le partage du mot de passe de son propre compte\n2.3.7. Diffusion de toutes informations personnelles au sujet d'autres utilisateurs ou sur les troisième personnes (à moins qu'une telle information est publiquement accessible) ;\n2.3.8. L’utilisation d’un langage grossier et frappante, d'autres mauvais mots ou mots grossiers (expressions) non classifiées en tant que mauvaise langue, incluant sous la forme implicite ;\n2.3.9. Publication d'information et matériaux de nature sexuelle, érotique ou pornographique, visualisant ou décrivant des rapports sexuels ou des pratiques sexuelles déviantes, aussi bien que signalant des liens aux ressources contenant une telle information ;\n2.3.10. Publication d'information ou symboles qui insultent ou humilient les sentiments des croyants, incite la haine, la discorde, l'intolérance (insultes y compris, donnant des surnoms sur la base des caractéristiques raciales, nationales, ethniques, religieuses), et également la provocation d'hostilité, raciales, internationales ou ethniques du l'interlocuteur pour commettre les actions spécifiques ;\n2.3.11. Propagande ou démonstration des emblèmes Nazis, les symboles, les abréviations ou les désignations, les noms et les noms de famille des activistes Nazis ;\n2.3.12. Publication d'information dans lesquels on peut voir des éléments qui font appelle à la violence, à la guerre, au terrorisme, au renversement de puissance ; activité extrémiste et/ou perturbations de masse ;\n2.3.13. La publication d'informations sur des organisations politiques (chefs politiques) qui ont commis des crimes politiques ou des crimes contre l'humanité, des actes terroriste, ou ont autrement violé les lois internationales ;\n2.3.14. Toute forme de discrimination de sexes, d’âge, de religion ou d'autres caractéristiques ;\n2.3.15. Publication d'information contenant des méthodes pour commettre le suicide, les appels pour commettre le suicide, la violence, ou d'autres actions qui constituent une menace pour la vie ou la santé, descriptions des techniques de combat dangereuses, cascades, méthodes pour la production d'armes, description des méthodes de modification de corps ;\n2.3.16. La publication d'information qui décrit, incite ou justifie la cruauté illégale ou le comportement antisociale, de crime, de violence, de mutilation, psychique ou physique aux gens, animaux, infligeant des dégâts sur la propriété des autres ;\n2.3.17. Publication d'information qui cause la crainte, l'horreur ou la panique chez les enfants, y compris des photos ou des descriptions de la mort, des maladies, de suicide, d'accidents, des cas d'urgences ou de catastrophes et (ou) de leurs conséquences, d'autre information qui peut endommager la santé ou le développement des mineurs ;\n2.3.18. La publication d'information qui contient la propagande directe ou indirecte, appelle à la consommer des boissons alcooliques et contenant de l'alcool, la bière, les produits de tabac, les accessoires de tabagisme, de drogues, de produit toxique, psychotropes et/ou des substances d'ivresse, leurs précurseurs, contient des informations sur les endroits et les méthodes de leur production, acquisition, culture et utilisation ;\n2.3.19. Publication d'information qui peut encourager le désir de participer aux jeux de hasard, à la prostitution, au vagabondage ou à la mendicité ;\n2.3.20. Toute utilisation des objets de propriété intellectuelle (logiciel, art, vidéo et d'autres objets ou leurs pièces, marques déposées, etc.), ou d'autres matériaux sans autorisation du vrai propriétaire  ; publication de liens au contenu piraté ; la suppression ou le changement d'information sur des droits de propriété intellectuelle, en particulier des liens aux vrai propriétaires, aux auteurs et à toute autre confirmation des droits de propriété intellectuelle ;\n2.3.21. Publication d'information qui peut avoir comme conséquence du mal/une perte pour les utilisateurs ou l'administration ;\n2.3.22. Fournissement d'information, de documents ou de fausses preuves ou informations factices. L'administration avertit les utilisateurs au sujet des actes criminelles et toute autre responsabilité de telles activités ;\n2.3.23. Création des sujets et/ou des messages dans les tchat/lobby de discussion et/ou les forums du jeu qui sont exacerbant (« discuter dans l'intérêt d'argumenter », un échange des messages qui est juste une guerre des mots, n'ayant souvent aucune relation à la cause originale du conflit) ;\n2.3.24. Création des sujets et/ou des messages dans les tchat/lobby de discussion et/ou les forums du jeu, destinés à provoquer d'autres utilisateurs, l'administration, présidents, aussi bien qu'obstruer la communication au forum ou au discussion dans le jeu ;\n\n\n2.4. Actions qui mèneront (à la discrétion de l'administration) à une limitation provisoire de l'accès aux tchat/lobby de discussion du jeu et du forum pour jusqu'à 24 heures (interdiction) ou un avertissement officiel :\n\n2.4.1. Toutes tentatives d’imiter un ancien ou employé actuel de l'administration ou de l'assistant de projet (président, conseiller, etc.), y compris envoyer des messages au nom de l'administration ou des modérateurs ;\n2.4.2. La supplication sous toute forme, y compris des demandes de transférer des fonds, des valeurs de jeu ou des cristaux ;\n2.4.3. Publication d'information qui nie des événements historiques ;\n2.4.4. Publication d'information qui contient la sollicitation politique, la publicité politique, propagande d'élection de toute sorte ;\n2.4.5. Discussion des problèmes politiques actuels qui peuvent provoquer le conflit de n’importe quelque façon ;\n2.4.6. Les menaces sous n'importe quelle forme liées aux utilisateurs, à l'administration ou aux troisièmes personnes ;\n2.4.7. Publication d'informations sur un mineur qui a souffert en raison des actions illégales (omissions) ;\n2.4.8. Publication des tous matériels publicitaires ou information sans approbation de l'administration ;\n2.4.9. Critique non constructive du jeu et/ou de ses auteurs, le Propriétaire ;\n2.4.10. La Commission ou instigation (provocation) aux actions (inaction) qui sont interdites par ces Règles de Jeu, l'accord et/ou loi applicable.\n2.4.11. Commencer des sujets et/ou créer des messages dans des discussions du jeu et/ou sur le forum qui :\n2.4.11.1. Reproduisent les sujets ou les messages déjà existants, aussi bien que les sujets qui ont été récemment discutés et/ou auxquelles les réponses sont disponibles dans les rubriques d'informations (les Règles de Jeu, FAQ, plans, etc.).\n2.4.11.2. Ne correspondent pas au thème de la section/de catégorie ;\n2.4.11.3. Contiennent la fonction majuscule ou beaucoup de majuscules dans le titre et/ou le contenu du sujet ou du message ;\n2.4.11.4. Contiennent le suivant dans le titre et/ou la description du sujet ou du message : des symboles ou des caractères inutiles ou répétés, émoticônes, des liens de parrainage, « codes de triche », l'information qui complique la compréhension du sujet ou de la section, ou n'a aucune signification (Spam), par exemple == – mon sujet – == ;\n2.4.11.5. Contiennent le texte avec la taille de police plus grande que 24 ;\n2.4.11.6. Manque d'information et ne reflètent pas un sens du sujet en cause dans le titre ou la description du sujet ;\n2.4.11.7. Citent les parties de messages précédents qui sont trop élargis, et/ou d'images sans n'importe quelle nécessité spéciale (citation exagérée) ;\n2.4.11.8. Continuent à discuter sur des sujets qui ont été clos ou supprimés par l'administration (publication de sujet abouti) ;\n2.4.11.9. Ont la nature d'un appel personnel aux participants de forum. Pour la communication personnelle veillez employer les messages privés s’il vous plait. Les discussions personnelles sont parallèlement permit pour résoudre des problèmes.\n2.4.11.10. Contiennent le Spam, c’est-à-dire., distribuent l'information que le destinataire n'a pas demandée, n’a montrée aucun intérêt pour la réception, et/ou n'avait donné aucun consentement à la réception ;\n2.4.11.11. Contiennent d'autre information ou violations qui sont interdites par ces Règles de Jeu, l'accord et/ou des lois applicables.\n\n3. Application des restrictions à l'utilisateur\n\n3.1. Si un utilisateur viole ces Règles de Jeu, l'administration sera autorisée à appliquer les restrictions stipulées dans la section appropriée des Règles de Jeu à cet utilisateur. Les restrictions possibles ne sont pas limitées à celles mentionnées. L'administration se réserve le droit d'appliquer d'autres restrictions à sa propre discrétion, qui s’élève jusqu'au blocage permanent du compte, y compris la réduction partiel ou complète de la propriété virtuelle, de placements, des accomplissements et toutes possessions de l'utilisateur dans le jeu (garage, cristaux, statistiques de jeu).\n3.2. En choisissant des restrictions, l'administration considère le type et le nombre de violations, aussi bien que les violations précédentes de ces Règles de Jeu par l'utilisateur.\n3.3. L'administration sera autorisée, à sa propre discrétion, de supprimer n'importe quelle information ou message ; de supprimer/déplacer le sujet créé se trouvant dans la mauvaise section du forum, sans avis.\n3.4. L'administration sera autorisée, à sa propre discrétion, d’appliquer une ou plusieurs restrictions simultanément à l'utilisateur, ou de donner un avertissement.\n3.5. La violation de ces Règles de Jeu signifie que l'utilisateur peut être immédiatement, sans n'importe quelle communication préalable, rejeté pour la prestation des services du jeu ou de tels services peuvent être limités entièrement ou en partie.\n3.6. Si un utilisateur enfreint les Règles de Jeu plusieurs fois ou d'une façon intégrée, l'administration sera autorisée, à sa propre discrétion, de répéter les restrictions appliquées à l'utilisateur.\n3.7. Car il n'est pas toujours possible d'identifier avec précision les infractions particulières des Règles de Jeu, la conclusion définitive demeure toujours avec l'administration.\n3.8. Ces restrictions peuvent être appliquées à n'importe quel compte de l'utilisateur qui enfreint ces Règles de Jeu.\n3.9. Les messages privés sont prévus pour la communication personnelle des utilisateurs dans des services de jeu et sur le forum. Tout en traitant des plaintes au sujet de la violation des Règles de Jeu, l'administration ne considérera pas des plaintes au sujet des messages privés, excepté des infractions des Règles de Jeu dans les messages privés des membres ou des assistants de l'administration. Un utilisateur peut cesser de recevoir les messages privés d'un autre utilisateur en ajoutant cette personne sur la liste noire dans la section appropriée du profil de l’utilisateur sur le forum.\n3.10. L'administration sera nullement responsable de n'importe quels perte ou dégâts, directe ou indirecte, qu'un utilisateur ou une tierces partie pourrait avoir subit en raison de l'usage de l'utilisateur ou de l'utilisation du tierces parties du site Internet, du jeu et de /or les équipements en ligne y compris notamment des dégâts provoqués par l'incapacité d'employer le jeu et les équipements en ligne, ou provoqués par l’application par l'administration des restrictions à l’utilisateur, des dégâts directs ou indirects provenant des actions de tierces parties, y compris d'autres utilisateurs du jeu, de manque d'accès à l'Internet, de vol, de destruction des matériaux, de perte d'information relatif au compte d'utilisateur et de toute affliction sur l'honneur de l'utilisateur, dignité et réputation d'affaires surgissant dans la connexion au jeu.\n\n4. Assistants d'administration\n\n4.1. Les assistants de l'administration sont sélectionnés par l'administration parmi les utilisateurs.\n4.2. Un assistant d'administration est une personne agissant au nom et dans l'intérêt de l'administration. Les assistants de l'administration maintiendront et commanderont l'ordre dans le jeu et les services de jeu, aussi bien que sur le forum, les tchat/lobby de discussion et les pages sociales officielles de media et les comptes du jeu.\n4.3. Un assistant d'administration sera honnête et objectif en prenant des décisions, et se conformera également aux dispositions de ces règles de jeu et l'accord, seront poli envers les utilisateurs, rempliront leur fonctions efficacement et régulièrement. Les activités des assistants de l'administration sont déterminées et réglées par leurs directives internes.\n4.4. Il est interdit de discuter publiquement les activités des assistants de l'administration dans les forums du jeu, les tchat/lobby de discussion, les groupes officiels dans le media sociale. Toutes les plaintes contre le travail des assistants devraient être envoyées à un administrateur du groupe respectif d'assistants ;\n4.5. L'activité des assistants de la modération est exercée à titre volontaire. Un utilisateur n’a aucun droit d’imposer à un assistant d’appliquer une restriction.\n\n5. Plaintes et Faire appels\n\n5.1. L'utilisateur a le droit de rapporter des infractions des règles de jeu en créant un nouveau sujet de forum dans la section de violations. Il est nécessaire de spécifier clairement la nature de l’infraction dans le nouveau sujet et d'attacher une capture d'écran ou une vidéo qui montre clairement l’infraction.\n5.2. L'utilisateur peut envoyer toutes les questions, commentaires ou plaintes concernant ces Règles de Jeu à help@tankionline.com. L'administration fera tous les efforts pour considérer de telles demandes dès que possible.\n5.3. Pendant l’envoie d’une plainte, l'utilisateur décrira la nature de la situation dedans avec autant de détail et aussi clair que possible et attachera des faits en tant que preuves, des captures d’écran, les plaintes etc. Les plaintes au sujet des restrictions sans fondement sont considérées uniquement pour l’intérêt d'évaluation interne du travail de l'administration et du modérateur. Les décisions sur l'application des restrictions ne sont pas soumises à la révision.\n5.4. Si l'utilisateur commence une correspondance avec l'administration ou fournit un rapport au sujet des problèmes du jeu ou les services de jeu, l'administration sera autorisée de garder toute correspondance comme telle.\n\n6. D'autres dispositions\n\n6.1. L'administration contrôle le jeu et applique ces Règles de Jeu à sa seul discrétion, mais prend en considération l'opinion de la communauté.\n6.2. Ces Règles de Jeu peuvent être changées par l'administration sans n'importe quelle communication préalable. L'utilisateur est prié d'examiner ces Règles de Jeu pour rester au courant des changements au moins une fois tous les sept jours (c.-à-d. chaque semaine). Si une telle examinassions n'a pas été faite au cours de la période spécifique et l'utilisateur continue d’employer le jeu, l'utilisateur est considéré comme avoir lu et être d'accord avec la version modifiée de ces Règles de Jeu.\n6.3. L'administration maintient une politique de « tolérance zéro » à la tricherie et à la fraude. Si, selon l'opinion de l'administration, l'utilisateur trichait ou essayait de tromper l’administration ou un utilisateur différent, ou a fait part d'information fausse ou factice, de documents, preuves et autrement a violé les lois applicables, l'administration se réserve le droit de bloquer le compte d'utilisateur et de virer une telle information à sa propre discrétion (avec les données personnelles de l'utilisateur) sur tous les tierces parties et/ou autorités de maintien de l'ordre si l'administration le considère étant nécessaire.\n6.4. L'administration peut publier d'autres dispositions et restrictions dans les règles d'eSports, les règles des concours, des tournois, et des championnats. En même temps, ces Règles de Jeu sont une partie intégrante d'autres règles adoptées par l'administration.\n6.5. Les modes de jeu générés par l'utilisateur (tels que « Sauvez le Gold ») peuvent être joués dans n'importe quel mode tant que c'est une « Pro Battle » privée. Cependant, n'importe quel abus tel que le placage de comptes inactifs multiples aussi connu en tant que « multing », sabotage ou booste de statistique de compte à l’aide de vos autres propre comptes aussi connu en tant que « power-leveling » pendant des « Pro Battles » comme telles sera traité selon les règles régulières de jeu."
