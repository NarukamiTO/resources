  PAYMENT_SMS_DESCRIPTION_TEXT_INCLUDING_VAT: |-
    Choisissez votre pays et votre opérateur de téléphonie mobile. Sélectionnez la quantité de cristaux, et envoyez un SMS avec le texte affiché au numéro correspondant. Normalement, le compte se met à jour en quelques secondes.

    Attention! Selon les règles des serveurs SMS, nous introduisons des restrictions anti-fraude. Pour éviter la perte de votre paiement, veuillez lire les règles suivantes:
    1. Ne pas envoyer de SMS avec une somme de plus de 13 dollars américains par heure.
    2. N'envoyez pas plus de 3 SMS à un seul et même joueur à partir d'un seul et même numéro dans le délai d'une heure.

    <font color='#ff4e00'>Assurez du consentement de ceux qui paient pour vos cristaux!</font>
