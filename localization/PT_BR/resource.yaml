sos e serviços disponíveis através de tais sites que tenham sido reconhecidos legal e oficialmente pela Companhia.\n \n“Licença” significará a licença simples, não exclusiva e revogável que a Companhia concede ao Usuário para uso pessoal e não comercial do Jogo.\n \n“Login e Senha” significará os detalhes de login (acesso) e senha escolhidos pelo Usuário quando esse se registra para o Jogo.\n \n“Material(ais)” significará os diferentes objetos em forma de texto, desenhos, imagens, sons, programas, comandos, nomes, sujeitos, histórias, diálogos, frases, conceitos, ilustrações, animações, composições musicais e efeitos, documentação, bate-papo do jogo ou qualquer outra forma e incluem qualquer material derivativo, colocado em Jogo pelo Usuário, ou pela Companhia/Administração.\n \n“Menor(es)” significará os indivíduos menores de 18 anos e/ou que ainda não tenham atingido a maioridade dentro das leis de sua naturalidade e que tenham se registrado no Jogo e em cujo nome uma Conta tenha sido aberta.\n \n“Instalações Online” significará coletivamente à Conta, ao Jogo e ao Site da Internet.\n \n“Serviços Pagos” significará toda compra de Cristais para uso em Jogo e/ou serviços ou possibilidades adicionais no Site da Internet nos termos de licença simples não exclusivas e revogáveis, na extensão e condições fornecidas pela Companhia.\n \n“Partes” significará coletivamente o Usuário e a Companhia.\n \n“Agente de Pagamento” significará terceiros autorizados pela Companhia a receber e processar pagamentos de Usuários no interesse da companhia através de diversos métodos de pagamento providos por esses terceiros autorizados.\n \n“Pagamento” significará a taxa de licença paga pelo Usuário aos Agentes de Pagamento para se utilizar dos Serviços pagos requisitados, cujo pedido e quantidade serão determinados e regulados pelas Instruções de Compra de Cristais.\n \n“Informação Pessoal” e/ou “Dados Pessoais” significarão quaisquer informações relacionadas a uma Pessoa Natural Identificada ou Identificável.\n \n“Usuário”/”Você” significará o indivíduo que acessou o Site da Internet incluindo acesso através de parceiros da Companhia e jogar o Jogo e/ou suas versões de teste e/ou utilizar as Instalações Online, serviços do jogo, Materiais, outros serviços, antes ou depois do processo de registro no Jogo.\n \n“Política de Privacidade e Cookies” significará o documento que cobre a privacidade dos Usuários e a armazenamento de cookies.\n \n“Servidor” significará o suporte de hardware-software da Companhia usado para a interação interativa virtual dos Usuários.\n \n“Serviço” significará ceder ao Usuário o direito de usar o Jogo, tanto gratuitamente quanto mediante pagamento, nos termos de licença simples, não exclusiva e revogável, na extensão e condições estipuladas nesse EULA.\n \n“Software” significará todo programa licenciado pela Companhia, incluindo todos os programas e bancos de dados e outros conteúdos derivados que possam requerer um download, sejam acessados ou de outra forma utilizados pelo Usuário através do Site da internet e permitindo ao Usuário que participe no Jogo.\n \n“Uso do Jogo” significará todos os tipos possíveis e autorizados de utilização do jogo, incluindo a inicialização do jogo pelo Usuário e/ou uso das possibilidades técnicas do Jogo de forma paga ou gratuita e/ou instalação do Jogo e/ou quaisquer outras ações necessárias para a operação do Jogo.\n \n“Nome de Usuário” significará o apelido escolhido pelo Usuário no registro da Conta.\n \nOutros termos, definições e combinações de palavras utilizadas no jogo terão os significados e interpretações que a prática estabelecida tenha designado a esses termos, definições e combinações de palavras no campo de tecnologias da Internet, jogos digitais, e na legislação vigente.\n \nCondições gerais\n \nAceitação deste EULA:\n \n1. Ao usar o Jogo e/ou as Instalações Online de qualquer forma e/ou clicando em “Aceito” no formulário de registro, o Usuário confirma que leu, entendeu, conco