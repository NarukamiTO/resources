 Site da Internet somente poderá ser usado para propósitos legais. O uso do Site da Internet para transmissão, distribuição, publicação ou armazenamento de qualquer material no Site da Internet ou através dele que viole qualquer lei ou regulamento aplicável ou direitos de terceiros é estritamente proibido. Isso inclui (sem se imitar a) o uso do Site da Internet para transmissão, distribuição, publicação ou armazenamento de qualquer material no Site da Internet ou através dele, de maneira ou por propósito que infrinja direitos autorais, marca registrada, segredo de negócio ou outros direitos de propriedade intelectual, seja obsceno ou danoso a Menor(es), ou constitua ato ilegal ou de perseguição, seja calunioso ou difamatório, que viole leis de privacidade ou proteção de dados, seja fraudulento ou quebre qualquer controle de câmbio ou lei de jogos de azar.\n2. Em caso de má utilização e/ou abuso do Site da Internet, a Administração reserva-se o direito de bloquear a Conta do Usuário e prevenir o Usuário de utilizar e/ou acessar o Jogo e o Site da Internet no futuro, e/ou tomar qualquer outra ação legal que a Companhia entenda necessário.\n \nRegras do Bate-Papo\n \n1. O fórum, sala de bate-papo e/ou serviços de comunidade oferecidos pela Tanki Online são planejados para oferecer uma experiência divertida e agradável. De tal forma qualquer linguagem abusiva ou obscena não será tolerada, e Usuários que insistirem em usar linguagem ofensiva e/ou obscena terão seus privilégios de bate-papo revogados e quaisquer Contas canceladas.\n2. O Usuário sabe que, ao postar ou fazer o upload de qualquer informação pessoal no Site da Internet, tal conteúdo se torna Público e acessível por outros Usuários. A Tanki Online não apoia de maneira alguma tal conteúdo e não será responsável por quaisquer danos causados pela disponibilidade de tal informação. Os usuários devem entender que as informações que eles disponibilizarem no Site da Internet também poderão afetar sua vida offline.\n3. O conteúdo armazenado nos servidores da Companhia não têm propósitos de arquivamento permanente ou temporário. De tal forma, a Tanki Online não tem obrigação de manter cópias de backup de qualquer material disponibilizado no Site da Internet. A Companhia reserva-se o direito de impor um limite à capacidade de armazenamento máxima para cada Usuário.\n4. A Companhia reserve o direito de excluir, mover ou editar, a seu exclusivo critério, conteúdo que ela julgue ofensivo ou em violação de quaisquer leis e/ou regulamentos e/ou das Regras do Jogo. O Usuário será unicamente responsável por conteúdo disponibilizado no Site da Internet. A falha da Administração em remover qualquer material em específico não deve ser visto de qualquer forma como endosso ou aceitação do mesmo pela Companhia.\n \nContas de Usuário\n \nAbertura de uma Conta de Usuário\n \n1. Uma Conta de Usuário deve ser registrada pessoalmente por um Usuário e a Administração reserva o direito de recusar o registro de uma Conta de Usuário em seu Site de Internet a qualquer Usuário, por qualquer motivo, sem qualquer explicação.\n2. É responsabilidade do Usuário garantir que seu histórico com o Jogo esteja atualizado, especialmente o endereço de e-mail. É responsabilidade do Usuário informar imediatamente à Administração quaisquer mudanças a sua Informação Pessoal.\n3. A Tanki Online proíbe estritamente o Usuário de vender, transferir e/ou adquirir Conta(s) de ou para outros Usuários e terceiros. O Usuário é proibido de transferir fundos/Cristais entre Contas de Usuário(s) diferentes.\n4. A Administração reserva o direito de não registrar e/ou cancelar o registro de uma Conta de Usuário no evento em que a informação disponibilizada à Administração seja falsa, imprecisa, enganosa ou incompleta.\n \nNome de Usuário\n \n1. Ao registrar uma Conta, será concedido ao Usuário o direito de escolher um Nome de Usuário. A Administração reserva o direito de negar e/ou retratar, por qualquer motivo que julgue necessário, quaisquer Nomes de Usuário, seja antes, durante ou depois desses nomes terem sidos emitidos ou validados.\n2. Caso uma conta esteja em concordância com esse EULA, com exceção somente do Nome de Usuário escolhido, a Administração dará ao Usuário a oportunidade de criar novo apelido e/ou Nome de Usuário.\n \nSegurança de Senha\n \n1. A Companhia não é responsável de qualquer maneira pelo eventual acesso a uma Conta por terceiros e não será responsabilizada por qualquer perda causada devido ao uso ilícito de um Login de Usuário e Senha por terceiros, por uso não autorizado e/ou por qualquer transação em que o Login e Senha do Usuário estejam registrados corretamente.\n2. A Companhia não é responsável de qualquer maneira se um Usuário esquecer, deslocar ou perder sua senha, exceto em casos onde tal perda ocorra por erro da Companhia, e a Companhia, em momento algum de seu relacionamento com o Usuário, será responsável por armazenar o Login e a Senha.\n \nBloqueio de Contas\n \n1. O Usuário poderá pedir à Administração que bloqueie sua Conta enviando um e-mail para suporte@tankionline.com.br.\n2. Se o Usuário ficar seis (6) meses consecutivos sem se conectar ao Jogo, a Administração terá o direito de bloquear a Conta do Usuário e encerrar esse Contrato imediatamente com aviso (ou tentativa de aviso) ao Usuário.\n3. A Administração tem o direito de bloquear uma Conta de Usuário a qualquer momento, e também em caso de violação pelo Usuário das condições deste EULA, Regras do Jogo, e outros documentos que sejam parte integral deste EULA.\n \nAtividade Fraudulenta e Mau Uso das Contas\n \n1. A Companhia tem uma política de tolerância zero com relação a atividades impróprias ou fraudulentas, e ela proíbe qualquer conspiração de Usuários. Se, na opinião da Administração, for descoberto que um Usuário trapaceou ou tentou fraudar a Administração ou qualquer outro Usuário do Jogo de qualquer forma, incluindo manipulação do jogo ou fraude de pagamento, conspiração de Usuários, ou se a Administração suspeitar que um Usuário esteja cometendo pagamento fraudulento, incluindo o uso de cartões de crédito roubados, ou qualquer outra atividade fraudulenta (incluindo devolução de crédito ou outra forma de reversão de pagamento) ou transação proibida (incluindo lavagem de dinheiro), isso dará o direito da Administração bloquear a Conta do Usuário e dividir essa informação (juntamente com a identidade do Usuário) a qualquer terceiro e/ou agências de aplicação da lei que a Administração entenda necessário ou requerido.\n2. Em caso de mau uso ou abuso do Site da Internet e/ou do Jogo e/ou do Software, a Administração reserva o direito de bloquear a Conta do Usuário em questão até que esse caso entre a Administração e o Usuário seja resolvido, e de buscar quaisquer outras soluções legais que a Companhia entende necessárias.\n \nServiço Pago\n \n1. Os usuários podem se beneficiar de Serviços Pagos no Jogo comprando Cristais. A Compra de Cristais somente pode ser feita através de terceiros autorizados.\n2. A Tanki Online não permite a transferência de propriedade virtual/Cristais fora do Jogo. A venda, concessão ou troca de quaisquer Materiais, Cristais e/ou objetos usados dentro do Jogo fora do Jogo é proibida.\n3. Os Serviços Pagos são considerados como providos no momento em que ocorre a transferência de Cristais para a Conta do Usuário. O Usuário compreende que ele perde o direito de retirada de um Serviço Pago no momento em que ocorre a transferência de Cristais para a Conta do Usuário.\n \nCompra de Cristais\n \nPreço\n \n1. A relação de itens e preço de qualquer Serviço Pago ocorre à escolha exclusiva da Companhia e podem ser alterados a qualquer momento.\n2. A Tanki Online não será responsabilizada pela recepção e/ou processamento do(s) Pagamento(s) do Usuário, incluindo quaisquer atrasos que possam ocorrer ou falha na recepção. Todos os pagamentos feitos pelo Usuário são voluntários, definitivos e não reembolsáveis.\n \nMétodos de Pagamento\n \n1. A compra de Cristais somente pode ser feita de Agentes de Pagamento através de um dos métodos listados a seguir e/ou outro método que o Site de Internet permita:\na. Cartões de Crédito;\nb. Cartões pré-pagos;\nc. PayPal;\nd. SMS;\ne. Pagamentos móveis; e\nf. Outros.\n2. O Usuário certifica que os fundos usados em sua Conta não são provenientes de fontes ilegais. O Usuário declara que, de forma alguma, utilizará o Site de Internet ou o Software com propósito de transferir fundos de fontes ilegais. O Usuário não irá usar o Site da Internet e/ou o Jogo para atividades ilegais ou fraudulentas, ou para transações ilegais ou fraudulentas (inclusive lavagem de dinheiro), de acordo com as leis de todas as jurisdições com autoridade sobre o Usuário. A Administração reserva-se o direito de descontinuar ou bloquear a Conta de Usuário a qualquer momento, e até que o caso tenha sido resolvido, se a Administração tiver qualquer dúvida sobre a legalidade dos fundos utilizados pelo Usuário.\n \nMoeda de Pagamento\n \nTodos os pagamentos para e de uma Conta terão que ocorrer nas moedas providas pelos Agentes de Pagamento de tempos em tempos, e todos os pagamentos de uma Conta deverão ser feitos a partir de uma fonte onde o Usuário seja o proprietário da Conta.\n \nSegurança de Menores\n \n1. A Companhia garante que está comprometida em garantir a segurança de Menores. A Companhia aconselha os Pais e/ou representantes legais de Menores que passem mais tempo com suas crianças enquanto estiverem no Site da Internet e controlem o uso do Jogo, do Site da Internet, da Conta e todos os meios de comunicação e/ou pagamento de serviços disponíveis.\n2. Se o Usuário for Menor, ele somente poderá registrar uma Conta com a companhia com o consentimento prévio de seus pais ou guardião legal. O uso de qualquer método de pagamento no Site da Internet por um menor presumirá tal consentimento.\n3. Se o usuário for Menor, seu pai ou guardião legal precisará completar seu processo de registro da Conta de Usuário com a Companhia em seu lugar. Em tais casos, o pai ou guardião legal do Usuário aceita que ele/ela aceita toda responsabilidade por todas as obrigações surgidas deste EULA e todas as atividades do Menor relacionadas ao uso do Jogo, do Site da Internet e/ou da Conta, incluindo uso indireto e quaisquer pagamentos efetuados com o uso do Login e/ou da Conta.\n4. A Companhia reserva-se o direito de requerer qualquer documentação do pai ou guardião legal do Menor, e qualquer outra confirmação por escrito que a Companhia entende necessário, para que o Menor jogue o Jogo ou faça pagamentos no Site da Internet.\n5. O Menor e o guardião legal e/ou pai(s) garantem que o consentimento necessário para o uso do Jogo e/ou registro de Conta em nome do Menor foi dado pelo guardião legal e/ou pai(s) do Menor.\n6. O guardião legal e/ou pai(s) dá seu consentimento a esse EULA e documentos partes integrais de EULA e confirma que controlará e terá total responsabilidade pelo uso do Jogo e dos serviços do jogo, do Site da Internet e da Conta do Menor, bem como de todos os pagamentos feitos através da Conta. O uso de qualquer Método de Pagamento confirma que o guardião legal e/ou pai(s) deu tal consentimento. O guardião legal e/ou pai(s) e Usuário aceitam que a Companhia não terá qualquer responsabilidade pelo uso do Jogo, do Site da Internet e da Conta por um Menor que não possua tal permissão.\n7. Os serviços de jogo podem incluir restrições de idade que têm a natureza de recomendações. O guardião legal e/ou pai(s) e Usuários decidem por si mesmos se devem seguir essas recomendações. A Companhia não será responsabilizada pelo uso do Jogo por usuário que não tenha atingido essa idade.\n8. Se necessário, o(s) pai(s) ou representantes legais de crianças podem usar programas especiais para limitar o acesso das crianças a certos serviços, o que ajudará a fazer o espaço da Internet mais seguro para crianças.\n \nResponsabilidades das Partes\n \n1. A Companhia não será responsabilizada por qualquer perda ou dano, direto ou indireto que o Usuário ou terceiros possam ter sofrido como resultado do uso pelo Usuário ou terceiro do Site da Internet, do Jogo e/ou das Instalações Online, incluindo, mas não se limitando, a danos causados pela incapacidade de acessar o Jogo e Instalações Online, danos diretos ou indiretos causados por ações de terceiros – incluindo outros Usuários do Jogo –, falta de acesso à Internet, furto, destruição de Materiais, perda de informação relacionada à Conta do Usuário e qualquer dano à honra, dignidade ou reputação de negócio do Usuário que surjam em conexão com o Jogo.\n2. Caso a Companhia seja julgada responsável de qualquer forma, por uma Corte Legal e/ou autoridade similar com competência legal e/ou jurisdição, sua responsabilidade está limitada a EUR 100 cumulativamente para todas as reinvindicações de um Usuário específico.\n3. O Usuário terá toda responsabilidade sobre Materiais inseridos pelo Usuário no Jogo e com relação a qualquer uso que o Usuário faça das Instalações Online.\n4. Nenhuma das Partes será responsável perante a outra a respeito de qualquer coisa que – além do previsto aqui –, possa constituir uma violação deste EULA, decorrente de causas de força maior, circunstâncias além do controle de qualquer das partes que incluem (mas não se limitam a) atos de Deus, perigos de mar ou ar, fogo, seca, explosão, sabotagem, acidente, embargo, tumulto, comoção civil ou autoridade civil, incluindo atos de governos locais ou autoridade parlamentar.\n5. O usuário irá indenizar completamente a Companhia e seus Afiliados por todas as reinvindicações, perdas, danos e demandas que surjam por causa do uso ou acesso pelo Usuário do Jogo ou das Instalações Online.\n \nResolução de Disputas e Leis Vigentes\n \n1. As partes concordam que este EULA, juntamente com todos os documentos que sejam parte deste EULA, serão interpretados de acordo com as Leis de Malta e serão sujeitos à jurisdição das Cortes de Malta.\n2. O processo de resolução de disputa pré-julgamento é obrigatório. As reinvindicações do Usuário devem ser enviadas para 60/2, Melita Street, Valletta VLT 1122, Malta e copiados por e-mail para suporte@tankionline.com.br, e tal reinvindicação deve conter uma lista especificando as violações feitas pela Companhia e/ou a Administração, Informação da Conta, informação de contato e assinatura do Usuário. O não cumprimento com a forma ou conteúdo da reinvindicação implica não cumprimento com o procedimento para resolução de disputas pré-julgamento, e o termo para análise da reinvindicação e envio de resposta pode demorar até trinta (30) dias úteis do momento de recebimento.\n \nConformidade Legal\n \nO Usuário confirma entender e aceitar que a Companhia é incapaz de prover o Usuário com conselhos legais ou garantias e que é responsabilidade exclusiva do Usuário garantir que esteja seguindo as leis que governam o Usuário, e que o Usuário tenha direitos legais para abrir uma Conta no Jogo e para jogar o Jogo. Toda participação no Jogo é feita por opção, discrição e riscos exclusivos do Usuário. Ao jogar o Jogo, o Usuário aceita que ele não acha o Jogo ou serviços ofensivos, censurável, injusto ou indecente em qualquer maneira.\n \nRenúncia\n \nA falha ou negligência da Companhia em aplicar, a qualquer momento, qualquer uma das disposições aqui contidas não deverão ser vistas como uma renúncia aos seus direitos aqui contidos, ou afetarão de qualquer forma a validade em todo ou em parte deste EULA, nem prejudicarão o direito da Companhia de tomar alguma ação.\n \nOutras condições\n \n1. Esse EULA representa o Contrato entre Usuário e Companhia em relação a seu conteúdo, e sobressai e anula quaisquer acordos anteriores entre as partes relacionados a tal conteúdo.\n2. Os títulos inclusos nesse EULA foram inseridos apenas pra conveniência de referência, e não intencionam a ser parte, ou afetar o significado ou interpretação de qualquer um dos termos e condições. Palavras no singular podem