  RENAME_ITEM_SHOP_DESCRIPTION: Este item permite que você renomeie a sua conta. Uma vez que este item for comprado, você pode encontrá-lo na sua Garagem na aba chamada «Especial ». Para usá-lo, por favor siga as instruções.
  GAME_PRIVACY_POLICY: "Política de privacidade e cookies\n\nAPL Publishing Ltd, registration no. C 85285, registered under the laws of Malta, 157, Archbishop Street Valletta, VLT1440, Malta (daqui em diante denominada “Companhia” ou “Administração), a detentora dos direitos exclusivos do Jogo respeita o direito dos Usuários à confidencialidade das Informações pessoais. A Companhia entende a importância de proteger as informações recebidas dos Usuários. A companhia aprovou esta Política de privacidade e cookies (daqui em diante denominada “Política”) para informar os Usuários sobre a coleta e uso de suas Informações pessoais.\n\nEsta Política fornece as condições, procedimentos e finalidades da coleta, uso, processamento, armazenamento, divulgação, transferência e apagamento das Informações pessoais do(s) Usuário(s), assim como as condições da proteção das Informações pessoais do(s) Usuário(s). Esta Política explica como um Usuário pode ver, atualizar e requisitar o apagamento de Informações pessoais conforme estipulado na Lei regente. Esta Política também fornece as condições, procedimentos e finalidades do uso e armazenamento de cookies pela Administração.\n\nO Acordo de Licença para o Usuário Final (daqui em diante denominado “Acordo”), Regras do Jogo e outros documentos publicados no Jogo e nos Serviços de jogo são parte integral desta Política. Por sua vez, esta Política é uma parte integral do Acordo, Regras do jogo e outros documentos do Jogo e dos serviços de jogo.\n\nEsta Política só é aplicada para os sites e outros serviços de Jogo, e não cobre outros sites e serviços.\n\nQualquer uso do Jogo e suas Instalações online e/ou clicar “Aceito” no formulário de registro significa que você conhece e concorda com esta Política, e aceita incondicionalmente todos os seus termos.\nSe você não concorda com qualquer condição desta Política, você não tem direito a continuar usando o Jogo e seus serviços, deixe este site e não use o Jogo.\n\n\nDefinições\n\nQualquer termo em maiúsculas aqui contido deve ter o mesmo significado que havia sido atribuído a ele no Acordo.\n\n\nObrigações\n\n1.       A Companhia se compromete a respeitar a privacidade do Usuário enquanto cumpre todas as leis aplicáveis de proteção de dados estabelecidas pela Lei regente. A Companhia garante que as Informações pessoais do Usuário são processadas imparcial e legalmente, e de acordo com a boa prática e só são coletadas para propósitos específicos que são conhecidos e aceitos pelo Usuário quando o Usuário decide fazer uso do Software, do Jogo e do Site internet.\n2.\tA Companhia está registrada na Comissão de Proteção de Dados em Malta, e adere ao Ato de proteção de dados, Capítulo 440 das Leis de Malta e quaisquer outros regulamentos, avisos legais e/ou regras similares relevantes em Malta.\n3.\tEsta Política cobre os seguintes recursos do Jogo: o jogo online interativo multiusuário “Tanki Online. Versão 2”, a sala de bate-papo do Jogo, o fórum do Jogo, Tanki Online Wiki, Tanki Online News (de agora em diante denominados coletivamente “Serviços do jogo”), assim como todos os formulários online, formulários internos e meios de comunicação usados nos serviços de jogo e no cliente de Jogo para coleta de informações pessoais.\n4.\tA Companhia assegura que tudo que é razoavelmente possível foi feito para que os Dados pessoais sejam a todo momento:\na.\tprocessados de acordo com os direitos do Usuário;\nb.\tprocessados imparcial e legalmente;\nc.\tobtidas somente para um propósito específico e legal;\nd.\tadequados, relevantes e não excessivos ao propósito da coleta;\ne.\tprecisos e atualizados;\nf.\tmantidos de forma segura;\ng.\tmantidos apenas pelo tempo necessário para o propósito da coleta;\nh.\tnão transferidos para jurisdições que não garantem proteção adequada dos seus Dados pessoais; e\ni.\tapenas utilizados para as razões aqui descritas.\n\n5.\tInformações pessoais recebidas pela Companhia só podem ser acessadas pelos empregados e representantes da Companhia, assim como as afiliadas da Companhia que detêm a liberação necessária.Todas as pessoas que têm acesso a tais Informações pessoais necessitam consentir com os termos desta Política e são obrigadas contratualmente por meio dos seus contratos de trabalho ou outros acordos a manter tais informações estritamente confidenciais, mesmo após o vínculo com a Companhia ter sido terminado.\n6.\tA Companhia está comprometida a tomar todas as medidas organizacionais e técnicas para proteger as Informações pessoais do Usuário de acesso ilegal ou acidental, destruição, alteração, bloqueio, cópia, distribuição, assim como outras ações ilegais de terceiros.\n7.\tA Companhia adotou as melhores práticas no que se refere ao princípio de proteção de comunicação de email com o Usuário, e a proteção de qualquer outro método de comunicação que possa ser necessário de tempos em tempos.\n8.\tA legislação de proteção de dados pode ser diferente em países diferentes. A Companhia tentará seguir as condições desta Política o máximo possível, e protegerá as Informações pessoais do Usuário o máximo possível, independente de onde tenham sido coletadas e/ou como foram transmitidas.\n9.\tA Companhia só pode transferir Informações pessoais a países terceiros se o terceiro país tem um nível adequado de proteção de Informações pessoais ou se tal transferência for necessária para a conclusão ou execução do Acordo ou outro contrato do interesse do Usuário, ou se tal transferência for necessária para proteger os interesses do Usuário, ou se a Companhia oferecer garantias adequadas em relação à proteção de Informações pessoais.\n\nColeta de Informações pessoais\n\n10.\tA Administração deve ter o direito de solicitar ao Usuário qualquer informação para permitir o uso do Jogo, o que pode incluir as informações fornecidas no processo de preenchimento de formulários especiais no Jogo e Serviços de jogo, incluindo as informações fornecidas durante o registro, assinatura de serviços, publicação de materiais e solicitação de outros serviços, incluindo email, número de telefone, dados de identificação (ID) em redes sociais, nome de usuário e senha.\n11.\tA Administração pode solicitar qualquer informação necessária para organizar e conduzir eventos no Jogo quando necessário o Usuário se registra para participar de tais eventos iniciados pela Administração.\n12.\tSe o Usuário iniciar correspondência com a Administração ou enviar um relatório sobre problemas no Jogo ou Serviços de jogo, a Administração tem o direito de armazenar toda essa correspondência.\n13.\tA Administração pode pedir ao Usuário que participe de pesquisas e solicite certas informações durante as pesquisas, mas isso não é um procedimento obrigatório, e qualquer Usuário pode se recusar a participar.\n14.\tA Administração pode coletar e processar os detalhes de transações e dos dados de pagamento do Usuário quando um Usuário utilizar qualquer Serviço pago.\n15.\tO navegador ou programa cliente do Usuário pode transferir certas informações sobre os detalhes de visitas a sites do Jogo e Serviços de jogo, incluindo informações sobre tráfego, arquivos de acesso, dados sobre localização geográfica do computador do Usuário e suas possibilidades, e outras informações. O Usuário aceita que a Administração pode usar essa informação para os fins e nos procedimentos estabelecidos nesta Política.\n16.\tA Administração pode solicitar outras informações do Usuário para executar algumas ações, tais como sexo, idade, data de nascimento, e preferências de jogo.\n17.\tA Administração pode coletar, processar e usar outras informações especificadas no Acordo, e quaisquer dos documentos que formam uma parte integral da EULA.\n\n\nConsentimento do usuário\n\n18.\tSe no formulário de registro dos Serviços pagos ou qualquer outro formulário de registro usado no Jogo ou Serviços de jogo, o Usuário fornecer qualquer Informação pessoal, tal fornecimento significa que o Usuário deu expressivamente seu direto e definitivo consentimento a essa Política, ao Acordo e a qualquer documento que faça parte do Acordo, e tal fornecimento significa que o Usuário deu expressamente seu direto e definitivo consentimento na coleta, processamento, uso, armazenamento, divulgação, transferência, transferência entre-fronteiras (transferência para outros países) e destruição das informações pessoais de qualquer Usuário, para os fins informados nesta Política, no Acordo e quaisquer documentos que fazem parte do Acordo.\n\n19.\tInformações pessoais deverão ser coletadas apenas para fins legais e em particular devem ser coletadas pelas razões abaixo:\na.\tverificação dos detalhes do Usuário;\nb.\tregistro de uma Conta junto à Companhia;\nc.\tpromoção e marketing de atividades;\nd.\tconformidade com as leis aplicáveis;\ne.\tfornecimento adequado e qualitativo ao Usuário de quaisquer serviços adicionais que a Companhia possa oferecer, tais como suporte técnico relativo ao Jogo; e\nf.\tperformance e execução do Acordo e de todos os documentos que formam parte integral do Acordo pela Companhia, seus fornecedores e/ou qualquer terceiro agindo em seu nome.\n20.\tA Administração deve ter o direito de coletar e fazer qualquer uso que ache adequado de qualquer informação que não seja considerada uma Informação pessoal, de acordo com a Lei regente, e o Usuário aqui aceita que a Companhia pode divulgar para quaisquer terceiros tais Informações não pessoais.\n21.\tO Usuário tem o direito de contestar ao procedimento de coleta das suas Informações pessoais, e tem o direito de revogar tal consentimento a qualquer momento, exceto quando determinado de outra forma pela Lei regente. Quando um Usuário revogar seu consentimento, ele entende e aceita que isto pode ter uma influência negativa na qualidade do Jogo e das Instalações online, assim como causar a impossibilidade de acesso ao Jogo e/ou Serviços de jogo e que o Usuário aqui concorda que a Companhia não terá qualquer responsabilidade por qualquer perda e/ou dano às Informações pessoais do Usuário em tal caso.\n\nUso e processamento de Informações pessoais\n\n22.\tO Usuário também aceita que a Companhia deve ter o direito de armazenar e processar as Informações pessoais fornecidas, que a Companhia achar necessárias para fazer uso do Jogo. O Usuário também aceita e entende que todas as atividades dentro do Jogo são registradas.\n23.\tAs Informações pessoais que são divulgadas pelo Usuário são coletadas e processadas pela Administração com a finalidade de executar o Acordo e outras ações especificadas no Acordo, Regras do jogo e nesta Política. O processamento de Informações pessoais é a coleta, registro, sistematização, classificação, armazenamento, acumulação, atualização, modificação, agrupamento, bloqueio, uso, divulgação, transferência a terceiros, disseminação, destruição, apagamento, e outras ações necessárias para execução do Acordo.\n24.\tA Companhia não vende as Informações pessoais do Usuário, e não divulga tais informações a terceiros, exceto conforme identificado nesta Política. A Companhia pode divulgar informações gerais demográficas e estatísticas para parceiros de negócio e anunciantes. Isto não está diretamente relacionado às Informações pessoais e não pode identificar um Usuário específico.\n25.\tPara garantir fornecimento adequado de serviços, a Companhia tem o direito de transferir Informações pessoais para outras pessoas ou organizações que fornecem serviços de hospedagem, serviços de pagamento, serviços relacionados ao envio de e-mails, e a moderadores. Estas pessoas e organizações têm o direito de usar as Informações pessoais recebidas somente para fins de fornecimento de serviços aos Usuários, e devem ser regidos pelos termos garantindo o correto uso das Informações pessoais.\n26.\tO Usuário aceita que a Companhia deve ter o direito de transferir as Informações pessoais fornecidas para qualquer afiliada da Companhia para fins de fornecimento adequado e de alta-qualidade e melhorias dos Serviços de jogo e para fins de melhorar os Serviços de jogo, para a execução do Acordo, Regras do jogo e esta Política.\n27.\tSe a Companhia se fundir a outra companhia no futuro por meio de processo de reorganização e/ou fusão e/ou venda e/ou aquisição e/ou liquidação e/ou por meio de outro processo, as Informações pessoais do(s) Usuário(s) podem ser transferidas junto com a Companhia ou sua parte, e pode ser vendida como parte da Companhia.\n28.\tO Usuário aceita que a Companhia deve ter o direito e a obrigação de divulgar Informações pessoais quando ordenada a fazê-lo por uma decisão derivada da Lei regente e/ou qualquer outra jurisdição respeitável e/ou quando obrigada a fazê-lo por ordem da Autoridade reguladora e/ou quando obrigada a fazê-lo por ordem da Comissão de proteção de dados e/ou no evento do Usuário ser direta e/ou indiretamente envolvido em qualquer crime que de alguma forma envolva o Jogo e/ou os serviços da Companhia.\n29.\tO Usuário concorda que se a Companhia receber uma solicitação de terceiros (detentores de direitos autorais) relacionada à violação do Usuário de direitos a Materiais colocados no Jogo ou nos Serviços de jogo, a Companhia deve ter o direito de transferir as informações sobre tal Usuário para o terceiro (detentor dos direitos autorais).\n30.\tSe o Usuário entrar no Jogo e/ou se registrar no Jogo por meio de sites de terceiros e/ou por meio de sites de parceiros da Companhia, tais pessoas podem solicitar, coletar e processar informações pessoais do Usuário com a finalidade de fornecer serviços apropriado e de alta qualidade. As políticas de privacidade e cookies dos terceiros serão aplicadas neste caso. O Usuário aceita que a Companhia deve ter o direito de transmitir as Informações pessoais do Usuário para tais pessoas para a finalidade de fornecimento adequado e de alta qualidade dos Serviços de jogo, execução do Acordo, Regras do jogo e esta Política.\n\nArmazenamento de informações pessoais\n\n31.\tA Companhia vai tomar todas as providências para o armazenamento adequado e seguro das Informações pessoais do Usuário armazenadas de acordo com as condições desta Política. Todas as informações fornecidas pelo Usuário são armazenadas nos servidores da Companhia.\n32.\tA Companhia deve usar uma tecnologia padrão que inclui firewalls para garantir a segurança das Informações pessoais.\n33.\tO Usuário está obrigado a não divulgar ou transferir seus detalhes de identidade ou conta, que são usados para autorização no Jogo, a terceiros. O Usuário é totalmente responsável pelo armazenamento das suas informações de conta.\n34.\tSe o Usuário perceber que suas informações de conta foram roubadas ou estão no poder de terceiros, o Usuário deve informar imediatamente a Companhia sobre tais circunstâncias para que a Companhia possa tomar as medidas adequadas. Em tais casos a Companhia não pode garantir a segurança das Informações pessoais do Usuário e o Usuário aceita que a Companhia não pode ser responsabilizada por qualquer uso destas Informações pessoais.\n35.\tQuando o Usuário comunica dentro do Jogo ou Serviços de Jogo (usando uma sala de bate-papo, fórum etc.), o Usuário entende que tal comunicação se passa através do Servidor da Companhia e concorda que estes dados podem ser coletados, armazenados e estudados pela Administração. A Administração não é responsável pela confidencialidade das Informações pessoais e/ou outras informações que o Usuário divulga para outros Usuários por meio do Jogo, Serviços de jogo ou outros serviços associados ao Jogo (usando uma sala de bate-papo, fórum, redes sociais, etc.) e a Administração deve ter o direito de considerar tais informações como sendo disponíveis em domínio público.\n\n\n\nCookies, endereços de IP e arquivos de acesso\n\n36.\tA Administração pode coletar e processar informações sobre o computador do Usuário, arquivos de log, incluindo endereço de IP, tipo de sistema operacional, navegador e cliente de email, informações sobre o tráfego, data e hora, detalhes das visitas aos serviços de jogo, atividade do usuário, informações sobre acessos, configurações e notificações do sistema. Estas informações sobre as ações dos Usuários no Site internet é coletada e armazenada com a finalidade de administração do sistema, garantindo funcionamento adequado do Jogo e Serviços de jogo, para a finalidade de segurança e fortalecimento da proteção e garantindo a integridade do sistema (prevenção de ataque de hackers, acesso não autorizado).\n37.\tA Administração usa cookies para que o Jogo funcione adequadamente. Cookies são pequenas informações de texto de registro que são criadas automaticamente e armazenadas no computador / outro equipamento do Usuário para associar e identificar atividade do Usuário (a partir de agora denominadas “Cookies”). Os cookies normalmente não incluem nomes e/ou endereços de email e/ou outras Informações pessoais. Na verdade, eles tipicamente contêm informações anônimas que são necessárias para melhor funcionalidade do Jogo e/ou Serviços de jogo.\n38.\tCookies armazenados no computador / outro equipamento do Usuário por meio do qual o Usuário faz uso do Jogo e/ou seus Materiais tem, entre outras mas sem limitação, as seguintes funções:\na.\tfornecimento de acesso a áreas seguras que o Usuário requisitou, sem estes Cookies, serviços você requisitou como áreas de login seguro não podem ser fornecidos;\nb.\tCookies de visita - lembrando as escolhas e/ou configurações que o Usuário fez e permitir o reconhecimento do Usuário ao fazer uso do Jogo. Sem tais Cookies, a funcionalidade do Jogo pode ser limitada;\nc.\tCookies de votação (pesquisa) - marcar os itens de qualquer pesquisa na qual o Usuário votou e prevenir o Usuário de votar novamente na mesma pesquisa;\nd.\tCookies de equilíbrio de carregamento de sessão - melhorando o tempo de carregamento do Jogo espalhando a carga de trabalho e otimização de tempo dos serviços de jogo. Sem esses Cookies a funcionalidade do Jogo pode ser perdida;\ne.\tCookies de customização da interface do usuário que tornam possível salvar as configurações de interface de Usuário no caso de entrada repetida no Jogo e serviços de jogo;\nf.\tCookies colocados e usados para sincronização com os dados do Usuário em redes sociais;\ng.\tCookies de performance (Analíticos) - coletando informações anônimas sobre como o Usuário faz uso do Jogo;\nh.\tCookies de Propaganda - entregar ao Usuário as propagandas mais relevantes, e ajudar a melhorar a eficiência das campanhas de propaganda. O Usuário aceita e concorda que a Companhia pode fazer uso destes cookies para suas próprias campanhas de propaganda.\n39.\tA Administração também pode permitir que certos terceiros coloquem e façam uso dos seus próprios cookies de performance web (análises) e propaganda no equipamento do Usuário e para coletar informações dos Cookies da Companhia, para fins de armazenamento e análise das informações sobre as preferências dos Usuários, e para melhorar a qualidade dos serviços. Neste caso, tais terceiros estão obrigados por esta Política. A Administração garante que ela deve permitir exclusivamente terceiros reputáveis a fazer tal uso.\n40.\tO Usuário entende que ao fazer uso do Jogo por meio de qualquer Site de Redes sociais, tais como o Facebook, o Usuário pode ter de aderir à política de cookies particular do site de Redes sociais, e o Usuário concorda que a Administração não deve ter nenhuma responsabilidade por tal uso dos cookies.\n41.\tUsando o Jogo e/ou as Instalações de internet, ou aceitando o Acordo (incluindo esta Política) e/ou clicando em “Aceito”, o Usuário entendeu e aceitou esta Política e expressa seu consentimento direto e definitivo que a Administração pode colocar, armazenar e fazer uso dos cookies no computador / qualquer outro equipamento do Usuário pelo qual faz uso do Jogo e/ou seus Materiais. A Administração pode continuar a presumir que o Usuário concorda com esta Política até que e/ou a não ser que o usuário desabilite os cookies por meio das configurações do navegador conforme fornecido aqui. Ao fornecer este consentimento, o Usuário dá à Administração uma possibilidade de melhor entender o Usuário e suas preferências, desenvolver e melhorar a qualidade dos serviços o tempo todo, considerando os interesses dos Usuários. O Usuário concorda que sem habilitar os Cookies o Jogo pode não funcionar adequadamente.\n42.\tA Administração garante que os cookies armazenados são seguros para os Usuários e absolutamente necessários para o funcionamento normal do Jogo e serviços do jogo, e para fornecer os serviços para os Usuários pela Administração.\n43.\tOs cookies são armazenados por não mais que um ano. Os termos do armazenamento dos cookies por terceiros deve ser estabelecido pelo terceiro.\n44.\tO Usuário pode a qualquer momento recusar-se a aceitar cookies e desabilitar os cookies mudando as configurações do seu navegador. Desabilitar os Cookies pode ter uma influência negativa na qualidade do Jogo e das Instalações online, e pode também tornar o impossível o acesso ao Jogo e às Instalações online, e o Usuário concorda que a Companhia não será responsabilizada por qualquer perda e/ou dano às informações do Usuário caso o Usuário desabilite os cookies.\n\n\nObtendo e alterando Informações pessoais do Usuário\n\n45. \t Usuário deve ter o direito de entrar em contato com a Administração a qualquer momento para obter uma cópia das Informações pessoais do Usuário que a Companhia tenha armazenadas e para que incorreções sejam corrigidas onde apropriado. O Usuário deve ter o direito a solicitar que suas Informações pessoais sejam apagadas, corrigidas, emendadas ou completadas. Para entrar em contato com a Administração com relação a Informações pessoais, o Usuário deve enviar email para help@tankionline.com.\n\nRecusa em fornecer qualquer Informação pessoal\n\n46.\tQualquer Informação pessoal fornecida pelo Usuário à Administração é fornecida de forma voluntária. Mesmo assim, a Companhia não pode garantir que o Jogo e/ou serviços de jogo devem funcionar adequadamente e/ou devem funcionar em caso do não fornecimento de qualquer Informação pessoal quando solicitado.\n\nSites de redes sociais\n\n47.\tO Usuário confirma que entende e aceita que, ao fazer uso do Jogo por meio de qualquer Site de redes sociais ou outro site de terceiros, pode também sujeitar o Usuário aos termos e condições deles.\n\n\nAlterações na Política\n\n48.\tEsta Política é válida a partir da data da última versão. Esta Política pode ser alterada, emendada, trocada de qualquer forma e a qualquer momento sem aviso prévio ou posterior ao Usuário, então recomendamos que olhe esta Política de tempos em tempos para se informar sobre mudanças. Qualquer uso subsequente do Jogo e serviços do jogo significa aceitação incondicional da versão alterada desta Política.\n\nContatos com a Administração\n\n49.\tSe você tiver quaisquer perguntas, observações, reclamações ou comentários sobre esta Política, entre em contato conosco em help@tankionline.com. Vamos analisar suas perguntas o mais cedo possível.\n50.\tA Administração pode declinar solicitações excessivamente frequentes, que requisitem esforços técnicos desproporcionais, coloquem em risco a privacidade de outros Usuários ou sejam extremamente impraticáveis.\n51.\tSe o Usuário iniciar qualquer correspondência com a Administração ou submeter um relatório sobre problemas com o Jogo ou serviços de jogo, a Administração deve ter o direito de armazenar toda essa correspondência."
