  SPECTATE_TEXT: Acompanhar
  GAME_RULES: "Resumo das regras\n \nNo jogo, é proibido:\n- bots, uso de software de terceiros, erros;\n- apresentar-se falsamente como membro da Administração;\n- ganhar níveis criando obstáculos para outros jogadores;\n- propaganda, pedidos políticos;\n- violação de leis, incluindo as relacionadas a direitos de propriedade intelectual;\n- venda, compra, troca ou transferência de Contas e outros valores do jogo;\n- fraude, trapaças.\n \nNos bate-papos e nos fóruns do jogo, é proibido:\n- insultos, ameaças, difamação;\n- xingamento, mesmo que implícito;\n- mensagens em massa, ofensas, lixo eletrônico, LETRAS MAIÚSCULAS;\n- fraudes envolvendo senhas ou outras informações da Conta;\n- baderna;\n- incentivar outros a violar as regras;\n- discussão pública sobre a Administração e os moderadores do jogo.\n- publicação de informações proibidas por lei;\n- publicação de links para recursos de terceiros;\n- qualquer forma de discriminação.\n \nRegulamento do jogo\nVocê está em Tanki Online, onde pessoas de todo o mundo se divertem pilotando veículos militares de várias toneladas e participando de batalhas ferozes! Os jogadores podem lutar sozinhos, formar equipes, lutar lado a lado com os amigos pela vitória conjunta, comunicar-se e fazer novos amigos. O Tanki Online é uma aventura multiusuário de fácil domínio, uma arena para competições sérias e um lugar para comunicação agradável.\nApós o registro, o Jogador recebe um tanque virtual e 500 cristais (moeda do jogo). O Jogador adquire uma classificação mais alta e ganha novas patentes e cristais vencendo batalhas. Cristais são gastos com suprimentos que podem ser usados em batalha e servem também para comprar e modernizar as armas principais e as carrocerias dos tanques.\nO Tanki Online não é só um jogo interessante, mas também uma comunidade de pessoas unidas por interesses iguais. Louvamos o respeito mútuo e a cortesia na comunicação e não aprovamos comportamentos que violem os direitos de outros usuários nem que os insultem. A Administração do Tanki Online reserva-se o direito de restringir a comunicação de usuários, de reduzir sua pontuação e de bloquear sua conta se violarem estas Regras.\n \n\nTermos gerais\nO Regulamento do jogo é parte integrante do Contrato de licença com o Usuário (doravante denominado \"Contrato\") e outros documentos do Jogo e serviços do jogo. Por sua vez, o Acordo, a política de não divulgação e os cookies, bem como outros documentos publicados no Jogo e serviços do jogo, são parte integrante deste Regulamento.\nQuaisquer termos e noções utilizados neste Regulamento têm o significado que lhes é atribuído pelo Acordo.\nAo usar o Jogo de qualquer forma e/ou concluir o procedimento de registro no Jogo pressionando o botão \"Confirmar\", o usuário confirma que ele leu, compreendeu e concordou incondicionalmente com este Regulamento do Jogo e todas as suas condições.\nO presente Regulamento do Jogo é obrigatório para todos os Usuários.\nSe não concordar com quaisquer disposições deste Regulamento do Jogo, você não tem o direito de continuar a utilizar o Jogo e seus serviços e deve sair da Página imediatamente.\n \n1. É proibido criar nomes de exibição (Nomes de Usuário) para o jogo que:\n1.1. Contenham linguagem ofensiva ou agressiva, insultos/provocações (na forma de palavras, abreviações, expressões ou frases);\n1.2. Contenham elementos de racismo, insultos ou apelidos baseados em raça, nacionalidade ou religião, ou aqueles que incitem ódio, intolerância, discórdia étnica;\n1.3. Contenham chamados à violência, ao terrorismo, ao extremismo e/ou a tumultos;\n1.4. Contenham solicitações ou propaganda política de qualquer tipo;\n1.5. Sejam direta ou indiretamente relacionados a organizações políticas (pessoas), incluindo aquelas que tenham cometido crimes políticos ou crimes contra a humanidade, atos terroristas etc.\n1.6. Contenham discriminação baseada em sexo, idade, religião ou qualquer outra condição;\n1.7. Que contenham propaganda direta ou indireta, exortação ao consumo de bebidas alcoólicas, cerveja, tabaco, drogas, tóxico, psicotrópicos e/ou substâncias entorpecentes, seus precursores, que contenham informações sobre lugares e métodos de produção, aquisição, cultivo e uso;\n1.8. Contenham informações sobre convites para jogos de azar, prostituição, vadiagem, mendicância;\n1.9. Contenham informações sobre métodos de suicídio, convites para suicídio, violência ou outras ações que representem ameaça à vida ou à saúde;\n1.10. Contenham exortação a comportamento ilegal, violência, crueldade, danos e que instiguem a cometer ações proibidas por lei;\n1.11. Contenham negações de valores familiares, desrespeito aos pais e/ou a outros membros da família;\n1.12. Contenham partes de nomes de usuário de membros da Administração ou que contenham informações que possam induzir o Usuário a uma percepção equivocada como membro da Administração;\n1.13. Contenham críticas ao Jogo, à Administração ou aos moderadores;\n1.14. Estejam direta ou indiretamente conectados a relações sexuais, estupro, pornografia, pedofilia;\n1.15. Contenham descrição do corpo e reflexos ou funções biológicas inferiores;\n1.16. Contenham propaganda e hiperlinks;\n1.17. Contenham referências a códigos de trapaça, páginas de trapaças, recursos que violem os direitos da Administração;\n1.18. Nomes que consistam de conjuntos de letras aleatórias e impronunciáveis (nomes de usuários de mensagens em massa);\n1.19. Que consistam total ou parcialmente de elementos de marcas registradas que sejam protegidas por direitos autorais;\n1.20. Contenham outras informações proibidas por estas Regras, este Contrato e/ou as leis vigentes.\n1.21. Se o nome de usuário do jogo não cumprir os requisitos acima, outros requisitos especificados nestas Regras, no Contrato ou nas leis vigentes, a Administração deverá ter o direito, ao seu critério exclusivo, de:\n      - exigir que o Usuário mude o nome no jogo para um que seja aceitável e bloquear a Conta do Usuário pelo tempo necessário para a mudança do nome;\n        - bloquear em caráter irrevogável a Conta do Usuário.\n \n2.Os seguintes itens são proibidos e passíveis (a critério da Administração) de bloqueio temporário ou permanente da Conta, redução de todos os valores virtuais no Jogo em 10% até 100% (garagem, cristais, estatística de jogo) ou a reinicialização da Conta, a limitação temporária ou permanente do acesso aos bate-papos do Jogo e ao Fórum (banimento):\n2.1. Quaisquer formas de comportamento desmotivador ou grosseiro no Jogo:\n2.1.1. \"Botting\" (uso de software que imita as ações dos usuários no jogo), uso de programas clicadores, macros que controlam mouse e teclado, uso de outros softwares de terceiros para obtenção de vantagens no jogo;\n2.1.2. Aplicativos ou software de terceiros ou outros meios de melhoria/automação de possibilidades do jogo (os chamados \"bots\", trapaças), bem como programas que deteriorem o funcionamento do Jogo, dispositivos eletrônicos de terceiros;\n2.1.3. Exploração de erros do software do Jogo e transferência de informações sobre eles a terceiros, exceto à Administração;\n2.1.4. Receber pontos às custas de omissão deliberada ou ajudar jogadores de outra equipe nos modos \"Captura de Bandeira\", \"Equipe contra equipe\" e \"Controle de pontos\", ou a equipes adversárias no modo \"Combate mortal\" (o chamado \"ganho de níveis\");\n2.1.5. Batalhas entre contas do mesmo Usuário;\n2.1.6. Criação de contas adicionais para ganhar níveis na conta principal;\n2.1.7. Fazer acordos com outros usuários para jogar de forma negligente a fim de ganhar níveis para o Usuário (a Administração aplicará sanções a todos os membros de tal acordo);\n2.1.8. Atos ou omissões que visem criar obstáculos para a equipe da qual o usuário é membro, inclusive nos modos CTF, TDM e CP, lutar contra a equipe da qual você é membro, prejudicar/destruir o tanque de um aliado, lutar em interesse da equipe adversária, acordos com o adversário, sabotagem;\n2.1.9. Discriminação de jogadores inexperientes (novatos): desinformação, intimidação, zombaria;\n2.1.10. Insultos, difamação (disseminação de informações falsas) em relação a outros Usuários do Jogo, Administração, moderadores ou outras pessoas;\n2.1.11. Quaisquer formas de manipulação ou conspiração no Jogo:\n2.1.12. Quaisquer ações que tenham influência negativa sobre o desenvolvimento e a imagem do Jogo;\n2.1.13. Outras formas de comportamento desmotivador que atrapalhe o curso normal do processo de jogo, o que será reconhecido como tal pela Administração.\n\n2.2.Quaisquer formas de operações fraudulentas, em especial:\n2.2.1. O uso do Jogo e/ou serviços do jogo para ações fraudulentas, incluindo, sem limitação, operações financeiras fraudulentas no jogo, fraude no curso de transações, pagamentos, incluindo qualquer reembolso, transações proibidas;\n2.2.2. Transferência dos valores do jogo do Usuário ou da Conta a terceiros; publicação de informações sobre a intenção de vender, comprar ou transferir os valores da Conta ou do Jogo, tanto de forma gratuita quanto por cristais ou fundos, bem como a instigação das referidas ações;\n2.2.3. Tentativas para obter a senha, outros dados da Conta ou outras informações pessoais de qualquer outro usuário, inclusive sob extorsão, usando ameaças morais, físicas ou técnicas;\n2.2.4. Divulgação de informações pessoais de outros usuários ou de terceiros (a não ser que tal informação esteja acessível ao público);\n2.2.4. Fraude - receber moeda do jogo usando quaisquer meios fraudulentos;\n2.2.5. Quaisquer tentativas de fingir ser ex-funcionário ou funcionário atual da Administração ou assistente de projeto (moderador, consultor etc), incluindo o envio de mensagens em nome da Administração ou dos moderadores;\n2.2.6. Mendicância de qualquer forma, incluindo pedidos de transferência de fundos, valores de jogos ou cristais;\n2.2.7. Publicação de links para recursos externos disfarçados de recursos oficiais do jogo.\n\n2.3.Outras violações:\n2.3.1. Uso de linguagem grosseira ou vulgar, outros palavrões ou frases rudes não classificados como xingamento, de forma disfarçada;\n2.3.2. Publicação das informações e de materiais de natureza sexual, erótica ou pornográfica, ilustrando ou descrevendo relações sexuais entre um homem e uma mulher;\n2.3.3. Publicação de informações ou símbolos que insultem ou humilhem os sentimentos de religiosos, que incitem o ódio, a inimizade, a discórdia racial, internacional ou étnica, a intolerância (incluindo insultos, como dar apelidos com base em raça, etnia, características nacionais, religião), e também provocação do interlocutor para que cometam as ações especificadas;\n2.3.4. Propaganda ou demonstração de emblemas ou símbolos nazistas, abreviaturas ou designações, nomes e sobrenomes de ativistas nazistas;\n2.3.5. Publicação de informações que neguem fatos históricos;\n2.3.6. Publicação das informações em que se possa verificar elementos de exortação à violência, à guerra, ao terrorismo, à subversão do poder, a atividades extremistas e/ou a tumultos;\n2.3.7. Publicação de informações sobre organizações políticas (líderes políticos) que tenham cometido crimes políticos ou crimes contra a humanidade, atos terroristas ou que, de outra forma, tenham violado leis internacionais;\n2.3.8. Publicação de informações que contenham solicitações políticas, propaganda política, propaganda eleitoral de qualquer natureza;\n2.3.9. Discussão de questões políticas atuais para provocar conflitos;\n2.3.10. Qualquer forma de discriminação baseada em sexo, idade, religião ou outras características;\n2.3.11. Ameaças de qualquer forma relacionadas a Usuários, Administração ou terceiros;\n2.3.12. Publicação de informações que contenham métodos de suicídio, exortação ao suicídio, à violência ou a outras ações que representem uma ameaça à vida ou à saúde, descrições de técnicas de combate perigosas, acrobacias, armas, métodos de produção de armas, descrição de métodos de modificação do corpo;\n2.3.13. Publicação de informações que descrevam, instiguem ou justifiquem comportamento ilegal ou antissocial, crime, violência, mutilação, crueldade psíquica ou física de pessoas, animais, causando danos à propriedade alheia;\n2.3.14. Publicação de informações que provoquem medo, terror ou pânico em crianças, incluindo imagens ou descrições de morte, doenças, suicídios, acidentes, emergências ou desastres e/ou suas consequências, outras informações que possam prejudicar a saúde ou o desenvolvimento de menores;\n2.3.15. Publicação de informações sobre menores que tenham sofrido em consequência de ações ilegais (omissões);\n2.3.16. Publicação de informações que contenham propaganda direta ou indireta, exortação ao consumo de bebidas alcoólicas, cerveja, produtos de tabaco, acessórios de tabagismo, drogas, tóxico, psicotrópicos e/ou substâncias entorpecentes, seus precursores, que contenham informações sobre lugares e métodos de produção, aquisição, cultivo e uso;\n2.3.17. Publicação de informações que possam aumentar o desejo de participar de jogos de azar, prostituição, vadiagem ou mendicância;\n2.3.18. Qualquer uso de objetos de propriedade intelectual (software, arte, vídeo e outros objetos ou suas partes, marcas etc.) ou outros materiais sem autorização do titular do direito; publicação de links para conteúdo pirata; exclusão ou alteração das informações sobre direitos de propriedade intelectual, em especial, links para titulares de direitos, autores e outras confirmações dos direitos de propriedade intelectual;\n2.3.19. Publicação de materiais ou informações publicitários sem a aprovação da Administração;\n2.3.20. Publicação de informações que possam resultar em danos/prejuízos para os usuários ou para a Administração;\n2.3.21. Críticas não construtivas ao Jogo e/ou aos seus autores, os Detentores dos Direitos;\n2.3.22. Discussão pública expressa ou implícita da Administração ou de moderadores do Jogo;\n2.2.23. Fornecimento de informações, documentos e provas falsas ou fictícias. A Administração alerta ao usuário sobre a responsabilidade criminal e outras sobre tais atividades;\n2.3.24. Execução ou instigação (provocação) a ações (omissão) que são proibidas por este Regulamento, pelo Contrato e/ou pela legislação aplicável.\n \n3.É proibido iniciar tópicos e/ou criar mensagens em bate-papos do Jogo e/ou Fórum que:\n3.1. Reproduzam tópicos ou mensagens já existentes, bem como temas que foram recentemente discutidos e/ou cujas respostas estejam disponíveis nas seções de informações (Regras, Perguntas Frequentes, Planos etc.) Não se esqueça de usar a busca para encontrar respostas para as questões que sejam do seu interesse, procure or tópicos já existentes antes de iniciar um novo.\n3.2. Não estejam de acordo com o tema da seção/categoria;\n3.3. Contenham CAPS LOCK ou VÁRIAS LETRAS MAIÚSCULAS no título e/ou no conteúdo do tópico ou da mensagem;\n3.4. Tenham símbolos, caracteres, emoticons, mensagens irrelevantes ou repetidos no título e/ou descrição do tópico ou mensagem que dificultem a compreensão do tema ou da seção ou que não transmitam qualquer significado (mensagem em massa), por exemplo == - Meu tópico - = =;\n3.5. Contenham texto com tamanho de fonte maior que 24;\n3.6. Com falta de informações e que não reflitam o cerne da questão (por exemplo, \"Vasya, responda\") no título ou na descrição do tema;\n3.7. Citem textos muito grandes de mensagens anteriores e/ou imagens sem qualquer necessidade especial (sobrecitar);\n3.8. Continuem a discutir temas que tenham sido fechados ou excluídos pela Administração (necroposting);\n3.9. Tenham caráter de apelo pessoal aos participantes do Fórum ou Bate-papo. Para comunicação pessoal, use mensagens privadas. Discussões pessoais são permitidas paralelamente à resposta de perguntas;\n3.10. Contenham lixo eletrônico, ou seja, distribuição de informações que o destinatário não solicitaou, não demonstrou interesse em receber e/ou não consentiu em receber;\n3.11. \"Ofensas\" (\"discutir apenas por discutir\", uma troca de mensagens que é apenas uma guerra de palavras, que muitas vezes não tem relação com a causa original da disputa);\n3.12. Contenham zombarias (incitação de participantes da comunidade a ações que tenham efeitos adversos e conflituosos para eles);\n3.13. Destinem-se à provocação de outros usuários, Administração, moderadores, bem como à obstrução da comunicação no Fórum ou nos bate-papos do Jogo;\n3.14. Contenham links de referência, \"Códigos de trapaça\" (addscore, Buy_krictals_in_the_panzer);\n3.15. Contenham outras informações ou violações que sejam proibidas por este Regulamento, pelo Contrato e/ou pelas leis aplicáveis.\n3.16. A Administração terá o direito, a seu exclusivo critério, de aplicar restrições na forma de bloqueio temporário ou permanente da Conta ou restrição temporária ou permanente de acesso aos bate-papos do Jogo e ao Fórum (banimento) para o usuário pelas violações mencionadas.\n3.17. A Administração terá o direito, a seu critério exclusivo, de apagar qualquer informação ou mensagem; apagar/mover o tópico criado na seção do Fórum errado para outra seção, sem aviso prévio.\n3.18. As mensagens privadas são destinadas à comunicação pessoal do usuário em serviços do jogo e no Fórum. Durante o processamento de queixas sobre violação de Regras, a Administração não considerará queixas sobre mensagens privadas. O usuário pode parar de receber mensagens privadas de outro usuário adicionando-o à Lista negra na seção apropriada do perfil no Fórum.\n \n \n4.Aplicação de restrições ao Usuário\n4.1. Se o Usuário violar essas Regras, a Administração terá o direito de aplicar as restrições previstas na respectiva seção deste Regulamento ao Usuário.\n\n4.2.Tipos de restrições:\n4.2.1. Bloqueio permanente ou temporário da Conta - bloqueio (limitação) de acesso ao jogo.\n4.2.2. Redução de todos os valores virtuais no Jogo em 10% até 100% (garagem, cristais, estatística de jogo) ou a redefinição da Conta.\n4.2.3. Restrição temporária ou permanente do acesso do Usuário a bate-papos do Jogo e ao Fórum (banimento) – restrição da possibilidade de deixar mensagens em bate-papos do Jogo e no Fórum.\n4.2.4. A exclusão ou a alteração, sem aviso prévio, de quaisquer informações ou mensagens publicadas em qualquer parte do Jogo ou serviços do jogo; transferência de tópicos do Fórum para outra seção ou exclusão de tópicos.\n4.3. Essas restrições podem ser aplicadas à Conta de qualquer usuário que viole estas Regras.\n4.4. A Administração terá o direito, a seu critério exclusivo, de aplicar uma ou várias restrições ao mesmo tempo ao Usuário ou dar-lhe uma advertência.\n4.5. Ao escolher restrições, a Administração considera o tipo e o número de violações, bem como violações anteriores destas Regras pelo Usuário.\n4.6. Como nem sempre é possível identificar com precisão violações específicas das Regras, a decisão final é sempre da Administração.\n4.7. A violação destas Regras significa que o Usuário pode perder o direito imediatamente, sem qualquer aviso prévio, à prestação de serviços do jogo ou tais serviços podem ser restringidos total ou parcialmente.\n4.8. Se o Usuário violar as Regras várias vezes ou de forma integrada, a Administração terá o direito, a seu critério exclusivo, de repetir as restrições aplicadas ao usuário.\n4.9. A Administração não será de forma alguma responsável por quaisquer perdas ou danos, diretos ou indiretos, que o Usuário ou um terceiro possa ter sofrido como resultado do uso por parte do Usuário ou de terceiros da Página na internet, do Jogo e/ou dos Recursos On-line, incluindo, mas não limitado a, danos causados por incapacidade de uso do Jogo e dos Recursos On-line, ou causados pela aplicação de restrições ao Usuário pela Administração, danos diretos ou indiretos decorrentes de ações de terceiros, incluindo outros usuários do Jogo, da falta de acesso à internet, roubo, destruição de materiais, perda de informações relacionadas à Conta do Usuário e qualquer dano à honra, à dignidade e à reputação empresarial do Usuário que tenham conexão com o jogo.\n \n5. Moderadores\n\n5.1. Moderadores são auxiliares da Administração e são selecionados pela Administração entre os jogadores.\n5.2. Um moderador é uma pessoa que age em nome e no interesse da Administração, exortado a manter e controlar a ordem no Jogo e nos serviços do jogo, bem como no Fórum e em bate-papos do Jogo.\n5.3.O moderador tem o direito de aplicar restrições temporárias ou permanentes de acesso aos bate-papos do Jogo e ao Fórum (banimento) ao Usuário em caso de violação dessas Regras.\n5.4. O moderador deve ser honesto e objetivo na tomada de decisões e também deve cumprir as disposições do presente Regulamento e do Contrato, ser educado com os Usuários, realizar suas funções de forma eficiente e com regularidade.\n5.5. É estritamente proibido ao moderador abusar de seus poderes. Todas as ações dos moderadores são registradas. Se um dos moderadores não fizer jus à confiança depositada nele, será dispensado sem discussões nem advertências por decisão interna da Administração.\n5.6. A atividade de moderadores é realizada de forma voluntária. O Usuário não terá o direito de obrigar o Moderador a aplicar quaisquer restrições.\n \n6.Reclamações e Pedidos\n\n6.1. O Usuário tem o direito de denunciar violações de Regras, para isso, deve entrar em contato com o Suporte através do seguinte email supporte@tankionline.com.br. É necessário especificar claramente a natureza da violação no novo tópico e anexar uma captura de tela do bate-papo ou um vídeo que mostre claramente a violação.\n6.2. O Usuário poderá enviar quaisquer perguntas, comentários ou reclamações sobre estas Regras para supporte@tankionline.com.br. A Administração despenderá todos os esforços para analisar tais pedidos o mais rápido possível.\n6.3. Ao enviar uma reclamação, o Usuário deve descrever a natureza da situação da forma mais detalhada e mais clara possível e anexar fatos da evidência, capturas de tela etc. Reclamações sobre restrições infundadas são consideradas apenas para fins de avaliação interna de trabalho da Administração e do moderador. As decisões sobre a aplicação de restrições não estão sujeitas a revisão.\n6.4. Se o usuário iniciar uma comunicação com a administração ou fornecer um relatório sobre problemas com o Jogo ou serviços do jogo, a Administração terá o direito de armazenar toda a troca de mensagens.\n \n \n7.Outras disposições:\n\n7.1. A Administração gerencia o Jogo e aplica estas Regras sob seu exclusivo critério, mas leva em conta a opinião da comunidade.\n7.2. Estas Regras podem ser alteradas pela Administração sem qualquer aviso prévio. O Jogador é obrigado a verificar mudanças nas regras pelo menos uma vez a cada sete dias (ou seja, semanalmente). Se essa verificação não for feita dentro do período especificado e o Usuário continuar a usar o serviço do jogo, será considerado que o Jogador leu e concordou com a versão alterada deste Regulamento.\n7.3. A Administração adota a política de \"tolerância zero\" para trapaças e fraudes. Se, na opinião da Administração, o Usuário tiver enganado ou tentado enganar a Administração ou outro usuário ou tenha fornecido informações, documentos ou provas falsos ou fictícios e tenha violado as leis aplicáveis, a Administração reserva-se o direito de bloquear a Conta do Usuário e transferir tais informações a seu critério (juntamente com os dados pessoais do Usuário) a terceiros e/ou a autoridades de aplicação da lei, caso a Administração considere necessário.\n7.4. A Administração poderá emitir outras disposições e restrições contidas no Regulamento do CyberSport, as regras de competições, torneios e campeonatos. Ao mesmo tempo, essas Regras são parte integrante de outras regras adotadas pela Administração."
