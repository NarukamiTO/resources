suário concorda que ele não possui nenhum direito a Materiais dentro do jogo, ou qualquer conteúdo contigo no Jogo, incluindo, mas não se limitando a bens virtuais ou moeda usada no Jogo. A Companhia não permite qualquer transferência intencional de propriedade virtual fora do jogo, bem como venda, concessão ou troca fora do Jogo de quaisquer Materiais e objetos dentro do Jogo, exceto por atos explicitamente permitidos pela Companhia por escrito. 10. A Administração fornece ao Usuário o direito não exclusivo e não transferível ao uso de Materiais de outros Usuários para ver, reproduzir (inclusive copiar), processar (inclusive imprimir cópias) e outros direitos somente para fins não comerciais, exceto em casos quando tal uso possa causar danos a interesses protegidos da Companhia.\n \nDireitos e Obrigações dos Usuários\n \nO Usuário entende e concorda que:\n \n1. O Usuário é obrigado a obedecer às condições deste EULA, Regras do Jogo, regras de outros anexos a esse EULA, e outros documentos que sejam parte integral deste EULA, e regras das leis aplicáveis.\n2. O Usuário não irá adaptar, criar obras derivativas, expor, distribuir, arrendar, emprestar, modificar, locar, sublicenciar, traduzir e/ou transferir do Jogo sem obter o consentimento prévio por escrito da Companhia.\n3. O Usuário não irá descompilar, desmontar, preparar obras derivativas baseadas, derivar código, fazer engenharia reversa e/ou tentar fazer engenharia reversa do Jogo, tomar outras ações com código de objetos ou código fonte do Jogo, violar sistemas de proteção, fazer uso ilegal do Jogo, e obter informações sobre o uso de algoritmos usados no Jogo, ou criar produtos de software derivativos através do uso do Jogo sem consentimento por escrito da Companhia.\n4. O Usuário não irá derivar código, ou tentar derivar código de qualquer pacote transmitido do ou para o Jogo, quer esteja criptografado ou não.\n5. O Usuário não irá revelar e/ou transferir dados de Conta para terceiros.\n6. O Usuário irá manter conexão adequada com a internet, e tal acesso à internet será providenciado por sua própria conta.\n7. O Usuário é obrigado a verificar e rever as condições desse Contrato e outros documentos que sejam parte integral desse Contrato regularmente.\n8. O Usuário cessará seu uso do Jogo se o Usuário estiver em violação deste EULA e/ou outros documentos parte deste EULA\n9. O Usuário tem o direito de usar o Jogo para propósitos pessoais e não comerciais,\na usar todas as Instalações e serviços do Jogo, a tomar todas as ações fornecidas pelo Jogo, a participar em comunicação no Site da Internet através do envio de mensagens, a direcionar reclamações e propostas para melhoria do Jogo pela Companhia e tomar quaisquer outras ações fornecidas pelo Jogo e/ou aprovadas pela Companhia.\n10. O Usuário pode receber licenças limitadas, não exclusivas e revogáveis para uso de melhorias e itens virtuais no Jogo através de Cristais ganhas em Jogo (moeda de jogo).\n \nObrigações e Direitos da Companhia\n \n1. A Companhia poderá tomar qualquer ação necessária contra Usuário(s) que violem os termos deste EULA e/ou de documentos parte deste EULA, incluindo a restrição e bloqueio do acesso ao Jogo. Tais ações serão tomadas por escolha exclusiva da Companhia.\n2. A Companhia poderá remover e/ou mudar qualquer informação, conteúdo e Materiais que façam parte do Jogo e/ou Instalações Online sem qualquer aviso ou notificação prévias.\n3. A Companhia poderá encerrar e/ou limitar funcionalidades do Jogo e/ou serviços de jogo a qualquer momento que seja conveniente para a companhia, sem qualquer aviso prévio ou posterior ao Usuário.\n4. A Companhia poderá alterar a qualidade e quantidade de Serviços oferecidos unilateralmente, a qualquer momento e em qualquer medida e volume, e se houver qualquer base para interromper um Serviço, a Companhia terá o direito de encerrar tal Serviço sem qualquer aviso prévio ou posterior ao Usuário.\n5. A Companhia poderá terminar esse EULA unilateralmente e cess