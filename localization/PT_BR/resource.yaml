  GAME_TERMS: "Contrato de Licença do Usuário Final\n \nQualquer uso desse Jogo ou de suas Instalações Online e/ou clicar em “Aceito” no formulário de registro significa que você conhece e está de acordo com o seguinte Contrato, e aceita todos os seus termos incondicionalmente.\n \nSe você não concordar com a totalidade desse Contrato, você não tem direito a utilizar o Jogo e seus serviços e está obrigado a sair deste site imediatamente.\n \nEsse Contrato de Licença do Usuário Final (“EULA” – End User License Agreement) constitui e governa o relacionamento contratual entre as partes; APL Publishing Ltd, registration no. C 85285, registered under the laws of Malta, 157, Archbishop Street Valletta, VLT1440, Malta (doravante denominada “Tanki Online”, ou “Companhia” ou “Administração”); e você, o usuário, doravante denominado “Você” ou “Usuário”.\n \nDocumentos parte deste EULA\n \nOs seguintes documentos fazem parte integral deste EULA:\n<a href=\"http://tankionline.com.br/privacy/\" target=\"_blank\"><u>Política de privacidade e cookies</u></a>;\n<a href=\"http://tankionline.com.br/rules/\" target=\"_blank\"><u>Regras do Jogo</u></a>; e\n<a href=\"http://br.tankiforum.com/index.php?showtopic=257\" target=\"_blank\"><u>Instruções para compra de cristais</u></a>.\n \nDefinições\n \nAs seguintes palavras e termos devem ser interpretados como descrito, a não ser que o contexto claramente indique o contrário, e devem ser aplicadas a todas as seções desse EULA e a todos os documentos parte deste EULA:\n \n“Conta”/”Conta do Usuário” significará a conta pessoal aberta pelo Usuário e mantida pela Administração, que deverá conter as Informações da Conta.\n \n“Informações da Conta” significará Login e Senha, Nome de Usuário e outros dados que permitirão a identificação do Usuário no Jogo.\n \n“Administração” significará as pessoas agindo em nome e no lugar da Companhia, para a provisão da operação do Jogo.\n \n“Contrato” se referirá a esta EULA, o presente contrato com o Usuári