momento, seguindo para o link especificado no final da mensagem eletrônica. Se o Usuário não mais desejar receber correio eletrônico da Administração/Companhia, o usuário pode recusar-se a receber correio eletrônico a qualquer momento, mudando as configurações pessoais adequadas dentro do Jogo, e assim, recusar-se a receber notícias.\n6. O Uso do Jogo, do Site da Internet, de Materiais e qualquer outra informação contida no Jogo somente pode ser feito em total acordo com esse EULA e esse EULA junto aos documentos parte integral deste EULA, constitui a totalidade do Contrato entre Usuário e Companhia pelo uso do Jogo.\n7. Esse EULA junto com os demais documentos que são parte integral deste EULA se tornam imediatamente ativos no momento que ocorra qualquer uso do Jogo e/ou Instalações Online e/ou ao clicar em “Eu Concordo”/”Aceito” no formulário de registro. Esse EULA e todos os documentos que são parte integral deste EULA serão a fonte de referência oficial para quaisquer disputas/complicações relacionadas ao uso do Jogo, do Site de Internet, do Software e/ou dos Serviços da companhia.\n8. A companhia não garante a funcionalidade sem interrupções ou erros do Jogo; nem garante que o Jogo irá atender as expectativas do Usuário, e também não dá quaisquer outras garantias que não as especificadas (fixadas) nesse EULA. O Usuário aceita que a Companhia não será responsabilizada por qualquer dano direto ou indireto causado pela possibilidade de fazer uso do Jogo.\n \nEmendas a esse EULA\n \n1. A Companhia reserva o direito de suspender, adicionar, terminar, emendar e/ou suplementar esse EULA juntamente com os documentos que fazem parte integral deste EULA a qualquer momento que a Companhia acredita apropriado, provendo aviso prévio da seguinte forma: a Companhia irá postar a versão atualizada deste EULA no Site de Internet, e pode providenciar outros avisos conforme a Companhia entender necessário. Quaisquer mudanças entrarão em vigor dez (10) dias contados a partir do mom