he Game and the Online Facilities available at all times, the Company does not guarantee that the Game and the Online Facilities will be always available or that User will not encounter any faults.\n \nMisuse of the Internet Site\n \n1. The Internet Site may only be used for lawful purposes. Use of the Internet Site for transmission, distribution, publication or storage of any material on or via the Internet Site which is in violation of any applicable law or regulation or any third party's rights is strictly prohibited. This includes (without limitation) the use of the Internet Site for the transmission, distribution, publication or storage of any material on or via the Internet Site in a matter or for a purpose which infringes copyright, trademark, trade secret or other intellectual property rights, is obscene or harmful to Minor(s) or constitutes an illegal act or harassment, is libellous or defamatory, violates any privacy or data protection laws, is fraudulent or breaches any exchange control or gambling law.\n2. In the event of misuse and/or abuse of the Internet Site, the Administration reserves the right to block User’s Account and to prevent User’s future use and/ or access of the Game and Internet Site and/or to proceed on instituting any other legal action that the Company may deem fit.\n \nChatting Rules\n \n1. The forum, chat-room and/or community services offered by Tanki Online are intended to offer a fun and pleasant experience. Therefore, any abusive and obscene language is not tolerated, and Users who insist on using offensive and/or obscene language will have their chat privileges revoked and any Account cancelled.\n2. User is aware that when posting or uploading any personal information onto the Internet Site, such content will become public and accessible by other Users. Tanki Online does not endorse in anyway such content and shall not be responsible for any damages arising from the publicizing of such information. Users should be aware that information which they post on the Internet Site may also affect their life offline.\n3. Content stored on the Company’s severs is not meant for permanent or temporary archival purposes. Therefore Tanki Online may but is not obliged to maintain back-up copies of any material posted on the Internet Site. The Company reserves the right to impose a limit on the maximum storage capacity for each User.\n4. The Company reserves the right to delete, move or edit, at its sole discretion, content that it deems to amount to offensive behaviour or to be in violation of any laws and/or regulations and/or the Game Rules. User shall remain solely responsible for the content posted on the Internet Site. Failure by the Administration to remove particular material shall in no circumstance be constituted as an endorsement or acceptance of it by the Company.\n \nUser’s Accounts\n \nOpening of a User’s Account\n \n1.A User’s Account must be registered personally by a User and the Administration hereby reserve the right to refuse registration of a User’s Account on its Internet Site to any User for any reason whatsoever and without any prior explanation.\n2.It is the Users’ responsibility to ensure that their records with the Game are kept up to date, especially email address. It is User’s responsibility to inform the Administration immediately of any changes to User’s personal information.\n3.Tanki Online strictly prohibits the User from selling, transferring and/or acquiring Account(s) to or from other Users and third parties. User is prohibited to transfer funds/Crystals amongst different User Account(s).\n4.The Administration reserves the right not to register and/or to cancel the registration of a User’s Account in the event that the information provided to the Administration is found to be false, inaccurate, deceitful or incomplete.\n \nUser Name\n \n1. Upon registration of an Account a User shall be granted the right to choose a Username. The Administration reserves the right to deny and/or retract, for whatever reason deemed necessary by the Administration, any Usernames, whether before, during and after these names have been issued or validated.\n2. In the event that apart from the Username chosen, the User’s Account is otherwise in order in accordance to this EULA, the Administration will give the User the opportunity to create another nickname and/or new screen and/or Username.\n \nPassword Security\n \n1. The Company is in no way responsible for the eventual access to an Account by a third person and shall not be held responsible for any eventual loss suffered due to the illicit use of a User’s Login and Password by a third person, of unauthorized access, and/or for any transaction in which the Login and Password of a User was registered correctly.\n2. The Company is in no way responsible if a User forgets, misplaces, or loses the password, except for in the case where such loss arises as a result of an error on the Company’s part and the Company shall not, at any time during the relationship with User, be responsible to store any Login and Password.\n \nBlocking of Accounts\n \n1. User is entitled to ask the Administration to block the User’s Account by sending e-mail on help@tankionline.com.\n2. Failure to log in to the Game for six (6) consecutive months entitles the Administration to block User’s Account and terminate this Agreement immediately on notice (or attempted notice) to User.\n3. The Administration is entitled to block User’s Account at any time at discretion, and also in case of violation by the User of conditions of the EULA, Game Rules, other documents which form an integral part of this EULA.\n \nFraudulent Activity and Misuse of Accounts\n \n1. The Company has a zero tolerance policy towards inappropriate play and fraudulent activity and it prohibit all User collusion. If, in the Administration’s sole determination, User is found to have cheated or attempted to defraud the Administration or any other User of the Game in