s, User’s parent or legal guardian hereby accepts that s/he is taking full responsibility for all the obligations arising out of this EULA and for any other activities of the Minor which are related to the use of the Game, the Internet Site and/or Account, including any indirect use and including any payments which may be effected using the Login and/or the Account.\n4. The Company reserves the right to request documentation from the parent or legal guardian of a Minor, requesting any other written confirmation that the Company deems necessary for the Minor to play the Game or make payments on the Internet Site.\n5. The Minor and the legal guardian and/ or parent(s) hereby guarantee that the required consent to the use of the Game and/ or the registration of an Account on behalf of the Minor has been given by the legal guardian and/ or parent(s) of the Minor.\n6. The legal guardian and/ or parent(s) hereby give their consent to this EULA and documents forming an integral part of this EULA, and confirm that they shall control and bear full responsibility for the use of the Game and game services, the Internet Site and the Account by the Minor as well as for any payments made through the Account. Use of any Payment Method confirms that legal guardian and/ or parent(s) have given such consent. The legal guardian and/ or parent(s) and Users hereby accept that the Company shall bear no responsibility for any use of the Game, the Internet Site and the Account by any Minor who does not possess such permission.\n7. Game services may include age restrictions which are recommendations in nature. The legal guardian and/ or parent(s) and Users decide on their own, whether to follow these recommendations The Company is not responsible for the actual using of the Game by Users who not reached the established age.\n8. If necessary, the parents or legal representatives of the children may use special programs to limit children's access to certain services that will help make the Internet space safer for children.\n \nResponsibility of the Parties\n \n1. The Company shall in no way responsible for any loss or damage, direct or indirect, that User or a third party might have suffered as a result of the User’s use or the third party’s use of the Internet Site, the Game and /or the Online Facilities including but not limited to damages caused by inability to use the Game and the Online Facilities, direct or indirect damages arising out of third party actions, including other users of the Game, lack of access to internet, theft, destruction of Materials, loss of information related to User’s Account and any harm to User’s honour, dignity and business reputation arising in connection to the Game.\n2. In the event that the Company is found liable in any way, by a Court of Law and/or a similar authority, with legal competence and/or jurisdiction over it, then it's liability is limited to the amount of 100 EUR cumulatively for any and all claims arising from one particular User.\n3. User shall bear all responsibility and/ or liability which may arise from the Materials placed by User in the Game and in relation to any use which User makes of the Online Facilities.\n4. Neither party hereto shall be liable to the other in respect of anything which, apart from this provision, may constitute breach of this EULA arising by reason of force majeure, namely circumstances beyond the control of either party which shall include (but shall not be limited to) acts of God, perils of the sea or air, fire, flood, drought, explosion, sabotage, accident, embargo, riot, civil commotion or civil authority, including acts of local government and parliamentary authority.\n5. User shall fully indemnify the Company and any of the Company’s affiliates against all claims, losses, damages and demands arising out of User’s use and access of the Game and Online Facilities.\n \nDispute resolution and Governing law\n \n1. The parties hereby agree that this EULA, together with the other documents forming an integral part of this EULA shall be construed in accordance with the Laws of Malta and shall be subject to the jurisdiction of the Courts of Malta.\n2. The Pre-trial dispute resolution procedure is obligatory. User's claims should be sent to 60/2, Melita Street, Valletta VLT 1122, Malta and e-mail copy to help@tankionline.com, and such claim should contain the specific list of violations made by the Company and/or the Administration, Account information, contact information and User signature. Non-compliance with the form or content of the claim entails non-compliance with the Pre-trial dispute resolution procedure and the term for claim consideration and for sending the answer may take up to thirty (30) business days from the moment of its acceptance.\n \nLegal Compliance\n \nUser hereby confirms understanding and accept that the Company is unable to provide the User with any legal advice or assurances and that it is User’s sole responsibility to ensure that at all times the User complies with the laws that govern the User and that the User has the complete legal right to open an Account with the Game and to play the Game. Any participation in the Game is at the User’s sole option, discretion and risk. By playing the Game, User acknowledges that he does not find the Game or services to be offensive, objectionable, unfair, or indecent in any way.\n \nWaiver\n \nThe Company’s failure or neglect to enforce, at any time, any of the provisions hereof shall not be construed nor shall be deemed to be a waiver of its rights herein, nor in any way affect the validity of the whole or any part of this EULA, nor prejudice the Company’s rights to take subsequent action.\n \nOther conditions\n \n1.This EULA represent the entire Agreement between User and the Company in relation to its subject matter and supersedes and voids all prior agreements between such parties relating to such subject matter.\n2.The headings contained in this EULA are inserted for 