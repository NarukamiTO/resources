  GAME_RULES: "Brief  Rules\n\nThe following in-game activities are prohibited in the Game:\n- use of bots, use of third-party software, bugs;\n- pretending to be a member of Administration;\n- power-levelling, creating obstructions for other users;\n- advertisement, political propaganda;\n- violation of laws, including intellectual property laws;\n- sale, purchase, exchange, transfer of Accounts, other game values;\n- fraud, other dishonest actions.\n \nThe following activities are prohibited in the Game chats and on the Forum:\n- using insults, threats, slander;\n- obscene language, including in the implied form;\n- flooding, flaming, spam, printing in capital letters (CAPS LOCK);\n- swindling passwords, other Account information;\n- trolling;\n- instigating others to violate the Game Rules;\n- public discussion of the Administration and moderators;\n- publication of information forbidden by legislation;\n- publication of links to third-party resources;\n- any forms of discrimination.\n \nGame Rules\nYou are in Tanki Online game where people from all over the world enjoy operating huge battle machines, taking part in fierce battles! Players can fight by themselves or team up to fight for victory side by side. They can also socialize and find new friends.\nTanki Online is an easy-to-learn multiplayer action game, a stage for serious battles, and a great social network.\nAfter completing the registration process, User receives a virtual tank and 500 crystals (the in-game currency). By winning battles, User increase their rating and earn new ranks and crystals. Crystals can be used to purchase useful ammunition and buy or upgrade tanks, guns and armor.\nTanki Online isn't merely an exciting online Game. It's a community of people who share the same interests. We encourage mutual respect and politeness and strongly discourage offensive behavior and/or violating other Users' rights. The Administrators reserves the right to limit users' communication abilities, lower their ratings, and/or block their Accounts if they violates these Game Rules.\n \n\nGeneral Terms\n\nThe Game Rules are an integral part of the End User License Agreement (hereinafter referred to as the ‘’Agreement’’ or EULA) and other documents of the Game and Game services. In their turn, the Agreement, the Privacy and cookies policy, as well as other documents published in the Game and Game services, are an integral part of these Game Rules.\nAny terms and notions used in the Game Rules have the same meaning as has been assigned to them in the Agreement.\nAny use of the Game and its Online Facilities and/or clicking “Accept” at the registration form means that you are acquainted and agree with this Game Rules, and unconditionally accept all its terms.\nThe Game Rules are obligatory for all Users.\nIf you disagree with any conditions of these Game Rules, you have no right to further use of the Game and its services, please leave this Site and do not use the Game.\n\n \n1. It is forbidden to create nicknames (User names) that:\n\n1.1. Contain bad or strong language, insults/provocations for insult (in the form of words, abbreviations, expressions or phrases);\n1.2. Contain elements of racism, fascism, insults or nicknames based on racial, national or religious identity, or those inciting hatred, intolerance, ethnic discord;\n1.3. Contain calls for violence, terrorism, extremism and/or mass disturbances;\n1.4. Contain political solicitation, propaganda, political advertisement of any kind;\n1.5. Are directly or indirectly related to political organizations (persons), including those that committed political crimes or crimes against humankind, terrorist acts;\n1.6. Contain discrimination by gender, age, religion or other characteristics;\n1.7. Сontain direct or indirect propaganda, calls to consume alcoholic and alcohol-containing drinks, beer, tobacco products, drugs, toxic, psychotropic and/or intoxicating substances, their precursors, contain information about the places and methods of their production, acquisition, cultivation and use;\n1.8. Contain the information about calls for participation in gambling games, prostitution, vagabondage, begging;\n1.9. Contain information about methods of committing suicide, incitements to commit suicide, violence, or other actions that pose a threat to life or health;\n1.10. Contain incitement to unlawful behavior, crime, violence, cruelty, infliction of harm that instigate to commit the actions prohibited by laws;\n1.11. Contain parts of User names of the Administration employees or contain the information that may entail erroneous perception of the User as an Administration representative;\n1.12. Contain criticism of the Game, the Administration or moderators;\n1.13. Are directly or indirectly connected with sexual intercourse, violation, pornography, pedophilia;\n1.14. Contain description of the body and its lower biological functions or reflexes;\n1.15. Contain advertisement and hyperlinks;\n1.16. Contain references to cheat codes, cheat sites, resources that violate the rights of the Administration;\n1.17. Consist of unpronounceable random sets of letters (flood User names);\n1.18. Fully or partially consist of trademarks elements that are protected by copyright and/or registered;\n1.19. Contain other information prohibited by these Game Rules, the Agreement and/or the effective laws.\n1.20. If User name does not comply with the requirements above, other requirements specified in these Game Rules, the Agreement or effective laws, the Administration shall have the right, upon its discretion:\n- to demand from the User to change the User name for an acceptable one and block the User's Account for the period required to change the User name;\n- to irrevocably block the User's Account.\n\n\n2. The following activities are prohibited, and will lead to (upon the Administration discretion) a permanent or temporary User’s Account blocking, cutdown of all the virtual Game values of the User by 10% to 100% (garage, crystals, game statistics) or setting the User’s Account to zero, temporary or permanent limitation of access to game chats and to the Forum (ban):\n\n2.1. Any forms of unsporting or impolite behavior in the Game:\n\n2.1.1. Botting (use of software that imitates the actions of Users in the Game), use of clicker programs, macros that control mouse and keyboard, use of other third-party software for obtaining advantages in the Game;\n2.1.2. Application or distribution of third-party software or other means for improvement/automation of game possibilities (bots, cheats), as well as the programs that may deteriorate the functioning of the Game and/or the functioning of electronic devices of third persons;\n2.1.3. Exploitation of software bugs of the Game and transferring the information about them to third persons, except for the Administration;\n2.1.4. Achieving experience points by deliberate inaction or help from the other team's players in 'Capture the Flag' or 'Control Points' or 'Team Deathmatch' modes or from opponents in 'Deathmatch' mode (so-called power-leveling);\n2.1.5. Battles between accounts owned by the same User;\n2.1.6. Creation of additional accounts to power-level the main Account;\n2.1.7. Making arrangements with other Users to fight half-steam to fight 'half-heartedly' with the purpose of power-leveling (the Administration will impose restrictions to all the members of such arrangements);\n2.1.8. Any acts or omissions aimed at creating obstructions for the team where the User is a member, including in CTF, TDM and CP modes, fighting against the team of which you are a member, doing harm to/ destruction of an ally's tank, fighting in interests of the opponent’s team, as well as the conspiracy with the enemy, sabotage;\n2.1.9. Discrimination of inexperienced players (newbies): misinformation, intimidation, mockery;\n2.1.10. Insults, slander (dissemination of misleading information) in relation to other Users, Administration, moderators, other persons;\n2.1.11. Any forms of manipulation or conspiracy in the Game;\n2.1.12. Performance of any actions that have a negative influence on the Game development and image;\n2.1.13. Other forms of unsporting behavior that hinder the normal game process which will be recognized as such by the Administration.\n\n\n2.2. Any forms of fraudulent actions, in particular:\n\n2.2.1. Use of the Game and/or Game services for fraudulent actions, including without limitation fraudulent in-game financial operations, fraud in the course of transactions, payments, including any refund, prohibited transactions;\n2.2.2. Transfer of the Account or other game values to third persons; publication of any offers to sell, buy, or transfer the Account or game values, both free of charge and for crystals or funds, as well as instigations to the said actions;\n2.2.3. Attempts to obtain the password, other Account information or other personal information from any other User, including in the form of extortion by using moral, physical or technical threats;\n2.2.4. Dissemination of any personal information about other Users or about third persons (unless such information is publicly accessible);\n2.2.5. Fraud — receiving in-Game currency using any fraudulent means;\n2.2.6. Any attempts to pretend to be former or current employee of the Administration or project assistant (moderator, consultant, etc.), including sending messages on behalf of the Administration or moderators;\n2.2.7. Begging in any form, including requests to transfer funds, game values or crystals;\n2.2.8. Publication of links to external resources disguised as official resources of the Game.\n\n2.3. Other violations:\n\n2.3.1. Use of bad or strong language, other bad or rude words (phrases) not classified as bad language, including in the implied form;\n2.3.2. Publication of the information and materials of sexual, erotic or pornographic nature, picturing or describing sexual relations between a man and a woman;\n2.3.3. Publication of the information or symbols that insult or humiliate the feelings of believers, raises hatred, enmity, racial, international or ethnic discord, intolerance (including insults, giving nicknames on the basis of racial, national, ethnic, religious characteristics), and also provocation of the interlocutor to commit the specified actions;\n2.3.4. Propaganda or demonstration of Nazi emblems, symbols, abbreviations or designations, names and surnames of Nazi activists;\n2.3.5. Publication of the information that negates historical events;\n2.3.6. Publication of the information in which one may see the elements of calling for violence, war, terrorism, overthrow of power; extremist activity and/or mass disturbances;\n2.3.7. Publication of information about political organizations (political leaders) that committed political crimes or crimes against humankind, terrorist acts, or otherwise violated the international laws;\n2.3.8. Publication of the information that contains political solicitation, political advertisement, election propaganda of any kind;\n2.3.9. Discussion of present-day political issues as provocative conflicts;\n2.3.10. Any form of discrimination by gender, age, religion or other characteristics;\n2.3.11. Threats in any form related to Users, Administration or third persons;\n2.3.12. Publication of information containing methods of committing suicide, calls to commit suicide, violence, or other actions that pose a threat to life or health, descriptions of dangerous fighting techniques, stunts, methods of weapons production, description of body modification methods;\n2.3.13. Publication of the information that describes, instigates or justifies unlawful or antisocial behavior, crime, violence, mutilation, psychic or physical cruelty to people, animals, inflicting damage on other’s   property;\n2.3.14. Publication of  the information that causes fear, horror or panic in children, including pictures or descriptions of death, diseases, suicide, accidents, emergencies or disasters and (or) their consequences, other information that may damage health or development of minors;\n2.3.15. Publication of the information about a minor that suffered as a result of unlawful actions (omissions);\n2.3.16. Publication of  information that contains direct or indirect propaganda, calls to consume alcoholic and alcohol-containing drinks, beer, tobacco products, smoking accessories, drugs, toxic, psychotropic and/or intoxicating substances, their precursors, contains information about the places and methods of their production, acquisition, cultivation and use;\n2.3.17. Publication of the information that can raise the desire to participate in gambling games, prostitution, vagrancy or beggary;\n2.3.18. Any use of intellectual property objects (software, art, video and other objects or their parts, trademarks, etc.), or other materials without the right holder's permission; posting links to pirated content; deletion or change of the information on intellectual property rights, in particular links to the right holders, authors and other confirmation of intellectual property rights;\n2.3.19. Publication of any advertising materials or information without the Administration's approval;\n2.3.20. Publication of information that may cause to  harm/losses for Users or the Administration;\n2.3.21. Unconstructive criticism of the Game and/or its authors, the Owner;\n2.3.22. Express or implicit public discussion of the Administration or moderators of the Game;\n2.2.23. Provision of false or fictitious information, documents or evidence. The Administration warns User about the criminal and other responsibility for such activities;\n2.3.24. Commission or instigation (provocation) to the actions (inaction) that are prohibited by these Game Rules, the Agreement and/or applicable law.\n \n3. It is prohibited to start topics and/or create messages in game chats and/or on the Forum that:\n3.1. Reproduce already existing topics or messages, as well as the topics that have recently been discussed and/or the answers to which are available in the information sections (the Game Rules, FAQ, Plans, etc.). Do not forget to use the Search to find answers to your questions. Be attentive and make sure you look through the existing topics before making a new one.\n3.2. Do not correspond to the theme of the section/category;\n3.3. Contain CAPS LOCK or A LOT OF CaPITAL LeTTERS in the title and/or content of the topic or message;\n3.4. Have irrelevant or repeated symbols, characters, emoticons, messages in the title and/or description of the topic or message that complicate understanding of the topic or section or do not have any meaning (Flood), for example == - My topic - ==;\n3.5. Contain text with font size more than 24;\n3.6. Lack information and do not reflect a sense of the matter in the title or description of the topic;\n3.7. Quote too large texts of previous messages and/or images without any special necessity (overquoting);\n3.8. Continue to discuss the topics that were closed or deleted by the Administration (necroposting);\n3.9. Have a character of a personal appeal to the Forum or game chats participants. For personal communication please use Private Messages. Personal discussions are allowed in parallel with solving issues.\n3.10. Contain spam, that is, distribute the information which the addressee did not request, showed no interest in receiving and/or gave no consent to receiving;\n3.11. Flame (\"arguing for the sake of arguing\", an exchange of messages which is just a war of words that often bears no relation to the original cause of the dispute);\n3.12. Contain trolling (incitement of community participants to the actions having adverse effects and conflicts for them);\n3.13. Aimed at provocation of other Users, the Administration, moderators, as well as obstructing communication at the Forum or game chats;\n3.14. Contain referral links, \"cheat codes\" (addscore, Buy_krictals_in_the_panzer);\n3.15. Contain other information or violations that are prohibited by these Game  Rules, the Agreement and/or applicable laws.\n3.16. For the mentioned violations the Administration shall be entitled, upon its own discretion, to apply to the User restrictions in the form of permanent or temporary Account blocking or temporary or permanent restriction of access to game chats and Forum (ban).\n3.17. The Administration shall be entitled, upon its own discretion, to delete any information or message; delete/move the topic created in the wrong Forum's section, without notification.\n3.18. Private messages are intended for User's personal communication in game services and on the Forum. While processing complaints about violation of the Game Rules, the Administration shall not consider complaints about private messages. User may stop receiving private messages from another user by adding him/her to the Black List in the appropriate section of the User’s profile on the Forum.\n \n4. Application of restrictions to the User\n4.1. If User violates these Game Rules, the Administration shall be entitled to apply the restrictions stipulated in the relevant section of the Game Rules to this User.\n4.2. Types of restrictions:\n4.2.1. Permanent or temporary Account blocking — blocking (limitation) of access to the Game.\n4.2.2. Cutdown of all the User's virtual values in the Game (garage, crystals, game statistics) by 10% to 100%  or setting the Account to zero.\n4.2.3. Temporary or permanent restriction of the User's access to game chats and Forum (ban) — restriction of the possibility to leave messages in chats and on the Forum.\n4.2.4. Deletion or change without notice of any information or messages posted in any part of the Game or game services; transfer of the Forum's topics to another section or deletion of topics.\n4.3. These restrictions may be applied to any Account of the User that violates these Game Rules.\n4.4. The Administration shall be entitled, upon its own discretion, to apply one or several restrictions simultaneously to the User, or give a warning.\n4.5. When choosing restrictions, the Administration considers the type and number of violations, as well as previous violations of these Game Rules by the User.\n4.6. As it is not always possible to precisely identify the particular violations of the Game Rules, the final decision always remains with the Administration.\n4.7. Violation of these Game Rules means that the User may be immediately, without any prior notice, denied game services provision or such services may be restricted in full or in part.\n4.8. If  User violates the Game Rules several times or in an integrated manner, the Administration shall be entitled, upon its own discretion, to repeat the restrictions applied to the User.\n4.9. The Administration shall in no way responsible for any loss or damage, direct or indirect, that User or a third party might have suffered as a result of the User’s use or the third party’s use of the Internet Site, the Game and /or the Online Facilities including but not limited to damages caused by inability to use the Game and the Online Facilities, or caused by application by the Administration of restrictions to the User, direct or indirect damages arising out of third party actions, including other users of the Game, lack of access to internet, theft, destruction of Materials, loss of information related to User’s Account and any harm to User’s honour, dignity and business reputation arising in connection to the Game.\n\n5. Moderators\n5.1. Moderators are the Administration's assistants and are selected by the Administration among Users.\n5.2. A moderator is a person acting on behalf and in the interests of the Administration. Moderators shall maintain and control the order in the Game and game services, as well as on the Forum and game chats.\n5.3. Moderator shall be entitled to apply temporary or permanent restriction of access to game chats and Forum (ban) to User in the event of violation of these Game Rules by the User.\n5.4. A moderator shall be honest and objective in making decisions, and shall also comply with the provisions of these Game Rules and the Agreement, be polite to Users, perform his/her duties efficiently and regularly.\n5.5. It is strictly prohibited for the moderator to abuse his/her powers. All moderators' actions are logged. If one of the moderators does not justify the reposed confidence, he/she will be dismissed without discussions or warnings by the internal decision of the Administration.\n5.6. The activity of moderators is performed on a voluntary basis. User shall not be entitled to commit a moderator to apply any restriction.\n \n6. Complaints and Appeals\n6.1. User has the right to report violations of the Game Rules by creating a new forum topic in <a href=\"http://en.tankiforum.com/index.php?showforum=76\" target=\"_blank\"><u>Violators section</u></a>. It is necessary to specify the nature of violation clearly in the new topic and attach a chat screenshot or a video which clearly shows the violation.\n6.2. User may send any questions, comments or complaints regarding these Game Rules to help@tankionline.com. The Administration will make every effort to consider such requests as soon as possible.\n6.3. When sending a complaint, the User shall describe the nature of the situation in as much detail and as clearly as possible and attach facts of evidence, screenshots, etc. Complaints about groundless restrictions are considered solely for the purpose of internal evaluation of work of the Administration and the moderator. Decisions on the application of restrictions are not subject to revision.\n6.4. If the User starts correspondence with the Administration or provides a report about  problems with the Game or game services, the Administration shall be entitled to store all such correspondence.\n\n7. Other provisions:\n7.1. The Administration manages the Game and applies these Game Rules upon its sole discretion, but takes into account the community's opinion.\n7.2. These Game Rules may be changed by the Administration without any prior notice. User is obliged to check these Game Rules  for changes at least once every seven days (i.e weekly). If such a check was not made within the specified period and the User continues to use the Game, the User is considered to have read and agreed with the amended version of these Game Rules.\n7.3. The Administration pursues \"zero tolerance\" policy to cheating and fraud. If, in the Administration's opinion, the User cheated or tried to cheat the Administration or another User, or provided false or fictitious information, documents, evidence and otherwise violated the applicable laws, the Administration reserves the right to block the User's Account and transfer such information upon its own discretion (along with the User's personal data) to any third party and/or law enforcement authorities if the Administration deems it necessary.\n7.4. The Administration may issue other provisions and restrictions in the Cybersport Rules, the rules of competitions, tournaments, and championships. At the same time, these Game Rules are an integral part of other rules adopted by the Administration."
