ights to all Materials contained within the Game, and User agrees that he owns no rights to the Material within the Game, or other content contained within the Game, including, but not limited to, virtual goods or currency which is used in the Game. The Company does not allow any intentional transfer of the virtual property outside the Game, as well as intentional sale, granting, or exchange outside of the Game of any Materials and objects used in Game, except for actions explicitly permitted by the Company in writing.10. The Administration provides to User a non-exclusive and non-transferable right to use Materials of other Users by viewing, reproduction (including copyings), processing (including printout of copies) and other rights only for the purpose of noncommercial use, except cases when such use can harm to protected interests of the Company.\n  \nUser’s rights and obligations\n \nUser hereby acknowledges and agrees that:\n \n1. User is obliged to comply with conditions of this EULA, Rules of Game, rules of other annexes to this EULA, any other documents forming an integral part of this EULA, and rules of applicable law.\n2. User shall not adapt, create derivative works of, display, distribute, lease, loan, modify, rent, sublicense, translate and/or transfer the Game without obtaining the Company’s prior written consent.\n3. User shall not decompile, disassemble, prepare derivative works based on, derive source code from, reverse engineer and/or attempt to reverse engineer the Game, make other actions with the object code or source code of the Game, violate any protection system, perform illegal use of the Game and obtaining information about realization of algorithms used in Game, create derivative software products by using of the Game without written consent of the Company.\n4. User shall not derive code, nor attempt to derive code from any packet stream transmitted to or from the Game, whether encrypted or not.\n5. User shall not disclose and/or transfer