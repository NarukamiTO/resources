  GAME_RULES: |-
    Regole brevi

    Le seguenti attività sono proibite nel Gioco, nelle Chat, nei Forum, e in tutti gli altri canali ufficiali di comunicazione:
    - uso di bot, software di terze parti, bug;
    - fingere di essere un membro dell'Amministrazione;
    - sabotare gli altri giocatori;
    - pubblicità, propaganda politica;
    - violazioni della Legge, incluse le Leggi sulla Proprietà Intellettuale;
    - vendita, acquisto, scambio, trasferimento di Account o componenti del Gioco;
    - frode, azioni disoneste;
    - insulti, minacce, diffamazione;
    - linguaggio scurrile, anche in forma implicita;
    - flood, spam, calunnie, scrivere in maiuscolo;
    - furto di password o altre informazioni sugli Account;
    - istigare gli altri Utenti a violare le Regole del Gioco;
    - pubblicazione di informazioni vietate dalla Legge;
    - pubblicazione di link a contenuti di terze parti;
    - qualsiasi forma di discriminazione.


    Regole del Gioco

    Sei su Tanki Online, un gioco dove persone da tutto il mondo si divertono a combattere con i carri armati in feroci battaglie! I giocatori possono combattere da soli o allearsi per conquistare la vittoria fianco a fianco. Possono anche socializzare e fare nuove amicizie.
    Tanki Online è un gioco di azione multi giocatore facile da imparare, un palcoscenico per furiose battaglie e un grande social network.
    Dopo il processo di registrazione, l'Utente riceve un carro armato virtuale e 500 cristalli (la valuta del gioco). Vincendo le battaglie gli Utenti migliorano la loro posizione e guadagnano nuovi ranghi e cristalli. I cristalli possono essere usati per acquistare nuovi oggetti e comprare o migliorare armi, carri armati e vernici.
    Tanki Online non è semplicemente un divertente Gioco online. È una comunità di persone che condividono gli stessi interessi. Incoraggiamo il rispetto reciproco e la gentilezza, e sconsigliamo fortemente comportamenti offensivi e/o la violazione dei diritti degli altri Utenti. L'Amministrazione si riserva il diritto di limitare la possibilità di comunicare degli Utenti, annullare i risultati conseguiti, e/o bloccare i loro Account in caso di violazione delle Regole del Gioco.

    Termini Generali
    Le Regole del Gioco sono una parte integrante del Contratto di Licenza con l'Utente Finale (di seguito "Contratto" o "EULA" - End User License Agreement) e degli altri documenti del Gioco e dei servizi di Gioco. A loro volta il Contratto, le Informazioni sul Trattamento dei Dati Personali, e tutti gli altri documenti pubblicati sul Gioco e sui servizi di Gioco sono una parte integrante delle Regole del Gioco.
    Qualsiasi termine o nozione utilizzata nelle Regole del Gioco ha lo stesso significato attribuito nel Contratto.
    Facendo uso del Gioco o dei suoi Servizi Online, e/o cliccando "Accetta" al momento della registrazione, l'Utente conferma di avere letto e familiarizzato con le Regole del Gioco, e le accetta incondizionatamente in tutti i termini.
    Le Regole del Gioco sono obbligatorie per tutti gli Utenti.
    Se l'Utente non è d'accordo con una qualsiasi delle condizioni delle Regole del Gioco, non ha il diritto di utilizzare il Gioco e i suoi servizi, e deve lasciare questo sito e il Gioco immediatamente.


    1. Requisiti per i nomi Utente (nickname)

    È vietato creare nomi Utente (nickname), nomi dei clan (o tag), e slogan che:
    1.1. Contengono linguaggio scurrile, insulti o provocazione agli insulti (sia con parole che con abbreviazioni, espressioni o frasi);
    1.2. Contengono richiami al razzismo, al fascismo, insulti o nomi Utente che discriminano per razza, nazionalità o religione, o incitano all'odio e all'intolleranza etnica;
    1.3. Contengono richiami alla violenza, al terrorismo, all'estremismo e/o ai disordini civili;
    1.4. Contengono richiami politici, propaganda, pubblicità politica di qualsiasi tipo;
    1.5. Sono direttamente o indirettamente collegati a organizzazioni (o personaggi) politici, inclusi quelli che hanno commesso crimini politici, crimini contro l'umanità, o atti di terrorismo;
    1.6. Contengono discriminazione di sesso, età, religione o altre caratteristiche;
    1.7. Contengono direttamente o indirettamente richiami all'uso di alcolici, birra, prodotti a base di tabacco, droghe, sostanze intossicanti o stupefacenti o le loro precorritrici, o contengono informazioni sulla loro produzione, acquisizione, coltivazione e uso;
    1.8. Contengono richiami al gioco d'azzardo, alla prostituzione, al vagabondaggio, all'elemosina;
    1.9. Contengono informazioni sui metodi per suicidarsi, incitamento al suicidio, alla violenza, o a qualsiasi altra azione che può essere un pericolo per la vita o la salute;
    1.10. Contengono istigazione a comportamenti illeciti, ad atteggiamenti criminosi, violenti, crudeltà, altri danneggiamenti o istigazione ad infrangere la Legge;
    1.11. Contengono parti dei nickname degli impiegati dell'Amministrazione o contengono informazioni che potrebbero far pensare che l'Utente sia un membro dell'Amministrazione;
    1.12. Contengono critiche sul Gioco, sull'Amministrazione o sui moderatori;
    1.13. Sono direttamente o indirettamente collegati al rapporto sessuale, alla pornografia, alla pedofilia, o a qualsiasi altra forma di pratica o violenza sessuale;
    1.14. Contengono descrizioni del corpo e delle sue funzioni sessuali o biologiche;
    1.15. Contengono pubblicità e collegamenti ipertestuali;
    1.16. Contengono riferimenti a trucchi, siti di cheating, o attività che violano i diritti dell'Amministrazione;
    1.17. Sono composti da un gruppo impronunciabile di lettere (flood nickname);
    1.18. Sono composti parzialmente o totalmente da elementi commerciali registrati e/o protetti dalle Leggi sul Copyright;
    1.19. Contengono altre informazioni proibiti dalle Regole del Gioco, dal Contratto, o dalla Legge;
    1.20. Se un nome Utente non rispetta i requisiti appena descritti, altri requisiti specificati dalle Regole del Gioco, dal Contratto, o dalla Legge, l'Amministrazione a sua discrezione avrà il diritto di:
    - chiedere all'Utente di cambiare il suo nome Utente in uno consentito, e bloccare l'Account per il tempo necessario a cambiare il nome Utente;
    - bloccare l'Account dell'Utente in modo irrevocabile.


    2. Attività e comportamenti proibiti per gli Utenti del Gioco:

    2.1. Azioni che comporteranno (a discrezione dell'Amministrazione) il blocco permanente o temporaneo dell'Account dell'Utente:
    2.1.1. Automazione dell'attività di Gioco, botting (uso di programmi che imitano le azioni degli Utenti nel Gioco), uso di autoclick, macro che controllano la tastiera e il mouse, utilizzo di programmi di terze parti per ottenere vantaggi nel Gioco;
    2.1.2. Utilizzo o distribuzione di programmi di terze parti per incrementare o automatizzare il Gioco (bot, cheat), e programmi che potrebbero danneggiare il funzionamento del Gioco e/o il funzionamento di dispositivi elettronici delle altre persone;
    2.1.3. Sfruttamento di bug di programmazione del Gioco, e condivisione con altre persone (tranne l'Amministrazione) di informazioni che li riguardano;
    2.1.4. Battaglie tra Account posseduti dallo stesso Utente;
    2.1.5. Sabotaggio: qualsiasi azione o omissione con lo scopo di danneggiare la squadra di cui l'Utente fa parte nelle modalità CLB, TDM, CP e AS, ritorsione contro la propria squadra (giocare intenzionalmente con equipaggiamento debole, pause frequenti, inattività o rifiuto intenzionale di applicare il formato previsto per la battaglia, simulazione di problemi di connessione internet), danneggiamento o distruzione di un carro armato alleato, cospirazione con la squadra avversaria;
    2.1.6. Uso del Gioco e/o dei servizi di Gioco per attività fraudolente, come ad esempio operazioni finanziarie fraudolente, frode durante le transazioni o i pagamenti (compreso il rimborso), transazioni proibite;
    2.1.7. Frode: ottenere valuta di Gioco con metodi fraudolenti. L'Amministrazione avverte gli Utenti che queste attività potrebbero determinare responsabilità giudiziarie, inclusa quella penale.
    2.1.8. Trasferimento dell'Account o componenti del Gioco a terzi, pubblicazione di annunci di vendita, acquisto o trasferimento dell'Account o componenti del Gioco, sia gratis che dietro pagamento di cristalli o denaro, e istigazioni a compiere le suddette azioni.

    2.2 Azioni che comporteranno (a discrezione dell'Amministrazione) la limitazione perpetua dell'accesso alle Chat e ai Forum del Gioco (ban):
    2.2.1. Phishing: azioni volte a ottenere l'accesso di dati sensibili degli altri Utenti, inclusi dati di accesso e passowrd;
    2.2.2. Postare link a contenuti di terze parti che potrebbero essere interpretati come contenuti ufficiali del Gioco;
    2.2.3. Postare link a siti o programmi che promettono cristalli gratis, cristalli regalati dall'Amministrazione, o descrivono l'utilizzo di bug per ottenere cristalli, ecc.;
    2.2.4. Postare link a siti o supporti che contengono software di terze parti (cheat, programmi, client, ecc.), diffondere link a siti che contengono software in grado di cambiare le funzionalità del gioco o promettono di farlo;
    2.2.5. Altri casi di frode, con l'obiettivo di rubare gli Account degli Utenti.

    2.3. Azioni che comporteranno (a discrezione dell'Amministrazione) la limitazione temporanea dell'accesso alle Chat e ai Forum del Gioco fino a 6 mesi (ban):
    2.3.1. Discriminazione nei confronti di giocatori inesperti (nabbi), disinformazione, intimidazione, derisione;
    2.3.2. Insulti, calunnie (distribuzione di informazioni fuorvianti) nei confronti degli altri Utenti, dell'Amministrazione, dei moderatori o di altre persone;
    2.3.3. Esecuzione di qualsiasi azione che può avere un'influenza negativa sullo sviluppo del Gioco o sulla sua immagine;
    2.3.4. Altre forme di comportamento che alterano il normale processo del Gioco, o che saranno riconosciute come tali dall'Amministrazione;
    2.3.5. Tentativi di ottenere la password, altre informazioni riguardanti l'Account, o altre informazioni personali degli Utenti, incluse forme di intimidazione con minacce fisiche o psicologiche;
    2.3.6. Condivisione della password del proprio Account;
    2.3.7. Condivisione di informazioni personali sugli altri Utenti o su terzi (a meno che queste informazioni siano pubblicamente accessibili);
    2.3.8. Uso di linguaggio scurrile, altre parole o frasi che potrebbero essere intese come insulti, anche in forma implicita;
    2.3.9. Pubblicazione di contenuti o materiale di natura sessuale, erotica o pornografica, descrizione o rappresentazione di pratiche sessuali, e pubblicazione di link che contengono questo materiale;
    2.3.10. Pubblicazione di contenuti o simboli che insultano o umiliano i sentimenti dei credenti, incitano all'odio o alla segregazione razziale, etnica o nazionale, all'intolleranza (inclusi insulti, dare soprannomi sulla base di caratteristiche razziali, nazionali, etniche o religiose), e provocare l'interlocutore a commettere queste azioni;
    2.3.11. Propaganda o condivisione di emblemi, simboli, abbreviazioni o denominazioni naziste, nomi e cognomi di attivisti nazisti;
    2.3.12. Pubblicazione di contenuti che potrebbero essere intesi come riferimenti alla violenza, alla guerra, al terrorismo, alla sovversione del potere, ad attività estremiste e/o altri disordini civili;
    2.3.13. Pubblicazioni di contenuti riguardanti organizzazioni politiche (o leader) che hanno commesso crimini politici o contro l'umanità, atti di terrorismo, o hanno in qualche modo violato le leggi internazionali;
    2.3.14. Qualsiasi forma di discriminazione di età, sesso, religione o altre caratteristiche;
    2.3.15. Pubblicazione di contenuti con richiami a metodi per suicidarsi, incitamento al suicidio, alla violenza, o a qualsiasi altra azione che può essere un pericolo per la vita o la salute, descrizione di tecniche di combattimento pericolose, acrobazie, informazioni sulla produzione di armi o modificazioni corporee;
    2.3.16. Pubblicazione di contenuti che descrivono, giustificano o istigano a comportamenti contro la Legge, crimini, violenza, mutilazioni, crudeltà fisiche o psicologiche su altre persone o animali, danneggiamento della proprietà altrui;
    2.3.17. Pubblicazione di contenuti che potrebbero causare paura, orrore o panico nei bambini, incluse immagini o descrizioni di morti, malattie, suicidi, incidenti, situazioni di emergenza, disastri e/o le loro conseguenze, qualsiasi altro contenuto possa danneggiare la salute o lo sviluppo dei minori;
    2.3.18. Pubblicazione di contenuti propagandistici, richiami al consumo di alcolici, birra, prodotti a base di tabacco, sigarette, droghe, sostanze intossicanti o stupefacenti o le loro precorritrici, o contengono informazioni sulla loro produzione, acquisizione, coltivazione e uso;
    2.3.19. Pubblicazione di contenuti che potrebbero creare il desiderio di giocare d'azzardo, prostituirsi, vagabondare, elemosinare;
    2.3.20. Qualsiasi uso della proprietà intellettuale (software, arte, video o loro riproduzioni parziali, marchi, ecc.) o pubblicazione di qualsiasi altro materiale senza il permesso del proprietario, link a contenuti pirata, cancellazione o modifica delle informazioni sulla proprietà intellettuale, in particolare link ai proprietari dei diritti o agli autori;
    2.3.21. Pubblicazione di contenuti che potrebbero causare danni agli Utenti o all'Amministrazione;
    2.3.22. Fornire informazioni, documenti o prove false o fittizie. L'Amministrazione avverte gli Utenti che queste attività potrebbero determinare responsabilità giudiziarie, inclusa quella penale.
    2.3.23. Creazione di topic e/o messaggi nelle Chat e nei Forum del Gioco composti da flaming ("discutere solo per il gusto di farlo", messaggi che costituiscono guerre verbali, senza alcun collegamento con il motivo originale della discussione);
    2.3.24. Creazione di topic e/o messaggi nelle Chat e nei Forum del Gioco per provocare altri Utenti, l'Amministrazione, i moderatori, o impedire la comunicazione nei Forum o nelle Chat.

    2.4. Azioni che comporteranno (a discrezione dell'Amministrazione) la limitazione temporanea dell'accesso alle Chat e ai Forum del Gioco fino a 24 ore (ban) o un avvertimento ufficiale:
    2.4.1. Tentativi di impersonare un componente o ex componente dell'Amministrazione o degli assistenti (moderatori, consulenti, ecc.), incluso l'invio di messaggi per conto dell'Amministrazione o dei moderatori;
    2.4.2. Qualsiasi forma di elemosina, incluse richieste di ottenere denaro, cristalli, o oggetti del gioco;
    2.4.3. Pubblicazione di contenuti che negano gli eventi storici;
    2.4.4. Pubblicazione di contenuti riguardanti sponsorizzazioni politiche, propaganda, elezioni;
    2.4.5. Discussione di temi o problemi politici che potrebbero provocare conflitti, in qualsiasi forma;
    2.4.6. Minacce, in qualsiasi forma, verso gli Utenti, l'Amministrazione, o terzi;
    2.4.7. Pubblicazione di contenuti che trattano di sofferenze subite da minori in seguito ad azioni illegali;
    2.4.8. Pubblicazione di contenuti pubblicitari senza l'approvazione dell'Amministrazione;
    2.4.9. Critiche non costruttive al Gioco, agli autori, al Proprietario;
    2.4.10. Istigazione a commettere azioni (od omissioni) vietate dalle Regole del Gioco, dal Contratto e/o dalla Legge;
    2.4.11. Creare topic e/o postare messaggi nei Forum e nelle Chat di Gioco che:
    2.4.11.1. Riproducono contenuti già esistenti, inclusi topic che sono già stati recentemente discussi e/o domande le cui risposte sono disponibili nelle informazioni generali (Regole del Gioco, FAQ, Wiki, ecc.);
    2.4.11.2. Non corrispondono all'argomento della sezione/categoria in cui sono pubblicati;
    2.4.11.3. Contengono troppe lettere maiuscole nel titolo o nel testo del messaggio;
    2.4.11.4. Contengono nel titolo o nel testo del messaggio: simboli o caratteri inutili, troppi smile, link d'invito, "codici cheat", informazioni che rendono difficoltosa la comprensione del messaggio o non hanno alcun significato (flood), ad esempio == - Il mio topic - ==;
    2.4.11.5. Contengono testo con dimensione del carattere superiore a 24;
    2.4.11.6. Sono carenti di informazioni e non descrivono sufficientemente il problema nel titolo o nel messaggio;
    2.4.11.7. Citano grosse parti di messaggi precedenti, e/o immagini senza alcun motivo (overquoting);
    2.4.11.8. Continuano a discutere topic che erano già stati chiusi o cancellati dall'Amministrazione (necroposting);
    2.4.11.9. Costituiscono un messaggio personale per un altro Utente. Per le comunicazioni personali si prega di utilizzare i messaggi privati (PM). Le discussioni personali sono consentite parallelamente alla soluzione dei problemi.
    2.4.11.10. Contengono spam, ossia informazioni che il ricevente non ha richiesto, non ha interesse a leggere, e/o non ha dato il consenso a ricevere;
    2.4.11.11. Contengono altre informazioni o violazioni che sono proibite da queste Regole del Gioco, dal Contratto e/o dalla Legge.


    3. Applicazione delle restrizioni all'Utente

    3.1. Se un Utente viola queste Regole di Gioco, l'Amministrazione si riserva il diritto di applicare a questo Utente le restrizioni stabilite nella relativa sezione delle Regole di Gioco. Le possibili sanzioni non si limitano a quanto descritto. L'Amministrazione si riserva il diritto di applicare altre sanzioni a propria discrezione, fino al blocco permanente dell'Account, incluso il ritiro parziale o totale di tutte le proprietà virtuali dell'Utente, le classifiche e i risultati dell'Utente nel Gioco (equipaggiamento del Garage, cristalli, statistiche di gioco).
    3.2. Al momento di scegliere le sanzioni, l'Amministrazione considera il tipo e il numero di violazioni, nonché le precedenti violazioni delle presenti Regole di Gioco da parte dell'Utente.
    3.3. L'Amministrazione si riserva il diritto, a propria discrezione, di cancellare qualsiasi contenuto o messaggio; di cancellare o spostare i topic creati nelle sezioni sbagliate del Forum, senza preventiva notifica.
    3.4. L'Amministrazione si riserva il diritto, a propria discrezione, di applicare una o più restrizioni contemporaneamente all'Utente, o di dare un avvertimento.
    3.5. La violazione di queste Regole del Gioco implica per l'Utente l'immediata possibilità che gli sia negato l'accesso a servizi di Gioco o che tali servizi siano soggetti a restrizione totale o parziale.
    3.6. Se un Utente viola le Regole di Gioco più volte o in modo sistematico, l'Amministrazione  si riserva il diritto, a propria discrezione, di applicare nuovamente le restrizioni all'Utente.
    3.7. Poiché non è sempre possibile identificare con precisione la violazione delle Regole del Gioco, la decisione finale spetta all'Amministrazione.
    3.8. Queste restrizioni possono essere applicate a qualsiasi Account dell'Utente che violi le Regole del Gioco.
    3.9. I messaggi privati sono riservati alle comunicazioni personali tra gli Utenti nei servizi di Gioco e sul Forum. Durante l'analisi di reclami relativi alla violazione delle Regole del Gioco, l'Amministrazione potrebbe non considerare reclami sui messaggi privati, ad eccezione di violazioni delle Regole del Gioco nei messaggi privati di membri o assistenti dell'Amministrazione. Un Utente può impedire che gli vengano inviati messaggi privati da un altro Utente aggiungendolo alla Lista nera nella sezione dedicata del profilo Utente del Forum.
    3.10. L'Amministrazione non sarà in alcun modo responsabile per eventuali perdite o danni, diretti o indiretti, che un Utente o terzi potrebbero aver subito a causa dell'uso fatto dall'Utente o da terzi del Sito Internet, del Gioco e/o dei Servizi online inclusi. A titolo di esempio non esaustivo, danni causati dall'impossibilità di utilizzare il Gioco o i Servizi online, o causati dall'applicazione da parte dell'Amministrazione di restrizioni all'Utente, danni diretti o indiretti derivanti da azioni di terzi, inclusi altri Utenti del Gioco, dalla mancanza di accesso a Internet, dal furto, dalla distruzione di Materiali, dalla perdita di informazioni relative all'Account dell'Utente e qualsiasi danno all'onore, alla dignità e alla reputazione commerciale dell'Utente derivanti dal Gioco.


    4. Assistenti dell'Amministrazione

    4.1. Gli Assistenti dell'Amministrazione sono selezionati dall'Amministrazione tra gli Utenti.
    4.2. Un Assistente dell'Amministrazione è una persona che agisce per conto e nell'interesse dell'amministrazione. Gli Assistenti dell'Amministrazione mantengono e controllano l'ordine nel Gioco e nei servizi di Gioco, nonché sui Forum, nelle Chat e sulle pagine e account ufficiali del Gioco sui social media.
    4.3. Un Assistente dell'Amministrazione deve essere onesto e obiettivo nel prendere decisioni, e deve anche rispettare le disposizioni delle presenti Regole del Gioco e del Contratto, essere gentile con gli Utenti, svolgere i suoi compiti in modo efficiente e regolare. L'attività degli Assistenti dell'Amministrazione è organizzata e regolata dalle loro linee guida interne.
    4.4. È vietato discutere pubblicamente le attività degli Assistenti dell'Amministrazione nei Forum, nelle Chat, nei gruppi ufficiali dei social media del Gioco. Tutti i reclami sul lavoro degli Assistenti devono essere inviati al'amministratore del rispettivo gruppo.
    4.5. L'attività degli assistenti di moderazione è volontaria. Un Utente non ha il diritto di imporre ad un Assistente di applicare una restrizione.


    5. Reclami e ricorsi

    5.1. L'Utente ha il diritto di segnalare violazioni delle Regole del Gioco creando un nuovo argomento nel forum nella sezione Violazioni. È necessario specificare chiaramente la natura della violazione e allegare uno screenshot della chat o un video che mostri chiaramente la violazione.
    5.2. L'utente può inviare domande, commenti o reclami riguardanti queste Regole del Gioco a help@tankionline.com. L'Amministrazione farà ogni sforzo per rispondere a queste richieste il prima possibile.
    5.3. Quando invia un reclamo, l'Utente deve descrivere la situazione nel modo più dettagliato e il più chiaramente possibile e allegare prove, screenshot, ecc. I reclami relativi a sanzioni senza fondamento sono considerati esclusivamente ai fini della valutazione interna del lavoro dell'Amministrazione e del moderatore. Le decisioni sull'applicazione delle restrizioni non sono soggette a revisione.
    5.4. Se l'utente inizia una corrispondenza con l'Amministrazione o fornisce un rapporto sui problemi relativi al Gioco o ai servizi di Gioco, l'Amministrazione ha il diritto di conservare tutti questi contenuti.


    6. Altre disposizioni

    6.1. L'Amministrazione gestisce il Gioco e applica queste Regole del Gioco a sua esclusiva discrezione, ma tiene conto dell'opinione della community.
    6.2. Queste Regole del Gioco possono essere modificate dall'Amministrazione senza preavviso. L'Utente è obbligato a controllare se queste Regole del Gioco sono state modificate almeno una volta ogni sette giorni (cioè ogni settimana). Se tale controllo non viene effettuato entro il periodo specificato e l'Utente continua a utilizzare il Gioco, si ritiene che l'Utente abbia letto e accettato la versione modificata delle Regole del Gioco.
    6.3. L'Amministrazione mantiene una politica di "tolleranza zero" nei confronti di imbrogli e frodi. Se, a giudizio dell'Amministrazione, l'Utente ha truffato o cercato di imbrogliare l'Amministrazione o un altro Utente, o ha fornito false informazioni, documenti, prove e ha violato in altro modo la Legge, l'Amministrazione si riserva il diritto di bloccare l'Account dell'Utente e trasferire tali informazioni a propria discrezione (insieme ai dati personali dell'Utente) a terzi o alle autorità giudiziarie, se l'Amministrazione lo ritiene necessario.
    6.4. L'Amministrazione può emettere altre disposizioni e restrizioni nei Regolamenti degli eSports, nelle regole delle competizioni, dei tornei e dei campionati. Allo stesso tempo, le Regole del Gioco sono parte integrante delle altre regole adottate dall'Amministrazione.
    6.5. Le modalità di gioco inventate dagli Utenti (come "Proteggi la Cassa D'oro") possono essere giocate in qualsiasi modalità purché sia una Battaglia PRO privata. Tuttavia, qualsiasi abuso come il sabotaggio o il power-levelling durante tali Battaglie Pro verrà gestito secondo le normali Regole del Gioco.
