  GAME_PRIVACY_POLICY: "Gizlilik ve Çerez Politikası\n\nAPL Publishing Ltd, registration no. C 85285, registered under the laws of Malta, 157, Archbishop Street Valletta, VLT1440, Malta (bundan sonra \"Şirket\" veya \"Yönetim\" olarak anılacak), Oyuna ilişkin münhasır hakların sahibi, Kullanıcıların Kişisel Verilerinin gizliliğine ilişkin haklarına saygı göstermektedir. Şirket, Kullanıcılardan alınan bilgilerin korunmasının arz ettiği önemi bilmektedir. Şirket, Kullanıcılarına Kişisel Verilerinin toplanması ve kullanılması hakkında bilgi sunmak amacıyla işbu Gizlilik ve Çerez Politikasını (bundan sonra \"Politika\" olarak anılacak) onaylanmıştır.\n\nİşbu Politika, Kullanıcının Kişisel Verilerinin toplanması, kullanılması, işlenmesi, saklanması, açıklanması, aktarılması ve silinmesine ilişkin koşulları, prosedürleri ve amaçları yanı sıra Kullanıcının Kişisel Bilgilerinin korunması şartlarını sunmaktadır.  İşbu Politika Yetkili Kanunlar kapsamında öngörüldüğü üzere bir Kullanıcının Kişisel Verilerini nasıl görüntüleyebileceği, güncelleyebileceği ve silinmesini talep edebileceğini açıklamaktadır. İşbu Politika ayrıca Yönetim tarafından çerezlerin kullanımı ve saklanmasına ilişkin koşulları, prosedürleri ve amaçları sunmaktadır.\n\nOyun ve Oyun Hizmetinde yayınlanan Son Kullanıcı Lisans Sözleşmesi (bundan sonra \"Sözleşme\" olarak anılacak), Oyun Kuralları ve diğer dokümanlar işbu Politikanın ayrılmaz bir parçasıdır. Buna karşılık, işbu Politika, Oyun ve Oyun Hizmetinde yayınlanan Sözleşme, Oyun Kuralları ve diğer dokümanların ayrılmaz bir parçasıdır.\n\nİşbu Politika yalnızca Oyunun internet siteleri ve diğer hizmetleri için geçerli olup diğer internet siteleri ve hizmetleri kapsamamaktadır.\n\nOyun veya Online Hizmetlerinin herhangi bir kullanımı ve/veya kayıt formunda \"Kabul Ediyorum\" düğmesine tıklamanız işbu Politikayı bildiğiniz ve onayladığınız ve tüm şartlarını kayıtsız şartsız kabul ettiğiniz anlamına gelmektedir. \nİşbu Politikanın herhangi bir şartını kabul etmiyorsanız, Oyun ve hizmetlerini kullanma hakkına sahip değilsiniz, ve lütfen bu internet sitesinden ayrılın ve Oyunu kullanmayın.\n\n\nTanımlar\n\nİşbu Politikada kullanılan ilk harfi büyük harfle yazılan herhangi bir terim veya ifade Sözleşmede kendilerine verilen anlamlara sahiptir.\n\n\nYükümlülükler\n\n1.       Şirket, Kullanıcının gizliliğine saygı gösterirken, Yetkili Kanunlar çerçevesinde geçerli her türlü verilerin korunması kanunlarına uymaya kendini adamıştır. Şirket, Kullanıcının Kişisel Verilerinin adil bir şekilde, yasalara ve iyi uygulamaya uygun bir şekilde işlenmesini ve yalnızca Kullanıcının Yazılım, Oyun ve İnternet Sitesini kullanmayı tercih ettiği anda Kullanıcı tarafından bilinen ve kabul edilen belirli amaçlar için toplanmasını sağlar.\n2.\tŞirket, Malta'da Veri Koruma Yetkilisine kayıtlı olup Malta Mevzuatı Veri Koruma Kanunu Madde 440 ve Malta'da geçerli diğer yönetmelikler, yasal tebliğler ve/veya benzeri kurallara riayet etmektedir.\n3.\tİşbu Politika, interaktif çok kullanıcı çevrimiçi oyun «Tanki Online. Sürüm 2», Oyunun sohbet odası, Oyunun forumu, Tanki Online wiki, Tanki Online Haberler (bundan sonra birlikte \"Oyun Hizmetleri\" olarak anılacaktır) yanı sıra oyun hizmetleri ve Oyun istemcisinde kişisel verilerin toplanması amacıyla kullanılan tüm çevrimiçi formlar, iç formlar ve iletişim araçları dahil Oyunun kaynaklarını kapsamaktadır.\n4.\tŞirket, Kişisel Verilerin daima \na.\tKullanıcının haklarına uygun bir şekilde işlenmesini; \nb.\tadil ve yasalara uygun bir şekilde işlenmesini; \nc.\tyalnızca belirli ve yasal bir amaçla alınmasını; \nd.\ttoplama amacı için aşırı olmaması, yeterli ve alakalı olmasını;  \ne.\tdoğru ve güncel olmasını; \nf.\tgüvenli bir şekilde saklanmasını; \ng.\ttoplama amacı için gerekli olandan daha uzun bir süre saklanmamasını; \nh.\tKişisel Verilerinizin yeterli bir korumasını sağlamayan ülkelere aktarılmamasını ve \ni.\tyalnızca işbu belgede belirtilen amaçlarla kullanılmasını sağlamak için\nmakul bir şekilde mümkün olan her türlü şeyin uygulandığını taahhüt etmektedir. \n\n5.\tYalnızca Şirket çalışanları ve temsilcileri yanı sıra gerekli onay ve yetkilere sahip Şirketin Bağlı Şirketleri, Şirket tarafından alınan Kişisel Verilere ulaşabilmektedir. Böyle bir Kişisel Veriye erişim hakkına sahip tüm kişilerin işbu Politikanın koşullarına uyması gerekmektedir ve iş sözleşmeleri veya sair sözleşmeler yoluyla, Şirketteki görevleri sona ermiş olsa bile böyle bilgileri son derece gizli tutmakla yükümlü kılınmışlardır.\n6.\tKullanıcının Kişisel Verilerini yasadışı veya istenmeyen erişimler, yok olma, değişiklikler, engelleme, kopyalanma, dağıtım yanı sıra üçüncü tarafların diğer yasadışı faaliyetlerine karşı korumak için mümkün olan her türlü organizasyonel ve teknik tedbirleri almaya kendini adamıştır.\n7.\tŞirket, Kullanıcı ile e-posta iletişimlerinin korunması ve muhtelif zamanlarda gerekli olabilecek sair iletişim yöntemlerinin korunması ilkesi hususunda en iyi uygulamaları benimsemiştir.\n8.\tVeri koruma mevzuatı ülkelere göre farklılık gösterebilmektedir. Şirket, işbu Politikanın hükümlerini mümkün olabildiği en geniş ölçüde uygulamayı amaç edinecek ve Kullanıcının Kişisel Bilgilerini, nerede toplandığı ve/veya nasıl iletildiğine bakılmaksızın, mümkün olabildiği en geniş ölçüde koruyacaktır. \n9.\tŞirket Kişisel Bilgileri üçüncü ülkelere ancak böyle bir üçüncü ülkenin yeterli bir düzeyde Kişisel Verileri koruyabilecek olması halinde veya böyle aktarımın Sözleşmenin veya sair sözleşmelerin Kullanıcının menfaatine akdedilmesi veya ifası için gerekli olması halinde veya böyle bir aktarımın Kullanıcının menfaatlerini korumak için gerekli olması veya ilgili Şirketin Kişisel Verilerin korunmasına ilişkin yeterli garantileri vermesi halinde aktarabilecektir.  \n\nKişisel Bilgilerin Toplanması\n\n10.\tYönetim Oyunun kullanılabilmesini sağlamak amacıyla Kullanıcıdan herhangi bir bilgi talep etme hakkına sahip olacaktır ve bu bilgiler,  e-posta, telefon numarası, sosyal ağlardaki kimlik bilgileri (ID), kullanıcı adı ve şifre dahil kayıt, hizmetlere abonelik, materyallerin yayınlanması ve diğer hizmetlere ilişkin talepler sırasında sağlanan bilgiler dahil Oyun ve Oyun Hizmetlerindeki özel formların doldurulması sırasında sağlanan bilgilerden oluşabilecektir.\n11.\tYönetim, Oyunda etkinlikler düzenlemek ve gerçekleştirmek için gerekli olan ve Kullanıcının Yönetim tarafından başlatılan böyle etkinliklere katılması için kayıt olurken sağlayacağı herhangi bir bilgiyi talep edebilir.\n12.\tKullanıcının Yönetim ile yazışmaları başlatması halinde veya Oyun ve Oyun Hizmetleriyle ilgili sorunlara ilişkin bir rapor sunması halinde, Yönetim tüm bu yazışmaları saklama hakkına sahiptir.\n13.\tYönetim, Kullanıcıdan anketlere katılmasını isteyebilir ve anketler sırasında belirli bilgileri talep edebilir ancak bu zorunlu bir prosedür olmayıp herhangi bir Kullanıcı bunlara katılmayı reddedebilir.\n14.\tYönetim, Kullanıcının Ücretli bir Hizmeti kabul etmesi halinde işlem bilgileri ve Kullanıcının ödeme verilerini toplayabilir ve işleyebilir.\n15.\tKullanıcının tarayıcısı veya istemci programı, Oyun ve Oyun Hizmetleri internet sitelerine ziyaretlerine ilişkin trafik, log (günlük) dosyaları, Kullanıcının bilgisayarının coğrafi konumuna ve olasılıklarına ilişki veri ve diğer veriler dahil bilgileri aktarabilir.  Kullanıcı, Yönetimin bu bilgileri işbu Politikada belirtilen amaçlar ve prosedüre uygun bir şekilde kullanabileceğini peşinen kabul etmektedir.\n16.\tYönetim, Kullanıcıdan belirli işlemleri yapmak amacıyla cinsiyet, yaş, doğum tarihi ve oyun tercihleri gibi sair bilgileri talep edebilir.\n17.\tYönetim, Sözleşme veya Sözleşmenin ayrılmaz bir parçasını oluşturan herhangi bir dokümanda belirtilen sair bilgileri toplayabilir, işleyebilir ve kullanabilir.\n\n\nKullanıcının Rızası\n\n18.\tÜcretli Hizmetlerin kayıt formunda veya Oyun veya Oyun Hizmetlerinde kullanılan herhangi bir diğer kayıt formunda Kullanıcının herhangi bir Kişisel Veriyi sağlaması halinde, böyle bir sağlama Kullanıcının açık bir şekilde işbu Politikaya, Sözleşmeye ve Sözleşmenin bir parçasını oluşturan herhangi bir belgeye doğrudan ve nihai rızasını verdiği anlamına gelmektedir ve böyle bir sağlama Kullanıcının işbu Politika, Sözleşmeye ve Sözleşmenin bir parçasını oluşturan herhangi bir belge ile sağlanan amaçlar doğrultusunda Kullanıcının herhangi bir kişisel bilgilerinin toplanması, işlenmesi, kullanılması, saklanması, açıklanması, aktarılması, sınırlar arası aktarılmasına (üçüncü ülkelere aktarılmasına) açık bir şekilde doğrudan ve nihai rızasını verdiği anlamına gelmektedir.  \n19.\t Kişisel Veriler, yalnızca yasal amaçlarla toplanacak ve özellikle de aşağıdaki sebeplerle toplanacaktır:\na.\tKullanıcı bilgilerinin doğrulanması;\nb.\tŞirkette bir Hesabın kaydedilmesi;\nc.\tfaaliyetlerin tanıtılması ve pazarlanması; \nd.\tgeçerli kanunlara uyum;\ne.\tŞirketin, örneğin oyunla ilgili teknik destek gibi, sunabileceği herhangi bir ek hizmetin Kullanıcıya uygun ve nitelikli bir şekilde sunulması ve \nf.\tSözleşmenin ve Sözleşmenin ayrılmaz bir parçasını oluşturan tüm belgelerin Şirket, tedarikçileri ve/veya adına hareket eden herhangi bir üçüncü tarafça yerine getirilmesi ve ifa edilmesi. \n20.\tYönetim, Yetkili Kanunlara göre Kişisel Veri olarak kabul edilmeyen herhangi bir bilgiyi toplama ve uygun gördüğü bir şekilde kullanma hakkına sahiptir ve Kullanıcı Şirketin böyle Kişisel Olmayan Verileri herhangi bir üçüncü tarafa ifşa edebileceğini kabul etmektedir.\n21.\tYetkili Kanunların aksini öngörmediği sürece, Kullanıcı, Kişisel Verilerinin işlenmesi ve toplanmasına itiraz etme hakkına sahiptir ve herhangi bir zamanda böyle bir rızayı geri çekme hakkına sahiptir. Kullanıcının rızasını geri çektiği her halde, Oyun ve Çevrimiçi Hizmetlerin kalitesi üzerinde olumsuz etkiye sahip olabileceğini ve Oyun ve/veya Oyun Hizmetlerine erişimi imkansız kılabileceğini anlamakta ve kabul etmektedir ve Kullanıcı, Şirketin böyle bir durumda Kullanıcının Kişisel Verilerinin herhangi bir şekilde kaybolması ve/veya zarara uğramasından dolayı herhangi bir yükümlülüğe sahip olmadığını kabul etmektedir.\n\nKişisel Verilerin kullanılması ve işlenmesi\n\n22.\tKullanıcı, Şirketin Oyunun kullanılmasını sağlamak için gerekli gördüğü şekilde sağlanan Kişisel Verileri saklama ve işleme hakkına sahip olduğunu ayrıca kabul etmektedir. Kullanıcı ayrıca Oyundaki tüm faaliyetlerin kayıt altına alındığını kabul etmekte ve bilmektedir.\n23.\tKullanıcı tarafından ifşa edilen Kişisel Verilerin Oyun Hizmetlerinin Kullanıcıya uygun ve nitelikli bir şekilde sağlanması, Oyun Hizmetlerinin geliştirilmesi ve iyileştirilmesi amacıyla, Sözleşme ve Sözleşme, Oyun Kuralları ve işbu Politikada belirtilen diğer edimlerin ifa edilmesi amacıyla Yönetim tarafından toplanmakta ve işlenmektedir. Kişisel Bilgilerin işlenmesi, toplama, kayıt altına alma, sistematikleştirme, sınıflandırma, saklama, biriktirme, güncelleme, değiştirme, gruplandırma, engelleme, kullanma, açıklama, üçüncü taraflara aktarma, yayma, imha etme, silme ve işbu Sözleşmenin ifası için gerekli olan diğer faaliyetlerdir. \n24.\tŞirket, Kullanıcının Kişisel Verilerini satmamaktadır ve işbu Politikada sağlananlar hariç olmak üzere, böyle bilgileri üçüncü taraflara açıklamamaktadır. Şirket, genel demografik ve istatistiksel bilgileri iş ortakları ve reklamverenlere ifşa edebilir. Bu Kişisel Verilerle doğrudan ilişkili değildir ve belirli bir Kullanıcıyı tanımlayamaz.\n25.\tHizmetlerin uygun bir şekilde sağlanmasını temin etmek amacıyla, Şirket sunucu barındırma hizmetleri, ödeme hizmetler, e-posta gönderimiyle ilişkili hizmetler sağlayan diğer kişi ve kuruluşlara ve moderatörlere aktarma hakkına sahiptir. Bu kişi ve kuruluşlar, alınan bilgileri yalnızca Kullanıcılara hizmet sağlamak amacıyla kullanma hakkına sahip olup Kişisel Verilerin uygun kullanımını sağlayan sözleşme hükümleriyle bağlı kılınacaktır.\n26.\tKullanıcı, Oyun Hizmetlerinin uygun ve yüksek kalitede sağlanması ve geliştirilmesi amacıyla ve Oyun Hizmetlerinin iyileştirilmesi amacıyla, Sözleşme, Oyun Kuralları ve işbu Politikanın yerine getirilmesi amacıyla sağlanan Kişisel Verileri Şirketin herhangi bir Bağlı Şirketine aktarma hakkına sahip olacaktır.\n27.\tŞirketin, ileride başka bir şirketle yeniden örgütlenme ve/veya birleşme ve/veya satış ve/veya satın alma ve/veya tasfiye ve/veya herhangi bir diğer işlem vasıtasıyla birleşmesi halinde, Kullanıcının Kişisel Verileri Şirket veya bir bölümüyle birlikte aktarılabilir veya Şirketin bir parçası olarak satılabilir.\n28.\tKullanıcı, Şirketin, Yetkili Kanunlar ve/veya herhangi bir diğer yetkili kanunlar çerçevesinde bir alınan bir karar ile emredilmesi halinde ve/veya Düzenleme Otoritesinin emriyle emredilmesi halinde ve/veya Veri Koruma Yetkilisinin emriyle emredilmesi halinde ve/veya Kullanıcının bir şekilde Oyun ve/veya Şirketin hizmetleriyle ilişkilendirilen herhangi bir suça doğruda ve/veya dolaylı olarak müdahil olması halinde, Kişisel Verileri ifşa etme hakkı ve yükümlülüğüne sahip olduğunu kabul etmektedir.\n29.\tKullanıcı, Oyun ve/veya Oyun Hizmetlerinde yer alan Materyallerle ilişkili hakların Kullanıcı tarafından ihlal edildiğine dair üçüncü taraflardan (telif hakkı sahipleri) bir talep alması halinde, Şirketin böyle bir Kullanıcı hakkında bilgileri üçüncü tarafa (telif hakkı sahipleri) aktarma hakkına sahip olduğunu kabul etmektedir.  \n30.\tKullanıcının Oyuna üçüncü taraflara ait internet siteleri ve/veya Şirketin partnerlerinin internet siteleri üzerinden katılması ve/veya kayıt olması halinde, bu kişiler uygun ve yüksek kaliteli hizmet sağlamak amacıyla Kullanıcının kişisel verilerini talep edebilir, toplayabilir ve işleyebilir.  Bu durumda üçüncü tarafların gizlilik ve çerez politikaları uygulanacaktır. Kullanıcı, Şirketin Oyun Hizmetlerinin uygun ve yüksek kalitede sağlanması, Sözleşmenin, Oyun Kurallarının ve işbu Politikanın yerine getirilmesi amacıyla böyle kişilere Kullanıcıya ait Kişisel Verileri aktarma hakkına sahip olduğunu kabul etmektedir.\n\n\nKişisel Verilerin Saklanması\n\n31.\tŞirket, işbu Politikanın koşullarına uygun bir şekilde toplanan Kullanıcıya ait Kişisel Verilerin uygun ve güvenli bir şekilde saklanması için gerekli tüm tedbirleri alacaktır. Kullanıcı tarafından sağlanan tüm bilgiler Şirketin sunucularında saklanacaktır.\n32.\tŞirket, Kişisel Verilerin güvenliğini sağlamak amacıyla güvenlik duvarlarını da kapsayan standart bir teknolojiyi kullanacaktır.\n33.\tKullanıcı, Oyuna giriş amacıyla kullanılan kimliğini veya hesap bilgilerini üçüncü taraflara açıklama veya aktarma yükümlülüğüne sahip değildir. Kullanıcı, hesap bilgilerinin saklanmasından tamamen kendisi sorumludur.\n34.\tKullanıcının, hesap bilgilerinin çalındığı ve/veya herhangi bir üçüncü tarafın eline geçtiğini öğrenmesi halinde, Kullanıcı bu durumları Şirketin gerekli tedbirleri alabilmesi için derhal Şirkete bildirecektir. Bu durumlarda, Şirket Kullanıcıya ait Kişisel Verilerin güvenliğini garanti edemez ve Kullanıcı Kişisel Verilerin herhangi bir şekilde kullanılmasından dolayı Şirketin sorumlu tutulmayacağını kabul etmektedir.\n35.\tKullanıcının Oyun ve Oyun Hizmetlerinde (sohbet odası, forum, vb. kullanarak) iletişimde bulunması halinde, Kullanıcı böyle bir iletişimin Şirketin Sunucuları üzerinden gerçekleştiğini biliyor ve böyle verilerin Yönetim tarafından toplanabileceği, saklanabileceği ve incelenebileceğini kabul etmektedir. Yönetim, Kullanıcının Oyun, Oyun Hizmetleri ve Oyunla ilgili diğer hizmetler (sohbet odası, forum, sosyal ağ vb. kullanarak) üzerinden diğer Kullanıcılara ifşa ettiği Kişisel Bilgiler ve/veya diğer Bilgilerin gizliliğinden sorumlu değildir ve Yönetim böyle bilgileri kamuya açık bilgiler olarak addetme hakkına sahiptir.  \n\n\n\nÇerezler, IP adresleri ve log (günlük) dosyaları\n\n36.\tYönetim, Kullanıcının bilgisayarı, günlük dosyaları, IP adresi, işletim sistemi, tarayıcı ve e-posta istemcisi, trafik bilgileri, tarih ve saat, oyun hizmetlerine ziyaretlerin tarih ve saati ve detayları, kullanıcı faaliyetleri, erişim, ayarlar, sistem bilgilendirmelerine ilişkin bilgileri toplayabilir ve işleyebilir. Bu bilgiler Kullanıcıların İnternet Sitesindeki faaliyetlerine ilişkin olup sistemlerin yönetilmesi, Oyun ve Oyun Hizmetlerinin doğru bir şekilde çalışmasını sağlamak, güvenlik ve koruma tedbirlerinin güçlendirilmesi ve sistem bütünlüğünün sağlanması, hacker saldırılarının, izinsiz erişimlerin önlenmesi amaçlarıyla toplanmakta ve saklanmaktadır.\n37.\tYönetim, Oyunun doğru bir şekilde çalışabilmesini sağlamak amacıyla çerezleri kullanmaktadır. Çerezler, Kullanıcının bilgisayarında/diğer cihazlarında bir faaliyetin Kullanıcıyla ilişkilendirilmesi ve tanımlanması amacıyla otomatik olarak oluşturulan ve saklanan küçük bir kayıt tutma metnidir (bundan sonra \"Çerezler\" olarak anılacaktır).  Çerezler tipik olarak adlar ve/veya e-posta adresleri ve/veya diğer Kişisel Verileri içermemektedir. Gerçekte, tipik olarak, Oyun ve Oyun Hizmetlerinin daha iyi çalışması için gerekli olan anonim bilgileri içermektedir.\n38.\tKullanıcının Oyun ve/veya Materyallerini kullanırken Kullanıcının bilgisayarı/herhangi bir diğer cihazında saklanan Çerezler sıralananlar dahil bunlarla sınırlı olmaksızın fonksiyonlara sahiptir: \na.\tKullanıcının talep ettiği güvenli alanlara erişimin sağlanması, bu Çerezler olmadan güvenli oturum açma alanları gibi talep ettiğiniz hizmetler sağlanamaz;\nb.\tZiyaret Çerezleri - Kullanıcının yaptığı tercihler ve/veya ayarların hatırlanması ve Kullanıcının Oyunu kullanırken tanınması için. Bu Çerezler olmadan, Oyunun işlevselliği bozulabilir;\nc.\tOy Kullanma (Anket) Çerezleri - Kullanıcının bir oy kullandığı herhangi bir anketin işaretlenmesi ve Kullanıcının aynı ankette tekrar oy kullanmasının engellenmesi için;\nd.\tYük Dengeleme Oturum Çerezleri - iş yükünün dağıtılması ve oyun hizmetlerinin optimizasyonunun zamanlanması yoluyla Oyunun yükleme süresinin kısaltılması için. Bu Çerezler olmadan, Oyunun işlevselliği kaybolabilir;\ne.\tOyun ve oyun hizmetlerine tekrar giriş durumunda Kullanıcının arayüz ayarlarının kaydedilmesini mümkün kılan Kullanıcı Arayüz özelleştirme çerezleri;\nf.\tKullanıcının sosyal ağlardaki verileriyle senkronizasyonun sağlanması için kullanılan çerezler.\ng.\tPerformans (Analitik) Çerezleri - Kullanıcının Oyunu nasıl kullandığına dair anonim bilgiler toplamak için.\nh.\tReklam Çerezleri - Kullanıcıya en uygun reklamların gönderilmesine ve reklam kampanyalarının etkinliğinin iyileştirilmesine yardımcı olur. Kullanıcı, Şirketin kendi reklam kampanyaları için bu çerezleri kullanabileceğini kabul etmektedir. \n39.\tYönetim, ayrıca, Kullanıcının tercihleri hakkında bilgilerin saklanması ve analiz edilmesi ve hizmet kalitesinin arttırılması amaçlarıyla belirli üçünü taraflara kendilerine ait internet performans (analitik) ve reklam çerezlerini Kullanıcının cihazlarına koymasına ve kullanmasına ve Şirketin Çerezlerinden bilgi toplamasına izin verebilir.  Bu durumda böyle üçüncü taraflar işbu Politikayla bağlı kılınmaktadır. Yönetim, böyle bir kullanımı yalnızca itibarlı üçüncü taraflara sağlayacağını garanti etmektedir.\n40.\tKullanıcı, Oyunu Facebook gibi herhangi bir Sosyal Ağ Sitesi üzerinden kullanarak, Kullanıcının ilgili Sosyal Ağ Sitesinin çerez politikasına riayet etmesinin gerekli olabileceğini bilmektedir ve Kullanıcı böyle herhangi bir çerez kullanımından dolayı herhangi bir yükümlülüğe sahip olmadığını kabul etmektedir.\n41.\tOyun ve/veya İnternet Hizmetlerini kullanarak veya Sözleşmeyi (işbu Politika dahil) kabul ederek ve/veya \"Kabul Ediyorum\"u tıklayarak, Kullanıcı işbu Politikayı anlamış ve kabul etmiştir ve Yönetimin Kullanıcının Oyunu ve/veya Materyalleri kullanacağı Kullanıcı bilgisayarı/herhangi bir diğer cihaza çerezler yerleştirebileceğini, saklayabileceğini ve kullanabileceğine dair doğrudan ve kesin rızasını ifade etmektedir. Yönetim, Kullanıcının işbu Politikada sağlandığı şekliyle tarayıcı ayarları üzerinden çerezleri devre dışı bırakıncaya kadar ve/veya devre bırakmadığı sürece işbu Politikaya rızasını verdiğini varsaymaya devam edebilir. İşbu rızayı vermek suretiyle, Kullanıcı Yönetime daima Kullanıcıların menfaatini düşünmek suretiyle Kullanıcıları ve tercihlerini daha iyi anlama, hizmet kalitesini geliştirme ve iyileştirme imkanı tanımaktadır. Kullanıcı, Çerezler etkinleştirilmeden Oyunun doğru bir şekilde çalışmayabileceğini kabul etmektedir.\n42.\tYönetim, saklanan çerezlerin Kullanıcılar için güvenli olduğunu ve Oyun ve oyun hizmetlerinin normal çalışması için ve Yönetim tarafından Kullanıcılara hizmetlerin sağlanması için kesinlikle gerekli olduğunu garanti etmektedir.\n43.\tÇerezler en fazla bir yıl için saklanmaktadır. Üçüncü tarafça çerez saklama süreleri ve şartları böyle bir üçüncü tarafça belirlenmektedir.\n44.\tKullanıcı herhangi bir zamanda tarayıcı ayarlarını değiştirmek suretiyle çerezleri almayı reddedebilir veya çerezleri devredışı bırakabilir. Çerezlerin devredışı bırakılması Oyun ve Çevrimiçi Hizmetlerin kalitesi üzerinde olumsuz bir etkiye sahip olabilir ve ayrıca Oyun ve Çevrimiçi Hizmetlere erişimi imkansız kılabilir ve Kullanıcı işbu Politikada Kullanıcının çerezleri devredışı bırakması nedeniyle Kullanıcı bilgilerinin kaybolması ve/veya zarara uğramasından dolayı Şirketin herhangi bir yükümlülüğe sahip olmadığını kabul etmektedir.  \n\n\nKullanıcıya ait Kişisel Verilerin Alınması ve Değiştirilmesi\n\n45.\tKullanıcı, Şirketin sakladığı Kullanıcıya ait Kişisel Verilerinin bir kopyasını almak ve mevcut ise herhangi bir yanlış verinin düzeltilmesini sağlamak amacıyla herhangi bir zamanda Yönetimle iletişim kurma hakkına sahiptir. Kullanıcı, Kişisel Verilerinin silinmesini, düzeltilmesini, değiştirilmesini veya tamamlanmasını talep etme hakkına sahiptir. Kullanıcıya ait Kişisel Veriler hakkında Yönetimle iletişim kurmak için, help@tankionline.com adresine bir e-posta gönderilmelidir.\n\nHerhangi bir Kişisel Veriyi sağlamayı reddetme\n\n46.\tKullanıcı tarafından Yönetime sağlanan herhangi bir Kişisel Veri gönüllülük esasında verilmektedir. Bununla birlikte, Şirket, talep edildiğinde herhangi bir Kişisel Verinin sağlanmaması halinde, Oyun ve/veya oyun hizmetlerinin uygun bir şekilde veya tam olarak çalışabileceğini garanti edemez. \n\nSosyal Ağ Siteleri\n\n47.\tKullanıcı, herhangi bir Sosyal Ağ Sitesi veya üçüncü taraflara ait diğer internet siteleri üzerinden Oyunu kullanarak Kullanıcının bunlara ait hüküm ve şartlara tabi olabileceğini kabul ettiğini ve bildiğini onaylamaktadır.\n\n\nPolitikadaki Değişiklikler\n\n48.\tİşbu Politika son baskının tarihi itibariyle geçerlidir. İşbu Politika önceden veya sonradan Kullanıcıya haber verilmeksizin herhangi bir şekilde ve herhangi bir zamanda kısmen veya tamamen değiştirilebilir veya tadil edilebilir, bu nedenle tüm değişikliklerden haberdar olmak için işbu Politikayı çeşitli zamanlarda incelemenizi tavsiye ediyoruz. Oyun ve oyun hizmetlerinin kullanılmaya devam edilmesi, işbu Politikanın değiştirilmiş halinin kayıtsız şartsız kabulü anlamına gelmektedir.\n\nYönetim ile İletişim\n\n49.\tİşbu Politika hakkında herhangi bir soru, açıklama, şikayet veya yorumlarınız için, lütfen help@tankionline.com adresinden bize ulaşınız. Sorularınızı mümkün olan en kısa süre içinde değerlendireceğiz.\n50.\tYönetim, orantısız bir şekilde teknik çaba gerektiren, diğer Kullanıcıların gizliliğini tehlikeye atan veya uygulanması aşırı derece güç olan makul olmayacak derecede sık talepleri reddedebilir.\n51.\tKullanıcının Yönetim ile yazışmaları başlatması halinde veya Oyun ve Oyun Hizmetleriyle ilgili sorunlara ilişkin bir rapor sunması halinde, Yönetim tüm bu yazışmaları saklama hakkına sahiptir."
