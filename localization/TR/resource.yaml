  GAME_TERMS: "SON KULLANICI LİSANS SÖZLEŞMESİ\n \nOyun veya Online Hizmetlerinin herhangi bir kullanımı ve/veya kayıt formunda \"Kabul Ediyorum\" düğmesine tıklamanız işbu Sözleşmeyi bildiğiniz ve onayladığınız ve tüm şartlarını kayıtsız şartsız kabul ettiğiniz anlamına gelmektedir.\n \nTüm Sözleşmeyi kabul etmiyorsanız, Oyunu kullanma hakkına sahip değilsiniz ve bu internet sitesinden derhal ayrılmakla yükümlüsünüz.\n \nAPL Publishing Ltd, registration no. C 85285, registered under the laws of Malta, 157, Archbishop Street Valletta, VLT1440, Malta (bundan sonra \"Tanki Online\" veya \"Şirket\" veya \"Yönetim\" olarak anılacak) ile diğer tarafta kullanıcı sıfatıyla Siz (bundan sonra \"Siz\" veya \"Kullanıcı\" olarak anılacaktır) arasındaki sözleşme ilişkisini tesis eder ve yönetir.  \n \nİşbu SKLS'nin bir parçasını teşkil eden dokümanlar \n \nAşağıdaki dokümanlar işbu SKLS'nin ayrılmaz bir parçasını teşkil etmektedir:\n<a href=\"http://tankionline.com/en/privacy/\" target=\"_blank\"><u>Gizlilik ve Çerez Politikası</u></a>;\n<a href=\"http://tankionline.com/en/rules/\" target=\"_blank\"><u>Oyun Kuralları</u></a>; ve \n<a href=\"http://en.tankiforum.com/index.php?showtopic=163769\" target=\"_blank\"><u>Kristal Satın Alma Kılavuzu</u></a>\n \nTanımlar\n \nAşağıdaki kelimeler ve ifadeler açık bir şekilde aksi belirtilmediği sürece aşağıdaki şekilde yorumlanacak ve işbu SKLS'nin tüm maddeleri ve işbu SKLS'nin bir parçasını teşkil eden her doküman için geçerlidir: \n \n\"Hesap/Kullanıcı Hesabı\" Hesap Bilgilerini içeren ve Kullanıcı tarafından açılan ve Yönetim tarafından sağlanan bir kişisel hesap anlamına gelmektedir.\n \n\"Hesap Bilgileri\" Oyun içinde Kullanıcının tanımlanmasını sağlayan Kullanıcı Adı ve Şifre ve Takma adı ve diğer bilgiler anlamına gelmektedir.\n \n\"Yönetim\" Oyunun yönetilmesi ve sunulması amacıyla Şirket adına ve namına hareket eden kişiler anlamına gelmektedir. \n \n\"Sözleşme\" Kullanıcıya basit münhasır olmayan ve iptal edilebilir bir lisans ile Oyunu kullanma hakkı veren, ve işbu SKLS'nin ayrılmaz bir parçasını teşkil eden tüm dokümanlar ve Yönetim tarafından İnternet Sitesi veya Şirket partnerlerinin siteleri için belirlenen diğer kurallar ve talimatlar dahil işbu SKLS, işbu lisans sözleşmesi anlamına gelmektedir.\n \n\"Kristal\" Oyun ve/veya İnternet Sitesinde kullanılan ve Hizmetlerden faydalanmak amacıyla sunulan Oyun içi para birimi anlamına gelmektedir.\n \n\"Tanki Online / Şirket\" APL Publishing Ltd, registration no. C 85285, registered under the laws of Malta, 157, Archbishop Street Valletta, VLT1440, Malta. \n \n\"SKLS\" işbu Son Kullanıcı Lisans Sözleşmesi anlamına gelmektedir.\n \n\"Oyun\"  tüm bileşenler, oyun hizmetleri, sohbet odası, Tanki Online Wiki, Tanki Online Haberler, sosyal ağlardaki resmi toplulukları dahil \"Tanki Online. Sürüm 2\" adlı interaktif çok kullanıcılı çevrimiçi oyun ile birlikte /en/, /de/ adresiyle İnternet Sitesinin alt alan adlarında ve /battle-en, /battle-de ile başlayan adreslerde oyun sunucularında, oyun sunucularıyla http://tankionline.com.br alan adında veya Şirketin partnerleri tarafından Kullanıcıların kullanımına sunulan sitelerde erişime sunulan tüm materyaller, resimler, sesler, siteler, bilgisayar programları ve herhangi bir web kaynağı anlamına gelmektedir.\n \n\"Yetkili Kanunlar\" Malta Kanunları anlamına gelmektedir.\n \n\"Tanımlanan\" veya \"Tanımlanabilir Gerçek Kişi\" doğrudan veya dolaylı olarak başta kimlik numarasına veya kimliğinin bir veya birden fazla öğesine atıf yoluyla olmak üzere tanımlanabilen bir kişi anlamına gelmektedir.\n \n\"İnternet Sitesi\"  /en/, /de/ adresiyle İnternet Sitesinin alt alan adlarında ve /battle-en, /battle-de ile başlayan adreslerde oyun sunucularında, oyun sunucularıyla http://tankionline.com.br alan adında ve bunlara bağlı olan ve linkler veya diğer erişim yollarıyla erişilebilen diğer internet sitelerinde bulunan tüm Materyaller ve web kaynaklarıyla birlikte Şirket tarafından resmi ve yasal olarak kabul edilmiş böyle siteler üzerinden sunulan hizmetlerin tamamı anlamına gelmektedir. \n \n\"Lisans\" Şirketin Oyunun kişisel ve ticari olmayan kullanımı için Kullanıcıya verdiği basit münhasır olmayan ve iptal edilebilir bir lisans anlamına gelmektedir.\n \n\"Kullanıcı Adı ve Şifre\" Kullanıcı tarafından oyuna kaydolurken belirlenen kullanıcı adı ve şifre anlamına gelmektedir.\n \n\"Materyaller\" Kullanıcı veya Şirket/Yönetim tarafından Oyuna yerleştirilen metin, çizim, resim, ses, program, komut, ad, konu, öykü, diyalog, ifade, konsept, illüstrasyon, animasyon, müzik eserleri ve efektleri, dokümanlar, oyun sohbetleri şeklinde veya herhangi bir diğer şekilde ve bunlardan türetilen materyaller dahil farklı nesneler anlamına gelmektedir.  \n \n\"Reşit Olmayan/lar\" 18 yaşından küçük veya başka türlü ülkelerinin kanunları çerçevesinde belirtilen rüşt yaşına henüz ulaşmamış olan Oyuna kaydolmuş ve adına bir Hesap açılmış olan kişiler anlamına gelmektedir. \n \n\"Çevrimiçi Hizmetler\" birlikte Hesap, Oyun ve İnternet Sitesi anlamına gelmektedir.\n \n\"Ücretli Hizmet\" Şirket tarafından sağlanan ölçüde ve koşullarda basit münhasır olmayan ve iptal edilebilir lisans üzerinden herhangi bir Oyun içi ve/veya İnternet Sitesi ek hizmetler ve imkanlar için kullanılan herhangi bir Kristal satın alma işlemi anlamına gelmektedir. \n \n\"Taraflar\" birlikte Şirket ve Kullanıcı anlamına gelmektedir.\n \n\"Ödeme Aracısı\" Şirket tarafından Şirket menfaatine Kullanıcılardan çeşitli ödeme yöntemleri üzerinden ödemeleri almak ve işlemek üzere yetkilendirilen üçüncü taraflar anlamına gelmektedir. \n \n\"Ödeme\" Ücretli Hizmetlerden faydalanabilmek için Kullanıcı tarafından Ödeme Aracılarına ödenen ve miktarı ve şekli Kristal Satın Alma Kılavuzuyla belirlenen ve düzenlenen lisans ücreti anlamına gelmektedir.\n \n\"Kişisel Veriler\" ve/veya \"Kişisel Bilgiler\" Tanımlanan veya Tanımlanabilir Gerçek Kişiyle ilgili herhangi bir bilgi anlamına gelmektedir.\n \n\"Kullanıcı\" / \"Siz / Sizin\" Oyun kayıt prosedüründen önce ve kayıt prosedüründen sonra Şirketin partnerlerinin siteleri vasıtasıyla erişim dahil Internet Sitesine erişimde bulunan ve Oyunu ve/veya deneme sürümlerini oynayan ve/veya Çevrimiçi Hizmetleri, oyun hizmetlerini, Materyalleri, diğer hizmetleri kullanan kişi anlamına gelmektedir.\n \n\"Gizlilik ve Çerez Politikası\" Kullanıcıların gizliliğini ve çerezlerin saklanmasını kapsayan doküman anlamına gelmektedir.\n \n\"Sunucu\" sanal interaktif Kullanıcı etkileşimi için Şirketin donanım-yazılım desteği anlamına gelmektedir.\n \n\"Hizmet\" Kullanıcıya SKLS ile sağlanan şartlarda ve ölçüde basit münhasır olmayan ve iptal edilebilir bir lisans ile ücretsiz ve bir ücret karşılığında Oyunu kullanma hakkının verilmesi anlamına gelmektedir.\n \n\"Yazılım\" Kullanıcının İnternet Sitesi üzerinden ulaşılabileceği veya başka türlü kullanabileceği ve Kullanıcının oyuna katılmasını sağlayan indirilmesi gerekebilen tüm programlar ve veritabanlarıyla birlikte herhangi bir diğer türetilmiş içerik dahil Şirket tarafından lisanslanan yazılım anlamına gelmektedir.  \n \n\"Oyunun Kullanımı\" Ücretli veya ücretsiz olarak Kullanıcılar tarafından Oyunun başlatılması ve/veya Oyunun teknik olanaklarının kullanılması yanı sıra Oyunun çalıştırılması için gerekli olan Oyunun kurulması ve/veya herhangi bir diğer işlemi kapsayacak Oyunun kullanımıyla ilgili tüm onaylı ve olası türler anlamına gelmektedir.  \n \n\"Kullanıcı adı\" Hesap kaydı üzerine Kullanıcı tarafından seçilen takma ad anlamına gelmektedir.\n \nOyunda kullanılan diğer ifadeler, tanımlar ve kelime kombinasyonları, Yetkili Kanunlara uygun bir şekilde, İnternet teknolojileri, dijital oyun alanında geçerli uygulamaların bu ifadeler, tanımlar ve kelime kombinasyonlarına verdiği anlam ve yorumlara sahip olacaktır.\n \nGenel Koşullar\n \nİşbu SKLS'nin kabul edilmesi:\n \n1. Oyunu ve/veya Çevrimiçi Hizmetleri herhangi bir şekilde kullanarak ve/veya kayıt formundaki \"Kabul Ediyorum\" ifadesini tıklayarak, Kullanıcı aşağıda belirtildiği şekilde işbu SKLS'yi okuduğunu, anladığını ve kayıtsız şartsız kabul ettiğini teyit etmektedir ve Kullanıcı işbu Sözleşmeyle Yetkili Kanunlar ve geçerli herhangi bir diğer kanuna göre Oyunu kullanma yetkisine sahip bir Kişi olduğunu taahhüt etmektedir. \n2. Kullanıcının işbu SKLS'yi kabul etmemesi halinde, Oyunu ve İnternet Sitesini kullanma hakkına sahip değildir ve İnternet Sitesinden derhal ayrılmalı ve Oyunu kullanmaktan imtina etmelidir.\n3. İşbu Sözleşmeyi kabul ederek, Kullanıcı gerçek kişi olduğunu ve Sözleşmeyi akdetmek ve Oyunu kullanmak için tüm yetkilere sahip olduğunu, Oyunu ve oyun hizmetlerinin kullanımına ilişkin kendisini ilgilendiren herhangi bir yasal kısıtlamanın bulunmadığını ve kanunların gerekli kıldığı şekilde tüm gerekli izinleri aldığını onaylar ve taahhüt eder.\n4. Oyunu ve/veya Çevrimiçi Hizmetleri herhangi bir şekilde kullanarak ve/veya kayıt formundaki \"Kabul Ediyorum\" ifadesini tıklayarak, Kullanıcı Şirket/Yönetim ve/veya Şirketin ortakları tarafından telekomünikasyon ağları, telefon, faks, cep telefonu, radyo iletişimi ve diğer araçlar dahil bunlarla sınırlı olmaksızın herhangi bir araç üzerinden dağıtılan elektronik mesajlar (e-postalar), kısa mesajlaşma servisleri (haberler ve/veya Oyundaki güncellemeler, Şirket veya Şirket partnerlerinin reklam ve tanıtım materyalleri hakkında mesajlar) (bundan sonra \"Elektronik Posta\" olarak anılacaktır) almayı istediğini ve kabul ettiğini onaylamaktadır.    Kullanıcının e-posta adresi ve/veya telefon numarasını sağlaması, Kullanıcının herhangi bir araçla elektronik posta almaya ve Kullanıcının Kişisel Verilerini Şirketin partnerlerine aktarmaya yönelik rızasını verdiğinin ek bir onayıdır.\nKullanıcının elektronik posta almaya rızasını verdiği andan itibaren, Yönetim/Şirket ve/veya Şirket partnerleri, Kullanıcıya herhangi bir niteliğe sahip mesajları gönderme hakkına sahiptir (e-postalar ve kısa mesajlaşma servisleri dahil bunlarla sınırlı olmaksızın). \n5. Kullanıcının Şirketin partnerlerinden elektronik posta almayı istememesi halinde, elektronik mesajın alt kısmında belirtilen linki takip etmek suretiyle herhangi bir elektronik posta almayı reddedebilir. Kullanıcının Şirket/Yönetimden elektronik posta almayı istememesi halinde, Kullanıcı Oyundaki ilgili kişisel ayarları değiştirmek ve bu şekilde haberleri almayı reddetmek suretiyle herhangi bir zamanda elektronik postaları almayı reddedebilir.\n6. Oyun, İnternet Sitesi, Materyaller ve Oyunda yer alan herhangi bir diğer bilgi, yalnızca işbu SKLS'ye göre kullanılacaktır ve işbu SKLS ile birlikte işbu SKLS'nin ayrılmaz bir parçasını teşkil ede dokümanlar Oyunun kullanılmasına ilişkin Kullanıcı ile Şirket arasındaki tüm Sözleşmeyi tesis etmektedir.\n7. İşbu SKLS ile birlikte işbu SKLS'nin ayrılmaz bir parçasını oluşturan dokümanlar, Oyun ve/veya Çevrimiçi Hizmetlerin kullanılmaya başlandığı ve/veya Kayıt formundaki \"Kabul Ediyorum\" ifadesi tıklandığı andan itibaren derhal yürürlüğe girecektir. İşbu SKLS ve işbu SKLS'nin ayrılmaz bir parçasını oluşturan dokümanlar, Oyunun, İnternet Sitesinin, Yazılımın ve/veya Şirket hizmetlerinin kullanımıyla ilgili herhangi bir sorun/ihtilaf durumunda resmi başvuru kaynağı olacaktır.\n8. Şirket, Oyunun hatasız veya kesintisiz çalışabileceğini garanti etmemektedir ne de Oyunun Kullanıcının beklentilerini karşılayacağını garanti etmemektedir ve ne de işbu SKLS'te belirtilmeyen (belirlenmeyen) herhangi bir sair garantiyi vermemektedir. Kullanıcı, Oyunun kullanımını imkansız kılan herhangi bir doğrudan veya dolaylı zararlardan sorumlu tutulmayacağını kabul etmektedir.\n \nİşbu SKLS'deki Değişiklikler\n \n1. Şirket, uygun gördüğü herhangi bir zamanda ve İnternet Sitesindeki bu SKLS'yi güncelleyerek veya kendi takdirinde başka türlü tercih edeceği sair bildirim yoluyla bildirmek suretiyle işbu SKLS ile birlikte işbu SKLS'nin ayrılmaz bir parçasını oluşturan dokümanları askıya alma, ekleme, sonlandırma, değiştirme ve tadil etme hakkını saklı tutmaktadır. Herhangi bir değişiklik, ilgili değişikliklerin yapılmasına müteakip on (10) gün içinde yürürlüğe girecektir. Oyun ve/veya İnternet Sitesiyle birlikte herhangi bir diğer Çevrimiçi Hizmetin kullanılmaya devam edilmesi, işbu SKLS ve/veya işbu SKLS'nin ayrılmaz bir parçasını oluşturan dokümanların değiştirilmiş halinin kayıtsız şartsız kabulü anlamına gelecektir.\n2. İşbu SKLS ve/veya işbu SKLS'nin ayrılmaz bir parçasını oluşturan dokümanlarda yapılan herhangi bir değişiklik veya ekleme geçmişe dönük olarak uygulanabilir ve Taraflar arasındaki önceki ilişkiyi kapsayabilir.\n3. Şirket, işbu SKLS'nin değiştirilmiş hali hakkında bilgi sahibi olması amacıyla Kullanıcının işbu SKLS'yi çeşitli zamanlarda incelemesini şiddetle tavsiye eder. Kullanıcının işbu SKLS'nin herhangi bir kısmın kabul etmemesi halinde, Oyunu ve/veya İnternet Sitesini kullanmaya derhal son vermelidir ve Şirketin Kullanıcının Oyun ve/veya İnternet Sitesi ve herhangi bir Çevrimiçi Hizmeti kullanmasının imkansız kılınmasını da kapsayabilecek gerekli tedbirleri alabilmesi için Kullanıcı ilgili uyuşmazlığını Şirkete bildirmekle yükümlüdür.\n4. Şirket, Kullanıcının Oyunu ve/veya İnternet Sitesini işbu SKLS'nin güncellenmiş haline göre kullanıp kullanmadığını doğrulamakla yükümlü değildir. İnternet Sitesinde yayınlanan sürümü Kullanıcının bir referans olarak kullanması gerektiği geçerli sürümdür.  İşbu SKLS yanı sıra Kullanıcıyı etkileyen ve/veya etkileyebilecek değişiklikler hakkında bilgi sahibi olması Kullanıcının kendi sorumluluğundadır. \n \nLisansın Verilmesi\n \n1. İşbu Sözleşmenin koşullarına tabi olarak Şirket Kullanıcının kişisel ve ticari olmayan kullanımı için Oyunun kullanılmasına ilişkin sınırlı, basit, münhasır olmayan ve iptal edilebilir bir lisansı Kullanıcıya vermektedir.\n2. Şirket, Oyunu bağımsız olarak kullanma ve diğer kişilere kullanım lisansı verme hakkına sahiptir.\n3. Kullanıcı, Oyunun sadece ve sadece Kullanıcıya lisanslandığını ve Kullanıcının bu lisansı herhangi bir üçüncü tarafa devir ve/veya temlik etmeyeceğini kabul etmektedir.\n4. İşbu Lisansın süresi Kullanıcının Oyunu kullanmaya başladığı anda başlar ve Kullanıcının Oyunu kullanmayı sonlandırdığı veya başka türlü işbu SKLS Şirket tarafından feshedildiği anda sona erer. İşbu şartladır ki işbu Lisans Kullanıcının işbu SKLS veya SKLS'nin bir parçasını teşkil eden herhangi bir dokümanı ihlal etmesi halinde derhal feshedilecektir.\n5. Lisans, Şirketin Oyuna ilişkin münhasır hakkının geçerlilik süresi kadar geçerli olacaktır.\n6. Lisans tüm ülkelerde geçerli olacaktır.\n7. Oyuna ilişkin münhasır hakkın yeni bir sahibe devredilmesi işbu SKLS'nin değiştirilmesi veya iptalini gerekli kılan bir sebep değildir.\n \nFikri Mülkiyet Hakları\n \n1. Şirket (veya icabında bağlı şirketleri) Oyun, Materyaller ile birlikte ilgili telif hakları, patent hakları, know-how, ticari marka ve diğer müseccel ve fikri mülkiyet hakları kapsamında Oyunda mevcut veya ilişkili olan tüm sair mülklerin ve Oyun ve Çevrimiçi Hizmetlerde genel olarak bulunan herhangi bir diğer materyalin tek ve münhasır sahibidir.  \n2. Kullanıcı, Materyalleri Yönetime gönderme, Oyuna, Siteye ve diğer oyun hizmetlerine Materyalleri yerleştirme hakkına ancak Kullanıcının böyle Materyallerde gerekli tüm haklara sahip olması ve yerleştirilen herhangi bir Materyalle ilgili olarak tek başına sorumlu olması ve Kullanıcının böyle Materyallerle ilgili olarak doğabilecek herhangi bir zarardan tek başına sorumlu tutulacağını kabul etmesi şartıyla sahiptir. Kullanıcı, böyle Materyallerle ilgili tüm gerekli haklara sahip olduğunu ve böyle Materyallerin yerleştirilmesi ve kullanılmasından tamamen sorumlu olduğunu onaylamaktadır.\n3. Kullanıcılar veya üçüncü taraflarca Oyuna Materyal, site linklerinin yerleştirilmesi, Şirketin böyle bir yerleştirmeyi onayladığı veya tavsiye ettiği anlamına gelmemektedir. Şirket, bu Materyaller ve sitelerin içeriğiyle ilgili ne de bu Materyaller veya sitelerin kullanımından kaynaklanan herhangi bir doğrudan veya dolaylı zararlardan herhangi bir sorumluluk üstlenmemektedir.\n4. Kullanıcı, Oyuna yerleştirdiği veya Yönetime gönderdiği (bir yarışmaya katılmak amacıyla olanlar dahil) Materyallerin Şirket tarafından uygun gördüğü şekilde kullanılabileceğini ve bu Materyallerin Kullanıcı tarafından Oyuna yerleştirildiği (yayınlandığı) veya gönderildiği andan itibaren Şirketin dünyanın herhangi bir ülkesinde herhangi bir yolla bu Materyalleri kullanmak için tüm fikri mülkiyet haklarını alacağını ve Kullanıcının adını belirtmeden ve herhangi bir rödevans veya sair ücretler ödemeden materyalleri yerleştirme, değiştirme, uyarlama, üçüncü taraflara aktarma, türev Materyaller oluşturma, Materyalleri yeniden geliştirme, dağıtma, silme, çoğaltma, halka gösterme, kamuoyuna sunma ve değişiklikler, çıkarmalar, eklemeler, yorumlar, açıklamalar yapma, Materyalleri yayınlama, kullanma ve sair haklara sahip olacağını kabul etmektedir.\nKullanıcı Oyuna veya Siteye yerleştirdiği Materyallere ilişkin münhasır hakların Şirkete devri için yasal dayanakları sağlamayı taahhüt etmektedir.\n5. Şirketin ön yazılı onayı olmaksızın, Şirketin açık bir şekilde Materyallerin diğer kişiler tarafından kullanılmasına onay verdiği haller hariç olmak üzere, Oyuna, Siteye veya diğer oyun hizmetlerine yerleştirilen fikri mülkiyet konusu eserlerin kısmen veya tamamen kullanılması yasaktır. \n6. Kullanıcı, Şirket tarafından belirlenen haller hariç olmak üzere, Oyun veya Oyun Materyallerine dayanarak herhangi bir eser yaratmayacağını kabul etmektedir. Kullanıcının Şirketin yazılı izni olmadan Oyun veya Materyallere dayanarak eserler yaratması halinde, türev eserlerde eser sahipliği haklarına ve telif haklarına sahip olamaz ve bunları kullanamaz. \n7. Kullanıcı, Oyun oynarken geçirdiği saatlerin sayısında bir menfaate sahip olmadığını ve Oyun oynarken geliştirilen tüm faaliyetler Şirketin tek ve münhasır mülkü olacağını kabul etmektedir.\n8. Yönetim, Kullanıcının İnternet Sitesi ve/veya Oyundaki faaliyetlerine ilişkin herhangi bir bilgiyi herhangi bir listede Kullanıcıya herhangi bir bildirim veya her nam altında olursa olsun ücret ödemeden gösterme ve yayınlama hakkına sahiptir.\n9. Şirket, Oyunda yer alan tüm Materyallerde tüm müseccel ve fikri mülkiyet haklarına sahiptir ve Kullanıcı Oyunda kullanılan sanal ürünler veya para birimi dahil bunlarla sınırlı olmaksızın Oyundaki Materyallerde veya Oyundaki diğer içeriklerde herhangi bir hakka sahip olmadığını kabul etmektedir.  Şirket, Yazılı olarak Şirket tarafından açık bir şekilde izin verilenler hariç olmak üzere sanal ürünlerin Oyun dışına kasıtlı bir şekilde aktarılmasına ve Oyunda kullanılan herhangi bir Materyal ve nesnenin Oyun dışında kasıtlı satışı, hibe edilmesi veya takas edilmesine izin vermemektedir. Yönetim, Şirketin korunmuş menfaatlerine zarar verebileceği haller hariç olmak üzere, diğer Kullanıcıların Materyallerini sadece ticari olmayan kullanım amacıyla görüntüleme, çoğaltma (kopyalama dahil), işleme (kopyaların yazıcı çıktılarının alınması) yoluyla kullanma hakları ve diğer hakları münhasır olmayan ve devredilmez bir esasta Kullanıcıya sağlamaktadır. \n  \nKullanıcının hakları ve yükümlülükleri\n \nKullanıcı aşağıdaki hususları kabul etmektedir:\n \n1. Kullanıcı, işbu SKLS'nin koşullarına, Oyun Kuralları, işbu SKLS'nin diğer eklerinin kuralları, işbu SKLS'nin ayrılmaz bir parçasını teşkil eden herhangi bir diğer dokümanı ve geçerli kanunların hükümlerine uymakla yükümlüdür.\n2. Kullanıcı, Şirketin ön yazılı onayını almadan Oyunu uyarlayamaz, türev eserler üretemez, gösteremez, dağıtamaz, kiralayamaz, ödünç veremez, değiştiremez, alt lisans veremez, kiralık alamaz, tercüme edemez ve/veya devredemez.\n3. Kullanıcı, Şirketin yazılı onayını almadan, Oyunu geri derleyemez, parçalarına ayıramaz, bunları kullanarak türev eserler hazırlayamaz, kaynak koda ulaşamaz, ters mühendisliğe tabi tutamaz ve/veya ters mühendislik girişiminde bulunamaz, Oyunun nesne kodu veya kaynak konuyla diğer işlemleri yapamaz, herhangi bir koruma sistemini ihlal edemez, Oyunu yasadışı bir şekilde kullanamaz ve Oyunda kullanılan algoritmaların gerçekleştirilmesine ilişkin bilgi edinemez, Oyunu kullanarak türev yazılım ürünleri geliştiremez.\n4. Kullanıcı, şifrelenmiş olsun olmasın, Oyuna iletilen veya Oyundan iletilen herhangi bir paket akışından kodları elde etmeyecek veya böyle bir girişimde bulunmayacaktır.\n5. Kullanıcı Hesap verilerini herhangi bir üçüncü tarafa ifşa etmeyecektir ve/veya aktarmayacaktır.\n6. Kullanıcı, yeterli bir internet bağlantısına sahip olacak ve bu internet bağlantısının maliyeti kendisine ait olacaktır.\n7. Kullanıcı, Sözleşmenin ve işbu Sözleşmenin ayrılmaz bir parçasını teşkil eden diğer dokümanların şartlarını düzenli olarak kontrol etmek ve incelemekle yükümlüdür. \n8. Kullanıcı, işbu SKLS ve/veya işbu SKLS'nin bir parçasını teşkili herhangi bir diğer dokümanı ihlal etmesi halinde Oyunu kullanmaya son verecektir.\n9. Kullanıcı, Oyuncu herhangi bir kişisel ve ticari olmayan amaçlar için kullanma, \nOyunun hizmetleri ve imkanlarını kullanma, Oyun tarafından sağlanan tüm işlemleri gerçekleştirme, mesaj göndererek İnternet Sitesindeki iletişime katılma, Oyunla ilgili şikayetler ve geliştirme önerilerini Şirkete gönderme, Oyun tarafından sağlanan ve/veya Şirket tarafından onaylanan herhangi bir diğer işlemi gerçekleştirme hakkına sahiptir.\n10. Kullanıcı, Oyunda kazanılan Kristaller (oyun içi para birimi) vasıtasıyla Oyunda geliştirmeler ve sanal ürünler için sınırlı, münhasır olmayan ve iptal edilebilir bir lisans edinebilir. \n \nŞirketin Hakları ve Yükümlülükleri\n \n1. Şirket, işbu SKLS ve/veya işbu SKLS'nin bir parçasını teşkil eden dokümanların şartlarını ihlal eden Kullanıcılara karşı, Oyuna erişimin kısıtlanması ve yasaklanması dahil herhangi bir gerekli işlemi yapma hakkına sahiptir. Böyle işlemler, Şirketin yegane takdirinde yapılacaktır.\n2. Şirket, herhangi bir ön uyarı veya bildirimde bulunmaksınız Oyun ve/veya Çevrimiçi Hizmetlerin bir parçasını oluşturan herhangi bir bilgiyi, içeriği ve Materyalleri kaldırma ve/veya değiştirme hakkına sahiptir.\n3. Şirket, Kullanıcıya önceden veya sonradan bildirimde bulunmaksızın Şirket için uygun olan herhangi bir zamanda Oyun ve/veya oyun hizmetleri durdurma ve/veya işlevselliğini kısıtlama hakkına sahiptir.\n4. Şirket, herhangi bir zamanda ve herhangi bir ölçüde ve hacimde Hizmetlerin kalitesi ve miktarında tek taraflı değişiklik yapma hakkına sahiptir ve Hizmetlerin sağlanmasını durdurmak için herhangi bir yeterli dayanağın mevcut olması halinde, Şirket Kullanıcıya önceden ve/veya sonradan bildirimde bulunmaksızın böyle bir Hizmeti durdurma hakkına sahiptir.\n5. Şirket, işbu Sözleşmeyi tek taraflı olarak feshetme ve kendi takdirinde ve Kullanıcıya önceden haber vermeksizin ve herhangi bir ödemeyi iade etmeksizin Kullanıcıya Oyunu sunmaktan vazgeçme hakkına sahiptir.\n6. Şirket, Oyunu, oyun hizmetlerini veya Oyun hakkında bilgileri kullanma veya kullanamamanın bir sonucu olarak ve Oyunun diğer Kullanıcıları dahil üçüncü tarafların işlemleriyle ilgili olarak oluşan herhangi bir doğrudan veya dolaylı zarardan sorumlu değildir.\n7. Şirket, Kullanıcının işbu Sözleşmeyi kabul etmesine tabi olarak Kullanıcıya Oyuna erişimi sağlamaktadır. \n \nVerilerin Toplanılması ve Kullanılması \n \n1. Şirket, Kullanıcıya ilişkin Kişisel Verileri toplama, IP adreslerine ilişkin bilgileri takip etme ve saklama ve Kullanıcının Cihazında bulunan teknik bilgi dosyalarını (çerezler) kullanma hakkına sahiptir. Kullanıcıların Kişisel Verilerinin toplanması, kullanılması, işlenmesi, saklanması, açıklanması (aktarılması) ve silinmesine ilişkin koşullar, prosedürler ve amaçlar ve Kullanıcının cihazında çerezlerin yerleştirilmesi, kullanılması, saklanması ve silinmesine ilişkin dayanaklar, amaçlar ve prosedürler işbu SKLS'nin ayrılmaz bir parçasını teşkil eden Gizlilik ve Çerez politikasıyla düzenlenmektedir.\n2. İşbu SKLS'yi kabul ederek Kullanıcı Gizlilik ve Çerez Politikasını ve tüm koşullarını kayıtsız şartsız kabul etmektedir. Şirket tarafından Kullanıcının Kişisel Verilerinin herhangi bir şekilde toplanması, saklanması, aktarılması ve kullanılması,  işbu SKLS'nin ayrılmaz bir parçasını teşkil eden Gizlilik ve Çerez politikasına uyuma tabidir.\n \nGarantiler\n \n1. Oyun ve bununla ilişkili olarak sağlanan tüm diğer Materyaller herhangi bir hata dahil 'olduğu gibi' esasında ve herhangi bir garanti verilmeden sağlanmaktadır. Kullanıcı, Oyuna erişim ve/veya Oyunun oynanması yanı sıra Çevrimiçi Hizmetlerin kullanılmasıyla ilişkili tüm riskleri üstlenmektedir.\n2. Şirket tarafından Oyun ve Çevrimiçi Hizmetlerin her zaman erişilebilir kılmak için tüm çabalar gösterilirken, Şirket Oyun ve Çevrimiçi Hizmetlerin her zaman erişilebilir olacağını ve Kullanıcının herhangi bir hatayla karşılaşmayacağını garanti etmemektedir.\n \nİnternet Sitesinin Suistimali\n \n1. İnternet Sitesi yalnızca yasalara uygun amaçlarla kullanılabilir. İnternet Sitesinin herhangi bir geçerli kanun veya yönetmeliği veya herhangi bir üçüncü taraf haklarını ihlal eden bir şekilde İnternet Sitesinde veya üzerinden aktarılması, dağıtılması, yayınlanması veya saklanması için kullanılması kesinlikle yasaktır. Bu, İnternet Sitesinin, telif hakları, ticari sır veya sair fikri mülkiyet haklarını ihlal eden, müstehcen olan veya Reşit Olmayanlara zararlı olan veya yasadışı bir edim veya tacizi tesis eden, hareket eden veya küçük düşüren, herhangi bir gizlilik ve veri koruma kanununu ihlal eden, dolandırıcı veya yolsuz olan veya herhangi bir kambiyo denetim veya kumar kanununu ihlal eden bir konuda veya amaçla İnternet Sitesinde veya üzerinden herhangi bir materyalin aktarılması, dağıtılması, yayınlanması, iletilmesi veya depolanması amacıyla kullanılmasını (bunlarla sınırlı olmaksızın) kapsamaktadır.\n2. İnternet Sitesinin istismar edilmesi halinde, Yönetim Kullanıcının Hesabını engelleme, Kullanıcının gelecekte Oyun ve İnternet Sitesini kullanmasını ve/veya erişimini engelleme ve/veya Şirketin uygun göreceği herhangi bir diğer yasal işlemi başlatma hakkına sahiptir.\n \nSohbet Kuralları\n \n1. Tanki Online tarafından sunulan forum, sohbet odası ve/veya topluluk hizmetleri eğlenceli ve zevkli bir deneyim sunmayı amaçlamaktadır. Bu nedenle herhangi bir küfürlü/kaba ve müstehcen bir dile müsamaha gösterilmemektedir ve saldırgan ve/veya müstehcen bir dil kullanma konusunda ısrar eden Kullanıcıların sohbet ayrıcalıkları geri alınacak ve herhangi bir Hesabı iptal edilecektir.\n2. Kullanıcı, İnternet Sitesinde herhangi bir kişisel veriyi gönderirken veya yüklerken, böyle bir içeriğin halka açık geleceği ve diğer Kullanıcılar tarafından erişilebileceğini bilmektedir. Tanki Online, herhangi bir şekilde böyle bir içeriği onaylamamaktadır ve böyle bilgilerin halka ilan edilmesinden doğan herhangi bir zarardan sorumlu değildir. Kullanıcılar, İnternet Sitesinde yayınladıkları bilgilerin ayrıca çevrimdışı yaşamlarını etkileyebileceğini bilmelidir.\n3. Şirket sunucularında saklanan içeriğin kalıcı veya geçici arşiv oluşturma amacını taşımamaktadır. Bu nedenle, Tanki Online, İnternet Sitesinde yayınlanan herhangi bir materyalin yedek kopyalarını tutmakla yükümlü değildir ancak böyle kopyaları tutabilir  Şirket, her bir Kullanıcı için maksimum depolama kapasitesinde bir limit uygulama hakkını saklı tutar.\n4. Şirket, kendi takdirinde saldırgan davranış teşkil ettiğini veya herhangi bir kanun ve/veya yönetmelik ve/veya Oyun Kurallarını ihlal ettiğini varsaydığı içeriği silme, taşıma veya düzenleme hakkını saklı tutar.  Kullanıcı, İnternet Sitesinde yayınlanan içerikten tek başına sorumludur ve sorumlu kalacaktır. Yönetimin belirli bir materyali kaldırmaması hiçbir şekilde bunun Şirket tarafından onaylandığı veya kabul edildiği şekilde yorumlanmayacaktır.\n \nKullanıcı Hesapları\n \nBir Kullanıcı Hesabının Açılması\n \n1. Bir Kullanıcı Hesabı, Kullanıcı tarafından şahsen açılarak kaydedilmelidir ve Yönetim İnternet Sitesinde bir Kullanıcı Hesabının açılmasını herhangi bir nedenle ve herhangi bir ön açıklama yapmadan reddetme hakkını saklı tutar. \n2. Oyundaki kayıtlarının, özellikle de e-posta adresinin, güncel tutulması Kullanıcının sorumluluğundadır. Kullanıcının kişisel verilerindeki herhangi bir değişikliğin derhal Yönetime bildirilmesi Kullanıcının sorumluluğundadır.\n3.Tanki Online diğer Kullanıcılarla ve/veya üçüncü taraflarla Hesap alışverişi, alımı, satımı, devrini, aktarılmasını kati surette yasaklamaktadır. Kullanıcının fonları/Kristalleri farklı Kullanıcı Hesap(ları) arasında aktarması yasaktır.\n4.Yönetim, kendisine sağlanan bilgilerin yalan, yanlış, hatalı, aldatıcı veya eksik olduğunu tespit etmesi halinde Kullanıcı Hesabını kaydetmeme ve/veya yapılan bir kaydı iptal etme hakkını saklı tutar.\n \nKullanıcı Adı\n \n1. Bir Hesabın açılarak kaydedilmesi üzerine, Kullanıcıya bir Kullanıcı Adı seçme hakkı verilecektir. Yönetim, herhangi bir Kullanıcı adını gerekli gördüğü herhangi bir sebeple, böyle adların verilmesi veya doğrulanması öncesinde, sırasında ve sonrasında reddetme ve/veya geriye çekme hakkını saklı tutar.\n2. Seçilen Kullanıcının adından ayrı olarak, Kullanıcı Hesabının işbu SKLS'ye göre uygunsuz olması halinde Yönetim Kullanıcıya başka bir takma adı ve/veya yeni ekran ve/veya Kullanıcı Adı oluşturma fırsatı verecektir.\n \nŞifre Güvenliği\n \n1. Şirket, herhangi bir üçüncü kişi tarafından Hesaba erişilmesinden dolayı hiçbir şekilde sorumlu değildir ve Kullanıcının Kullanıcı Adı ve Şifresinin bir üçüncü kişi tarafından izinsiz kullanımı, izinsiz erişim ve/veya bir Kullanıcının Kullanıcı Adı ve Şifresinin doğru bir şekilde kaydedildiği herhangi bir işlemden kaynaklanan herhangi bir zarardan sorumlu tutulamaz.\n2. Şirket, Şirketin herhangi bir hatasından kaynaklanan kayıplar hariç olmak üzere bir Kullanıcının bir şifreyi unutması, yanlış kişiye ifşa etmesi veya kaybetmesinden dolayı herhangi bir şekilde sorumlu değildir ve Şirket, Kullanıcıyla ilişkisi sırasında herhangi bir zamanda herhangi bir Kullanıcı Adı ve Şifreyi saklamaktan sorumlu değildir.\n \nHesapların Engellenmesi\n \n1. Kullanıcı, help@tankionline.com adresine e-posta göndermek suretiyle Yönetimden Kullanıcının Hesabının engellenmesini talep edebilir.\n2. Arka arkaya Altı (6) ay boyunca Oyuna girilmemesi Yönetime Kullanıcıya göndereceği (göndermeye çalışacağı) bildirim ile derhal Kullanıcı Hesabını engelleme ve işbu Sözleşmeyi feshetme hakkı verir.  \n3. Yönetim, kendi takdirinde herhangi bir zamanda ve ayrıca Kullanıcının işbu SKLS, Oyun Kuralları, işbu SKLS'nin ayrılmaz bir parçasını teşkil eden diğer dokümanlarının şartlarını ihlal etmesi halinde Kullanıcı Hesabını engelleme hakkına sahiptir.\n \nDolandırıcılık ve Hesapların Suistimali\n \n1. Şirket, uygunsuz oyun ve dolandırıcılığa karşı sıfır tolerans politikasına sahiptir ve tüm Kullanıcıların danışıklı oyun oynamasını yasaklamaktadır. Yönetimin takdirine göre Kullanıcının hile yaptığı veya Yönetimi veya Oyunun herhangi bir diğer Kullanıcısını, oyun manipülasyonu veya ödeme dolandırıcılığı dahil bunlarla sınırlı olmaksızın herhangi bir yolla dolandırmaya çalıştığını tespit etmesi halinde veya Yönetimin, çalıntı kredi kartları veya herhangi bir diğer dolandırıcılık (ters ibraz, veya ödemenin sair tersine çevrilmesi dahil) yöntemi veya yasak bir işlem (kara para aklama dahil) dahil Kullanıcının dolandırıcılık yaptığından şüphelenmesi halinde, Yönetim Kullanıcının Hesabını engelleme ve bu bilgileri (Kullanıcının kimlik bilgileri dahil) Yönetimin gerekli ve uygun görmesi halinde herhangi bir diğer üçüncü taraf ve/veya emniyet müdürlükleriyle paylaşma hakkını saklı tutar.  \n2. İnternet Sitesi ve/veya Oyun ve/veya Yazılımın kötü amaçlarla kullanılması ve/veya suistimali durumunda, Yönetim söz konusu Kullanıcının Hesabını Yönetim ile bu Kullanıcı arasındaki husus çözümleninceye kadar engelleme ve Şirketin uygun görebileceği herhangi bir diğer yasal yolar başvurma hakkını saklı tutar. \n \nÜcretli Hizmet\n \n1. Kullanıcılar Kristal satın almak suretiyle Oyunda Ücretli Hizmetlerden faydalanabilir. Kristalleri satın alması yalnızca yetkili üçüncü taraflardan yapılabilir.\n2. Tanki Online, sanal ürün/Kristallerin Oyun dışına herhangi bir transferine izin vermektedir. Oyun içinde kullanılan herhangi bir Materyal, Kristal ve/veya nesnenin Oyun dışına satışı, hibe edilmesi veya takası yasaktır. \n3. Ücretli Hizmetler, Kristallerin Kullanıcı Hesabına aktarıldığı anda sağlanmış sayılacaktır. Kullanıcı, Kristallerin Kullanıcı Hesabına aktarıldığı andan itibaren Ücretli Hizmetten vazgeçme hakkını kaybettiğini bilmektedir.\n \nKristallerin Satın Alınması\n \nFiyatlama\n \n1. Herhangi bir Ücretli Hizmetlerin listesi ve fiyatlandırılması Şirketin yegane takdirinde olup herhangi bir zamanda değiştirilebilir.\n2. Tanki Online, Kullanıcıların ödemelerinin oluşabilecek herhangi bir gecikme veya alınmaması dahil alınması ve/veya işlenmesinden yükümlü değildir.  Kullanıcı tarafından yapılan tüm ödemeler, gönüllü, kesin olup iade edilemez.\n \nÖdeme Yöntemleri\n \n1. Kristaller yalnızca Ödeme Aracılarından aşağıdaki yöntemlerden birisi ve/veya İnternet Sitesinin sağladığı herhangi bir diğer yöntem kullanılarak satın alınabilir. \na. Kredi Kartları;\nb. Banka Mevduat Kartları;\nc. PayPal;\nd. SMS;\ne. Mobil ödemeler ve\nf. Diğerleri\n2. Kullanıcı, Hesapta kullanılan paraların herhangi bir yasadışı kaynaktan gelmediğini onaylar. Kullanıcı, hiçbir şekilde İnternet Sitesi veya Yazılımı yasadışı kaynaklardan bu paraların transfer edilmesi amacıyla kullanmayacağını beyan etmektedir.  Kullanıcı üzerinde yetkiye sahip tüm kanunlara uygun bir şekilde İnternet Sitesi ve/veya Oyunu herhangi bir yasadışı veya dolandırıcılık amacıyla veya herhangi bir yasadışı veya dolandırıcılık işlemi (kara para aklama dahil) için kullanmayacaktır.   Yönetim, Kullanıcı tarafından kullanılan paraların kaynağının yasallığı konusunda en ufak bir şüpheye sahip olması halinde bile herhangi bir zamanda ve konu çözümleninceye kadar Kullanıcının Hesap veya Hesaplarını askıya alma veya engelleme hakkını saklı tutar.\n \nÖdeme Para Birimi\n \nHesapla ilgili olarak yapılacak tüm ödeme işlemleri muhtelif zamanlarda Ödeme Aracıları tarafından belirtilen para birimlerinde ödenmelidir ve Hesaba yatırılacak tüm ödemeler Kullanıcının kendi adına bir Hesaba sahip olduğu ödeme kaynağından yapılmalıdır.\n \nReşit Olmayanların Güvenliği\n \n1. Şirket, Reşit Olmayanlar Güvenliğinin sağlanması için her türlü önlemin alındığını ve alınacağını taahhüt etmektedir. Şirket, Reşit Olmayanların ebeveynleri ve/veya yasal temsilcilerine İnternette iken çocuklarıyla daha fazla zaman geçirmelerini ve Oyun, İnternet Sitesi, Hesap, herhangi bir iletişim aracının kullanımını ve/veya mevcut hizmetler için herhangi bir ödemeyi kontrol altında tutmalarını tavsiye etmektedir.  \n2. Kullanıcının Reşit Olmayan bir kişi olması halinde, yalnızca ebeveyn veya yasal vasisinin ön muvafakati ile Şirkette bir Hesap açabilir ve kaydedebilir. Bir Reşit Olmayanın İnternet Sitesinde herhangi bir ödeme yönetimini kullanması böyle muvafakatin verildiğini varsaymaktadır.\n3. Kullanıcının Reşit Olmayan bir kişi olması halinde, ebeveynleri veya yasal vasilerinin Şirkette Kullanıcı Hesabı açarken veya kaydederken kayıt sürecini kendisi adına tamamlaması gerekecektir. Böyle durumlarda, Kullanıcının ebeveynleri veya yasal vasilerinin işbu SKLS'den doğan tüm yükümlülükler ile birlikte Kullanıcı Adı ve/veya Hesap kullanılarak gerçekleştirilecek herhangi bir ödeme ve herhangi bir dolaylı kullanım dahil olmak üzere Oyun, İnternet Sitesi ve/veya Hesabın kullanımıyla ilgili olan Reşit Olmayanların herhangi bir diğer faaliyetinden dolayı tam sorumluluğu kabul etmektedir.\n4. Şirket, Şirketin Reşit Olmayan Kişinin Oyunu oynayabilmesi veya İnternet Sitesinde ödeme yapabilmesi için gerekli gördüğü herhangi bir dokümantasyonu veya herhangi bir diğer yazılı onayı Reşit Olmayanın ebeveynleri veya yasal vasilerinden talep etme hakkını saklı tutar. \n5. Reşit Olmayan ve yasal vasileri ve/veya ebeveynleri, Oyunun kullanılması ve/veya Reşit Olmayanın adına bir Hesabın açılması ve kaydedilmesi için gerekli muvafakatin Reşit Olmayanın yasal vasisi ve/veya ebeveynleri tarafından verildiğini taahhüt etmektedir. \n6. Yasal vasi ve/veya ebeveynler, işbu SKLS ve işbu SKLS'nin ayrılmaz bir parçasını teşkil eden dokümanlara onaylarını vermektedir ve Reşit Olmayan tarafından Oyun ve oyun hizmetleri, İnternet Sitesi ve Hesabın kullanımı yanı sıra Hesap üzerinden yapılan herhangi bir ödemeyi kontrol edeceklerini ve bununla ilgili tam yükümlülüğü üstlendiklerini onaylamaktadırlar. Herhangi bir Ödeme Yönteminin kullanılması yasal vasi ve/veya ebeveynlerin böyle bir muvafakati verdiğini onaylamaktadır. Yasal vasi ve/veya ebeveynler ve Kullanıcılar, Şirketin böyle bir izne sahip olmayan herhangi bir Reşit Olmayan tarafından Oyun, İnternet Sitesi ve Hesabın kullanılmasından dolayı herhangi bir sorumluluğa sahip olmadığını peşinen kabul etmektedir. \n7. Oyun hizmetleri, tavsiye niteliği taşıyan yaş kısıtlamaları içerebilir. Yasal vasi ve/veya ebeveynler ve Kullanıcılar bu tavsiyeleri takip edip etmeme konusunda kendi takdirlerini kullanacaktır. Şirket belirlenen yaşa ulaşmamış olan Kullanıcılar tarafından oyunun fiilen kullanılmasından sorumlu değildir.\n8. Gerekliyse, Reşit Olmayanların ebeveynleri veya yasal temsilcileri Reşit Olmayanların erişimini Reşit Olmayanlar için İnterneti daha güvenli bir yer haline getirecek belirli hizmetlere sınırlayan özel programlar kullanabilir. \n \nTarafların Sorumlulukları\n \n1. Şirket, Kullanıcının veya üçüncü tarafın İnternet Sitesini, Oyunu ve/veya Çevrimiçi Hizmetleri kullanmasının bir sonucu olarak doğrudan veya dolaylı olarak uğrayabileceği, Oyunu ve Çevrimiçi Hizmetleri kullanamamadan dolayı uğradığı zararlar, Oyunun diğer kullanıcıları, internet erişiminin bulunmaması, hırsızlık, Materyallerin yok olması, Kullanıcının Hesabıyla ilgili bilgilerin kaybı dahil üçüncü taraf faaliyetlerinden doğan dolaylı veya doğrudan zararlar ve Oyunla ilgili olarak Kullanıcının onuru, şerefi veya iş itibarının zedelenmesi dahil herhangi bir zarar veya kayıptan hiçbir şekilde sorumlu değildir.\n2. Şirketin Yetkili Mahkemeler ve/veya benzeri bir otorite tarafından herhangi bir şekilde sorumlu tutulması halinde, yükümlülük, belirli Kullanıcıdan doğan her türlü ve herhangi bir talep için toplam olarak 100 EUR ile sınırlı olacaktır.\n3. Kullanıcı, Kullanıcı tarafından Oyuna yerleştirilen Materyallerden veya Kullanıcının Çevrimiçi Hizmetleri herhangi bir şekilde kullanmasından doğabilecek her türlü sorumluluk ve/veya yükümlülüğü üstlenmektedir.\n4. Hiçbir taraf, diğer tarafa karşı bir tarafın kontrolü dışında meydana gelen, Doğal Afetler, deniz ve hava tehlikeleri, yangın, sel, kuraklık, patlama, sabotaj, kaza, ambargo, isyan, halka ayaklanması, yerel devlet ve parlamento tasarrufları dahil bunlarla sınırlı olmaksızın Mücbir Sebep olayı nedeniyle yükümlülüklerini yerine getirememesinden dolayı işbu SKLS'yi ihlal etmiş sayılmayacaktır.  \n5. Kullanıcı, Kullanıcının Oyun ve Çevrimiçi Hizmetleri kullanması ve bunlara ulaşmasından doğan her türlü talep, kayıp, zarar ve ziyanlara karşı şirketi ve herhangi bir Şirkete Bağlı Şirketi tam olarak tazmin edecektir.\n \nİhtilaf Çözümü ve Yetkili Kanunlar\n \n1. Taraflar,  işbu SKLS ile birlikte işbu SKLS'nin ayrılmaz bir parçasını oluşturan dokümanların Malta Kanunlarına göre yorumlanacağını ve Malta Mahkemelerinin yargı yetkisine tabi olacağını kabul etmektedir.\n2. Dava öncesi ihtilaf çözüm prosedürü zorunludur. Kullanıcının talebi 60/2, Melita Street, Valletta VLT 1122, Malta adresine posta ile ve e-posta kopyası help@tankionline.com adresine gönderilmelidir ve böyle bir talep Şirket ve/veya Yönetim tarafından yapılan ihlallerin açık bir listesi, Hesap Bilgileri, iletişim bilgileri ve Kullanıcı imzası içermelidir.  Talebin şekli ve içeriğine uyulmaması, Dava öncesi ihtilaf çözüm prosedürüne uyulmaması anlamına gelmekte olup talebin değerlendirilmesi ve bir yatın gönderilmesi kabul edildiği ana müteakip otuz (30) iş gününe kadar sürebilir.\n \nYasalara Uyum\n \nKullanıcı, Şirketin Kullanıcıya herhangi bir yasal tavsiye veya güvence sağlayamayacağını ve Kullanıcının tabi olduğu kanunlara daima uygun hareket ettiğini ve Kullanıcının Oyunda bir Hesap açmak ve Oyunu oynamak için tüm yasal haklara sahip olduğunu temin edilmesi Kullanıcının kendi sorumluluğundadır. Oyuna herhangi bir katılım yalnızca Kullanıcının tercihinde, takdirinde ve riskindedir.  Oyunu oynayarak Kullanıcı Oyun ve hizmetleri hiç bir şekilde saldırgan, itiraz edilebilir, adaletsiz veya ahlaksız bulmadığını kabul etmektedir.\n \nFeragat\n \nŞirketin herhangi bir zamanda herhangi bir hükmü uygulamaması veya ihmal etmesi, hiçbir şekilde işbu Sözleşmedeki haklarından feragat ettiği şeklinde yorumlanmayacak veya varsayılmayacaktır ne de işbu SKLS'nin tamamı veya herhangi bir kısmının geçerliliği etkilemeyecektir ne de Şirketin bu hakları daha sonradan kullanma hakkına halel getirecektir.\n \nDiğer koşullar\n \n1.İşbu SKLS konusuyla ilgili olarak Kullanıcı ile Şirket arasındaki tüm Sözleşmeyi temsil etmektedir ve taraflar arasında konusuyla ilgili olarak tüm önceki anlaşmaları geçersiz kılmakta ve bunların yerini almaktadır.\n2.İşbu SKLS'de başlıklar sadece başvuru kolaylığı sağlamak amacıyla verilmiştir ve herhangi bir hüküm veya koşulun anlamını veya yorumunun bir parçası olma veya bunları etkileme amacını taşımamaktadır. Tekil kelimeler, çoğulunu da kapsamakta veya çoğul olan tekilini de kapsayacaktır. Tekil kelimeler, çoğulunu da kapsamakta veya çoğul olan tekilini de kapsayacaktır.\n3. İşbu hüküm, koşul veya şartların herhangi bir yetkili makam tarafından herhangi bir ölçüde geçersiz, yasalara aykırı veya tatbik edilemez bulunması halinde, böyle bir hüküm, koşul veya şart, kalan hüküm, koşul ve şartlardan bu ölçüde ayrılacak ve kalan hüküm, koşul ve şartlar kanunların izin verdiği en geniş ölçüde geçerli olmaya devam edecektir.\n \nYönetim ile İletişim\n \n1. Kullanıcı, işbu Sözleşmeye ilişkin herhangi bir soru, görüş, şikayet veya yorumlarını help@tankionline.com adresine gönderebilir. Yönetim mümkün olan en kısa süre içinde değerlendirecektir.\n2. Kullanıcının Yönetim ile yazışmaları başlatması halinde veya Oyun ve Oyun Hizmetleriyle ilgili sorunlara ilişkin bir rapor sunması halinde, Yönetim tüm bu yazışmaları saklama hakkına sahiptir.\n"
