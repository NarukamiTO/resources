  GAME_RULES: "Özet Kurallar\n\nAşağıdaki oyun içi davranışlar Oyunda yasaktır:\n-bot kullanımı, üçün parti yazılım kullanımı, böcekler;\n-yönetim üyesiymiş gibi hareket etmek;\n-aşırı hızlı seviye atlama, diğer kullanıcılar için engeller yaratma;\n-reklam, siyasi propaganda;\n-fikri mülkiyet kanunları dahil kanunları ihlal etme;\n-Hesapların ve diğer oyun değerlerinin satılması, alınması, takası veya devri;\n-dolandırıcılık ve diğer aldatıcı faaliyetler.\n \nAşağıdaki davranışlar, Oyun sohbetlerinde ve Forum'da yasaktır:\n-hakaret, tehdit ve iftira niteliğinde ifadeleri kullanmak;\n-ima yoluyla da olsa küfürlü konuşmak;\n-sohbeti ele geçirmek, alevlendirmek, istenmeyen mesajlar göndermek, tamamı büyük harflerle yazmak (CAPS LOCK);\n-şifreleri ve diğer Hesap bilgilerini hileyle çalmak;\n-trollemek;\n-başkalarını Oyun Kurallarını ihlal etmek için teşvik etmek;\n-yönetim ve moderatörleri herkesin içinde tartışmak;\n-yasalar ile yasaklanan bilgileri yayınlamak;\n-üçüncü parti kaynaklara ait linkler yayınlamak;\n-herhangi bir türde ayrımcılık. \n \nOyun Kuralları\nTüm dünyadan insanların devasa savaş makinelerini kullandıkları, şiddetli savaşlara katıldığı Tanki Online oyunundasınız.  Oyuncular, tek başlarına veya bir takım halinde omuz omuza zafere ulaşmak için savaşabilirler.  Ayrıca sosyalleşebilmekte ve yeni arkadaşlar edinebilmektedirler.\nTanki Online öğrenmesi kolay çok oyunculu aksiyon oyunu, ciddi savaşlar için bir sahne ve harika bir sosyal ağdır.\nKayıt sürecini tamamladıktan sonra Kullanıcı bir sanal tank ve 500 kristal (oyunun para birimi) almaktadır. Kullanıcı savaşlar kazanarak, puanlarını artıracak ve yeni rütbeler ve kristaller kazanacaktır. Kristaller, yararlı mühimmat satın almak ve tanklar, silahlar ve zırhlar satın almak veya yükseltmek için kullanılabilir.\nTanki Online sadece heyecan verici bir online Oyun değildir. Aynı ilgi alanlarını paylaşan insanlardan oluşan bir topluluktur. Karşılıklı saygı ve nezaketi teşvik ediyor ve saldırgan davranışları ve/veya Diğer Kullanıcıların haklarını ihlal eden davranışları şiddetle cezalandırıyoruz. Yöneticilerimiz, bu Oyun Kurallarını ihlal eden kullanıcıların iletişim becerilerini sınırlandırma, puanlarını düşürme ve/veya Hesaplarını engelleme haklarına sahiptir. \n \n\nGenel Koşullar\n\nOyun Kurallar, Oyun ve Oyun hizmetlerinin Son Kullanıcı Lisans Sözleşmesi (bundan sonra \"Sözleşme\" veya EULA\" olarak anılacak) ve diğer dokümanların ayrılmaz bir parçasıdır. Bunun karşılığında, Sözleşme, Gizlilik ve çerez politikası yanı sıra Oyun ve Oyun Hizmetlerinde yayınlanan diğer dokümanlar bu Oyun Kurallarının ayrılmaz bir parçasıdır.\nOyun Kurallarında kullanılan herhangi bir terim veya ifade Sözleşmede kendilerine verilen anlamlara sahiptir.\nOyun veya Online Hizmetlerinin herhangi bir kullanımı ve/veya kayıt formunda \"Kabul Ediyorum\" düğmesine tıklamanız bu Oyun Kurallarını bildiğiniz ve onayladığınız ve tüm şartlarını kayıtsız şartsız kabul ettiğiniz anlamına gelmektedir.\nOyun Kuralları tüm Kullanıcılar için bağlayıcıdır.\nBu Oyun Kurallarının herhangi bir şartını kabul etmiyorsanız, Oyun ve hizmetlerini kullanma hakkına sahip değilsiniz, ve lütfen bu Siteden ayrılın ve Oyunu kullanmayın.\n\n \n1. Aşağıdakileri içeren takma adların (Kullanıcı adlarının) oluşturulması yasaktır:\n\n1.1. küfürlü veya sert ifadeler, hakaret/hakaret provokasyonları (kısaltma, ifade, sözcük veya sözcük grubu şeklinde);\n1.2. Irkçılık, faşizm, küfür öğeleri veya ırk, milli veya dini kimliğe dayanan takma adlar veya nefret, hoşgörüsüzlük, etnik nifakı kışkırtan öğeler;\n1.3. Şiddet, terörizm, aşırıcılık ve/veya kitlesel karışıklıklara davet eden ifadeler;\n1.4. Her türlü siyasi teşvik, propaganda, reklam; \n1.5. Siyasi suçlar veya insanlığa karşı suçlar, terör faaliyetlerinde bulunmuş olanlar dahil siyasi örgütlerle (kişilere) doğrudan veya dolaylı ilişki olanlar;\n1.6. Cinsiyet, yaş, din veya diğer özelliklere dayanan ayrımcılık;\n1.7. Doğrudan veya dolaylı propaganda, alkollü ve alkol içeren içkiler, bira, tütün ürünleri, uyuşturucu, toksik, psikotropik ve/veya sarhoş edici maddeler, öncül maddeleri ile bunların üretim, edinme, yetiştirme ve kullanım yerleri ve yöntemleri hakkında bilgiler;\n1.8. Kumar oyunları, fuhuş, serserilik, dilenciliğe davet eden çağrılara ilişkin bilgiler;\n1.9. İntihar etme yöntemleri hakkında bilgi, intihar, şiddet veya yaşam veya sağlığa tehdit oluşturan diğer eylemlere teşvikler; \n1.10. Yasadışı davranış, suç, şiddet, işkenceye teşvik ile birlikte kanunların yasakladığı faaliyetlere tahrik eden zarar verici eylemlere teşvik;\n1.11. Yönetici çalışanların kullanıcı adlarının bir kısmı veya Kullanıcının Yönetici temsilcisiymiş gibi yanlış algılanmasına yol açabilecek bilgiler;\n1.12. Oyuna, Yöneticilere veya moderatörlere yönelik eleştiri; \n1.13. Cinsel ilişki, ırza tecavüz, pornografi, pedofiliyle doğrudan veya dolaylı ilişkili ifadeler;\n1.14. Beden veya bedenin alt biyolojik fonksiyonları veya refleksleriyle ilgili açıklamalar;\n1.15. Reklamlar ve internet sitesi linkleri;\n1.16. Yönetici haklarını ihlal eden kaynaklar, hile kodları, hile sitelerine atıflar; \n1.17. Telaffuz edilemeyen rastgele harfler (flood Kullanıcı adları);\n1.18. Telif haklarıyla korunan veya tescilli ticari marka unsurlarının tamamı veya bir kısmı;\n1.19. Bu Oyun Kuralları, Sözleşme ve/veya geçerli kanunlarca yasaklanan diğer bilgiler.\n1.20. Kullanıcı adının yukarıda belirtilen gerekleri, bu Oyun Kuralları, Sözleşme veya geçerli kanunlarda belirtilen diğer gerekliliklere uygun olmaması halinde, Yönetim, mutlak kendi takdirinde, aşağıdaki haklara sahiptir:\n- Kullanıcıdan adını kabul edilebilir bir Kullanıcı adıyla değiştirmesini talep etme ve Kullanıcı adının değiştirilmesi için verilen süre için Kullanıcı Hesabını engelleme;\n- Kullanıcı Hesabını daimi olarak engelleme.\n\n\n2. Aşağıda belirtilen faaliyetler yasaktır ve (Yönetimin kararına göre) Kullanıcının Hesabının kalıcı veya geçici olarak engellenmesine, Kullanıcının sanal Oyun değerlerinin (garaj, kristal, oyun istatistikleri) tamamını %10 ila %100 arasında azaltılmasına veya Kullanıcı Hesabının sıfırlanmasına, oyun sohbetleri ve Foruma erişimin geçici veya kalıcı olarak yasaklanmasına (yasaklama) yol açacaktır: \n\n2.1. Oyunda herhangi bir sportmenlik dışı veya kaba davranış şekilleri:\n\n2.1.1. Bot kullanımı (Oyunda Kullanıcıların hareketlerini taklit eden bir yazılımının kullanılması), fare ve klavyeyi kontrol eden tıklama programları, makroların kullanılması, Oyunda avantaj elde etmek için diğer üçüncü parti yazılımların kullanılması;\n2.1.2. Oyun olanaklarının iyileştirilmesi/otomasyonu için üçüncü taraf yazılımların ve diğer araçlar (botlar, hileler) yanı sıra Oyunun çalışmasını veya üçüncü kişilerin elektronik cihazlarının çalışmasını bozabilecek programların uygulanması veya dağıtılması;\n2.1.3. Oyunun yazılım hatalarının suistimal edilmesi ve bunlara ilişkin bilgilerin Yönetim hariç üçüncü kişilere aktarılması;\n2.1.4. 'Bayrağı Ele Geçir' veya 'Kontrol Noktaları' veya 'Takım Ölüm Maçı' oyunlarında diğer takım oyuncularından veya 'Ölüm Maçı' modunda rakiplerin yardımı veya kasıtlı hareketsizliği yoluyla deneyim puanlarının kazanılması ('Aşırı Hızlı Seviye Atlama');\n2.1.5. Bir kullanıcının sahip olduğu hesaplar arasında savaşlar;\n2.1.6. Ana Hesabın seviyesini aşırı hızlı atlatmak için ek hesapların açılması;\n2.1.7. Aşırı hızlı seviye atlamak amacıyla diğer kullanıcılarla üstünkörü savaşmak için danışıklı ve önceden ayarlanmış savaşlar yapmak (Yönetim böyle bir faaliyete dahil olan herkes için kısıtlamalar uygulayacaktır);\n2.1.8. BEG, TÖM ve KN modları dahil bir Kullanıcının üyesi olduğu takıma karşı engellemeler yaratmayı amaçlayan herhangi bir davranışı veya ihmali, üyesi olduğunuz takıma karşı savaşmak, bir müttefik tankına zarar vermek/imha etmek, rakip takımın menfaatine savaşmak veya düşmanla komplo kurmak, sabotaj;\n2.1.9. Deneyimsiz oyunculara (acemilere) karşı ayrımcılık yapmak: yanlış bilgi vermek, gözdağı vermek, dalga geçmek;\n2.1.10. Diğer Kullanıcılar, Yönetim, moderatörler ve diğer kişilerle ilgili olarak hakaretlerde bulunmak ve iftira atmak (yalan yanlış bilgiler yaymak); \n2.1.11. Oyunda herhangi bir manipülasyon veya komplo şekilleri;\n2.1.12. Oyunun geliştirilmesi ve imajı üzerinde olumsuz bir etkiye sahip olan herhangi bir faaliyet;\n2.1.13. Normal oyun sürecini engelleyen ve yönetim tarafından bu şekilde algılanacak herhangi bir sportmenlik dışı davranış şekilleri.\n\n\n2.2. Başta aşağıdakiler olmak üzere her türlü dolandırıcılık şekli:\n\n2.2.1. Oyun ve/veya Oyun hizmetlerinin hileli oyun içi mali işlemler, para iadesi, yasak işlemler dahil işlemler sırasında dolandırıcılık dahil bunlarla sınırlı olmaksızın herhangi bir dolandırıcılık amacıyla kullanılması;\n2.2.2. Hesapların ve diğer oyun değerlerinin üçüncü taraflara devredilmesi; Hesap veya oyun değerlerinin ücretsiz veya kristal veya para karşılığında satışı, alımı veya devri için herhangi bir teklifin yayınlanması yanı sıra söz konusu işlemlerle ilgili teşvikler;\n2.2.3. Herhangi bir diğer Kullanıcından şifre, diğer Hesap bilgileri veya diğer kişisel bilgilerin, ahlaki, fiziksel veya teknik tehditler kullanarak şantaj dahil herhangi bir şekilde edinme girişimleri;\n2.2.4. Diğer Kullanıcılar ve üçüncü kişiler hakkında herhangi bir kişisel bilginin yayınlanması (böyle bir bilgi aleni değil ise); \n2.2.5. Dolandırıcılık - herhangi bir dolandırıcılık şekliyle Oyun içi paraların ele geçirilmesi;\n2.2.6. Yönetimin eski veya mevcut bir çalışanı veya proje asistanı (moderatör, danışman vb.) olarak kendini tanıtmak için herhangi bir girişim, özellikle de Yönetim veya moderatörler adına mesaj göndermek;\n2.2.7. Para, oyun değeri veya kristal transfer etme talepleri dahil herhangi bir şekilde dilencilik;\n2.2.8. Oyunun resmi kaynaklarıymış gibi göstermek suretiyle dış kaynaklara ait linklerin yayınlanması.\n\n2.3. Diğer ihlaller:\n\n2.3.1. İma yoluyla kullanılmaları dahil küfür veya sert ifadeler içeren sözcükler ve küfür olarak sınıflandırılmayan diğer küfür veya kaba sözcükler (ifadeler);\n2.3.2. Bir kadın ile erkek arasındaki cinsel ilişkiyi resmeden veya anlatan cinsel, erotik veya pornografik nitelikte bilgi ve materyallerin yayınlanması;\n2.3.3. İnanan kişilerin hislerini hareket eden veya aşağılayan, nefret, husumet, ırk, uluslararası veya etnik karışıklık, hoşgörüsüzlük yaratan ve belirtilen edimleri gerçekleştirmeleri sağlamak amacıyla muhatapları provoke eden bilgiler veya sembollerin yayınlanması (ırk, ulus, etnik ve dini özelliklere dayanarak takma adların alınması, hakaretler dahil); \n2.3.4. Nazi sembolleri, simgeleri, kısaltmaları veya Nazi aktivistlerinin unvanları, adları ve soyadlarının kullanılması, sergilenmesi veya propaganda amaçlı kullanılması;\n2.3.5. Tarihsel olayları olumsuzlayan bilgilerin yayınlanması;\n2.3.6. Şiddet, savaş, terörizm, hükümetin devrilmesine; aşırı faaliyetler ve/veya kitlesel karışıklıklara davet ediyor olarak görülebilecek bilgilerin yayınlanması;\n2.3.7. Siyasi suçlar veya insanlığa karşı suçlar işlemiş, terör faaliyetlerinde bulunmuş veya başka türlü uluslararası kanunları ihlal etmiş siyasi örgütler (siyasi liderler) hakkında bilgilerin yayınlanması; \n2.3.8. Siyasi teşvik, siyasi reklam, herhangi bir seçim propagandası içeren bilgilerin yayınlanması,\n2.3.9. Provokatif çatışmalar gibi güncel siyasi konuların tartışılması;\n2.3.10. Cinsiyet, yaş, din veya diğer özelliklere dayanan her türlü ayrımcılık;\n2.3.11. Kullanıcılar, Yönetim veya üçüncü kişilerle ilgili her türlü tehdit;\n2.3.12. İntihar etme yöntemleri hakkında bilgi, intihar, şiddet veya yaşam veya sağlığa tehdit oluşturan diğer eylemlere teşvikler, tehlikeli dövüş teknikleri, dublörlük, silah yapım tekniklerine ilişkin açıklamalar, vücut değiştirme yöntemlerine dair açıklamalar içeren bilgilerin yayınlanması;\n2.3.13. Yasadışı veya antisosyal davranış, suç, şiddet, sakatlama, insanlar, hayvanlar üzerinde psikolojik veya fiziksel işkence veya başkalarının mülküne zarar vermeyi açıklayan, teşvik eden veya meşrulaştıran her türlü bilginin yayınlanması;\n2.3.14. Çocuklarda korku, panik veya dehşete yol açan, ölüm, hastalık, intihar, kaza, acil durum veya felaketlerin ve(veya) sonuçlarının resimleri ve açıklamaları dahil her türlü bilgi yanı sıra çocukların sağlığına veya gelişimine zarar verebilecek diğer bilgilerin yayınlanması;\n2.3.15. Yasadışı faaliyetlerin (ihmaller) sonuçlarından olumsuz etkilenen bir çocuk hakkında bilgilerin yayınlanması;\n2.3.16. Doğrudan veya dolaylı propaganda, alkollü ve alkol içeren içkiler, bira, tütün ürünleri, sigara içme aksesuarları, uyuşturucu, toksik, psikotropik ve/veya sarhoş edici maddeler, öncül maddeleri ile bunların üretim, edinme, yetiştirme ve kullanım yerleri ve yöntemleri hakkında bilgilerin yayınlanması\n2.3.17. Kumar oyunları, fuhuş, serserilik veya dilencilik faaliyetlerine katılma arzusu uyandırabilecek bilgilerin yayınlanması;\n2.3.18. Mülkiyet hakkı sahibinin izni olmadan herhangi bir fikri mülkiyete tabi materyallerin (yazılım, sanat eserleri, resim, video ve diğer materyaller ve parçaları, ticari markaları vb.) veya diğer materyallerin kullanılması; korsan içeriklere ait linklerin yayınlanması; başta hak sahipleri, eser sahipleri ve fikri mülkiyet haklarının diğer onaylarına ait linkler olmak üzere fikri mülkiyet haklarına ilişkin bilgilerin silinmesi veya değiştirilmesi;\n2.3.19. Yönetimin onayı olmadan herhangi bir reklam materyali veya bilgilerin yayınlanması;\n2.3.20. Kullanıcının veya Yönetimin zarara/kayba uğramasına yol açabilecek bilgilerin yayınlanması; \n2.3.21. Oyun ve/veya geliştiricilere ve Sahibe karşı yapıcı olmayan eleştiriler;\n2.3.22. Oyun Yönetimi veya moderatörlerinin açık veya örtük bir şekilde herkese açık bir şekilde tartışma;\n2.2.23. Yalan veya uydurma bilgiler, belgeler ve delillerin sağlanması. Yönetim, Kullanıcıyı bu faaliyetlerine ilişkin cezai ve diğer sorumlulukları hakkında uyarır;\n2.3.24. İşbu Oyun Kuralları, Sözleşme ve/veya geçerli kanunlarca yasaklanan faaliyetlere (ihmallere) teşvik etme veya ön ayak olma. \n \n3. Oyun sohbetlerinde ve/veya Forumlarda aşağıdaki özelliklere haiz konuların başlatılması ve/veya mesajların yayınlanması yasaktır:\n3.1. Halihazırda mevcut konuların veya mesajların yanı sıra yakın bir zamanda tartışılmış ve yanıtları bilgilendirme bölümlerinde (Oyun Kuralları, SSS, Planlar, vb.) bulunan yeniden açan/yayınlayan.  Sorularınıza aradığınız yanıtı bulmak için Arama fonksiyonunu kullanmayı unutmayın. Yeni bir konu açmadan önce mevcut konulara dikkat edin ve detaylı bir şekilde araştırın.\n3.2. Bölüm/kategorinin temasına karşılık gelmeyen;\n3.3. Konunun veya mesajın başlığında ve/veya içeriğinde CAPS LOCK veya ÇOK FAZLA BüYÜK HaRF içeren;\n3.4. Konunun veya mesajın başlığında ve/veya açıklamasında, konu veya bölümün anlaşılmasını zorlaştıran veya herhangi bir anlam taşımayan (Flood) ilgisiz veya tekrarlayan semboller, karakterler, duygu simgeleri, mesajlara sahip olan, örneğin == - Benim Konum - ==;\n3.5. 24'den daha büyük yazı boyutunda metne sahip olanlar;\n3.6. Bilgi eksikliği bulunan ve konunun başlığı veya açıklamasında konunun içeriğini yansıtmayan;\n3.7. Herhangi bir özel gereklilik olmamasına rağmen önceki mesajlar ve/veya resimlere ait çok uzun metinlerin alıntılanması (aşırı alıntılama); \n3.8. Yönetim tarafından kapatılmış veya silinmiş konuları tartışmaya devam eden (ölü bir konuyu canlandırma); \n3.9. Forum veya oyun sohbeti katılımcıları için kişisel sayılabilecek bir niteliğe sahip olan. Kişisel İletişim için lütfen Özel Mesajları kullanın. Soruların çözülmesi amacını taşıması şartıyla kişisel tartışmalara izin verilmektedir.\n3.10. Alıcının talep etmediği, ilgi göstermediği ve/veya onay vermediği istenmeyen mesajlar içeren;\n3.11. Tartışmayı alevlendiren (\"tartışmak için tartışmak\", sıklıkla tartışmanın asıl sebebiyle ilişkisi bulunmayan sadece söz dalaşı niteliğindeki mesajların paylaşılması); \n3.12. Trolleme içeren (topluluk katılımcılarını, kendileri için olumsuz sonuç ve çatışmalara sahip davranışlara teşvik etmek); \n3.13. Diğer Kullanıcılar, Yönetim ve moderatörlerin provoke etmeyi ve Forum veya oyun sohbetlerindeki iletişimi engellemeyi amaçlayan;\n3.14. Referans linkleri, \"hile kodları\" (addscore, Buy_krictals_in_the_panzer) içeren;\n3.15. Bu Oyun Kuralları, Sözleşme ve/veya geçerli kanunlarca yasaklanan diğer bilgiler ve ihlalleri içeren.\n3.16. Yukarıda belirtilen ihlaller için, Yönetim, kendi takdirinde, kalıcı veya geçici Hesap engelleme veya oyun sohbetleri ve Foruma erişimin geçici veya kalıcı yasaklanması (yasaklama) şeklinde Kullanıcı kısıtlamaları uygulama hakkına sahiptir.\n3.17. Yönetim, kendi takdirinde, önceden haber vermeksizin herhangi bir bilgi veya mesajı silme, yanlış Forum bölümünde açılan konuyu silme/taşıma hakkına sahiptir.  \n3.18. Özel Mesajlar, oyun hizmetleri ve Forumda Kullanıcının kişisel iletişimini sağlamak amacını taşımaktadır. Oyun Kurallarının ihlaline ilişkin şikayetler değerlendirilirken, Yönetim özel mesajlarla ilgili şikayetleri dikkate almayacaktır. Kullanıcı, Forumdaki Kullanıcı profilinin uygun bölümündeki Kara Listeye eklemek suretiyle başka bir kullanıcıdan gelen özel mesajları almayı durdurabilir.\n \n4. Kullanıcı kısıtlamalarının uygulanması\n4.1. Kullanıcının işbu Oyun Kurallarını ihlal etmesi halinde, Yönetim, Oyun Kurallarının ilgili bölümünde belirtilen kısıtlamaları bu Kullanıcıya uygulama hakkına sahip olacaktır.\n4.2. Kısıtlama türleri:\n4.2.1. Geçici veya kalıcı Hesap engelleme - Oyuna erişimin engellenmesi (sınırlandırılması). \n4.2.2. Kullanıcının sanal Oyun değerlerinin (garaj, kristal, oyun istatistikleri) tamamının %10 ila %100 arasında azaltılması veya Kullanıcı Hesabının sıfırlanması.\n4.2.3. Kullanıcının Foruma ve oyun sohbetlerine erişimin geçici veya kalıcı yasaklanması (yasaklama) - sohbetler ve Formunda mesaj bırakabilme imkanının kısıtlanması. \n4.2.4. Oyun veya oyun hizmetlerinin herhangi bir kısmında yayınlanan herhangi bir bilgi veya mesajın önceden haber verilmeden silinmesi veya değiştirilmesi; Forum konularının başka bir bölüme aktarılması veya konuların silinmesi.\n4.3. Bu kısıtlamalar, işbu Oyun Kurallarını ihlal eden Kullanıcının herhangi bir Hesabına uygulanabilir.\n4.4. Yönetim, kendi takdirinde, bir Kullanıcıya aynı anda bir veya daha fazla kısıtlama uygulama veya uyarıda bulunma hakkına sahiptir.\n4.5. Kısıtlamaları seçerken, Yönetim ihlalinin türü ve sayısı yanı sıra bu Oyun Kurallarının Kullanıcı tarafından önceki ihlallerini dikkate almaktadır.\n4.6. Oyun Kurallarının belirli ihlallerinin tam olarak tespit edilmesi her zaman mümkün olmadığından dolayı son karar daima Yönetime aittir.\n4.7. İşbu Oyun Kurallarının ihlali, Kullanıcının önceden haber verilmeden derhal oyun hizmetlerine erişiminin durdurulması veya bu hizmetlerin kısmen veya tamamen kısıtlanması anlamına gelebilir.\n4.8. Kullanıcının Oyun Kurallarını birkaç kez veya entegre bir şekilde ihlal etmesi halinde, Yönetim kendi takdirinde Kullanıcıya uygulanan kısıtlamaları tekrar uygulama hakkına sahiptir.\n4.9. Yönetim, Kullanıcının veya üçüncü tarafın İnternet Sitesini, Oyunu ve/veya Çevrimiçi Hizmetleri kullanmasının bir sonucu olarak doğrudan veya dolaylı olarak uğrayabileceği, Oyunu ve Çevrimiçi Hizmetleri kullanamama veya Yönetimin Kullanıcıya kısıtlama uygulamasından dolayı uğradığı zararlar, Oyunun diğer kullanıcıları, internet erişiminin bulunmaması, hırsızlık, Materyallerin yok olması, Kullanıcının Hesabıyla ilgili bilgilerin kaybı dahil üçüncü taraf faaliyetlerinden doğan dolaylı veya doğrudan zararlar ve Oyunla ilgili olarak Kullanıcının onuru, şerefi veya iş itibarının zedelenmesi dahil herhangi bir zarar veya kayıptan hiçbir şekilde sorumlu değildir. \n\n5. Moderatörler\n5.1. Moderatörler, Yönetimin yardımcıları olup Kullanıcılar arasından Yönetim tarafından seçilmektedir.\n5.2. Bir moderatör, Yönetim adına ve menfaatine hareket eden bir kişidir. Moderatörler, Oyun ve oyun hizmetlerin yanı sıra Forum ve oyun sohbetlerinde düzeni sağlar ve kontrol eder.\n5.3. Moderatör, Kullanıcı tarafından bu Oyun Kurallarının ihlal edilmesi halinde, Kullanıcıya oyun sohbetleri ve Forumlarına erişimi kalıcı veya geçici olarak kısıtlama (yasaklama) uygulama hakkına sahiptir.\n5.4. Bir moderatör karar alırken dürüst ve tarafsız olacaktır ve işbu Oyun Kuralları ve Sözleşmenin hükümlerine de uyacaktır ve Kullanıcılara karşı kibar olacak, görevlerini verimli ve düzenli bir şekilde yerine getirecektir.\n5.5. Moderatörün sahip olduğu gücü istismar etmesi kesinlikle yasaktır. Tüm moderatörlerin faaliyetleri kayıt altına alınmaktadır. Moderatörlerden birinin kendisine gösterilen güveni yerine getirmemesi halinde, Yönetim iç kararıyla tartışma veya uyarı yapılmadan görevinden alınacaktır.\n5.6. Moderatörlerin faaliyetleri gönüllülük esasına dayanmaktadır.  Kullanıcı, bir moderatöre herhangi bir kısıtlamayı uygulama emri verme hakkına sahip değildir.\n \n6. Şikayetler ve İtirazlar\n6.1. Kullanıcı, <a href=\"http://en.tankiforum.com/index.php?showforum=76\" target=\"_blank\"><u>İhlalciler bölümü</u></a> bölümünde yeni bir forum konusu açmak suretiyle Oyun Kuralları ihlallerini raporlama hakkına sahiptir. Yeni konu alanında ihlalin niteliğinin açık bir şekilde belirtilmesi ve ihlali açık bir şekilde gösteren bir sohbet ekran görüntüsü veya videonun eklenmesi gerekmektedir.\n6.2. Kullanıcı işbu Oyun Kurallarına ilişkin herhangi bir soru, yorum veya şikayeti help@tankionline.com adresine gönderebilir. Yönetim, bu istekleri en kısa sürede değerlendirmek için her türlü çabayı gösterecektir.\n6.3. Bir şikayeti gönderirken, Kullanıcı, durumun içeriğini mümkün olabildiğince ayrıntılı bir şekilde açıklayacak ve delil niteliğindeki materyalleri, ekran görüntülerini, vb. ekleyecektir. Gerekçesiz kısıtlamalar ilişkin şikayetler, yalnızca Yönetim ve moderatörlerin faaliyetlerinin bir iç değerlendirmesinin yapılması amacını taşımaktadır. Kısıtlamaların uygulanmasına ilişkin kararlar, değişikliğe tabi değildir.\n6.4. Kullanıcının Yönetim ile yazışmaları başlatması halinde veya oyun ve oyun hizmetleriyle ilgili sorunlara ilişkin bir rapor sunması halinde, Yönetim tüm bu yazışmaları saklama hakkına sahiptir.\n\n7. Diğer hükümler:\n7.1. Yönetim, mutlak takdir yetkisinde, Oyunu yönetir ve işbu Oyun Kurallarını uygular ancak topluluğun görüşlerini dikkate alır.\n7.2. İşbu Oyun Kuralları, önceden haber verilmeksizin Yönetim tarafından değiştirilebilir. Kullanıcı en az her yedi günde bir (yani, haftada bir) değişiklikler için işbu Oyun Kurallarını kontrol etme yükümlülüğüne sahiptir. Böyle bir kontrolün belirtilen süre içinde yapılmaması ve Kullanıcının Oyunu kullanmaya devam etmesi halinde, Kullanıcı işbu Oyun Kurallarının değiştirilmiş halini okuduğu ve kabul ettiği varsayılmaktadır\n7.3. Yönetim hile ve dolandırıcılığa karşı \"sıfır tolerans\" politikası uygulamaktadır. Yönetim görüşüne göre, Kullanıcının Yönetimi veya başka bir Kullanıcıyı kandırmış olması veya kandırmaya teşebbüs etmiş olması halinde veya yalan veya uyduruk bilgiler, belgeler, deliller sunmuş olması veya başka türlü geçerli kanunları ihlal etmiş olması halinde, Yönetim, Kullanıcının Hesabını engelleme hakkını ve böyle bilgileri (Kullanıcının şahsi bilgileriyle birlikte), Yönetimin kendi takdirinde ve gerekli görmesi halinde, herhangi bir üçüncü tarafa ve/veya emniyet yetkililerine aktarma hakkını saklı tutar.\n7.4. Yönetim, Siberspor Kuralları, yarışma kuralları, turnuvalar ve şampiyonalarda başka hükümler ve kısıtlamalar uygulayabilir. Aynı zamanda, işbu Oyun Kuralları, Yönetim tarafından uygulamaya geçirilen diğer kuralların ayrılmaz bir parçasıdır."
