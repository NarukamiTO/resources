  GAME_PRIVACY_POLICY: "سیاست های رعایت حریم خصوصی و کوکی ها\nشرکت  APL Publishing Ltd، شماره 60/2، خیابان ملیتا، والیتا VLT 1122، کشور مالتا (از این پس به عنوان «شرکت» یا «اداره» نامیده می شود)، صاحب حقوق منحصر به فرد این بازی، حق محرمانه بودن اطلاعات شخصی را برای کاربران محترم می شمارد. شرکت اهمیت حفاظت از اطلاعات دریافت شده از کاربران را درک می کند. این شرکت برای اطلاع رسانی به کاربران در مورد جمع آوری و استفاده از اطلاعات شخصی آنها، این سیاست حفظ حریم خصوصی و کوکی ها (از این پس به عنوان «سیاست» شناخته می شود) را تایید می کند.\nشرکت ناشر نیز تشکیل شده از استودیو بازی سازی سورنا و وب سایت سرگرمی که نماینده انحصاری این بازی در کشور ایران هستند. کلیه حقوق مادی و معنوی بازی فوق در ایران در اختیار وب سایت سرگرمی و شرکت سورنا می باشد.\nاین سیاست ها؛ شرایط، روش ها و اهداف جمع آوری، استفاده، پردازش، ذخیره، افشا، انتقال و حذف اطلاعات شخصی کاربر (ها) و همچنین شرایط حفاظت از اطلاعات شخصی کاربر (ها) را فراهم می کند. این سیاست ها توضیح می دهند که چگونه یک کاربر می تواند امکان مشاهده، به روزرسانی و درخواست حذف اطلاعات شخصی را طبق قوانین حاکمه تعیین کند. این سیاست همچنین شرایط، روش ها و اهداف استفاده و نگهداری از کوکی‌ها (فایلهای متنی کوچکی هستند که در دستگاه شما ذخیره می‌شوند) توسط شرکت را فراهم می کند.\nتوافقنامه مجوز کاربر نهایی (در اینجا \"توافقنامه\")، قوانین بازی و سایر اسناد منتشر شده در بازی و خدمات بازی جزء جدایی ناپذیر این سیاست هستند. به نوبه خود، این سیاست بخشی جدایی ناپذیر از موافقتنامه، قوانین بازی و سایر اسناد خدمات بازی است.\nاین سیاست فقط برای وب سایت ها و سایر سرویس های مربوط به بازی اعمال می شود و وب سایت ها و خدمات دیگر را پوشش نمی دهد.\nهرگونه استفاده از بازی و امکانات آنلاین آن و / یا کلیک روی \"پذیرش\" در فرم ثبت نام به این معنی است که شما با این سیاست آشنا هستید و موافقید و بدون تردید تمام شرایط آن را قبول می کنید.\nاگر با هر یک از شرایط این سیاست موافق نیستید، شما حق استفاده بیشتر از بازی و خدمات آن ا ندارید، لطفا این وب سایت را ترک کنید و از این بازی استفاده نکنید.\nتعاریف\n\nهر اصطلاحی که در اینجا مورد استفاده قرار گرفته است، همان معنی را دارد که در توافقنامه به آن تعلق می گیرد. \nوظایف\n1.  شرکت متعهد به احترام به حریم شخصی کاربر است در حالی که با همه قوانین حفاظت از داده های قابل اجرا که به موجب قانون حاکم عنوان می شود موافق است. شرکت اطمینان می دهد که اطلاعات شخصی کاربر به طور عادلانه، قانونی و با روشی مناسب پردازش می شود و فقط برای اهداف خاصی که توسط کاربر و در زمانی که تصمیم به استفاده از نرم افزار، بازی و سایت اینترنتی گرفته است، شناخته و پذیرفته شده است، و مورد استفاده قرار گیرد.\n2.  شرکت در کمیته حفاظت از داده ها در کشور مالتا ثبت شده است و از قانون حفاظت از اطلاعات، فصل 440 قانون کشور مالتا و سایر مقررات مربوطه، اعلامیه های قانونی و / یا قوانین مشابه در کشور مالتا پیروی می کند.\n\n3. این سیاست، منابع زیررا در خصوص بازی پوشش می دهد: بازی آنلاین چند کاربره تعاملی “Tanki Online نسخه دوم) اتاق چت بازی، انجمن بازی، Tanki Online Wiki، Tanki Online News  (در اینجا به طور کلی به عنوان\" خدمات بازی \"اشاره می شود)، و همچنین تمام فرم های آنلاین، فرم های داخلی و ابزار ارتباطات مورد استفاده در خدمات بازی و در بازی کاربر برای جمع آوری اطلاعات شخصی.\n4.  شرکت اطمینان می دهد که همه ی موارد منطقی ممکن و لازم برای همیشه در دسترس بودن اطلاعات شخصی را فراهم کرده است:  \na.  پردازش شده با توجه به حقوق کاربر؛\nb.  پردازش عادلانه و قانونی\nc. فقط برای یک هدف خاص و قانونی جمع آوری شده؛\nd. کافی، مناسب و مرتبط و فقط برای جمع آوری نه بیشتر؛\ne. دقیق و به روز شده؛\nf. به صورت امن نگهداری می شود\ng.  بیش از مدت زمان لازم نگهداری نشوند؛\nh. به حوزه قضایی که محافظت کافی از اطلاعات شخصی شما را تضمین نمی کند داده نخواهد شد؛ و\ni. فقط برای دلایل عنوان شده در اینجا استفاده می شود.\n5. امکان دسترسی به اطلاعات شخصی دریافت شده توسط شرکت تنها توسط کارمندان و نمایندگان شرکت و همچنین وابستگان شرکت، با در اختیار داشتن تأییدیه لازم، ممکن می باشد. همه اشخاصی که به این اطلاعات شخصی دسترسی دارند، باید شرایط این سیاست را حفظ کنند و از طریق قرارداد کاری یا توافقنامه دیگری؛ حتی پس از اینکه رابطه کاری آنها با شرکت قطع شد، ملزم به نگهداری محرمانه از این اطلاعات هستند.\n6.  شرکت متعهد است تمامی اقدامات سازمانی و فنی را برای محافظت از اطلاعات شخصی کاربر از دسترسی غیرمجاز یا تصادفی، تخریب، تغییر، مسدود کردن، کپی، توزیع، و همچنین سایر اقدامات غیرقانونی اشخاص دیگر، را انجام دهد .\n7. شرکت در خصوص اصل حفاظت از ارتباطات الکترونیکی با کاربر و حفاظت از هر روش دیگر ارتباطی که ممکن است هر زمان ضروری باشد، بهترین شیوه را اتخاذ کرده است.\n8. قوانین حفاظت از اطلاعات ممکن است در کشورهای مختلف متفاوت باشد. شرکت خواهان این است که شرایط این سیاست را تا آنجا که ممکن است دنبال کند و صرف نظر از جایی که این اطلاعات جمع آوری شده و / یا چگونگی انتقال آنها، از اطلاعات شخصی کاربر تا حد امکان محافظت می کند.\n9.  شرکت تنها در صورتی ممکن است انتقال اطلاعات شخصی را به کشور سوم انجام دهد که کشور سوم دارای سطح کافی حفاظت از اطلاعات شخصی باشد یا اگر چنین انتقالی برای نتیجه گیری یا اجرای توافق یا قرارداد دیگر در منافع کاربر مورد نیاز باشد یا اگر برای حفاظت از منافع کاربر لازم و ضروری باشد، و یا اگر شرکت تضمین های مناسب در رابطه با حفاظت از اطلاعات شخصی را فراهم  کند.\nمجموعه اطلاعات شخصی\n10.  شرکت باید حق درخواست هر گونه اطلاعات از کاربر را داشته باشد؛ که ممکن است حاوی اطلاعاتی باشد که در جریان تکمیل فرم های ویژه در بازی ها و خدمات بازی، از جمله اطلاعاتی که در طول دوره ثبت نام، اشتراک برای خدمات، انتشار مواد و درخواست خدمات دیگرمورد نیاز است ، از جمله ایمیل، شماره تلفن، شناسه (ID) در شبکه های اجتماعی، نام کاربری و رمز عبور، تا امکان استفاده از بازی را فراهم کند.\n11.  شرکت می تواند هر گونه اطلاعاتی را در زمان ثبت نام جهت شرکت کاربر در رویداد هایی که از طرف شرکت برگزار می شود، از کاربر در خواست کند.\n12. شرکت حق دارد و می تواند تمام مکاتباتی که از طرف کاربر برای بیان مشکلی در رابطه با بازی و خدمات آن با شرکت انجام می شود را نگهداری و ذخیره کند.\n13. شرکت ممکن است از کاربر بخواهد در نظرسنجی ها شرکت کند و اطلاعات خاصی را در جریان نظرسنجی ها درخواست کند، اما این یک روش اجباری نیست و هر کاربر می تواند در خواست شرکت برای شرکت در نظر سنجی را رد کند.\n14. زمانی که کاربر از هر نوع سرویسی برای پرداخت خود استفاده می کند، شرکت می تواند جزئیات معاملات و اطلاعات پرداخت کاربر را جمع آوری و پردازش کند.\n15.  مرورگر کاربر یا یک برنامه سرویس گیرنده ممکن است اطلاعات خاصی را درباره جزئیات بازدیدهای وب سایت های بازی و خدمات بازی، از جمله اطلاعات مربوط به ترافیک، فایل های log-file، اطلاعات مربوط به موقعیت جغرافیایی رایانه کاربر و امکانات آن، و سایر اطلاعات را منتقل کند. کاربر در اینجا می پذیرد که شرکت می تواند از این اطلاعات برای اهداف و روش مندرج در این سیاست استفاده کند.\n16.  شرکت ممکن است اطلاعات دیگری مانند جنسیت، سن، تاریخ تولد و تنظیمات بازی برای انجام برخی اقدامات از کاربر درخواست کند.\n17.  شرکت ممکن است سایر اطلاعات مندرج در توافقنامه و هر یک از اسنادی که بخش جدایی ناپذیر از  EULA (توافق نامه کاربر نهایی) است، را جمع آوری، پردازش و استفاده کند.\nموافقت کاربر\n18. در صورت ثبت نام ، خدمات پرداخت شده یا هر فرم ثبت نام دیگری که در بازی یا سرویس های بازی استفاده می شود و کاربر هرگونه اطلاعات شخصی را فراهم می کند، به این معنی است که کاربر به صراحت رضایت مستقیم و قطعی خود را نسبت به این سیاست، توافق نامه و هر سندی که بخشی از توافقنامه است، اعلام کرده و این امر به این معنی است که کاربر به صراحت رضایت مستقیم و قطعی خود را در مورد جمع آوری، پردازش، استفاده، ذخیره، افشا، انتقال، انتقال بین المللی (انتقال به کشورهای سوم)و تخریب هر گونه اطلاعات شخصی کاربر، برای اهداف ارائه شده توسط این سیاست، توافقنامه و هر گونه اسنادی که بخشی از توافقنامه هستند را نیز اعلام می کند.\n19. اطلاعات شخصی فقط برای مقاصد قانونی و به ویژه به دلایل زیر جمع آوری می شود:\na.\t تایید جزئیات کاربر؛\nb.\tثبت نام حساب کاربری با شرکت؛\nc.\tارتقاء و بازاریابی فعالیت ها؛\nd.\tانطباق با قوانین قابل اجرا\ne.\tارائه سرویس کاربری با هر گونه خدمات اضافی مانند پشتیبانی فنی مربوط به بازی؛ که ممکن است شرکت ارائه دهد، به صورت صحیح و مناسب در اختیار کاربر قرار بدهد.\nf.\tعملکرد و تحقق این توافقنامه و تمام اسنادی که بخشی جدایی ناپذیر از توافقنامه شرکت هستند، توسط تأمین کنندگان آن و / یا هر شخص سومی که از طرف شرکت عمل می کند.\n20.  شرکت حق دارد جمع آوری و استفاده از هر گونه اطلاعاتی را که مطابق با قانون حاکم بر اطلاعات شخصی محسوب نمی شود، مورد استفاده قرار دهد و کاربر این مساله را می پذیرد که شرکت ممکن است چنین اطلاعات غیر شخصی را در اختیار هر شخص سومی قرار بدهد.\n21. کاربر حق دارد در برابر پردازش و جمع آوری اطلاعات شخصی خود مخالفت کند و حق رضایت را در هر زمانی را لغو می کند، مگر در مواردی که توسط قانون حاکم تعیین شده باشد. هرگاه چنین کاربری رضایت خود را از دست می دهد، درک می کند و می پذیرد که این مساله ممکن است تاثیر منفی بر کیفیت بازی ها و امکانات آنلاین و همچنین امکان دسترسی به بازی و / یا سرویس های بازی که در اختیار کاربر قرار می دهند داشته باشد و می پذیرد که شرکت در این مورد مسئولیتی در قبال خسارت و / یا آسیب به اطلاعات شخصی کاربر ندارد.\nاستفاده و پردازش اطلاعات شخصی\n22. کاربر به این ترتیب می پذیرد که شرکت حق دارد که اطلاعات شخصی را که مورد نیاز شرکت برای استفاده از بازی است، ذخیره و پردازش کند.  علاوه بر این کاربر می پذیرد و می داند که تمام فعالیت ها در داخل بازی ثبت می شوند.\n23. اطلاعات شخصی که توسط کاربر افشا شده، توسط شرکت به منظور ارائه مناسب و کیفی خدمات بازی به کاربر؛ و به منظور توسعه و بهبود، برای انجام موافقت نامه و سایر اقدامات مشخص شده در توافقنامه، قوانین بازی و این سیاست مورد استفاده قرار میگیرد. انجام فرآیند های لازم در مورد اطلاعات شخصی از جمله: جمع آوری، ضبط، ساماندهی، طبقه بندی، ذخیره سازی، انباشت، به روز رسانی، اصلاح، گروه بندی، مسدود کردن، استفاده، افشا، انتقال، انتقال به اشخاص سوم، انتشار، تخریب، حذف و سایر اقدامات لازم برای انجام توافق.\n24. شرکت اطلاعات شخصی کاربر را نمی فروشد و چنین اطلاعاتی را به اشخاص سوم به جز موارد مندرج در این سیاست ارائه نمی کند. این شرکت ممکن است اطلاعات عمومی جمعیت شناختی و آماری را به شرکای تجاری یا تبلیغ کنندگان افشا کند. این مساله به طور مستقیم به اطلاعات شخصی مرتبط نیست و امکان شناسایی یک کاربر خاص وجود ندارد.\n25. برای اطمینان از ارائه خدمات مناسب، شرکت حق انتقال اطلاعات شخصی را به اشخاص یا سازمان های دیگر که خدمات میزبانی، خدمات پرداخت، خدمات مربوط به ارسال ایمیل و مدیران را فراهم می کند را دارد.  این افراد و سازمان ها حق استفاده از اطلاعات شخصی دریافت شده را تنها برای ارائه خدمات به کاربران و تحت شرایطی دارند که اطمینان استفاده مناسب از اطلاعات شخصی فراهم است.\n26. کاربر قبول می کند که شرکت حق انتقال اطلاعات شخصی به هر شخص وابسته به شرکت را با هدف ارائه و بهینه سازی مناسب و با کیفیت بالای خدمات بازی و به منظور بهبود سرویس های بازی برای عملکرد موافقتنامه، قوانین بازی و این سیاست ها را دارد.\n27.  اطلاعات شخصی شرکت ممکن است در آینده از طریق روند سازماندهی مجدد و / یا ادغام و / یا فروش و / یا خرید و / یا انحلال و / یا از طریق هر فرآیند دیگر، همراه با شرکت یا بخشی از آن منتقل شود و یا ممکن است به عنوان بخشی از شرکت فروخته شود.\n28. کاربر قبول می کند که شرکت حق و تعهد به افشای اطلاعات شخصی را در هنگام دریافت دستور به انجام آن توسط تصمیم گیری ناشی از قانون حاکم و / یا هر مقام قضایی معتبر دیگر و / یا در صورت دستور به انجام این کار توسط سازمان تنظیم مقررات و / یا به دستوری که توسط کمیته حفاظت از داده ها و / یا در صورتی که کاربر به طور مستقیم و یا به طور غیر مستقیم درگیر در هر جرمی که به نحوی شامل بازی و / یا خدمات شرکت می باشد، را دارد.\n29.  کاربر موافقت می کند که در صورتی که شرکت ادعایی از اشخاص سوم (صاحبان حق نسخه برداری) در مورد نقض حقوق کاربران برای مواد مندرج در بازی و / یا خدمات بازی، دریافت کند، شرکت حق دارد اطلاعات مربوط به چنین کاربری را به شخص سوم  (دارنده حق نسخه برداری) ارائه کند.\n30. اگر کاربر وارد بازی و / یا ثبت نام در بازی از طریق سایت های اشخاص سوم و / یا از طریق سایت های شرکای شرکت کند، چنین اشخاصی می توانند درخواست شخصی، جمع آوری و پردازش اطلاعات شخصی کاربر را به منظور خدمات مناسب و با کیفیت بالا را داشته باشند. سیاست های حریم خصوصی و کوکی های شخص سوم در این مورد اعمال خواهد شد. کاربر قبول می کند که شرکت حق دارد انتقال اطلاعات شخصی کاربران را به این افراد به منظور ارائه مناسب و با کیفیت مناسب خدمات بازی، اجرای موافقتنامه، قوانین بازی و این سیاست ارائه کند.\n\nذخیره اطلاعات شخصی\n31. شرکت اقدامات لازم را برای ذخیره سازی مناسب و ایمن اطلاعات شخصی جمع آوری شده کاربر مطابق با شرایط این سیاست انجام خواهد داد. تمام اطلاعات ارائه شده توسط کاربر در سرورهای شرکت ذخیره می شود.\n32. شرکت باید از یک تکنولوژی استاندارد که شامل فایروال ها برای اطمینان از ایمنی اطلاعات شخصی است، استفاده کند.\n33. کاربر موظف است اطلاعات شخصی یا حساب کاربری خود را، برای دریافت مجوز حضور در بازی، به اشخاص سوم، افشا نکرده و یا انتقال ندهد. کاربر مسئول ذخیره اطلاعات حساب خود است.\n34. اگر کاربر متوجه شود که اطلاعات حساب کاربری اش سرقت شده و یا در اختیار شخص سوم قرار دارد، باید بلافاصله در این  موارد شرکت را مطلع سازد تا شرکت بتواند اقدامات لازم را انجام دهد. در چنین مواردی شرکت نمی تواند ایمنی اطلاعات شخصی کاربر را تضمین کند و به این ترتیب کاربر می پذیرد که شرکت برای استفاده از این اطلاعات شخصی مسئولیتی نخواهد داشت.\n35.  هنگامی که کاربر در داخل بازی یا سرویس های بازی (با استفاده از اتاق چت، انجمن و غیره) ارتباط برقرار می کند،  می داند که چنین ارتباطی از طریق سرور شرکت انجام می شود و موافقت می کند که این داده ها ممکن است جمع آوری، ذخیره و مطالعه شوند شرکت هیچگونه مسئولیتی در مورد محرمانه باقی ماندن اطلاعات شخصی و / یا سایر اطلاعاتی که کاربر به سایر کاربران (ها) از طریق بازی، خدمات بازی یا سایر خدمات مرتبط با بازی( با استفاده از اتاق چت، انجمن، انجمن های اجتماعی ، و غیره) قرار می دهد، نداشته و این حق را دارد که این اطلاعات را در معرض عموم قرار گرفته و افشا شده تلقی کند.\n\nکوکی ها، IP آدرس ها و log-file ها( فایل اطلاعات ورود و خروج به بازی)\n36. شرکت می تواند اطلاعات مربوط به رایانه کاربر، پرونده های ورودی، از جمله آدرس IP، نوع سیستم عامل، مرورگر و سرویس گیرنده ایمیل، اطلاعات مربوط به ترافیک، تاریخ و زمان، اطلاعات مربوط به بازدید از خدمات بازی، فعالیت کاربر، اطلاعات در مورد دسترسی ها، تنظیمات، و اعلان های سیستم را جمع آوری و پردازش کند. این اطلاعات در مورد اقدامات کاربران در سایت اینترنتی برای اداره سیستم ها، اطمینان از کارکرد مناسب بازی و خدمات بازی برای اهداف ایمنی و تقویت حفاظت و تضمین یکپارچگی سیستم (پیشگیری از هکر حملات، دسترسی غیر مجاز) جمع آوری و ذخیره می شود.\n37. شرکت از کوکی ها برای کارکرد درست بازی استفاده می کند. کوکی ها اطلاعات متنی ثبت شده کوچکی هستند که به صورت خودکار در رایانه / تجهیزات دیگر کاربر ذخیره می شوند تا فعالیت و ارتباط آنها با کاربر مشخص شود (از این به بعد عنوان «کوکی ها» به آنها اشاره خواهد شد). کوکی ها به طور معمول شامل نام و / یا آدرس ایمیل و / یا سایر اطلاعات شخصی نیستند. در واقع آنها معمولا حاوی اطلاعات ناشناسی هستند که برای عملکرد بهتر بازی و / یا خدمات بازی مورد نیاز است.\n38. کوکی های ذخیره شده در رایانه کاربر / یا هر وسیله دیگری که از طریق آن کاربر از بازی و / یا موارد جانبی آن را در میان دیگر برنامه ها  بدون محدودیت از آنها استفاده می کند؛ عملکرد های زیر را در بر می گیرد: \na. ارائه دسترسی به حوزه های امنیتی که کاربر درخواست کرده است، بدون این کوکی ها خدماتی را که درخواست کرده اید مانند ورودی امن ارائه نمی شود؛\nb. از کوکی ها بازدید کنید - به خاطر داشته باشید که گزینه ها و / یا تنظیماتی که کاربر به وجود آورده است برای فعال کردن تشخیص کاربر هنگام استفاده از بازی به کار می روند. بدون چنین کوکی هایی قابلیت و عملکرد بازی ممکن است مختل شود؛\nc. کوکی های رای گیری (Survey) - علامت گذاری موارد هر گونه نظرسنجی که کاربر به آن رای داده است را بر عهده داشته و مانع از رأی دادن کاربر در همان نظرسنجی می شود.\nd. بارگیری کوکی های تعادلی - بهبود زمان بارگذاری بازی با گسترش بار کاری و بهینه سازی زمان بندی خدمات بازی را بر عهده دارند. بدون این کوکی ها قابلیت بازی ممکن است از بین برود؛\ne . کوکی های سفارشی سازی رابط کاربری که امکان ذخیره تنظیمات رابط کاربر را در صورت ورود تکراری به سرویس های بازی و خود بازی فراهم می کنند.\nf .کوکی ها برای هماهنگ سازی با داده های کاربر در شبکه های اجتماعی مورد استفاده قرار می گیرند.\ng . کوکی های عملکردی (تجزیه و تحلیل) - جمع آوری اطلاعات ناشناس در مورد نحوه استفاده کاربر از بازی را بر عهده دارند.\nh. کوکی های تبلیغاتی – فرستادن تبلیغات خاص به یک کاربر خاص و کمک به بهبود کارایی برنامه های تبلیغاتی را بر عهده دارند. کاربر در اینجا می پذیرد و موافق است که شرکت ممکن است از این کوکی ها برای برنامه های تبلیغاتی خود استفاده کند.\n39. شرکت همچنین ممکن است به اشخاص سوم اجازه دهد تا از عملکرد خود (تجزیه و تحلیل) و کوکی های تبلیغاتی خود در تجهیزات کاربر و استفاده از اطلاعات کوکی های شرکت برای ذخیره و تجزیه و تحلیل اطلاعات مربوط به تنظیمات کاربران و بهبود کیفیت خدمات استفاده کنند. در خصوص چنین موردی شخص سومی تحت این سیاست قرار خواهد داشت. شرکت تضمین می کند که تنها به اشخاص سوم معتبر اجازه چنین استفاده ای را می دهد.\n40. کاربر می داند که با استفاده از این بازی از طریق هر سایت شبکه اجتماعی، مانند فیس بوک، ممکن است کاربر به سیاست های کوکی خاص مربوط به سایت شبکه های اجتماعی متصل باشد و کاربر می پذیرد که شرکت در مورد چنین کوکی هایی هیچ گونه مسئولیتی ندارد.\n 41. با استفاده از بازی و / یا امکانات اینترنتی یا پذیرش توافقنامه (از جمله این سیاست) و / یا کلیک روی «پذیرش» کاربر این سیاست را درک کرده و پذیرفته و رضایت مستقیم و قطعی خود را در خصوص اینکه ممکن است شرکت از کوکی ها در رایانه کاربر / هر وسیله دیگری که از طریق آن کاربر از بازی و / یا موارد جانبی آن استفاده می کند، اعلام کرده است. شرکت می تواند همچنان فرض کند تا زمانی و / یا مادامی که کاربر کوکی ها را همانطور که در اینجا عنوان شده است از طریق تنظیمات مرورگر غیر فعال نکرده است، موافق این سیاست است.  با ارائه این رضایت، کاربر به شرکت امکان درک بهتر کاربران و تمایلات آنها، توسعه و بهبود کیفیت خدمات با توجه به منافع کاربران را می دهد. کاربر با این امر موافق است که بدون فعال کردن کوکی ها بازی ممکن است به درستی کار نکند.\n42.  شرکت تضمین می کند که کوکی های ذخیره شده برای کاربران امن و کاملا برای عملکرد عادی بازی ها و خدمات بازی و برای ارائه خدمات به کاربران توسط شرکت ضروری است.\n43. کوکی ها بیش از یک سال ذخیره نمی شوند. شرایط نگهداری کوکی ها به وسیله شخص سوم باید توسط خود آن شخص ایجاد شود.\n44. کاربر می تواند در هر زمان، از قبول کوکی ها خودداری کرده و کوکی ها را با انجام تغییر در تنظیمات مرورگر خود غیر فعال کند. غیرفعال کردن کوکی ها ممکن است تأثیر منفی بر کیفیت بازی و امکانات آنلاین داشته باشد و همچنین ممکن است باعث عدم امکان دسترسی به بازی و امکانات آنلاین شود و کاربر موافقت می کند که شرکت هیچ گونه مسئولیتی در قبال خسارت و یا آسیب وارده به اطلاعات کاربر در مواردی که کاربر کوکی ها را غیر فعال کرده است، ندارد.\n\nدریافت و تغییر اطلاعات شخصی کاربر\n45. کاربر می تواند در هر زمان برای دریافت یک نسخه از \"اطلاعات شخصی کاربر\" که توسط شرکت ذخیره شده است، با شرکت تماس گرفته و در صورت لزوم هر گونه اشتباهی را اصلاح کند. کاربر حق دارد که اطلاعات شخصی خود را حذف، تصحیح، اصلاح یا تکمیل کند. برای تماس با شرکت در خصوص موارد مربوط به اطلاعات شخصی کاربری، کاربر باید به آدرس الکرونیکیhelp@tankionline.com  ایمیل ارسال کند.\n\nرد ارائه هرگونه اطلاعات شخصی\n46. هر گونه ارائه اطلاعات شخصی توسط کاربر به شرکت، به صورت داوطلبانه می باشد. با این وجود، شرکت نمی تواند تضمین کند که خدمات بازی و / یا بازی در صورت عدم ارائه هرگونه اطلاعات شخصی در هنگام درخواست،  باید به طور کامل عمل کند.\n\n\nسایت های شبکه اجتماعی\n47. کاربر تایید می کند که می داند و پذیرفته است که انجام بازی از طریق هر سایت شبکه اجتماعی یا دیگر سایت های مربوط به شخص سوم دیگر،  ممکن است کاربر را مجبور به پذیرش شرایط و ضوابط ان سایت کند.\n\nتغییرات سیاست\n48.  این سیاست تا تاریخ آخرین نسخه معتبر است. این سیاست ممکن است در هر زمان بدون اطلاع قبلی یا بعد از اعلان به کاربر تغییر، اصلاح، و یا جایگزینی در هر شکلی داشته باشد، بنابراین ما توصیه می کنیم به طور مرتب این سیاست را مطالعه کنید تا از تمام تغییرات مطلع شوید. هر گونه استفاده بیشتر از خدمات بازی و بازی به معنای قبول بدون قید و شرط نسخه اصلاح شده این سیاست است.\n\nتماس با شرکت\n49. در صورت داشتن سؤال، اظهار نظر، شکایات یا نظرات مربوط به این سیاست، لطفا با ما در help@tankionline.com  تماس بگیرید. ما سؤالات شما را در اسرع وقت بررسی خواهیم کرد.\n50. شرکت ممكن است درخواستهاي مكرر غیر منطقی را كه نيازمند تلاشهاي فني ناسازگار است، و باعث به خطر افتادن حريم خصوصي كاربران ديگر می شود و يا بسيار غیر عملی می باشد را نپذیرد.\n51. شرکت حق دارد و می تواند تمام مکاتباتی که از طرف کاربر برای بیان مشکلی در رابطه با بازی و خدمات آن با شرکت انجام می شود را نگهداری و ذخیره کند. "
