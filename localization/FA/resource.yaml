  CONSEQUENCES_EXTERNAL_LINK_FOLLOWING: |-
    ما برای مطالب این سایت مسئولیتی نداریم و به شدت به شما توصیه می کنیم اطلاعات حساب کاربری خود را در آن وارد نکنید(به خصوص آدرس ایمیل و رمز ورود).

    اگر دلیل خاصی برای استفاده از این سایت ندارید، پیشنهاد می شود وارد آن نشوید.

    به یاد داشته باشید، ما هرگز کریستال مجانی از طریق سایت یا ایمیل ارسال نمی کنیم و هیچوقت کلمه عبور شما را از شما درخواست نمی کنیم. تنها شرکت سورنا و وب سایت سرگرمی یکسری هدایا می توانند به شما بدهند ولی به هیچ عنوان هیچ کدام از آنها هم از شما کلمه عبور را درخواست نمی کنند.
