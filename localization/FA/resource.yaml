 حق استفاده از بازی به صورت رایگان و به صورت پرداخت در شرایط خاص به یک کاربر تحت شرایط مجوز ساده غیر انحصاری و مجوز قابل لغو در میزان و در شرایطی که توسط EULA  مشخص شده است.\n\"نرم افزار\" به معنای نرم افزار مجاز شرکت است که شامل همه برنامه ها و پایگاه های داده و هر محتوای دیگری از بازی است که ممکن است نیاز به دانلود داشته باشد، چه در دسترس کاربر باشد یا اینکه با استفاده کاربر از سایت اینترنتی ، به کاربر امکان حضور در بازی را  بدهد.\n\"استفاده از بازی\" به معنی تمام انواع مجاز و ممکن استفاده از بازی است که شامل شروع بازی توسط کاربران و / یا استفاده از امکانات فنی بازی به صورت رایگان و یا با پرداخت هزینه و / یا نصب بازی و / یا هر اقدام دیگری که برای اجرای بازی ضروری است.\n\"نام کاربری\" نام مستعار انتخاب شده توسط کاربر در زمان ثبت حساب کاربری است.\nاصطلاحات دیگر، تعاریف و ترکیب کلمات در مورد بازی باید معنی و تفسیری داشته باشد که به صورت عادی برای آن اصطلاح، تعریف و ترکیب ، کلمات در زمینه های فناوری های اینترنتی، بازی های دیجیتال و مطابق با قوانین حاکم؛ به کار  رود.\n\n\n\n\n شرایط عمومی\nپذیرش این توافقنامه مجوز کاربر نهایی (EULA):\n1 کاربر با استفاده از بازی ها و / یا امکانات اینترنتی در هر شیوه ای و / یا کلیک روی \"پذیرش\" در فرم ثبت نام، تایید می کند که این متن را خوانده، درک کرده، و با موافقت بدون قید و شرط این EULA و به عنوان زیر مجموعه هر گونه اسناد تشکیل دهنده و جدایی ناپذیر از این EULA ان را پذیرفته و کاربر به این ترتیب تضمین می کند که  برای استفاده از بازی با توجه به قانون حاکم و هر قانون دیگری که قابل اجرا است، از همه قدرت خود استفاده خواهد کرد.\n2. اگر کاربر با این EULA موافق نیست، حق استفاده از بازی و سایت اینترنتی را ندارد و باید بلافاصله سایت اینترنتی را ترک کرده و از استفاده از بازی خودداری کند.\n3. در پذیرش این توافقنامه، کاربر تأیید و تضمین می کند که او فرد قابل شناسایی است و او دارای همه امکانات لازم برای ورود به توافقنامه و استفاده از بازی است، و هیچ محدودیت قانونی برای استفاده از خدمات بازی و خود بازی برای او وجود ندارد و تمام مجوزهای لازم را در قالب الزامات قانونی به دست آورده است.\n4. با استفاده از بازی ها و / یا امکانات اینترنتی در هر شیوه ای و / یا کلیک روی \"پذیرش\" در فرم ثبت نام، کاربر تایید می کند که می خواهد و موافق دریافت پیام های الکترونیکی (ایمیل)، خدمات پیام کوتاه (پیام ها در مورد اخبار و / یا به روز رسانی در بازی، تبلیغات و موارد تبلیغاتی شرکت یا شرکای شرکت) (از این به بعد بع عنوان \"پست الکترونیکی\" شناخته می شود) منتشر شده توسط شرکت / اداره و / یا شرکای شرکت، می باشد؛ که شامل موارد شبکه های مخابراتی، با استفاده از تلفن، فکس، تلفن همراه، ارتباطات رادیویی و سایر ابزارها هستند اما تنها به آنها محدود نمی شوند.  ارائه آدرس ایمیل و / یا شماره تلفن توسط کاربر تایید مجددی مبنی بر رضایت کاربر برای دریافت ایمیل به هر طریق و انتقال اطلاعات شخصی کاربر به شرکای شرکت است.\nاز لحظه ای که کاربر رضایت خود را به دریافت پست الکترونیکی اعلام می کند، اداره / شرکت و / یا شرکای شرکت حق ارسال پیام ها در هر زمینه ایی به کاربر (از جمله، ایمیل ها و سرویس های پیام کوتاه و...) را دارند. \n5. اگر کاربر نمی خواهد ایمیل های الکترونیکی از شرکای شرکت دریافت کند، می تواند از طریق لینک مشخص شده در قسمت پایین پیام الکترونیکی، هر زمان که بخواهد از دریافت ایمیل امتناع کند. اگر کاربر نمی خواهد ایمیل الکترونیکی را از اداره / شرکت دریافت کند، می تواند هر زمان با انجام تنظیمات شخصی مربوطه در بازی این مساله را مشخص کرده، و در نتیجه از دریافت اخبار جدید، خودداری کند.\n6. استفاده از بازی، سایت اینترنتی، موارد و سایر اطلاعات موجود در بازی تنها به موجب این EULA  قابل استفاده بوده و این EULA همراه با اسنادی که بخش جدایی ناپذیر آن می باشند؛ کل توافقنامه بین کاربر و شرکت برای استفاده از بازی را در بر می گیرند.\n7. این EULA همراه با اسنادی که بخشی جدایی ناپذیر آن می باشند، از زمان هرگونه استفاده از بازی و / یا امکانات آنلاین و / یا با کلیک روی \"من موافق هستم\" در فرم ثبت نام، بلافاصله موثر خواهد بود. این EULA همراه با اسنادی که بخشی جدایی ناپذیر آن می باشند، مرجع اصلی ارجاع برای هر مشکل / اختلاف مربوط به استفاده از بازی، سایت اینترنتی، نرم افزار و / یا خدمات شرکت هستند.\n8. شرکت قابلیت عملکرد بی وقفه و بدون تداخل بازی را تضمین نمی کند؛ همچنین تضمین نمی کند که بازی با انتظارات کاربر مطابقت داشته باشد و همچنین تضمین دیگری را که در این EULA مشخص نشده باشد (قرار نداشته باشد) ارائه نمی کند. کاربر در اینجا موافقت می کند که شرکت مسئول هیچ گونه صدمات مستقیم یا غیرمستقیم ناشی از استفاده از بازی نخواهد بود.\nاصلاح  توافقنامه مجوز کاربر نهایی (EULA):\n1.\tبه این ترتیب، شرکت حق تعلیق، افزودن، پایان دادن، اصلاح و / یا تکمیل، این EULA همراه با اسنادی که بخشی جدایی ناپذیر آن می باشند در هر زمان که مناسب ببیند را دارد، در این صورت شرکت موظف است قبل از این کار به شرح زیر اطلاع رسانی کند: شرکت نسخه بروزرسانی شده این EULA را در وب سایت اینترنتی ارسال خواهد کرد و ممکن است چنین اطلاع رسانی های دیگری را نیز به صلاحدید خود انتخاب کند. هر تغییری به مدت ده (10) روز از زمان ایجاد تغییرات مربوطه اجرائی خواهد شد. هرگونه استفاده بیشتر از بازی و / یا وب سایت اینترنتی با سایر امکانات آنلاین به معنای قبول بدون قید و شرط نسخه اصلاح شده ، این EULA همراه با اسنادی که بخشی جدایی ناپذیر آن است.\n2. همه تغییرات و موارد اضافه شده به ، این EULA همراه با اسنادی که بخشی جدایی ناپذیر آن می باشد ممکن است مربوط به گذشته برنامه بوده و به رابطه قبلی بین طرفین مربوط باشد.\n3. شرکت به شدت توصیه می کند که هرچند وقت یک بار کاربر این EULA را مطالعه کند تا از هر نسخه اصلاح شده این EULA مطلع شود، در صورت مخالفت کاربر با هر یک از بخش های این EULA؛ باید بلافاصله استفاده از بازی و / یا سایت اینترنتی را متوقف کند و کاربر مسئولیت اعلام مخالفت با این موارد را به شرکت دارد تا شرکت اقدامات لازم را اتخاذ کند که ممکن است شامل جلوگیری از امکان استفاده از بازی و / یا سایت اینترنتی و هر تسهیلات آنلاینی برای کاربر باشد.\n4. شرکت هیچ تعهدی برای بررسی اینکه آیا کاربر از بازی و / یا سایت اینترنتی بر اساس نسخه به روز شده این EULA استفاده می کند؛ ندارد. نسخه ارسال شده در سایت اینترنتی نسخه اجرائی است و کاربر باید از آن به عنوان مرجع استفاده کند. این مسئولیت کاربر است که خود از این  EULA مطلع شود و همچنین با تغییراتی که بر کاربر و یا اراده کاربر ممکن است  تاثیر گذار باشد ، آشنا باشد.\n\n\nصدور مجوز\n1.\tبا توجه به شرایط مندرج در اینجا، شرکت به این وسیله به کاربر مجوز محدود، ساده و غیر انحصاری را که مربوط به استفاده از بازی برای کاربر شخصی و غیر تجاری است، اعطا می کند.\n2. شرکت حق استفاده از بازی به صورت مستقل و یا با ارائه مجوز برای استفاده سایر افراد را دارد.\n3. به این وسیله کاربر تایید می کند که مجوز بازی که به او داده شده است، منحصر به شخص او است و کاربر نباید این مجوز را به هر شخص سوم دیگری انتقال دهد و یا اعطا کند.\n4. مدت این مجوز باید از  اولین استفاده کاربر از بازی آغاز شود و زمانی که کاربر استفاده از بازی را متوقف کند، به پایان می رسد؛ و یا زمانی که این EULA توسط شرکت متوقف شود، مدت مجوز نیز پایان می یابد. در صورتی که کاربر بر خلاف این EULA و / یا هر سندی که بخشی از این EULA است، عمل کرده و آن را نقض کند، فورا این مجوز پایان می یابد. \n5. مجوز باید برای مدت اعتبار حق انحصاری شرکت نسبت به بازی، معتبر باشد.\n6. مجوز باید در تمامی حوزه های قضایی معتبر باشد.\n7. انتقال حق انحصاری بازی به صاحب جدید، نمی تواند دلیل از بین رفتن یا متوقف شدن این EULA باشد.\n\n\n\nحقوق مالکیت معنوی\n1. شرکت (و یا افراد وابسته به آن) صاحب منحصر به فرد و مالک انحصاری بازی، تمام موارد و تمام مالکیت های انحصاری دیگر موجود در بازی یا در ارتباط با بازی که تحت پوشش حقوق مربوط به حق ثبت اختراع، دانش فنی، علائم تجاری و سایر حقوق مالکیت معنوی و سایر مواد دیگر که معمولا در بازی و امکانات آنلاین یافت می شود، است.\n2. کاربر حق ارسال اجناس به شرکت، برای قرار دادن آنها درون بازی، در سایت و یا در سایر خدمات و سرویس های بازی را دارد، و با توجه به اینکه کاربر دارای همه حقوق لازم برای چنین اجناسی است؛ باید مسئولیت هر کالایی که در بازی قرار داده می شود را بر عهده بگیرد و کاربر به این ترتیب می پذیرد که به تنهایی به خاطر خسارت هایی که ممکن است در ارتباط با هر گونه کالا بوجود آید، مسئول باشد. کاربر تایید می کند که او تمامی حقوق مورد نیاز برای چنین کالاهایی را دارد و مسئولیت قرار دادن و استفاده از چنین کالاهایی با شخص خود او است.\n3. قرار دادن کالا، لینک سایت در بازی توسط کاربران یا اشخاص ثالث به این معنا نیست که شرکت چنین مواردی را تاید و توصیه می کند.. شرکت  هیچگونه مسئولیتی در قبال محتوای این کالاها و سایتها و همچنین هیچ یک از آسیب های مستقیم یا غیرمستقیمی ناشی از استفاده از این کالاها یا سایتها را ندارد.\n4. کاربر در اینجا موافقت می کند که شرکت حق هر گونه استفاده ی مناسب از کالاهایی که کاربر در بازی قرار می دهد و یا برای شرکت ارسال می کند (از جمله در موارد شرکت در یک رقابت) را دارد و از لحظه قرار گرفتن (انتشار) و یا ارسال این کالاها در بازی یا به شرکت، تمام حقوق فکری و معنوی برای استفاده از این کالاها  با هر روشی در هر کشور از جهان، به شرکت منتقل خواهد شد؛ از جمله برای اهداف تجاری، و حق برخورداری از استفاده از آن در هر مکان، اصلاح، انطباق، انتقال به اشخاص ثالث، ساخت کالا و یا وسای جانبی، بازسازی کالا، توزیع، حذف، بازتولید، نمایش عمومی، در دسترس عموم قرار دادن و تأثیر هرگونه تغییر، کاهش، افزودن، نظرات، توضیحات به کالا، انتشار کالا، برای استفاده از کالا و / یا غیره بدون مشخص کردن کاربر و بدون حق امتیاز و یا وفاداری و یا هر مورد دیگری.\nکاربر متعهد می شود مبانی حقوقی منحصر به فرد را در مورد کالای قرار داده شده توسط کاربر در بازی یا در سایت،  به شرکت ارائه دهد.\n5. هر گونه استفاده از اشیاء مالکیت معنوی قرار داده شده در بازی، در سایت یا سایر سرویس های بازی، به طور کامل و یا جزئی، بدون رضایت قبلی شرکت ممنوع است، به جز در مواردی که شرکت به طور صریح رضایت استفاده از کالا توسط افراد دیگر را اعلام کرده باشد.\n6. کاربر تایید می کند که هیچ کاری بر اساس بازی یا کالا های بازی به جز مواردی که توسط شرکت تعیین شده است، انجام نمی دهد.  اگر کاربر بدون اجازه کتبی شرکت، بر اساس بازی کار یا کالایی ایجاد کند ، نمیتواند از حقوق و کپی رایت خود برای کار ساخته شده استفاده کند.\n7.به این وسیله کاربر تایید می کند و می پذیرد که هیچ ادعاییی نسبت به مقدار ساعت هایی که صرف انجام بازی کرده است نداشته و تمام فعالیت های توسعه یافته در طی بازی، باید تحت مالکیت منحصر به فرد و انحصاری شرکت باشد.\n8. شرکت حق دارد هرگونه اطلاعات مربوط به فعالیت کاربر بر روی سایت اینترنتی و / یا بازی را در هر نوع لیست، بدون هر گونه اطلاع یا جبران نسبت به کاربر، نمایش دهد و منتشر کند.\n9. شرکت دارای تمام حقوق اختصاصی و حقوق مالکیت معنوی نسبت به تمام کالاهای موجود در بازی است و کاربر موافق است که هیچ حقوقی در مورد کالای درون بازی یا سایر محتواهای موجود در بازی ندارد، از جمله،کالاهای مجاز یا واحد پول مجازی که در بازی استفاده می شود. شرکت هیچ گونه انتقال عمدی از اموال مجازی به خارج از بازی، و همچنین فروش عمدی، اعطا و یا تبادل هر گونه کالا و اشیاء مورد استفاده در بازی و خارج از بازی را مجاز نمی داند، به استثنای اقداماتی که صریحا توسط شرکت مجاز عنوان شده است. 10 این شرکت حق غیر انحصاری و غیر قابل انتقال برای استفاده از کالاهای دیگر کاربران را در شرایطی به کاربر می دهد که مشاهده، تولید (از جمله کپی کردن)، پردازش (از جمله نسخه چاپی) و سایر حقوق فقط برای استفاده غیر تجاری باشد، به غیر از مواردی که چنین استفاده ای می تواند آسیب یا ضربه ایی به منافع محافظت شده شرکت ایجاد کند.\n\nحقوق و تعهدات کاربر\nبه این وسیله کاربر تایید کرده و موافق است که:\n1. کاربر موظف به رعایت و پذیرفتن شرایط این EULA، قوانین بازی، مقررات دیگر ضمیمه های این EULA، هر گونه اسناد دیگر که بخشی جدایی ناپذیر از این EULA و قوانین قابل اجرا هستند، می باشد. \n2. کاربر بدون اخذ رضایت نامه کتبی شرکت نمی تواند هیچ یک از موارد مرتبط با بازی، از جمله اقتباس، ساختن مواردی از بازی، نمایش، توزیع، اجاره، قرض، اصلاح، مجوز، ترجمه و / یا انتقال بازی را انجام بدهد. \n3. کاربر نباید کدهای بازی را باز نویسی کند، نباید کدها را جدا کند، و یا کارهای مشابه بر اساس، تولید کد منبع، مهندسی معکوس و / یا تلاش برای معکوس کردن بازی، انجام اقدامات دیگر با کد هدف یا کد منبع بازی، نقض هر سیستم حفاظتی، انجام غیرقانونی بازی و کسب اطلاعات در مورد تحقق الگوریتم های مورد استفاده در بازی،  و یا حق ساخت محصولات نرم افزاری الهام گرفته شده از بازی بدون رضایت کتبی شرکت را ندارد.\n4. کاربر نباید کدهای بازی را برداشت کند و یا تلاش کند کد را از هر جریان بسته ای که به بازی راه دارد خارج کرده و یا از طریق بازی، چه رمزگذاری شده باشد چه نباشد، کد ها را از بازی خارج کند.\n5. کاربر نباید داده های حساب کاربری را به اشخاص ثالث انتقال دهد.\n6. کاربر باید یک اتصال اینترنتی مناسب را حفظ کند و دسترسی به چنین اتصال اینترنتی را باید با هزینه خود پرداخت کند.\n7. کاربر موظف به بررسی و بازبینی شرایط توافقنامه و سایر اسنادی است که به طور منظم بخشی جدایی ناپذیر از این توافقنامه هستند.\n8. اگر کاربر ناقض این EULA و / یا هر سندی که بخشی از این EULA است، باشد ، باید از استفاده از بازی خودداری کند.\n9. کاربر حق استفاده از بازی را برای هر هدف شخصی و غیر تجاری دارد برای استفاده از تمام امکانات و خدمات بازی، برای انجام تمام اقدامات ارائه شده توسط بازی، برای شرکت در ارتباطات و اجتماعات در سایت اینترنتی با ارسال پیام ها، برای ارسال شکایات و پیشنهادها برای بهبود بازی به شرکت، اقدامات دیگری را که توسط بازی و / یا تایید شده توسط شرکت؛ کاربر از حقوق لازم برای استفاده از آنها برخوردار است.\n10. کاربر مجوز محدود و غیر انحصاری و با امکان لغو برای استفاده و بهبود اقلام مجازی در بازی را با استفاده از کریستال های به دست آمده در بازی (پول درون بازی) می تواند به دست آورد.\nحقوق و تعهدات شرکت\n1. شرکت می تواند هر گونه اقدام لازم را علیه هر کاربری (کاربرهایی) که شرایط اینEULA  و / یا اسنادی که بخشی از این EULA هستند را نقض میکند (می کنند) انجام دهد ؛ از جمله محدودیت و مسدود کردن دسترسی به بازی. شرکت می تواند چنین اقداماتی را طبق صلاحدید خود انجام بدهد.\n3. شرکت حق دارد هر گونه اطلاعات، محتویات و کالا (هایی) که بخشی از بازی و/ یا امکانات آنلاین است را بدون هیچ گونه اطلاع رسانی یا اخطار قبلی، حذف و یا تغییر دهد.\n3. شرکت حق دارد در هر زمان، بدون اطلاع قبلی یا پس از اطلاع به کاربر، به صلاح دید شرکت ، قابلیت های بازی و/ یا خدمات بازی را متوقف یا محدود بکند.\n4. شرکت حق دارد کیفیت و میزان خدمات ارائه شده را به طور یک جانبه، در هر زمان و به هر میزان و به هر حجم تغییر بدهد، و یا در صورت وجود هرگونه نیاز برای جلوگیری از ارائه خدمات، شرکت حق دارد که چنین سرویس رندری (سرویس ایجاد تصاویر بازی) را بدون اطلاع قبلی و / یا پس از اطلاع به کاربر؛ متوقف کند.\n5. شرکت به این وسیله می تواند به طور یک جانبه این مجوز EULA را لغو کند و از ارائه بازی به کاربر به تنهایی و بدون اطلاع قبلی و بدون هرگونه باز پرداخت به هر کاربر؛ امتناع کند.\n6. شرکت هیچ گونه مسئولیتی در قبال خسارت مستقیم یا غیرمستقیم ناشی از استفاده یا عدم امکان استفاده از بازی، خدمات بازی یا اطلاعات مربوط به بازی و همچنین در ارتباط با اقدامات سوم شخص، از جمله کاربران دیگر از بازی؛ ندارد.\n7. شرکت با رعایت این موافقت نامه توسط کاربر، امکان دسترسی به موضوع بازی را به وی می دهد.\n\nجمع آوری و استفاده از اطلاعات\n1. شرکت حق جمع آوری اطلاعات شخصی در مورد کاربر، برای رد گیری و ذخیره اطلاعات مربوط به آدرس های IP و استفاده از فایل های اطلاعات فنی (کوکی ها)، قرار داده شده در تجهیزات کاربر را دارد. شرایط، روش ها و اهداف جمع آوری، استفاده، پردازش، ذخیره سازی، افشا (انتقال) و حذف اطلاعات شخصی کاربران و شرایط مربوط به پایگاه ها، اهداف و روش های قرار دادن، استفاده، ذخیره و حذف کوکی ها در تجهیزات کاربران توسط سیاست حفظ حریم خصوصی و کوکی ها تنظیم می شود که بخشی جدایی ناپذیر از این EULA هستند.\n2. به این وسیله و با پذیرفتن این EULA کاربر  قبول می کند که بدون قید و شرط سیاست حفظ حریم خصوصی و کوکی ها و تمام شرایط آن را می پذیرد. هر گونه جمع آوری، ذخیره سازی، انتقال و استفاده توسط شرکت  ازاطلاعات شخصی کاربر، باید مطابق با سیاست حفظ حریم خصوصی و کوکی ها باشد که بخشی جدایی ناپذیری از این EULA است.\n\n\nضمانت نامه ها\n1. بازی و سایر موارد ارائه شده در ارتباط با آن از جمله هر گونه خطا در اتصال، بر اساس \"همان طور که هست\" ، و بدون هر گونه ضمانت از هر نوع ارائه می شود. کاربر باید تمام خطرات مرتبط با دسترسی و / یا بازی  و نیز استفاده از امکانات آنلاین را بپذیرد.\n2. در حالی که تمام تلاش های شرکت برای ایجاد بازی و امکانات آنلاین در دسترس همیشگی است، اما شرکت تضمین نمی کند که بازی و امکانات آنلاین همیشه در دسترس خواهند بود و یا کاربر با هیچ گونه خطایی در اتصال روبرو نخواهد شد.\n\nسوء استفاده از سایت اینترنتی\n\n1. وب سایت اینترنتی فقط برای اهداف قانونی مورد استفاده قرار می گیرد. استفاده از سایت اینترنتی برای انتقال، توزیع، انتشار یا نگهداری هر گونه مطالب در سایت یا  اعمال قانون یا مقررات قابل اجرا یا نقض حقوق هر شخص سومی از طریق وب سایت، به شدت ممنوع است. این مورد شامل (بدون محدودیت) استفاده از سایت اینترنتی برای انتقال، توزیع، انتشار یا ذخیره سازی هر گونه کالایی در وب سایت و یا از طریق وب سایت در یک موضوع یا برای هدفی است که نقض کپی رایت، علامت تجاری، اسرار تجاری و یا سایر حقوق مالکیت معنوی، ناخوشایند یا مضر  هر چقدر هم جزئی یا اقدام غیرقانونی یا آزار و اذیت، تهمت و افترا است، همچنین وب سایت اینترنتی هرگونه تجاوز به حریم خصوصی یا نقض  قوانین حفاظت از اطلاعات و هرگونه اقدام کلاه برداری و نفوذ و یا قوانین تبادلی قمار را رد میکند.\n2. در صورت استفاده غلط و / یا سوء استفاده از سایت اینترنتی، شرکت حق مسدود کردن حساب کاربری و جلوگیری از دسترسی کاربر به بازی و / یا جلوگیری از دسترسی به سایت بازی و وب سایت اینترنتی را داشته و یا می تواند با هرگونه اقدام قانونی دیگری که شرکت لازم بداند با کاربر برخورد کند.\n\nقوانین چت\n\n1. انجمن، اتاق چت و / یا خدمات اجتماعی ارائه شده توسط Tanki Online برای ارائه یک تجربه سرگرم کننده و دلپذیر در نظر گرفته شده است. بنابراین، هر گونه سوء استفاده و زبان توهین آمیز  و ناخوشایند تحمل نمی شود، و ، امتیازات چت کاربرانی را که بر استفاده از زبان توهین آمیز و یا ناخوشایند اصرار دارند لغو خواهد کرد و حساب کاربری لغو خواهد شد.\n2. کاربر آگاه است که هنگام ارسال یا آپلود هر گونه اطلاعات شخصی بر روی سایت اینترنتی، چنین محتوایی عمومی بوده  و قابل دسترس توسط سایر کاربران خواهد بود. Tanki Online به هیچ وجه چنین محتوایی را تایید نمیکند و مسئولیت هر نوع خسارت ناشی از انتشار چنین اطلاعاتی را بر عهده نمی گیرد. کاربران باید آگاه باشند که اطلاعاتی که آنها در وب سایت اینترنتی ارسال می کنند ممکن است بر روی زندگی آنها تاثیر بگذارد.\n3. محتویات ذخیره شده بر روی سرورهای شرکت برای مقاصد بایگانی دائمی یا موقت نیست. بنابراین،Tanki Online  مجبور به نگهداری نسخه پشتیبان از هر گونه مطالب ارسال شده در سایت اینترنتی نیست. شرکت حق دارد محدودیتی برای حداکثر ظرفیت ذخیره سازی برای هر کاربر اعمال کند.\n4. شرکت حق دارد هرگونه محتوایی را  که به نظر می رسد به رفتار توهین آمیز و یا نقض قوانین و / یا مقررات و / یا قوانین بازی است، حذف، انتقال و یا ویرایش کند. کاربر به تنهایی مسئول محتوای مطالب ارسال شده در سایت اینترنتی است. عدم رسیدگی توسط شرکت نسبت به حذف موارد خاص، به هیچ عنوان به معنی تایید و پذیرش آن توسط شرکت نخواهد بود.\n\nحساب کاربری\n\nافتتاح حساب کاربری\n\n1. حساب کاربری کاربر باید شخصا توسط کاربر ثبت شود و در نتیجه این شرکت از حق عدم ثبت نام یک حساب کاربری در سایت اینترنتی خود به هر کاربر به هر دلیلی و بدون توضیح قبلی خودداری می کند.\n2. وظیه کاربر است که مطمئن شود سوابق و اطلاعات ثبت شده اش در بازی ، به ویژه آدرس ایمیل به روز است. کاربر وظیفه دارد که بلافاصله هر گونه تغییرات در اطلاعات شخصی کاربری اش را به اطلاع شرکت برساند.\n3. شرکتTanki Online به شدت کاربر را از فروش، انتقال و / یا خرید حساب (ها) به سایر کاربران و اشخاص ثالث ممنوع می کند. انتقال وجوه / کریستالها در میان حساب (ها) کاربری مختلف برای کاربر ممنوع است.\n4. شرکت حق ثبت نام و یا لغو ثبت نام حساب کاربری کاربر را در صورت ارائه اطلاعات نادرست، غلط، فریبنده و یا ناقص به شرکت ، را دارد.\nنام کاربری\n1.\tپس از ثبت حساب، یک کاربر باید حق انتخاب نام کاربری را داشته باشد. این شرکت حق رد یا تایید هر گونه مدرک و نام کاربری را قبل و بعد از  ثبت این اسامی صادر یا تایید شده ، برای خود محفوظ می داند.\n2.\tدر صورتی که علاوه بر نام کاربری انتخابی، حساب کاربری مغایر با این EULA باشد، شرکت به کاربر امکان ایجاد یک اسم مستعار و / یا صفحه جدید و / یا نام کاربری را می دهد.\n\n\nامنیت رمز عبور\n\n1. شرکت هيچ مسئوليتي در قبال دسترسي نهايي به حساب کاربر توسط شخص را ثالث ندارد و هيچ مسئوليتي در قبال هرگونه خرابي ناشي از استفاده  نامناسب از ورود کاربر و رمز عبور توسط شخص ثالث، به صورت دسترسي غير مجاز، و / یا برای هر معامله ای که برای آن ورود و رمز عبور یک کاربر به درستی ثبت شده اس؛ را بر عهده نمی گیرد.\n2. شرکت هیچ گونه مسئولیتی در قبال فراموشی یا ثبت اشتباه نام کاربری و یا رمز عبور کاربر ندارد، مگر در مواردی که چنین زیانی ناشی از بروز یک خطا در بخشی از شرکت باشد و شرکت در هر زمان در طول ارتباط با کاربر، مسئول ذخیره هر ورود و رمز عبور نیست.\nمسدود کردن حسابها\n1. کاربر می تواند در خواست مسدود کردن حساب کاربر خود را با ارسال ایمیل به help@tankionline.com به شرکت اعلام کند.\n2. عدم ورود به بازی برای شش (6) ماه متوالی به شرکت اجازه میدهد که حساب کاربری را مسدود کند و بلافاصله پس از اخطار (یا اقدام به اطلاع) به کاربر این موافقتنامه به پایان میرسد.\n3. شرکت حق دارد در هر زمان به صورت اختیاری در صورت نقض شرایط  EULA توسط کاربر  ، قوانین بازی، و سایر مدارکی که بخشی جدایی ناپذیر از این EULA را تشکیل می دهند ،حساب کاربری کاربر را مسدود کند.\n\nفعالیت های مخرب و سوء استفاده از حساب\n\n1. شرکت دارای سیاست تحمل صفر (بدون تحمل) در برابر بازی های نامناسب و فعالیت های جعلی است و تمامی توافقنامه کاربر را از هر نوع زد و بند و تبانی منع کرده است. در صورتی که به تشخیص شرکت، کاربر تقصیر یا تلاش برای تقلب در بازی و یا تلاش برای کلاه برداری از شرکت و یا دیگر کاربران باری به هر نحو ممکن از جمله دستکاری در بازی یا تقلب در پرداخت، تبانی کاربر را داشته و یا اگر شرکت مظنون به پرداخت جعلی کاربر، از جمله با استفاده از کارت های اعتباری ربوده شده یا سایر فعالیت های جعلی (از جمله هر گونه بازپرداخت یا سایر معکوس پرداخت) یا معامله ممنوعه (از جمله پول شویی) باشد؛ شرکت حق توقف و بستن حساب کاربری و به اشتراک گذاشتن این اطلاعات (همراه با هویت کاربر) به هر شخص ثالث دیگر و / یا سازمان های مجری قانون که برای شرکت مناسب باشد؛ را برای خود محفوظ می داند.\n2. در صورت استفاده غلط و / یا سوءاستفاده از سایت اینترنتی و / یا بازی و / یا نرم افزار، شرکت حق دارد تا حساب کاربری کاربر را تا زمانی که موضوع بین مدیریت و این کاربر حل شود ، مسدود کند و هر گونه اقدام قانونی دیگری که ممکن است به نفع شرکت باشد را ، انجام دهد.\n\nخدمات غیر رایگان\n1. کاربران می توانند از خدمات پرداختی در بازی با خرید کریستال استفاده کنند. خرید کریستال ها می تواند تنها از طرف شخص ثالث مجاز انجام شود.\n2. Tanki Online به هیچ وجه اجازه انتقال مالکیت مجازی / کریستال ها  را در خارج از بازی نمی دهد. فروش، اعطا و یا تبادل هر گونه مواد، کریستال ها و یا اشیاء مورد استفاده در بازی ، در خارج از بازی ممنوع است.\n3. خدمات پرداخت شده از لحظه انتقال کریستال به حساب کاربری ارائه می شود. کاربر می داند که از زمان انتقال کریستال ها به حساب کاربری؛ هیچ گونه حقی نسبت به پرداخت خود نخواهد داشت.\nخرید کریستال\n\nقیمت گذاری\n\n1. فهرست و قیمت هر سرویس پرداخت شده در اختیار شرکت قرار می گیرد و می تواند در هر زمان معین تغییر کند.\n2. Tanki Online مسئولیتی برای و / یا پردازش پرداخت (های) کاربر ندارد، از جمله برای هر گونه تاخیر که ممکن است رخ دهد و یا هر تراکنش نا موفق. تمام پرداخت های انجام شده توسط کاربر داوطلبانه، قطعی و غیر قابل استرداد است.\n\nروش های پرداخت\n\n1. خرید کریستال ها تنها از طریق شرکت های واسط پرداخت و با یکی از روش های زیر و / یا هر روش دیگر که وب سایت ارائه می دهد، انجام خواهد شد:\na. کارت های اعتباری؛\nb. کارت های پیش پرداخت\nc. سیستم پرداخت PayPal\nd. پیامک؛\ne. پرداخت های موبایل؛ و\nf. دیگر روش ها.\n2. کاربر تایید می کند که وجوه استفاده شده در حساب از هیچ منبع غیر قانونی نیستد. کاربر اعلام می کند که به هیچ وجه از سایت اینترنتی یا نرم افزار به منظور انتقال چنین پولی از منابع غیر قانونی استفاده نمی کند. کاربر مطابق با قوانین تمام حوزه های قضایی که دارای اختیار بر او هستند از سایت اینترنتی و / یا بازی برای فعالیت های غیرقانونی یا جعلی و یا برای هر معامله غیرقانونی یا جعلی (از جمله پولشویی) استفاده نمی کند. این شرکت حق دارد تا زمانی که مسائل حل نشده باشد، و یا تا زمانی که شرکت نسبت به منبع قانونی پول استفاده شده توسط کاربر شک داشته باشد؛  تا هر زمان که لازم باشد حساب کاربر (ها) را قطع و یا مسدود کند.\n\nواحد پولی پرداخت\nتمام پرداخت ها به حساب و از حساب باید در ارزهای ارائه شده توسط نمایندگان پرداخت در هر زمان پرداخت شود و تمام پرداخت ها به حساب باید از منبع پرداختی باشد که کاربر به عنوان مسئول و مالک آن حساب شناخته می شود.\n\nایمنی خردسالان\n1. شرکت تضمین می کند که در تامین ایمنی خردسالان متعهد است. این شرکت به والدین و / یا نمایندگان قانونی خردسالان توصیه می کند در هنگام استفاده آنها از اینترنت ، درکنترل استفاده از بازی، سایت اینترنتی، حساب، هر گونه وسیله ارتباطی و / یا پرداختی برای خدمات موجود، با فرزندان خود زمان بیشتری را صرف کنند.\n2. اگر کاربر خردسال باشد، می تواند حساب کاربری را  تنها با رضایت قبلی والدین یا سرپرست قانونی خود ثبت کند. استفاده از هر شیوه پرداختی در اینترنت توسط یک خردسال به عنوان چنین رضایتی تلقی می شود.\n3. اگر کاربر کوچک باشد، والدین یا قیمین  قانونی باید فرایند ثبت نام را تکمیل نماید تا ثبت نام حساب کاربر با شرکت از طرف آن انجام شود. با توجه به این که در چنین مواردی، والدین یا سرپرست قانونی کاربر پذیرفته اند که او به طور کامل مسئولیت های ناشی از این EULA و سایر فعالیت های مادی را که مربوط به استفاده از بازی، اینترنت، سایت و / یا حساب، از جمله هر گونه استفاده غیر مستقیم و از جمله هر گونه پرداخت که ممکن است با استفاده از ورود و / یا حساب انجام شود؛ را بر عهده گرفته.\n4. شرکت حق دارد که مستندات را از والدین یا سرپرست قانونی فرد خردسال و یا هرگونه تاییدیه کتبی دیگری که شرکت ، برای انجام بازی توسط فرد خردسال و استفاده از سایت اینترنتی در نظر دارد ، درخواست کند.\n5. سرپرست قانونی و / یا پدر و مادر (ها) به این ترتیب تضمین می کنند که برای استفاده از بازی و / یا ثبت حساب از طرف فرد خردسال توسط سرپرست قانونی و / یا پدر و مادر، رضایت لازم را دارند.\n6. سرپرست قانونی و / یا پدر و مادر (ها) رضایت خود را نسبت به این EULA و اسناد جدایی ناپذیر این EULA  اعلام و تایید می کنند که آنها مسئولیت کامل را برای استفاده از خدمات بازی و خود بازی، سایت اینترنتی و حساب توسط فرد خردسال و همچنین برای هر پرداخت انجام شده از طریق حساب بر عهده دارند. استفاده از هر روش پرداخت نشان دهده این است که سرپرست قانونی و / یا پدر و مادر (ها) این رضایت را اعلام کرده اند. سرپرست قانونی و / یا پدر و مادر (ها) و کاربران این را قبول می کند که شرکت در قبال هر گونه استفاده از بازی، وب سایت و حساب توسط هر فردی که چنین مجوزی ندارد، هیچ گونه مسئولیتی نخواهد داشت.\n7. خدمات بازی ممکن است شامل محدودیت های سنی باشد که در عرف توصیه می شوند. سرپرست قانونی و / یا پدر و مادر (ها) و کاربران  در خصوص اینکه این توصیه ها را دنبال کنند یا نه؛ خود تصمیم می گیرند. شرکت مسئولیت استفاده از بازی توسط کاربرانی است که به سن قانونی نرسیده اند، را بر عهده ندارد. \n8. در صورت لزوم، والدین یا نمایندگان قانونی کودکان ممکن است از برنامه های ویژه ای برای محدود کردن دسترسی کودکان به خدمات خاص استفاده کنند که به امن تر شدن فضای اینترنت برای کودکان کمک می کند.\n\n\nمسئولیت های طرفین\n\n1. شرکت در قبال هر گونه از دست دادن یا آسیب، مستقیم یا غیر مستقیمی که کاربر یا شخص ثالث ممکن است به سایت اینترنتی، بازی و / یا امکانات آنلاین از جمله مواردی چون خسارت ناشی از عدم استفاده از بازی و امکانات آنلاین، خسارات مستقیم یا غیر مستقیم ناشی از اقدامات شخص ثالث، از جمله سایر کاربران بازی، عدم دسترسی به اینترنت، سرقت، تخریب مواد ، از دست دادن اطالعات مربوط به حساب کاربری و آسیب رساندن به نام، کرامت و شهرت کسب و کار در ارتباط با بازی، وارد کند ، هیچ گونه مسئولیتی ندارد.\nدر صورتی که شرکت به هر شکلی، توسط یک دادگاه قانون گذار و / یا یک مقام مشابه، با صلاحیت حقوقی و / یا صلاحیت قانونی بر آن، محکوم به استرداد یا پرداخت بدهی برای هر یک از ادعاهای ناشی از یک کاربر خاص شود؛ این مسئولیت محدود تا سقف مبلغ 100 یورو در مجموع برای همه ادعاهای یک کاربر می باشد.\n3. کاربر باید مسئولیتی و / یا بدهی که ممکن است از مواد قرار داده شده توسط کاربر در بازی و در ارتباط با هر گونه استفاده ای که کاربر از امکانات آنلاین می کند، را بپذیرد. \n4. هیچ یک از طرفین به هیچ وجه در قبال چیزی که خارج از این ضمانت می تواند باعث نقض  ضمانتنامه EULA ناشی از فجایع غیر مضاعف شود ، یعنی شرایطی که  فراتر از کنترل هر یک از طرفین باشد که شامل (اما نباید محدود به) موارد طبیعی خارج از توان انسان (خواست خدا؛ مث سیل، زلزله و...)، تهدیدات دریایی یا هوا، آتش سوزی، خشکسالی، انفجار، خرابکاری، تصادف، تحریم، شورش، دعوا مدنی یا مقامات مدنی، از جمله اقدامات دولت محلی و مجلس نمایندگان است، مسئولیتی بر عهده ندارد.\n5. کاربر باید به طور کامل شرکت و هر یک از وابستگان شرکت را در برابر تمامی ادعاهایش، زیان، خسارت و مطالبات ناشی از استفاده و دسترسی کاربران به بازی و امکانات آنلاین بیمه کند (زیان آنها را بر عهده بگیرد).\n \nحل اختلاف و قانون حاکم\n1. به این وسیله طرفین می پذیرند که این EULA همراه با اسناد دیگر که جزء جدایی ناپذیر از این EULA هستند، مطابق با قوانین کشور مالتا تفسیر می شود و تحت نظر صلاحیت دادگاه های کشور مالتا است.\n2. حل منازعه پیش از رسیدن زمان محاکمه و دادگاه ضروری است. ادعاهای کاربر باید به شماره 60/2، خیابان ملته، والیتا VLT 1122، کشور مالتا و کپی ایمیل به help@tankionline.com  ارسال شود و چنین ادعایی باید حاوی لیست خاصی از نقض های انجام شده توسط شرکت و / یا اداره باشد؛ اطلاعات حساب، اطلاعات تماس و امضای کاربر باید در ایمیل و نامه درج شوند. عدم انطباق با فرم و محتوای ادعا مستلزم عدم انطباق با روش حل منازعه قبل از دادگاه و زمان محاکمه است و برای ارسال پاسخ  تا سی (30) روز کاری از زمان پذیرش فرصت دارد.\n\nالزامات قانونی\nبه این وسیله کاربر  امر را تایید، درک و قبول می کند که شرکت قادر به ارائه هر گونه مشاوره و یا اطمینان قانونی نیست و این وظیفه کاربر است که اطمینان خود را نسبت به پذیرش قوانین در هر زمان با حق قانونی خود برای باز کردن یک حساب کاربری در بازی و یا با انجام بازی نشان بدهد. هرگونه مشارکت در بازی تنها به عنوان گزینه های کاربر، اختیار و ریسک او در نظر گرفته می شود. با انجام بازی، کاربر تایید می کند که بازی یا خدمات را به هر طریقی توهین آمیز، اعتراضی، ناعادلانه یا ناخوشایند نمی داند.\nابطال یا لغو\nشکست یا بی توجهی شرکت در هر زمانی که بخشی از مقررات این قانون را اجرا می کند، نباید به عنوان صرفنظر از حقوق خود تلقی و تفسیر شود؛ به طریقی که هیچ تاثیری بر اعتبار کل یا بخشی از این EULA ندارد ، و حق شرکت برای انجام اقدامات بعدی را محدود نمی کند.\n\nسایر شرایط\n\n1. اگواهینامه EULA نشان دهنده کل توافقنامه بین کاربر و شرکت در رابطه با موضوع آن است و جایگزین تمام موافقتنامه های قبلی بین طرفین در ارتباط با چنین موضوعی می باشد.\n\n2. سرفصل های موجود در این EULA برای راحتی مرجع (داوری) ، نوشته شده اند و قصد اینکه معنی یا تفسیر هر یک از شرایط و ضوابط را تحت تاثیر قرار دهند، را ندارند. واژگان در معنای انحصاری و در حالات جمع به کار رفته است و به هر صورت صادق است. واژه هایی که با عناوین مردانه به کار رفته اند در مورد زنان هم همان معنی را می دهند.\n 3.در صورتی که هر یک از این شرایط یا مقررات توسط هر مقام صلاحیت داری به عنوان نادرست، غیرقانونی یا غیر قابل اجرا تعیین شود، چنین اصطلاح، شرایط یا نکته ایی از شرایط و قوانین باقی مانده جدا می شود و مقرراتی که باقی می مانند، باید تا حد ممکن از طرف قانون مجاز شمرده شوند.\nتماس با شرکت\n1. کاربر می تواند هر گونه سؤال، اظهارات، شکایات یا نظرات مربوط به این موافقت نامه را به ایمیل help@tankionline.com ارسال نماید. شرکت سوالات شما را در اسرع وقت بررسی خواهد کرد.\n2. هر مکاتبه ای که کاربر با شرکت شروع کند؛ یا گزارشاتی را درباره مشکلات مربوط به خدمات بازی یا خود بازی ارائه کند، شرکت حق ذخیره تمام این مکاتبات را دارد.\n"
