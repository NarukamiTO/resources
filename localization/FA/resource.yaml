  GAME_TERMS: "توافقنامه مجوز کاربر نهایی\nهر گونه استفاده از این بازی و امکانات آنلاین آن و / یا کلیک روی «پذیرش» در فرم ثبت نام به این معنی است که با توافقنامه تحت پوشش قرارداد آشنا هستید و موافقت کرده و بدون تردید همه این شرایط را قبول میکنید.\nاگر با توافقنامه کاملا موافق نیستید، حق استفاده از بازی و خدمات آن ندارید و مجبور هستید بلافاصله این سایت را ترک کنید.\nشرکت  APL Publishing Ltd، شماره 60/2، خیابان ملیتا، والیتا VLT 1122، کشور مالتا (از این پس به عنوان «شرکت» یا «اداره» نامیده می شود)، صاحب حقوق منحصر به فرد این بازی، حق محرمانه بودن اطلاعات شخصی را برای کاربران محترم می شمارد.\n\nاین توافقنامه مجوز کاربر نهایی (\"EULA\")، روابط قراردادی بین طرفین را تشکیل می دهد؛ APL Publishing Ltd, registration no. C 85285, registered under the laws of Malta, 157, Archbishop Street Valletta, VLT1440, Malta، کشور مالتا ثبت شده است و از این پس (از این پس به عنوان \"بازی Tanki Online\" یا   \"شرکت\" یا \"اداره\" نامیده می شود)؛ و شما به عنوان کاربر،  از این پس به عنوان \"شما\" یا \"کاربر\" نامیده می شوید.\n\n\n\nاسنادی که بخشی از این EULA هستند\nاسناد موجود در لیست زیر، بخش جدایی ناپذیری از EULA را تشکیل می دهند\n<a href=\"http://tankionline.com/en/privacy/\" target=\"_blank\"><u>Privacy and Cookies Policy</u></a>; \n<a href=\"http://tankionline.com/en/rules/\" target=\"_blank\"><u>Game Rules</u></a>; and \n<a href=\"http://en.tankiforum.com/index.php?showtopic=163769\" target=\"_blank\"><u>Crystal Purchase Instruction</u></a>:\nتعاریف:\nکلمات و اصطلاحات باید به صورت زیر تفسیر شوند مگر این که در متنی به وضوح به معنی دیگری اشاره داشته باشد و در مورد تمام بخش های EULA  و هر سندی که بخشی از این  EULA  است، اعمال شود:\n\"حساب / حساب کاربری\" به معنی یک حساب کاربری شخصی است که توسط کاربر باز شده و توسط وی اداره و نگهداری می شود، که شامل اطلاعات حساب کاربری می شود.\n\"اطلاعات حساب\" \"به معنای نام کاربری و رمز عبور و سایر اطلاعاتی است که شناسایی کاربر را در بازی ممکن می کند.\n\"شرکت\" به معنی افرادی است که به نام و از طرف شرکت برای ارائه فرایندهای بازی عمل می کنند.\n\"توافقنامه\" به این EULA،اشاره دارد؛ توافقنامه با مجوز کنونی؛ به کاربر حق استفاده از بازی در شرایط ساده، غیر انحصاری و با امکان لغو مجوز، شامل تمام اسنادی که بخش جدایی ناپذیر از EULA هستند، و همچنین قوانین دیگر و دستورالعمل هایی که توسط شرکت در سایت اینترنتی یا سایت شرکای شرکت قرار داده می شود.\n\"کریستال ها\" به واحد پولی اشاره می کند که در بازی و / یا سایت اینترنتی استفاده می شود و با استفاده از آن می توان از خدمات استفاده کرد.\n\"Tanki Online / Company\" به شرکت  APL Publishing Ltd, registration no. C 85285, registered under the laws of Malta, 157, Archbishop Street Valletta, VLT1440, Malta، در کشور مالتا ثبت شده است.\n\"EULA\" به توافقنامه مجوز کاربر نهایی اشاره میکند.\nشرکت ناشر نیز تشکیل شده از استودیو بازی سازی سورنا و وب سایت سرگرمی\n\"بازی\" به بازی تعاملی چند کاربره Tanki Online نسخه2 ' و تمام اجزای آن، از جمله؛ خدمات بازی، اتاق چت، انجمن، Tanki Online Wiki، Tanki Online News، جوامع رسمی در شبکه های اجتماعی، و تمام مواد، تصاویر، صدا، سایت ها، برنامه های کامپیوتری و هر گونه منابع وب که در زیر دامنه های سایت اینترنتی با آدرس / en /، / de / و در سرورهای بازی در آدرس هایی که با / battle-en / / battle-de وجود دارند، در نام دامنه http://tankionline.com.br ا ؛ با سرور بازی خود و یا با دسترسی از طریق سایت های شرکای شرکت برای استفاده توسط کاربران؛ اشاره دارد.\n\"قانون حاکم\" باید به قوانین کشور مالتا و کشور ایران مراجعه شود.\n\"شناسایی\" یا \"فرد حقیقی که قابل شناسایی باشد\" به معنی فردی است که به طور مستقیم یا غیر مستقیم شناسایی می شود، به ویژه با اشاره به شماره شناسایی یا به یک یا چند عامل خاص برای شناختن هویت او.\n\"وب سایت اینترنتی\" به معنای مجموع تمام مواد و منابع تحت وب است که در آدرس http://tankionline.com و در همه زیر دامنه های آن با آدرس / en /، / de / در سرورهای بازی که با آدرس شروع با / battle-en، / battle-deمی شوند، در نام دامنه http://tankionline.com.br با سرورهای بازی و سایر وب سایت های متصل به آن و که با دسترسی از طریق لینک ها و یا سایر مسیرهای دسترسی و خدمات موجود از طریق چنین سایت هایی که توسط شرکت قانونی و رسمی شناخته شده اند، می باشد.\n\"مجوز\" به معنی مجو