  GAME_RULES: "خلاصه قوانین \nفعالیت های زیرکه درهنگام انجام این بازی ممنوع است:  \n- استفاده از رباتها، استفاده از نرم افزار شخص سوم، اشکالات (باگ ها)؛\n- تظاهر به عضویت در شرکت؛\n- تنظیم قدرت، ایجاد مانع برای سایر کاربران؛\n- تبلیغات، تبلیغات سیاسی؛\n- نقض قوانین، از جمله قوانین مالکیت معنوی؛\n- فروش، خرید، تبادل، انتقال حساب ها، انتقال موارد ارزشمند در بازی؛\n- تقلب، سایر اقدامات نادرست.\n\nفعالیت های زیر در چت های بازی و در انجمن ممنوع است:\n- استفاده از توهین ها، تهدیدات، افتراء؛\n- زبان مبهم، استفاده از جملاتی با معنی چندگانه و پنهان ؛\n- ارسال همزمان یک یا چند اسپم(هرز نامه)، چاپ حروف در اندازه بزرگ (CAPS LOCK)؛\n- رمز ها و کلید های تقلب در بازی، دیگر اطلاعات حساب کاربری؛\n- تسویه حساب\n- تحریک دیگران برای نقض قوانین بازی؛\n- بحث عمومی در باره شرکت و مدیران؛\n- انتشار اطلاعات ممنوع شده توسط قانون؛\n- انتشار لینک ها به منابع شخص سوم؛\n- هر نوع تبعیض.\nقوانین بازی\n\nشما در بازی Tanki Online هستید که در آن مردم در سراسر جهان با استفاده از ماشین آلات بزرگ جنگی، با لذت درنبردهای بزرگ شرکت می کنند! بازیکنان می توانند به تنهایی و یا به صورت گروهی و تیمی برای پیروزی در کنار یکدیگر مبارزه کنند. آنها می توانند با هم در تعامل بوده و حتی دوستان جدید هم پیدا کنند.\n\nبازی Tanki Online بازی اکشن چند نفره ایی است همراه با مراحل جدی جنگی و یک شبکه اجتماعی فوق العاده، که به راحتی می توانید بازی کردن با آن را یاد بگیرید.\n\nپس از اتمام فرایند ثبت نام، کاربر یک تانک مجازی و 500 کریستال (واحد پول\nدر بازی) را دریافت می کند. با پیروزی در جنگ ها، کاربر رتبه بندی خود را افزایش می\nدهد و رتبه های جدید و کریستال ها را به دست می آورد. می توانید از کریستال ها برای\nخرید مهمات لازم و خرید و یا ارتقاء تانک ها، اسلحه ها و زره ها استفاده کنید.\n\nبازی Tanki Online فقط یک بازی آنلاین هیجان انگیز نیست. بلکه جامعه ای از افرادی است که منافع مشترک دارند. ما احترام متقابل و مؤدبانه را تایید می کنیم و به شدت از رفتار توهین آمیز و یا نقض حقوق کاربران دیگر جلوگیری می کنیم. مدیران این حق را دارند که در صورت نقض قوانین بازی، نسبت به محدود کردن امکان ارتباطی کاربران، کم کردن رتبه بندی، و حتی نسبت به مسدود کردن حساب کاربری آنها اقدام کنند.\nشرایط عمومی\n\nقوانین بازی بخشی جدایی ناپذیری از توافقنامه \"مجوز کاربر نهایی\" (که از این به بعد \"توافقنامه\" یا EULA نامیده می شود) و سایر اسناد خدمات بازی و خود بازی است. به نوبه خود، توافقنامه، سیاست حفظ حریم خصوصی و سیاست کوکی ها، و همچنین سایر اسنادی که در بازی و خدمات بازی منتشر می شوند، بخشی جدایی ناپذیر از قوانین بازی هستند.\nهر شرایط و مفاهیمی که در قوانین بازی استفاده می شود به همان معنی است که در توافقنامه به آنها داده شده است.\nهرگونه استفاده از بازی و امکانات آنلاین آن و یا کلیک روی \"پذیرش\" در فرم ثبت نام به این معنی است که شما با این قوانین بازی آشنا هستید و موافقید و بدون تردید تمام شرایط آن را قبول می کنید.\nرعایت قوانین بازی برای همه کاربران الزامی است.\nاگر با هر شرایطی از این قوانین بازی مخالف هستید، شما حق استفاده بیشتراز بازی و خدمات آن ندارید، لطفا این سایت را ترک کنید و از بازی استفاده نکنید.\n1.\tساختن نام مستعار (نام کاربری) که دراای شرایط زیر باشد ممنوع است:\n1.1 شامل لحن بد یا تند ، توهین / تحریک برای توهین (به صورت کلمات، اختصارات، عبارات توهین امیز و عبارات) باشد؛\n1.2 عناصری از نژادپرستی، فاشیسم، توهین یا نام مستعار بر اساس هویت نژادی، ملی یا مذهبی یا کسانی که باعث نفرت، عدم تحمل و اختلاف قومی می شوند؛ داشته باشد؛\n1.3 شامل درخواست برای خشونت، تروریسم، افراط گرایی و / یا اختلالات توده ای؛\n1.4 شامل درخواست های سیاسی، تبلیغات، تبلیغات سیاسی از هر نوع باشد؛\n1.5 به طور مستقیم یا غیرمستقیم به سازمان های سیاسی (افراد) مربوط شود، از جمله به افرادی که مرتکب جنایات سیاسی یا جنایات علیه بشریت و اعمال تروریستی شده اند؛ اشاره داشته باشد.\n1.6 تبعیض جنسیتی، سن، دین یا سایر ویژگی ها را شامل شود؛\n1.7 پیگیری تبلیغات مستقیم یا غیرمستقیم، خواستار مصرف نوشابه های الکلی و الکل، آبجو، محصولات تنباکو، مواد مخدر، مواد سمی، روانگردان و / یا مواد سمی، مشتغات آنها، حاوی اطلاعات در مورد مکان ها و روش های تولید، خرید، کشت و استفاده از آنها باشد؛\n 1.8 حاوی اطلاعات مربوط به دعوت به مشارکت در بازی های قمار، فحشا، سرقت، گدایی باشد.\n1.9 اطلاعات مربوط به روش های انجام خودکشی، محرک های خودکشی، خشونت یا اقدامات دیگر که تهدیدی برای زندگی یا سلامتی هستند را شامل می شود؛\n1.10 شامل تحریک به رفتار غیرقانونی، جرم و جنایت، خشونت، ظلم و ستم، تهدید به آسیب رساندن و اعمال و اقدامات ممنوع شده توسط قوانین باشد؛\n1.11 شامل بخش های نام کاربری کارمندان شرکت و یا حاوی اطلاعاتی است که ممکن است درک اشتباه کاربران به عنوان نماینده شرکت را داشته باشد؛\n1.12 شامل انتقاد از بازی، مدیر یا مدیران؛\n1.13 ارتباط مستقیم یا غیر مستقیم با رابطه جنسی، خشونت جنسی، پورنوگرافی، مسائل جنسی مربوط به کودکان؛\n1.14 شامل شرح بدن و فعالیت های آن یا واکنش های بیولوژیکی آن باشد؛\n1.15 حاوی تبلیغات و هایپر لینک ها؛\n 1.16 شامل ارجاع به کدهای تقلب، سایت های تقلب و منابعی که حقوق و قوانین شرکت را نقض می کنند، شود؛\n1.17 متشکل از مجموعه های تصادفی غیر قابل پیش بینی (نام کاربری با حروف بی معنی و تکراری)؛\n1.18 به طور کامل یا جزئی از عناصر علامت تجاری که توسط قوانین کپی رایت ، ثبت شده محافظت می شود.\n1.19 حاوی دیگر اطلاعات ممنوع شده توسط قوانین این بازی، موافقت نامه و یا سایر قوانین موثر است.\n1.20 اگر نام کاربری با الزامات بالا مطابقت نداشته باشد،در  سایر الزامات مندرج در این قوانین بازی، توافقنامه یا قوانین موثر بر آن، شرکت حق دارد بر اساس اختیارات خود:\n-  از کاربر بخواهد نام کاربری خود را تغییر داده و نام کاربری قابل قبولی را  انتخاب کند و یا حساب کاربری او را برای مدت زمان لازم جهت تغییر نام کاربری مسدود نماید؛ \n -  به صورت کامل و غیرقابل برگشت حساب کاربری را مسدود کند.\n2.  فعالیت های زیر ممنوع است و منجر به (به موجب اختیارات شرکت) مسدود شدن دائمی یا موقت حساب کاربر ، کاهش تمام مقادیر مجازی بازی کاربر از 10٪ تا 100٪ (گاراژ، کریستال، آمار و ارقام بازی) یا تنظیم حساب کاربر به صفر، محدودیت موقت یا دائمی دسترسی به چت های بازی و انجمن (ممنوعیت):\n2.1 هر گونه رفتار غیرمتمرکز یا غیراخلاقی در بازی:\n2.1.1   Botting  ( استفاده از نرم افزاری که عملکردهای کاربران در بازی را تقلید می کند)، استفاده از برنامه های کلیک کننده، ماکروهایی که ماوس و صفحه کلید را کنترل می کنند، استفاده از دیگر نرم افزار های شخص سوم برای به دست آوردن برتری در بازی؛\n2.1.2 استفاده یا توزیع نرم افزار شخص سوم یا سایر ابزارها برای ارتقاء / خودکار سازی امکانات بازی (ربات ها، تقلب ها) و همچنین برنامه هایی که ممکن است عملکرد بازی و / یا عملکرد دستگاه های الکترونیکی شخص سوم را خراب کند؛\n2.1.3 بهره برداری از اشکالات نرم افزار بازی و انتقال اطلاعات مربوط به آنها به اشخاص سوم، به جز شرکت؛\n2.1.4 به دست آوردن امتیاز تجربه توسط انجام اعمال عمدی پنهان و یا کمک از بازیکنان دیگر تیم در \"Capture the Flag\" (تسخیر پرچم) و یا \"Control Points\" (کنترل منطقه) و یا حالت  \"Team Deathmatch\" (مبارزه گروهی) و یا از مخالفان در حالت \"Deathmatch\" (مبارزه انفرادی) (قبلا به عنوان Power-Leveling شناخته می شد)؛\n2.1.5 نبرد بین حسابهای متعلق به یک کاربر؛\n2.1.6 ایجاد حساب های کاربری اضافی با سطح قدرت حساب اصلی؛\n2.1.7 برنامه چیدن و تبانی با دیگر کاربران برای مبارزه با نیمه توان آنها برای مبارزه با \"نیمه - جان\" با هدف افزایش سطح قدرت (شرکت  محدودیت را برای همه کاربرانی که چنین تبانی هایی انجام دهند اعمال خواهد کرد)؛\n2.1.8 انجام هرگونه عمل یا نادیده گرفتن ان به منظور ایجاد مانع برای تیمی که کاربر عضو آن است، از جمله در حالت (تسخیر پرچم)  CTF، (مبارزه گروهی) TDM و  (کنترل منطقه) CP، مبارزه با تیمی که عضو آن هستید، آسیب رساندن / نابودی تانک هم پیمان های خود، مبارزه در منافع تیم حریف، و همچنین توطئه با دشمن، خرابکاری؛\n2.1.9 تبعیض در برابر بازیکنان بی تجربه (مبتدیان): اطلاعات نادرست، ارعاب، خیانت؛\n2.1.10 توهین، تهمت (انتشار اطلاعات گمراه کننده) در رابطه با سایر کاربران، شرکت، مدیران، افراد دیگر؛\n2.1.11 هر گونه اشکال دستکاری یا توطئه در بازی؛\n2.1.12 اجرای هر نوع فعالیتی که تاثیر منفی بر پیشرفت بازی و تصویر دارد؛\n2.1.13 اشکال دیگر رفتار غیرمتعارف که مانع فرآیند بازی عادی می شود، و توسط شرکت به رسمیت شناخته می شود.\n\n\n\n2.2 هر گونه اشکال اقدامات جعلی، به ویژه:\n2.2.1 استفاده از بازی و / یا خدمات بازی برای اقدامات جعلی، از جمله عملیات مالی جعلی بدون محدودیت در بازی، تقلب در جریان معاملات، پرداختها، از جمله بازپرداخت، معاملات ممنوعه؛\n2.2.2 انتقال حساب یا دیگر ارزش های بازی به اشخاص سوم؛ انتشار پیشنهادات برای فروش، خرید و یا انتقال ارزش حساب یا بازی، هر دو به صورت رایگان و برای کریستال و یا وجوه، و همچنین تحریک به اقدامات ذكر شده؛\n2.2.3 تلاش برای به دست آوردن رمز عبور، اطلاعات حساب دیگر و یا سایر اطلاعات شخصی از هر کاربر دیگر، از جمله به عنوان اخاذی با استفاده به عنوان تهدید اخلاقی، فیزیکی و یا فنی؛\n2.2.4 توزیع هر گونه اطلاعات شخصی در مورد سایر کاربران یا اشخاص سوم (مگر اینکه این اطلاعات به طور عمومی در دسترس باشد)؛\n2.2.5 تقلب - دریافت پول در بازی با استفاده از هر گونه وسیله برای تقلب؛\n2.2.6 هر گونه تلاش برای تظاهر به کارمند سابق یا فعلی شرکت  یا معاون پروژه (مدیر، مشاور، و غیره)، از جمله ارسال پیام از طرف شرکت یا مدیران؛\n2.2.7 درخواست مالی به هر صورت، از جمله درخواست برای انتقال وجوه، ارزش بازی یا کریستال\n2.2.8 انتشار لینک هایی که به عنوان منابع رسمی بازی جاسازی شده ، به منابع خارجی.\n\n2.3  نقض های دیگر:\n2.3.1  استفاده از لحن بد یا تند، سایر کلمات بد یا غیر مودبانه (عبارات) که به عنوان لحن بد طبقه بندی نشده اند، از جمله در فرم ضمنی (به صورت پنهان و اشاره ایی)؛\n2.3.2  انتشار اطلاعات و موارد مربوط به مسائل جنسی، وابسته به عشق ،شهوانی یا پورنوگرافی، تصویربرداری یا توصیف روابط جنسی بین مرد و زن؛\n2.3.3  انتشار اطلاعات یا نمادهای که احساسات مؤمنان را توهین یا تحقیر می کند، موجب تنفر، خصومت، اختلاف نژادی، بین المللی یا قومی، عدم تحمل (از جمله توهین، دادن نام مستعار بر اساس ویژگی های نژادی، ملی، قومی، مذهبی) و نیز تحریک مخاطب برای انجام اقدامات مشخص؛\n2.3.4  تبلیغات و یا تظاهرات نشانه های نازی، نمادها، اختصارات و یا نامگذاری ها، نام و نام خانوادگی فعالان نازی؛\n2.3.5  انتشار اطلاعاتی که رویدادهای تاریخی را نادیده می گیرد؛\n2.3.6  انتشار اطلاعاتی که ممکن است عناصر خواستار خشونت، جنگ، تروریسم، سرنگونی قدرت را در بر داشته باشند؛ فعالیت افراطی و یا اختلالات توده ای؛\n2.3.7  انتشار اطلاعات مربوط به سازمان های سیاسی (رهبران سیاسی) که مرتکب جنایات سیاسی یا جنایات علیه بشریت، اعمال تروریستی یا خلاف قوانین بین المللی شده اند؛\n2.3.8  انتشار اطلاعاتی که حاوی درخواست های سیاسی، تبلیغات سیاسی، تبلیغات انتخاباتی به هر نوع است؛\n2.3.9  بحث مسائل سیاسی روز به عنوان درگیری های تحریک آمیز؛\n2.3.10  هرگونه تبعیض جنسیتی، سن، مذهب و سایر خصوصیات؛\n2.3.11  تهدید در هر نوع مربوط به کاربران، شرکت و یا اشخاص سوم؛\n2.3.12  انتشار اطلاعات حاوی روش های خودکشی، خواستار انجام خودکشی، خشونت یا اقدامات دیگری است که تهدیدی برای زندگی یا سلامتی می باشند، شرح تکنیک های مبارزه با خطر، مانع، روش های تولید سلاح، شرح روش های اصلاح بدن؛\n2.3.13  انتشار اطلاعاتی که توصیف، تحریک یا توجیه رفتار غیرقانونی یا ضد اجتماعی، جرم و جنایت، خشونت، ظلم و ستم روحی و جسمی افراد، حیوانات، وارد آوردن خسارت به اموال دیگران را در پی دارد؛\n2.3.14  انتشار اطلاعاتی که سبب ترس، وحشت و یا اضطراب در کودکان می شود، از جمله تصاویر یا شرح مرگ، بیماری ها، خودکشی، سوانح، حوادث و یا بلایای طبیعی و(یا) عواقب آن، اطلاعات دیگری که ممکن است به سلامت و یا رشد کودکان آسیب برساند.\n2.3.15  انتشار اطلاعاتی در مورد فردی که از نتیجه اقدامات غیرقانونی (بی نظمی) رنج می برد؛\n2.3.16 انتشار اطلاعاتی که حاوی تبلیغات مستقیم یا غیرمستقیم است، در خواست مصرف نوشابه های الکلی و الکل، آبجو، محصولات تنباکو، لوازم مصرف سیگار، مواد مخدر، مواد سمی، روانگردان و / یا سم زدایی، و مشتقات آنها، حاوی اطلاعات در مورد مکان ها و روش های تولید، کسب، کشت و استفاده آنها؛\n2.3.17 انتشار اطلاعاتی که می تواند تمایل به شرکت در بازی های قمار، فحشا، فحاشی و گدایی را افزایش دهد؛\n2.3.18  هر گونه استفاده از اشیاء مالکیت معنوی (نرم افزار، هنر، ویدئو و دیگر اشیاء یا قطعات آنها، علائم تجاری و غیره) یا سایر موارد بدون اجازه صاحب حق؛ لینک دادن به محتوای دزدی و سرقت شده، حذف یا تغییر اطلاعات در مورد حقوق مالکیت معنوی، به ویژه لینک دادن به صاحبان حق، مولفان و دیگر موارد تأیید حقوق مالکیت معنوی؛\n2.3.19  انتشار هرگونه مواد تبلیغاتی یا اطلاعات بدون اجازه شرکت؛\n2.3.20  انتشار اطلاعاتی که ممکن است موجب آسیب یا زیان کاربران یا شرکت شود؛\n2.3.21  انتقاد مخرب از بازی و / یا نویسندگان و مالکان آن؛\n2.3.22  اظهارنظر پنهان یا عمومی در مورد شرکت، یا مدیران بازی؛\n2.2.23  ارائه اطلاعات، اسناد و شواهد غلط یا فریبکارانه.  شرکت به کاربران در خصوص موارد مجرمانه و مسئولیت های چنین اقداماتی هشدار می دهد.\n 2.3.24 همکاری یا تحریک (اغوا) به اقداماتی (عدم انجام اقدام خاصی) که توسط  قوانین بازی، موافقتنامه و / یا قانون اجرایی، ممنوع هستند.\n\n3. ایجاد پیام و یا آغاز موضوعات شامل موارد زیر در چت های بازی و / یا در انجمن ممنوع است:\n3.1  باز تولید موضوعات یا پیام های موجود، و همچنین موضوعاتی که اخیرا مورد بحث بوده و یا پاسخ هایی که در بخش های اطلاعات (قوانین بازی، پرسش های متداول، برنامه ها و غیره) وجود دارند. فراموش نکنید که برای پیدا کردن پاسخ به سوالات خود از جستجو استفاده کنید. مراقب باشید و اطمینان حاصل کنید که قبل از ایجاد یک موضوع جدید از موضوعات موجود استفاده کنید.\n3.2  با موضوع بخش / رده مطابقت ندارد\n3.3 نوشته های با حروف کاملا بزرگ و یا داشتن تعداد حروف درشت زیاد در عنوان و / یا محتوای موضوع یا پیام؛\n3.4  نمادهای نامناسب یا تکراری، شخصیت ها، شکلک ها، پیام ها در عنوان و / یا توضیحات موضوع یا پیام که فهم موضوع یا بخش را پیچیده می کنند یا معنی ندارند، مثلا ==-My Topic-==؛\n3.5  حاوی متن با اندازه قلم بیش از 24؛\n3.6  کمبود اطلاعات و مشخص نبودن حساسیت موضوع در عنوان یا توضیحات؛\n3.7  نقل قول متن های بیش از حد بزرگ از پیام های قبلی و / یا تصاویر بدون نیاز خاص  (نقل قول بیش از حد)؛\n3.8  ادامه بحث در مورد موضوعاتی که توسط شرکت  بسته شده یا حذف شده اند؛\n3.9 درخواست های شخصی برای یک شخص خاص یا افراد شرکت کننده در قسمت اتاق گفت و گو یا چت بازی. برای ارتباطات شخصی لطفا از پیام خصوصی استفاده کنید. بحث های شخصی به موازات حل مسائل مجاز است.\n3.10 توزیع موارد حاوی هرزنامه، یعنی اطلاعاتی که مخاطب درخواست نکرده، هیچ علاقه ای به دریافت و / یا رضایت به دریافت آنها ندارد؛ \n3.11 شروع بحث وجدل (\"بحث برای بحث\"، مبادله پیامی که فقط جنگ کلمات است و اغلب بدون ارتباط با علت اصلی اختلاف هستند)؛\n3.12  شامل تسویه حساب (تشویق مشارکت اقشار جامعه برای اقدامات با اثرات نامطلوب و درگیری برای آنها)؛\n3.13  به منظور تحریک دیگر کاربران، شرکت، مدیران، و همچنین جلوگیری از ارتباط در انجمن یا چت های بازی؛\n3.14  شامل لینک های ارجاع، \"کد تقلب\" ( افزودن امتیاز، Buy_kirctals_in_the_Panzer)\n3.15  شامل اطلاعات دیگر یا نقض هایی که توسط این قوانین بازی، موافقت نامه و / یا قوانین قابل اجرا، ممنوع است.\n3.16  برای موارد نقض ذکر شده، شرکت به موجب اختیار خود، می تواند محدودیتهای کاربر را در قالب بستن  دائمی یا موقت حساب یا محدودیت موقت یا دائمی دسترسی به چت های بازی و انجمن (ممنوعیت) اعمال کند.\n3.17  شرکت می تواند بر اساس اختیار خود هرگونه اطلاعات یا پیام را حذف کند؛ حذف / انتقال موضوع ایجاد شده در بخش اشتباه انجمن، بدون اطلاع رسانی.\n3.18  پیام های خصوصی برای ارتباط شخصی با کاربر در سرویس های بازی و در انجمن طراحی شده اند. در حالی که شرکت شکایات مربوط به نقض قوانین بازی را پردازش می کند، باید شکایات مربوط به پیام خصوصی را در نظر نگیرد. کاربر می تواند دریافت پیام های خصوصی را از کاربر دیگری متوقف کند و او را به لیست سیاه در بخش مربوطه به نمایه کاربر در انجمن اضافه کند.\n4.  اعمال محدودیت به کاربر\n4.1  اگر کاربری  قوانین بازی را نقض کند، شرکت می بایست محدودیت های مندرج در بخش مربوط به قوانین بازی را به این کاربر اعمال کند.\n4.2  انواع محدودیت ها:\n4.2.1  مسدود کردن دائمی یا موقت - مسدود کردن (محدود کردن) دسترسی به بازی.\n4.2.2  کاهش تمام مقادیر مجازی کاربر در بازی (گاراژ، کریستال، آمار بازی) 10٪ تا 100٪ یا تنظیم حساب به صفر.\n4.2.3  محدودیت موقت یا دائمی دسترسی کاربر به چت های بازی و انجمن (ممنوعیت) - محدود کردن امکان ارسال پیام در چت و در انجمن.\n4.2.4  حذف یا تغییر،  بدون اطلاع از هر گونه اطلاعات و یا پیام های ارسال شده در هر بخش از بازی و یا خدمات بازی؛ انتقال موضوعات انجمن به بخش دیگری یا حذف موضوعات.\n4.3  این محدودیت ها ممکن است برای هر حساب کاربری که این قوانین بازی را نقض می کند، اعمال شود.\n4.4  شرکت به موجب اختیار خود، می تواند یک یا چند محدودیت را همزمان به کاربر اعمال کند یا به او هشدار بدهد.\n4.5 هنگام انتخاب محدودیت ها، شرکت نوع و تعداد نقض ها و نقض قبلی قوانین بازی توسط کاربر را بررسی می کند.\n4.6  از آنجا که همیشه امکان دقیق نقض خاص قوانین بازی ممکن نیست، تصمیم نهایی همیشه با شرکت باقی می ماند.\n4.7  نقض قوانین بازی به این معنی است که کاربر ممکن است بلافاصله بدون اطلاع قبلی از دریافت خدمات بازی منع شود یا این خدمات ممکن است به طور کامل یا به طور جزئی محدود شود.\n4.8  اگر کاربر چندین بار یا به صورت یکپارچه قوانین بازی را نقض کند ، شرکت به موجب اختیار خود مجاز به تکرار محدودیت های اعمال شده به کاربر می باشد.\n4.9  این شرکت هیچ گونه مسئولیتی در قبال خسارت و آسیب مستقیم یا غیرمستقیم که کاربر یا شخص ثالث که ممکن است به دلیل استفاده کاربر یا استفاده از سایت اینترنتی، بازی و / یا آنلاین به امکانات موجود وارد شود، ندارد، اما این مساله محدود به خسارت ناشی از ناتوانی در استفاده از بازی و امکانات آنلاین، و یا ناشی از درخواست محدودیت به کاربر توسط شرکت، خسارات مستقیم یا غیر مستقیم ناشی از اقدامات شخص ثالث، از جمله کاربران دیگر بازی، فقدان دسترسی به اینترنت، سرقت، تخریب مواد، از دست دادن اطلاعات مربوط به حساب کاربر و هر گونه آسیب به افتخار، شأن و مقام تجاری در ارتباط با بازی، نمی شود.\n5  ناظر\n5.1  ناظران دستیار اداری هستند و توسط شرکت از میان کاربران انتخاب شده اند.\n5.2  یک ناظر شخصی است که از طرف و به نفع شرکت عمل می کند. ناظران باید نظم را در سرویس های بازی، بازی و همچنین در انجمن ها و چت های بازی حفظ و کنترل کنند.\n5.3  ناظر موظف به اعمال محدودیت های موقت یا دائمی دسترسی به چت های بازی و انجمن (ممنوعیت) به کاربر در صورت نقض قوانین بازی توسط کاربر می باشد.\n5.4  ناظر باید در تصمیم گیری صادقانه و عادلانه عمل کند و تصمیماتش نیز با مقررات این  بازی و توافق نامه مطابقت داشته باشد، با کاربران مودب و با احترام بر خورد کند، وظایف خود را به طور موثر و منظم انجام دهد.\n5.5  برای ناظر سوء استفاده از قدرتی که به آنها داده شده به شدت ممنوع است. همه اقدامات ناظران ثبت می شوند. اگر یکی از ناظران اقدامات خود را توجیه ننماید، بدون بحث و یا هشدار از طریق تصمیم داخلی شرکت، با او قطع همکاری خواهد شد.\n5.6  فعالیت ناظران به صورت داوطلبانه انجام می شود. کاربر نمی تواند ناظر را برای انجام یک محدودیت سرزنش و بازخواست کند.\n6.  شکایت و تجدید نظر\n6.1  کاربر حق دارد نقض قوانین بازی را با ایجاد موضوع جدید در  <a href=\"http://en.tankiforum.com/index.php?showforum=76\" target=\"_blank\"><u>Violators section</u></a> گزارش کند. مشخص کردن واضح و روشن این نقض باید در یک تاپیک جدید همراه با تصویری از صفحه یا فایل تصویری که نقض را به وضوح نشان بدهد، انجام شود. \n6.2 کاربر می تواند هر گونه سؤال، نظرات یا شکایات مربوط به  این بازی را به ایمیل help@tankionline.com  ارسال نماید.  شرکت برای در نظر گرفتن سریع چنین درخواست هایی همه تلاش خود را خواهد کرد.\n6.3  هنگام ارسال شکایت، کاربر باید ماهیت وضعیت را با بیشترین جزئیات، با بیشترین وضوح ممکن و با ضمیمه کردن حقایق و  شواهد، عکس ها و... توضیح بدهد. شکایات در مورد محدودیت های غیر منطقی صرفا به منظور ارزیابی داخلی کار شرکت و ناظر مورد استفاده قرار می گیرد. موارد تصمیم گیری شده در خصوص محدودیت ها قابل باز بینی نیستند.\n6.4  شرکت حق دارد و می تواند تمام مکاتباتی که از طرف کاربر برای بیان مشکلی در رابطه با بازی و خدمات آن با شرکت انجام می شود را نگهداری و ذخیره کند.\n7.  سایر مقررات:\n7.1  شرکت این بازی را مدیریت می کند و این قوانین بازی را به صلاحدید خود اعمال می کند، اما نظر باقی افراد جامعه (کاربران) را نیز در نظر خواهد گرفت.\n7.2  این قوانین بازی ممکن است توسط شرکت بدون اطلاع قبلی تغییر کند. کاربر موظف به بررسی این قوانین بازی برای تغییرات حداقل یک بار در هر هفت روز (یعنی هفتگی) است. اگر چنین بررسی هایی در مدت مشخص شده انجام نشده باشد و کاربر همچنان از این بازی استفاده کند،این طور در نظر گرفته خواهد شد که کاربر با نسخه اصلاح شده این قوانین بازی موافق است.\n7.3  شرکت سیاست «بدون تحمل» را برای تقلب و کلاه برداری در بازی دنبال می کند. اگر از نظر شرکت، کاربر تقلب یا تلاش برای فریب شرکت و یا یک کاربر دیگر، یا ارائه اطلاعات، اسناد، شواهد نادرست یا دروغین کند و یا قوانین قابل اجرا را نقض کند، شرکت حق متوقف کردن فعالیت حساب کاربر و انتقال اطلاعات مربوطه را به اختیار خود (همراه با اطلاعات شخصی کاربر) به هر شخص ثالث و / یا مقامات اجرای قانون که شرکت آن را ضروری می داند،  دارد.\n7.4  شرکت می تواند مقررات و محدودیت های دیگری در قوانین بازی های رایانه ای، قوانین رقابت، مسابقات و لیگ ها را صادر کند. در عین حال، این قوانین بازی بخشی جدایی ناپذیر از قوانین انتخاب شده توسط شرکت هستند."
