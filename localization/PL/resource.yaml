  PAYMENT_SMS_DESCRIPTION_TEXT_INCLUDING_VAT: |-
    Wybierz kraj i operatora komórkowego. Wybierz liczbę kryształów i wyślij SMS-a o treści pasującej do wybranej liczby. Zazwyczaj konto jest aktualizowane w ciągu kilku sekund.

    Uwaga! Zgodnie z zasadami serwera SMS-ów wprowadzamy ograniczenia przeciw oszustwom. Chcąc uniknąć przepadnięcia wpłaty, postępuj zgodnie z następującymi zasadami:
    1. Nie wysyłaj SMS-ów na sumę większą niż 13 USD na godzinę.
    2. Nie wysyłaj więcej niż 3 SMS-ów na jedną nazwę gracza z tego samego numeru w ciągu jednej godziny.

    <font color='#ff4e00'>Uzyskaj zgodę tych, którzy płacą za twoje kryształy!</font>
