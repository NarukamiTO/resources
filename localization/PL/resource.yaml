    3.Niniejsza Polityka dotyczy następujących zasobów Gry: interaktywnej, wieloosobowej gry online <<Tanki Online. Version 2>>, pokoju na czacie Gry, forum Gry, Tanki Online Wiki, Wiadomości Tanki Online (odtąd łącznie zwanych „Usługami Gry”), a także innych internetowych formularzy, wewnętrznych formularzy oraz środków komunikacji używanych w usługach gry oraz kliencie Gry do gromadzenia informacji osobowych.
    4.Spółka zapewnia, że dołożyła wszelkich możliwych starań, aby Dane Osobowe były zawsze:
    a.przetwarzane zgodnie z prawami Użytkownika;
