    24.Spółka nie sprzedaje Informacje Osobowych Użytkownika, ani nie ujawnia tychże osobom trzecim, z wyjątkiem sytuacji przewidzianych w niniejszej Polityce. Spółka może ujawnić ogólne informacje demograficzne i statystyczne parterom biznesowym oraz reklamowym. Nie jest to bezpośrednio związane z Informacjami Osobowymi i nie można na tej podstawie zidentyfikować konkretnego Użytkownika.
    25.Aby zapewnić właściwe świadczenie usług, Spółka ma prawo przekazania Informacji Osobowych innym osobom i organizacjom, które świadczą usługi hostingowe, płatnicze oraz związane z wysyłaniem e-maili, a także moderatorom. Osoby te i organizacje mają prawo wykorzystać otrzymane Informacje Osobowe jedynie do celów świadczenia usług Użytkownikowi, a także są związane postanowieniami zapewniającymi właściwe wykorzystanie Informacji Osobowych.
    26.Użytkownik potwierdza, że Spółka ma prawo przekazywać Informacje Osobowe wszelkim oddziałom Spółki w celach zapewnienia właściwych, wysokiej jakości Usług Gry, a także w celu ich usprawnienia oraz wykonania Umowy, Zasad Gry oraz niniejszej Polityki.
    27.Jeżeli Spółka połączy się z inną spółką poprzez reorganizację albo fuzję, albo sprzedaż lub nabycie, albo likwidację lub jakikolwiek inny proces, Informacje Osobowe Użytkownika mogą zostać przekazane wraz ze Spółką lub jej częścią lub mogą zostać sprzedane jako część Spółki.
    28.Użytkownik akceptuje to, że Spółka ma prawo i obowiązek ujawnienia Informacji Osobowych z polecenia organów reprezentujących Obowiązujące Prawo albo inną jurysdykcję, albo z polecenia organów nadzorujących, albo z polecenia Inspektora Ochrony Danych Osobowych, albo w przypadku, gdy Użytkownik jest bezpośrednio lub pośrednio zaangażowany w udział w przestępstwie związanym z Grą albo usługami Spółki.
    29.Użytkownik akceptuje to, że gdy Spółka otrzyma roszczenie od osób trzecich (posiadaczy praw autorskich) dotyczące naruszenia przez Użytkownika praw do Materiałów umieszczonych w Grze albo Usługach Gry, to Spółka ma prawo przekazać informacje dotyczące takiego Użytkownika osobie trzeciej (posiadaczowi praw autorskich).
    30.Jeżeli Użytkownik wejdzie do Gry albo zarejestruje się w Grze poprzez strony osób trzecich, albo strony parterów Spółki, takie osoby mogą żądać podania informacji osobowych Użytkownika oraz gromadzić i przetwarzać je w celach zapewnienia wysokiej jakości usług. W tym wypadku zastosowanie mają polityki prywatności i ciasteczek osób trzecich. Użytkownik akceptuje to, że Spółka ma prawo przekazania Informacji Osobowych Użytkownika takim osobom w celach zapewnienia wysokiej jakości Usług Gry, wykonania Umowy, Zasad Gry oraz niniejszej Polityki.


    Przechowywanie Informacji Osobowych

    31.Spółka podejmie wszelkie niezbędne kroki w celu właściwego i bezpiecznego przechowywania gromadzonych Informacji Osobowych Użytkownika zgodnie z postanowieniami niniejszej Polityki. Wszelki informacje podane przez Użytkownika są przechowywane na serwerach Spółki.
    32.Spółka ma prawo wykorzystywać standardowe technologie, w tym zapory sieciowe, do zapewnienia bezpieczeństwa Informacji Osobowych.
    33.Użytkownik jest zobowiązany do nieujawniania ani nieprzekazywania osobom trzecim swojej tożsamości lub szczegółów dotyczących konta, których używa do autoryzacji w Grze. Użytkownik jest w pełni odpowiedzialny za przechowywanie informacji dotyczących jego konta.
    34.Jeżeli Użytkownik nabywa wiedzę o tym, że jego informacje dotyczące konta zostały skradzione albo są w posiadaniu dowolnej osoby trzeciej, Użytkownik natychmiast informuje o tym Spółkę, tak żeby Spółka mogła powziąć niezbędne kroki. W takich przypadkach Spółka nie może zagwarantować bezpieczeństwa Informacji Osobowych Użytkownika, a użytkownik niniejszym akceptuje to, że Spółka nie będzie pociągana do odpowiedzialności za żadne wykorzystanie takich Informacji Osobowych.
    35.Gdy Użytkownik komunikuje się wewnątrz Gry lub Usług Gry (za pomocą pokoju na czacie, forum itp.), Użytkownik rozumie, że takie działanie odbywa się za pomocą Serwera Spółki, i zgadza się na to, że podane dane mogą być gromadzone, przechowywane i analizowane przez Administrację. Administracja nie jest odpowiedzialna za zachowanie poufności Informacji Osobowych albo informacji ujawnionych przez Użytkownika innym Użytkownikom w Grze, Usługach Gry lub innych serwisach powiązanych z Grą (używając pokoju na czacie, forum, sieci społecznościowych itp.), Administracja ma także prawo traktować takie informacje jako pozyskane z domeny publicznej.



    Ciasteczka, adresy IP oraz logi

    36.Administracja może gromadzić i przetwarzać informacje o komputerze Użytkownika, w tym logi, adresy IP, rodzaj systemu operacyjnego, przeglądarki oraz klienta e-mail, informacje o ruchu internetowym, dacie i czasie, szczegóły wejść do usług gry, informacje o aktywności użytkownika, dostępie, ustawieniach i powiadomieniach systemowych. Informacje o działaniach Użytkownika na Stronie Internetowej są gromadzone i przechowywane, aby zarządzać systemem, zapewniając właściwe funkcjonowanie Gry i Usług Gry, aby zapewnić bezpieczeństwo i zwiększyć ochronę, oraz aby zapewnić integralność systemu (zapobiegać atakom hakerskim i nieautoryzowanemu dostępowi).
    37.Administracja wykorzystuje ciasteczka, aby zapewnić właściwe funkcjonowanie Gry. Ciasteczka są niedużej wielkości dziennikami zawierającymi informacje tekstowe, które są automatycznie tworzone i przechowywane na komputerze/innym sprzęcie Użytkownika, aby skojarzyć i zidentyfikować działania z Użytkownikiem (odtąd zwane „Ciasteczkami”). Ciasteczka zazwyczaj nie zawierają nazw albo adresów e-mail, albo innych Informacji Osobowych, zwykle zawierają anonimowe dane wymagane do lepszego funkcjonowania Gry albo Usług Gry.
    38.Ciasteczka przechowywane na komputerze/innym sprzęcie Użytkownika, dzięki którym Użytkownik korzysta z Gry albo Materiałów, mają, między innymi, następujące funkcje:
    a.zapewnienie dostępu do zabezpieczonych obszarów, którego to dostępu zażądał Użytkownik. Bez tych Ciasteczek usługi takie, jak bezpieczny login nie mogą być świadczone;
    b.Ciasteczka odwiedzin – zapamiętują wybory albo ustawienia Użytkownika i umożliwiają jego rozpoznanie w trakcie korzystania z Gry. Bez tych Ciasteczek funkcjonowanie Gry może być ograniczone;
    c.Ciasteczka ankietowe – zaznaczają wybrane pozycje dowolnej ankiety, w której Użytkownik uczestniczył, i nie pozwalają Użytkownikowi brać ponownego udziału w tej samej ankiecie;
    d.Ciasteczka ładowania – skracają czas ładowania Gry, rozkładając obciążenie pracą oraz optymalizację czasową usług gry. Bez tych Ciasteczek funkcjonowanie Gry może być niemożliwe;
    e.Ciasteczka dostosowania interfejsu Użytkownika – pozwalają zapisywać ustawienia interfejsu Użytkownika w przypadku ponownego wejścia do Gry i usług gry.
    f.Ciasteczka wykorzystywane do synchronizacji z danymi Użytkownika w sieciach społecznościowych.
    g.        Ciasteczka wydajności (analityczne) – gromadzą anonimowe informacje na temat sposobu wykorzystania Gry przez użytkownika.
    h.Ciasteczka reklamowe – dostarczają Użytkownikowi najnowsze reklamy oraz pomagają w usprawnieniu efektywności kampanii reklamowych. Użytkownik niniejszym akceptuje i zgadza się na to, że Spółka może wykorzystywać takie ciasteczka w celu przeprowadzania własnych kampanii reklamowych.
    39.Administracja może również zezwolić konkretnym osobom trzecim na wprowadzanie i wykorzystywanie swoich własnych ciasteczek wydajności (analitycznych) oraz reklamowych na urządzeniach Użytkownika oraz na gromadzenie informacji z Ciasteczek Spółki w celach przechowywania i analizy informacji na temat preferencji Użytkowników, a także poprawienia jakości usług. W takim przypadku osoby trzecie są związane niniejszą Polityką. Administracja gwarantuje udzielenie takich zezwoleń wyłącznie osobom trzecim cechującym się dobrą reputacją.
    40.Użytkownik rozumie, że używając Gry poprzez wszelkie sieci społecznościowe, takie jak Facebook, Użytkownik może zostać zobowiązany do przestrzegania polityki ciasteczek strony danej sieci społecznościowej, Użytkownik akceptuje także to, że Administracja nie ponosi żadnej odpowiedzialności za wykorzystanie takich ciasteczek.
    41.Korzystanie z Gry albo Usług Internetowych lub zaakceptowanie Umowy (w tym niniejszej Polityki), albo kliknięcie „Akceptuję” równoznaczne jest ze zrozumieniem i akceptacją przez Użytkownika niniejszej Polityki oraz wyrażeniem jego bezpośredniej i wyraźnej zgody na to, że Administracja może umieszczać, przechowywać i wykorzystywać ciasteczka w komputerze Użytkownika lub innych urządzeniach, przez które Użytkownik korzysta z Gry albo jej Materiałów. Administracja zakłada ciągłą zgodę Użytkownika na tę Politykę do momentu, w którym Użytkownik wyłączy ciasteczka w ustawieniach swojej przeglądarki zgodnie z postanowieniami niniejszej Polityki. Dając taką zgodę, Użytkownik daje Administracji możliwość lepszego poznania Użytkownika i jego preferencji oraz ciągłego poprawiania jakości usług w trosce o dobro Użytkowników. Użytkownik niniejszym akceptuje to, że bez włączonych Ciasteczek Gra może nie funkcjonować prawidłowo.
    42.Administracja zapewnia, że przechowywane ciasteczka są bezpieczne dla Użytkowników oraz całkowicie konieczne do normalnego funkcjonowania Gry i jej usług, a także świadczenia usług Użytkownikom przez Administrację.
    43.Ciasteczka przechowywane są przez okres nie większy niż jeden rok. Warunki przechowywania ciasteczek przez osobę trzecią są ustalane przez taką osobę trzecią.
    44.Użytkownik może w każdej chwili odmówić akceptowania ciasteczek i wyłączyć je za pomocą ustawień swojej przeglądarki. Wyłączenie Ciasteczek może mieć negatywny wpływ na jakość Gry i Usług Internetowych, a także może być przyczyną niemożności dostępu do Gry i Usług Internetowych. Użytkownik niniejszym akceptuje to, że Spółka nie ponosi odpowiedzialności za żadną stratę albo uszkodzenie informacji Użytkownika w sytuacji, gdy Użytkownik wyłączył ciasteczka.


    Pozyskiwanie i zmienianie Informacji Osobowych Użytkownika

    45.Użytkownik ma prawo skontaktować się z Administracją w dowolnej chwili, aby pozyskać kopię Informacji Osobowych Użytkownika, które Spółka przechowuje, oraz poprawić wszelkie nieprawidłowości. Użytkownik ma prawo zażądać, aby jego Informacje Osobowe zostały wykasowane, skorygowane lub uzupełnione. Aby skontaktować się z Administracją w sprawie Informacji Osobowych, Użytkownik powinien wysłać wiadomość e-mail na adres help@tankionline.com

    Odmowa podania Informacji Osobowych

    46.Wszelki Informacje Osobowe podane Administracji przez Użytkownika są podawana dobrowolnie. Jednakże Spółka nie może zagwarantować poprawnego funkcjonowania Gry albo jej usług lub jakiegokolwiek funkcjonowania tychże w przypadku, gdy użytkownik nie poda wymaganych Informacji Osobowych.

    Strony sieci społecznościowych

    47.Użytkownik niniejszym rozumie i akceptuje, że korzystanie z Gry przez strony sieci społecznościowych lub inne strony osób trzecich może wymagać od Użytkownika stosowania się do postanowień i warunków tychże stron.


    Zmiany Polityki

    48.Niniejsza Polityka nabiera mocy z dniem widniejącym na jej ostatniej wersji. Niniejsza Polityka może zostać zmieniona, poprawiona lub zastąpiona w dowolnej formie, dowolnym czasie, bez uprzedniego lub następującego powiadomienia Użytkownika. W związku z tym zaleca się okresowe przeglądanie niniejszej Polityki, aby na bieżąco wiedzieć o wszelkich zmianach. Dalsze korzystanie z Gry i usług gry oznacza bezwarunkowe zaakceptowanie zmodyfikowanej wersji niniejszej Polityki.

    Kontakty z Administracją

    49.W razie pytań, uwag, skarg lub komentarzy dotyczących niniejszej Polityki prosimy o kontakt pod adresem help@tankionline.com. Zajmiemy się nimi w jak najkrótszym, możliwym czasie.
    50.Administracja może odmówić zbyt często wysyłanym żądaniom, które wymagają dołożenia niewspółmiernych technicznych wysiłków, zagrażają prywatności innych Użytkowników lub są wyjątkowo niepraktyczne.
    51.Administracja jest upoważniona do przechowywania wszelkiej korespondencji z Użytkownikiem (w tym także zgłoszeń o problemach z Grą lub Usługami Gry).
