    Niniejsza polityka stosowana jest do stron internetowych i pozostałych usług związanych z Grą, lecz nie obejmuje swoim zakresem innych stron i serwisów.

    Jakiekolwiek wykorzystanie Gry oraz jej Usług Internetowych albo kliknięcie „Akceptuję” w trakcie procesu rejestracji potwierdza, że Użytkownik zapoznał się z niniejszą Polityką oraz bezwarunkowo ją akceptuje.
