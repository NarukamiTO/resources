    Definicje

    Poniższe słowa i terminy winne być interpretowane w następujący sposób, o ile z kontekstu wyraźnie nie wynika ich inne znaczenie, a także mają zastosowanie do niniejszej EULA oraz każdego dokumentu wchodzącego w jej skład:

