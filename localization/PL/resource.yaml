  GAME_RULES: |-
    Podsumowanie zasad

    W grze zabrania się następujących czynności:
    – wykorzystywania botów, oprogramowania osób trzecich, błędów;
    – podawania się za członków administracji;
    – przeprowadzania tzw. „power-levelling”, blokowania innych użytkowników;
    – zamieszczania reklam, przeprowadzania politycznych kampanii propagandowych;
    – naruszania prawa, w tym prawa własności intelektualnej;
    – sprzedawania, kupowania, zamieniania, przekazywania kont graczy oraz pozostałych aktywów gry;
    – oszukiwania oraz nieuczciwego zachowania.

    Zabrania się następujących czynności na czacie oraz forum gry:
    – znieważania, grożenia, oczerniania;
    – używania nieprzyzwoitego języka, również dorozumianego;
    – floodowania, kłócenia się, spamowania, nieustannego używania wielkich liter (CAPS LOCKA);
    – wyłudzania haseł oraz innych danych powiązanych z kontami;
    – trollowania;
    – namawiania pozostałych graczy do naruszania Zasad Gry;
    – prowadzenia publicznych dyskusji przez administrację oraz moderatorów;
    – publikowania informacji prawnie zakazanych;
    – publikowania linków do stron osób trzecich;
    – przejawiania jakichkolwiek form dyskryminacji.

    Zasady Gry
    Wchodzisz do gry Tanki Online, w której osoby z całego świata cieszą się możliwością prowadzenia ogromnych maszyn wojennych i brania udziału w zaciętych bitwach! Gracze mogą walczyć samotnie lub dobierać się w drużyny, aby wspólnie z innymi maszerować po zwycięstwo. Mogą utrzymywać kontakty towarzyskie oraz szukać nowych znajomych.
    Tanki Online jest łatwą do opanowania, wieloosobową grą akcji, sceną poważnych bitew oraz świetną siecią społecznościową.
    Po ukończeniu procesu rejestracji Użytkownik otrzymuje wirtualny czołg oraz 500 kryształów (waluta w grze). Wygrywając bitwy, Użytkownik pomnaża swoje punkty, otrzymuje nowe rangi i kryształy. Kryształów można używać do nabywania amunicji, ulepszeń do czołgów, armat oraz pancerza.
    Tanki Online to nie tylko ekscytująca gra. Tworzymy społeczność ludzi, których łączą te same zainteresowania. Promujemy wzajemny szacunek oraz uprzejmość, a zdecydowanie nie pochwalamy obelżywego języka oraz naruszania praw Użytkowników. Administratorzy zastrzegają sobie prawo do ograniczania możliwości komunikowania się użytkowników, obniżania ich punktów albo blokowania Kont, jeżeli naruszają oni Zasady Gry.


    Postanowienia ogólne

    Zasady Gry stanowią integralną część Umowy Licencyjnej Użytkownika Końcowego (odtąd określanej mianem „Umowy” lub EULA) oraz pozostałych dokumentów i usług powiązanych z Grą. Umowa, Polityka prywatności i ciasteczek, a także pozostałe dokumenty i usługi powiązane z Grą są odpowiednio integralną częścią niniejszych Zasad Gry.
    Jakiekolwiek terminy oraz pojęcia użyte w Zasadach Gry mają znaczenie przypisane im w Umowie.
    Jakiekolwiek wykorzystanie Gry oraz jej Usług Internetowych, a także kliknięcie „Akceptuję” w trakcie procesu rejestracji potwierdza, że Użytkownik zapoznał się z Zasadami Gry oraz bezwarunkowo je akceptuje.
    Zasady Gry są wiążące dla wszystkich Użytkowników.
    Jeżeli nie zgadzasz się z dowolnym warunkiem niniejszych Zasad Gry, prosimy o opuszczenie tej Strony i niekorzystanie z Gry.


    1. Zabrania się tworzenia nazw (nazw Użytkownika), które:

    1.1. Zawierają wulgaryzmy, obelgi/prowokacje do obelg (w formie całych słów, skrótów lub wyrażeń);
    1.2. Zawierają elementy wskazujące na rasizm, faszyzm, obelżywość lub są nazwami wykorzystującymi tożsamość rasową, narodowościową lub religijną, lub prowokującymi nienawiść, nietolerancję, a także nieporozumienia etniczne;
    1.3. Zawierają nawoływania do przemocy, terroryzmu, ekstremizmu albo zakłócania porządku publicznego;
    1.4. Zawierają agitacje polityczne, propagandę lub nawoływania polityczne dowolnego rodzaju;
    1.5. Są bezpośrednio lub pośrednio związane z organizacjami politycznymi (osobami), w tym z tymi, które dopuściły się przestępstw politycznych, przestępstw przeciwko ludzkości, aktów terrorystycznych;
    1.6. Oznaczają dyskryminację płciową, wiekową, religijną lub zawierają jakiekolwiek elementy tejże;
    1.7. Zawierają bezpośrednią lub pośrednią propagandę, nawołują do konsumpcji napojów alkoholowych lub zawierających alkohol, piwa, produktów tytoniowych i toksycznych, narkotyków, substancji psychotropowych albo odurzających,a także pierwowzorów powyższych substancji. Zabrania się również tworzenia nazw informujących o miejscach i metodach produkcji, nabywania, hodowli oraz wykorzystywania powyższych substancji;
    1.8. Zawierają nawoływania do uczestnictwa w grach hazardowych, prostytucji, włóczęgostwie oraz żebraniu;
    1.9. Zawierają informacje na temat metod popełniania samobójstwa, nakłaniania do samobójstwa, przemocy lub innych czynności stanowiących zagrożenie dla życia lub zdrowia;
    1.10. Zawierają podburzanie do zachowania sprzecznego z prawem, przestępstwa, przemocy, okrucieństwa, spowodowania szkód przyczyniających się do zachowań zabronionych przez prawo;
    1.11. Zawierają części nazw Użytkowników pracowników Administracji lub zawierają informacje pociągające za sobą błędne postrzeganie Użytkownika jak przedstawiciela Administracji;
    1.12. Zawierają krytyczną ocenę Gry, Administratorów lub moderatorów;
    1.13. Są bezpośrednio lub pośrednio związane ze współżyciem seksualnym, przemocą, pornografią, pedofilią;
    1.14. Zawierają opis ciała oraz funkcji biologicznych jego dolnych części lub odruchów;
    1.15. Zawierają reklamy lub hiperlinki;
    1.16. Zawierają odniesienia do nieuczciwych kodów, stron lub zasobów, które naruszają prawa Administracji;
    1.17. Składają się z niemożliwych do wymówienia, losowych zbitek literowych (nazwy zaśmiecające);
    1.18. W całości lub części składają się z zarejestrowanych znaków firmowych chronionych przez prawo autorskie.
    1.19. Zawierają pozostałe informacje zabronione przez niniejsze Zasady Gry, Umowę albo obowiązujące prawo.
    1.20. Jeżeli nazwa Użytkownika nie spełnia powyższych wymagań, pozostałych wymagań określonych w Zasadach Gry, Umowie lub obowiązującym prawie, Administracja ma prawo, według własnego uznania:
    – zażądać od Użytkownika, aby ten zmienił swoją nazwę na nazwę akceptowaną, a także zablokować Konto Użytkownika na czas potrzebny do zmiany nazwy Użytkownika;
    – nieodwołalnie zablokować Konto Użytkownika.


    2. Następujące czynności są zabronione i pociąganą za sobą (wedle uznania Administracji) stałą lub tymczasową blokadę Konta Użytkownika, pomniejszenie wszystkich wirtualnych aktywów Gry Użytkownika o od 10% do 100% (hangar, kryształy, statystyki gry) lub wyzerowanie Konta Użytkownika, tymczasowe lub stałe ograniczenie dostępności czatu w grze oraz forum (blokada):

    2.1. Wszelkie formy niesportowego lub nieuprzejmego zachowania w Grze:

    2.1.1. Botowanie (używanie oprogramowania naśladującego czynności Użytkownika w Grze), wykorzystanie programów klikających, makr kontrolujących ruch myszki i klawiatury oraz programów osób trzecich do odniesienia korzyści w Grze;
    2.1.2. Zastosowanie lub rozprowadzanie programów osób trzecich lub innych środków poprawy/zautomatyzowania możliwości w Grze (botów, oszustw), jak również programów, które mogą pogorszyć funkcjonowanie Gry albo urządzeń elektronicznych osób trzecich;
    2.1.3. Wykorzystywanie błędów w oprogramowaniu Gry oraz przekazywanie o nich informacji osobom trzecim, z wyłączeniem Administracji;
    2.1.4. Zyskiwanie punktów doświadczenia poprzez umyślną bezczynność lub umyślne korzystanie z pomocy innych graczy z drużyny w trybach „Zdobądź flagę”, „Strefy wpływu” lub „Team Deathmatch”, lub przeciwników w trybie „Deathmatch” (tzw. power-leveling);
    2.1.5. Bitwy pomiędzy kontami, których właścicielem jest ten sam Użytkownik;
    2.1.6. Tworzenie dodatkowych kont do tzw. „power-levelowania” Konta głównego;
    2.1.7. Umawianie się z pozostałymi Użytkownikami na walki „na pół gwizdka” w celu „power-levelingu” (Administracja nałoży ograniczenia na wszystkie strony takiego porozumienia);
    2.1.8. Wszelkie działania lub zaniechania, których celem jest blokowanie drużyny Użytkownika, włączając w to tryby Zdobądź flagę, Team Deathmatch oraz Strefy wpływu, walka przeciw swojej drużynie, uszkadzanie/niszczenie czołgu sojusznika, walka po stronie drużyny przeciwnej, a także umawianie się z wrogiem, sabotaż;
    2.1.9. Dyskryminacja niedoświadczonych graczy (nowicjuszy): dezinformowanie, zastraszanie, wyśmiewanie;
    2.1.10. Obrażanie, oczernianie (rozpowszechnienie mylnych informacji) innych Użytkowników, Administracji, moderatorów, pozostałych osób;
    2.1.11. Wszelkie formy manipulacji lub spiskowania w Grze;
    2.1.12. Wykonywanie wszelkich czynności mających negatywny wpływ na rozwój Gry i jej wizerunek;
    2.1.13. Inne formy niesportowego zachowania, uznane za takie przez Administrację, utrudniające swobodne granie.


    2.2. Wszelkie formy oszustw, w szczególności:

    2.2.1. Wykorzystanie Gry albo usług z nią związanych do nieuczciwych działań, w tym do nielegalnych transakcji finansowych w Grze, oszustw wynikających z transakcji, płatności, w tym wszelkich zwrotów oraz zabronionych transakcji;
    2.2.2. Przeniesienie Konta lub pozostałych aktywów w Grze na osoby trzecie; publikacja wszelkich ofert sprzedaży, kupna lub przeniesienia Konta lub aktywów w Grze, zarówno bezpłatnie, jak i za kryształy lub prawdziwe pieniądze. Zabronione jest również nakłanianie do powyższych czynności.
    2.2.3. Próby przejęcia hasła, pozostałych danych Konta lub danych osobowych innych Użytkowników, włączając w to wymuszenie za pomocą moralnych, fizycznych lub technicznych gróźb;
    2.2.4. Rozpowszechnianie informacji osobowych o Użytkownikach lub osobach trzecich (o ile informacje te nie są publicznie dostępne);
    2.2.5. Oszustwo – uzyskanie waluty w Grze za pomocą dowolnych, nieuczciwych środków;
    2.2.6. Wszelkie próby przedstawiania siebie jako byłego lub obecnego pracownika Administracji lub asystenta projektu (moderatora, konsultanta itp), włączając w to wysyłanie wiadomości w imieniu Administracji lub moderatorów;
    2.2.7. Żebranie w każdej formie, włączając w to prośby o przekazanie funduszy, aktywów Gry lub kryształów;
    2.2.8. Publikacja linków do zasobów zewnętrznych ucharakteryzowanych jako oficjalne zasoby Gry.

    2.3. Pozostałe naruszenia:

    2.3.1. Używanie ordynarnego lub obelżywego języka lub innych słów (fraz) niesklasyfikowanych jako ordynarny język, również w formie dorozumianej;
    2.3.2. Publikacja informacji i materiałów o naturze seksualnej, erotycznej lub pornograficznej, obrazujących lub opisujących relacje seksualne pomiędzy mężczyzną i kobietą;
    2.3.3. Publikacja informacji lub symboli, które obrażają lub poniżają uczucia osób wierzących, powodują nienawiść, wrogość, rasową, narodową lub etniczną niezgodę, nietolerancję (włączając w to obelgi, nadawanie nazw na podstawie cech rasowych, narodowych, etnicznych lub religijnych), a także prowokują interlokutora do popełnienia powyższych wykroczeń;
    2.3.4. Propagowanie lub demonstrowanie nazistowskich symboli, skrótów, określeń lub imion i nazwisk nazistowskich aktywistów;
    2.3.5. Publikacja informacji zaprzeczających wydarzeniom historycznym;
    2.3.6. Publikacja informacji, w których można się dopatrzyć nawoływania do przemocy, wojny, terroryzmu, obalenia władzy, działań ekstremistycznych lub zakłócających porządek publiczny;
    2.3.7. Publikacja informacji na temat organizacji politycznych (przywódców politycznych), które popełniły przestępstwa polityczne lub przestępstwa przeciwko ludzkości, akty terroryzmu lub w jakikolwiek inny sposób naruszyły międzynarodowe prawa;
    2.3.8. Publikacja informacji zawierających polityczną agitację, reklamę lub propagandę przedwyborczą dowolnego rodzaju;
    2.3.9. Debatowanie nad sprawami politycznymi dnia dzisiejszego jako prowokującymi konflikty;
    2.3.10. Wszelka forma dyskryminacji płciowej, wiekowej, religijnej lub zawierającej jakiekolwiek elementy tejże;
    2.3.11. Wszelkie groźby odnoszące się do Użytkowników, Administracji lub osób trzecich;
    2.3.12. Publikacja informacji omawiających metody popełnienia samobójstwa, nawołujących do samobójstwa, przemocy lub innych czynności zagrażających życiu lub zdrowiu, a także informacji opisujących niebezpieczne techniki walki, wyczyny kaskaderskie, metody produkcji broni oraz modyfikacji ciała;
    2.3.13. Publikacja informacji opisujących niezgodne z prawem lub antyspołeczne zachowanie, przestępstwa, przemoc, okaleczenie, psychiczne lub fizyczne znęcanie się nad ludźmi lub zwierzętami, niszczenie cudzej własności lub informacji nawołujących do powyższych czynności, lub je usprawiedliwiających;
    2.3.14. Publikacja informacji powodujących strach, przerażenie lub panikę u dzieci, włączając w to zdjęcia lub opisy śmierci, chorób, samobójstw, wypadków, nagłych wypadków, katastrof oraz ich konsekwencji, a także pozostałych informacji mogących wpływać niekorzystnie na zdrowie lub rozwój nieletnich;
    2.3.15. Publikacja informacji o nieletnim, który ucierpiał wskutek czynności sprzecznych z prawem (zaniedbań);
    2.3.16. Publikacja informacji zawierających bezpośrednią lub pośrednią propagandę, nawołujących do konsumpcji napojów alkoholowych lub zawierających alkohol, piwa, produktów tytoniowych i toksycznych, narkotyków, substancji psychotropowych albo odurzających,a także pierwowzorów powyższych substancji. Zabrania się również publikacji informacji o miejscach i metodach produkcji, nabywania, hodowli oraz wykorzystywania powyższych substancji;
    2.3.17. Publikacja informacji skłaniających do gier hazardowych, prostytucji, włóczęgostwa lub żebractwa;
    2.3.18. Wszelkie wykorzystanie własności intelektualnej (oprogramowania, sztuki, materiałów wideo oraz pozostałych obiektów, a także ich części, znaków handlowych itp.) lub innych materiałów bez pozyskania zgody właściciela; umieszczanie linków z nielegalną zawartością; usunięcie lub zmiana informacji dotyczących praw autorskich, w szczególności odnośników do właścicieli praw, autorów lub innego rodzaju potwierdzenia praw autorskich;
    2.3.19. Publikacja wszelkich materiałów reklamowych lub podobnych informacji bez zgody Administracji;
    2.3.20. Publikacja informacji mogących spowodować szkody/straty Użytkowników lub Administracji;
    2.3.21. Niekonstruktywna krytyka Gry albo jej autorów, Właściciela;
    2.3.22. Jawna lub implicytna dyskusja publiczna na temat Administracji lub moderatorów Gry;
    2.2.23. Podawanie fałszywych lub zmyślonych informacji, dokumentów lub dowodów. Administracja ostrzega Użytkownika o skutkach prawnych oraz pozostałych skutkach takich działań;
    2.3.24. Popełnienie lub nawoływanie (prowokacja) do działań (zaniechań) zabronionych przez poniższe Zasady Gry, Umowę albo stosowne prawo.

    3. Zabrania się rozpoczynania tematów albo tworzenia wiadomości w czacie gry albo na Forum, które:
    3.1. Powielają istniejące tematy lub wiadomości, a także tematy niedawno dyskutowane albo odpowiedzi na takie tematy, które są dostępne w sekcji informacyjnej (Zasady Gry, FAQ, Plany itp). Prosimy nie zapominać o skorzystaniu z opcji wyszukiwania, aby znaleźć odpowiedzi na swoje pytania. Należy uważnie przeszukać istniejące tematy przed założeniem nowego.
    3.2. Nie odpowiadają tematowi danej sekcji/kategorii;
    3.3. Zawierają CAPS LOCK lub dużo WiELKICH LiTER w tytule albo zawartości tematu lub wiadomości;
    3.4. Mają nieistotne lub powtarzające się symbole, znaki, emotikony, wiadomości w swoim tytule albo opisie tematu lub wiadomości, które utrudniają zrozumienie tematu lub sekcji, a także nie mają żadnego znaczenia (Zaśmiecanie), na przykład == - Mój temat - ==;
    3.5. Zawierają tekst pisany czcionką większą niż 24;
    3.6. Brakuje w nich informacji i nie odnoszą się do istoty tytułu lub opisu w temacie;
    3.7. Cytują zbyt duże ilości tekstu z poprzednich wiadomości albo obrazy bez takiej potrzeby (nadmierne cytowanie);
    3.8. W dalszym ciągu odnoszą się do tematów zamkniętych lub skasowanych przez Administrację (necroposting);
    3.9. Mają naturę osobistej prośby do uczestników Forum lub czatu Gry. Do osobistej komunikacji prosimy używać Wiadomości Prywatnych. Prywatne dyskusje są dopuszczalne równolegle z procesem rozwiązywania problemów.
    3.10. Zawierają spam, czyli rozsyłają informacje niepożądane przez adresata, na których otrzymywanie nie wyraził on zgody;
    3.11. Są internetowymi kłótniami (kłóceniem się dla samego kłócenia, wymianą wiadomości będącą wojną na słowa, która często nie jest związana z pierwotną przyczyną sporu);
    3.12. Zawierają tzw. „trolling” (nakłanianie członków społeczeństwa do czynności, które będą miały negatywne konsekwencje i powodują konflikty);
    3.13. Są próbą prowokacji innych Uczestników, Administracji, moderatorów, a także zakłócenia komunikacji na Forum lub czacie Gry;
    3.14. Zawierają linki, „kody” (addscore, Buy_krictals_in_the_panzer);
    3.15. Zawierają inne informacje lub naruszenia zabronione przez niniejsze Zasady Gry, Umowę albo stosowne prawo.
    3.16. Za dopuszczenie się wymienionych naruszeń Administracja będzie według własnego uznania nakładać na Użytkownika ograniczenia w formie stałego lub tymczasowego zablokowania Konta lub stałego lub tymczasowego ograniczenia dostępności do czatu w grze i Forum (zawieszenie).
    3.17. Administracja może według własnego uznania i bez powiadomienia usunąć wszelkie informacje lub wiadomości; usunąć/przesunąć temat stworzony w niewłaściwej sekcji Forum.
    3.18. Prywatne wiadomości służą prywatnej komunikacji Użytkownika w grze i na Forum. Administracja analizuje zgłoszenia dotyczące naruszenia Zasad Gry, lecz nie będzie wszczynać dochodzeń w sprawach zgłoszeń dotyczących wiadomości prywatnych. Użytkownik może zablokować otrzymywanie wiadomości prywatnych od drugiego użytkownika poprzez dodanie tegoż do swojej Czarnej Listy we właściwej sekcji profilu Użytkownika na forum.

    4. Nakładanie ograniczeń na Użytkownika
    4.1. Jeżeli Użytkownik naruszy niniejsze Zasady Gry, Administracja będzie upoważniona do nałożenia na niego ograniczeń określonych w odpowiedniej sekcji Zasad Gry.
    4.2. Rodzaje ograniczeń:
    4.2.1. Stałe lub tymczasowe zablokowanie Konta — blokada (ograniczenie) dostępu do Gry.
    4.2.2. Pomniejszenie wszystkich wirtualnych aktywów Użytkownika w Grze (hangar, kryształy, statystyki Gry) o od 10% do 100% lub wyzerowanie jego Konta.
    4.2.3. Tymczasowe lub stałe ograniczenie dostępu Użytkownika do czatu i Forum Gry (zawieszenie) —ograniczenie możliwości zostawiania wiadomości na czacie i Forum.
    4.2.4. Usunięcie lub zmiana, bez uprzedzenia, wszelkich informacji lub wiadomości pozostawionych w dowolnej części Gry lub usług z nią związanych; przeniesienie tematów Forum do innej sekcji lub usunięcie tematów.
    4.3. Ograniczenia te mogą zostać nałożone na każde Konto Użytkownika, który narusza niniejsze Zasady Gry.
    4.4. Administracja według własnego uznania nakłada jedną lub kilka kar na danego Użytkownika lub daje mu ostrzeżenie.
    4.5. Wybierając rodzaj ograniczenia, Administracja bierze pod uwagę rodzaj i liczbę naruszeń, a także poprzednie naruszenia niniejszych Zasad Gry przez Użytkownika.
    4.6. Jako że nie zawsze możliwe jest precyzyjne ustalenie danego naruszenia Zasad Gry, Administracja zachowuje sobie prawo podjęcia ostatecznej decyzji.
    4.7. Naruszenie niniejszych Zasad Gry oznacza, że Użytkownik może zostać bez uprzedniego powiadomienia pozbawiony świadczenia usług związanych z Grą lub też świadczenie tychże może zostać ograniczone w całości bądź części.
    4.8. Jeżeli Użytkownik kilkukrotnie lub w sposób zintegrowany narusza Zasady Gry, Administracja może według własnego uznania powtórnie nałożyć ograniczenia na tego Użytkownika.
    4.9. Administracja nie jest w żaden sposób odpowiedzialna za żadną stratę lub szkodę, pośrednią lub bezpośrednią, które Użytkownik lub osoba trzecia może ponieść wskutek wykorzystywania przez Użytkownika lub osobę trzecią Strony Internetowej, Gry albo Usług Internetowych, włączając w to, między innymi za straty spowodowane niemożnością korzystania z Gry lub Usług Internetowych lub spowodowane nałożeniem przez Administrację ograniczeń na Użytkownika, za bezpośrednie lub pośrednie straty wynikające z działalności osoby trzeciej, w tym innych użytkowników Gry, brak dostępu do internetu, kradzież, zniszczenie Materiałów, utratę informacji dotyczących Konta Użytkownika oraz za żadną szkodę na honorze, godności czy reputacji biznesowej Użytkownika wynikającą z tytułu użytkowania Gry.

    5. Moderatorzy
    5.1. Moderatorzy są pomocnikami Administracji, która wybiera ich spośród Użytkowników.
    5.2. Moderator to osoba działająca w imieniu i interesie Administracji. Moderatorzy pilnują porządku w Grze i usługach związanych z grą, a także na Forum i czacie Gry.
    5.3. Moderator może nałożyć tymczasowe lub stałe ograniczenie dostępu do czatu Gry lub Forum (zawieszenie) na Użytkownika, który narusza niniejsze Zasady Gry.
    5.4. Moderator jest uczciwy i obiektywny w podejmowanych decyzjach, a także stosuje się do postanowień niniejszych Zasad Gry i Umowy. Moderator jest także uprzejmy w stosunku do Użytkowników, wykonuje swoje obowiązki sprawnie i regularnie.
    5.5. Surowo zabrania się moderatorom nadużywania swoich uprawnień. Wszystkie działania moderatorów są rejestrowane. Jeżeli moderator nie zasługuje na pokładane w nim zaufanie, zostaje bez ostrzeżenia zwolniony z pełnionej funkcji wewnętrzną decyzją podjętą przez Administrację.
    5.6. Działalność moderatorów jest działalnością społeczną. Użytkownik nie może nakłaniać moderatora do nałożenia jakichkolwiek ograniczeń.

    6. Skargi i prośby
    6.1. Użytkownik ma prawo zgłaszać naruszenia Zasad Gry, rozpoczynając nowy temat na forum w sekcji <a href="http://en.tankiforum.com/index.php?showforum=76" target="_blank"><u>Naruszenia</u></a>. Należy w nim w sposób zrozumiały określić charakter naruszenia, a także załączyć zrzut ekranu czatu lub wideo wyraźnie pokazujący opisywane wykroczenie.
    6.2. Użytkownik może wysyłać pytania, komentarze lub skargi dotyczące niniejszych Zasad Gry na adres help@tankionline.com. Administracja postara się rozpatrzyć wiadomości takiego typu w jak najkrótszym czasie.
    6.3. Wysyłając skargę, Użytkownik winien w sposób szczegółowy i zrozumiały opisać daną sytuację, a także załączyć dowody w postaci zrzutów ekranu itp. Skargi dotyczące bezpodstawnych ograniczeń rozpatruje się wyłącznie w celu wewnętrznej oceny pracy Administracji i moderatora. Decyzje o nałożeniu ograniczeń nie podlegają rewizji.
    6.4. Administracja jest upoważniona do przechowywania wszelkiej korespondencji z Użytkownikiem (w tym także zgłoszeń o problemach z Grą lub usługami z nią związanymi).

    7. Pozostałe postanowienia:
    7.1. Administracja kieruje Grą oraz według własnego uznania stosuje niniejsze Zasady Gry, jednakże bierze również pod uwagę opinię społeczności graczy.
    7.2. Niniejsze Zasady Gry mogą zostać zmienione przez Administrację bez uprzedniego powiadomienia. Użytkownicy zobowiązani są do sprawdzania zmian w niniejszych Zasadach Gry przynajmniej co siedem dni (tj. co tydzień). Jeżeli Użytkownik nie przeprowadził takiej kontroli w określonym czasie i w dalszym ciągu korzysta z Gry, to uważa się, że przeczytał i zaakceptował zmienioną wersję niniejszych Zasad Gry.
    7.3. Administracja prowadzi politykę „zero tolerancji” wobec oszustw. Jeżeli, według Administracji, Użytkownik oszukał lub próbował oszukać Administrację lub innego Użytkownika, przekazywał nieprawdziwe lub zmyślone informacje, dokumenty, dowody lub w inny sposób naruszył obowiązujące prawo, Administracja zastrzega sobie prawo do zablokowania Konta takiego Użytkownika i przekazania tychże informacji, według własnego uznania, (wraz z danymi osobowymi Użytkownika) dowolnej osobie trzeciej albo organom ścigania, jeżeli będzie to zdaniem Administracji konieczne.
    7.4. Administracja może wprowadzić kolejne postanowienia i ograniczenia w Zasadach Cybersportu, zasadach zawodów, turniejów oraz mistrzostw. Niniejsze Zasady Gry stanowią jednocześnie integralną część pozostałych zasad przyjętych przez Administrację.
