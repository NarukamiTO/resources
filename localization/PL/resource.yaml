    1. Strony Internetowej można używać wyłącznie w celach zgodnych z prawem. Surowo zabronione jest wykorzystywanie Strony Internetowej do przekazywania, dystrybucji, publikacji lub przechowywania jakichkolwiek materiałów, jeżeli czynności te naruszają jakiekolwiek postanowienia prawa, przepisy lub prawa osób trzecich. W powyższe wliczają się (między innymi) wykorzystanie Strony Internetowej do przekazywania, dystrybucji, publikacji lub przechowywania na niej wszelkich materiałów łamiących prawo autorskie, znaki handlowe, tajemnicę handlową lub wszelkie inne prawa własności intelektualnej, materiałów, które są nieprzyzwoite i szkodliwe dla Nieletnich lub stanowią czyn niezgodny z prawem albo nękanie, materiałów nieuczciwych lub łamiących jakiekolwiek postanowienia prawa hazardowego lub kontroli dewizowej.
    2. W przypadku niewłaściwego wykorzystania albo nadużywania Strony Internetowej Administracja zastrzega sobie prawo do zablokowania Konta Użytkownika oraz uniemożliwienia mu w przyszłości korzystania z i uzyskania dostępu do Gry oraz Strony Internetowej albo do podjęcia wszelkich innych kroków prawnych, które Spółka uzna za słuszne.

    Zasady Czatu

    1. Forum, chat-room albo usługi społecznościowe są oferowane przez Tanki Online w celu zapewnienia zabawy i przyjemności ich użytkownikom. Dlatego też nie będą tolerowane żadne przejawy obelżywego i nieprzyzwoitego języka, a Użytkownicy dopuszczający się takich zachowań zostaną ukarani cofnięciem dostępu do czatu oraz unieważnieniem wszystkich Kont.
    2. Użytkownik jest świadom tego, że poprzez umieszczanie wszelkich informacji osobowych na Stronie Internetowej upublicznia je innym Użytkownikom. Tanki Online w żaden sposób nie zatwierdza takich informacji i nie będzie odpowiedzialna za jakiekolwiek szkody powstałe w wyniku publikacji tychże. Użytkownicy winni być świadomi tego, że informacje umieszczane na Stronie Internetowej mogą również wpłynąć na ich życie poza grą.
    3. Zawartość przechowywana na serwerach Spółki nie jest przeznaczona do stałej lub tymczasowej archiwizacji. Dlatego też Tanki Online może, lecz nie musi, przechowywać kopie zapasowe wszelkich materiałów umieszczonych na Stronie Internetowej. Spółka zastrzega sobie prawo do nałożenia ograniczeń dotyczących maksymalnej ilości miejsca na dane dostępnej dla każdego Użytkownika.
    4. Spółka zastrzega sobie prawo do usunięcia, przesunięcia albo edycji, według własnego uznania, zawartości, którą uzna za obelżywą lub łamiącą postanowienia jakiegokolwiek prawa albo przepisu, albo Zasad Gry. Użytkownik jest całkowicie odpowiedzialny za treści umieszczane na Stronie Internetowej. Nieusunięcie danych treści przez Administrację w żadnym przypadku nie może zostać uznane za ich akceptację albo zatwierdzenie ze strony Spółki.

    Konta Użytkowników

    Otwarcie Konta Użytkownika

    1.Konto Użytkownika musi zostać osobiście zarejestrowane przez Użytkownika, a Administracja niniejszym zastrzega sobie sprawo do odmowy rejestracji Konta Użytkownika na Stronie Internetowej skierowanej do dowolnego Użytkownika z dowolnego powodu i bez podawania uprzedniego wyjaśnienia.
    2.Na Użytkowniku ciąży odpowiedzialność uaktualniania swoich danych w Grze, dotyczy to zwłaszcza adresu e-mail. Na Użytkowniku ciąży odpowiedzialność niezwłocznego poinformowania Administracji o wszelkich zmianach dotyczących informacji osobowych Użytkownika.
    3.Tanki Online surowo zabrania Użytkownikom sprzedawania, przekazywania Kont(a) innym Użytkownikom lub nabywania ich od innych Użytkowników oraz osób trzecich. Zabrania się przekazywania funduszy/Kryształów pomiędzy różnymi Kontami Użytkownika.
    4.Administracja zastrzega sobie prawo do nierejestrowania albo cofnięcia rejestracji Konta Użytkownika w przypadku wykrycia fałszywości, nieprecyzyjności, niekompletności lub zakłamania informacji podanych Administracji.

    Nazwa Użytkownika

    1. W trakcie rejestracji Konta Użytkownik otrzyma prawo wybrania Nazwy Użytkownika. Administracja zastrzega sobie prawo do odmowy nadania lub wycofania, z jakiegokolwiek powodu uznanego przez Administrację za słuszny, wszelkich Nazw Użytkownika przed, w trakcie oraz po procesie ich nadawania i zatwierdzania.
    2. Jeżeli Konto Użytkownika, poza wybraną Nazwą Użytkownika, nie łamie postanowień niniejszej EULA, to Administracja pozwoli Użytkownikowi stworzyć inny pseudonim albo Nazwę Użytkownika.

    Ochrona Hasła

    1. Spółka nie jest w żadnym stopniu odpowiedzialna za możliwy dostęp do Konta osób trzecich i nie będzie odpowiedzialna za jakiekolwiek możliwe szkody poniesione w związku z niedozwolonym wykorzystaniem Loginu i Hasła Użytkownika przez osoby trzecie, nieautoryzowanym dostępem do Konta albo w związku z jakąkolwiek transakcją, w której Login i Hasło Użytkownika zostały poprawnie wprowadzone.
    2. Spółka nie jest w żaden sposób odpowiedzialna za sytuację, w której Użytkownik zapomni, zagubi lub straci hasło, chyba że sytuacja taka wyniknie z błędu Spółki. Spółka nie będzie odpowiedzialna, przez cały okres obowiązywania Umowy z Użytkownikiem, za przechowywanie jakichkolwiek Loginów oraz Haseł.

    Blokowanie Kont

    1. Użytkownik jest upoważniony, poprzez wysłanie e-maila na adres help@tankionline.com, do zażądania od Administracji zablokowania Konta Użytkownika.
    2. Niezalogowanie się Użytkownika do Gry przez sześć (6) kolejnych miesięcy upoważnia Administrację do zablokowania Konta Użytkownika oraz natychmiastowego rozwiązania niniejszej Umowy za powiadomieniem (lub próbą powiadomienia) Użytkownika.
    3. Administracja jest upoważniona do zablokowania Konta Użytkownika w dowolnym momencie i według własnego uznania oraz w przypadku naruszenia przez Użytkownika warunków EULA, Zasad Gry oraz innych dokumentów stanowiących integralną część niniejszej EULA.

    Działalność Nieuczciwa oraz Niewłaściwe Wykorzystanie Kont

    1. Spółka prowadzi politykę „zero tolerancji” dla niewłaściwej gry oraz nieuczciwych działań, a także zabrania Użytkownikom wszelkich działań w zmowie. Jeżeli według Administracji Użytkownik oszukał lub próbował oszukać Administrację albo innego Użytkownika Gry w dowolny sposób, między innymi poprzez manipulacje w Grze lub oszustwo finansowe, zmowę Użytkowników lub podejrzewaną fałszywą płatność, w tym poprzez wykorzystanie skradzionych kart kredytowych albo jakąkolwiek inną nieuczciwą działalność (w tym poprzez wszelkie obciążenia zwrotne albo inne zwroty płatności), albo zabronioną transakcję (w tym poprzez pranie brudnych pieniędzy), Administracja zastrzega sobie prawo do zablokowania takiego Konta Użytkownika i ujawnienia informacji o rzeczonym nieuczciwym działaniu (wraz z tożsamością Użytkownika) wszelkim osobom trzecim albo organom ścigania, zgodnie z tym, co uzna za słuszne.
    2. W przypadku niewłaściwego wykorzystania albo nadużywania Strony Internetowej albo Gry, albo Oprogramowania, Administracja zastrzega sobie prawo do zablokowania zakwestionowanego Konta Użytkownika, aż do rozwiązania tej sprawy pomiędzy Administracją, a Użytkownikiem, a także do podjęcia wszelkich kroków prawnych, które Spółka uzna za stosowne.

    Usługi Płatne

    1. Użytkownicy mogą korzystać z Usług Płatnych w Grze poprzez zakup Kryształów. Zakup Kryształów może być zrealizowany jedynie u upoważnionych osób trzecich.
    2. Tanki Online nie zezwala na jakiekolwiek przekazywanie wirtualnego mienia/Kryształów poza grą. Sprzedaż, przekazywanie lub wymiana wszelkich Materiałów, Kryształów albo obiektów używanych w Grze poza Grą jest zabroniona.
    3. Usługi Płatne rozpoczynają się od chwili przekazania Kryształów na Konto Użytkownika. Użytkownik jest świadom utraty prawa do wycofania się z Usługi Płatnej od chwili przekazania Kryształów na Konto Użytkownika.

    Zakup Kryształów

