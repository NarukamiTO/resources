    Gromadzenie Informacji Osobowych

    10.Administracja ma prawo zażądać od Użytkownika podania informacji, aby umożliwić mu korzystanie z Gry, w tym informacji dostarczanych podczas wypełniania specjalnych formularzy w Grze oraz Usługach Gry, informacji dostarczanych podczas rejestracji, zapisywania się do usług, publikacji materiałów oraz zapisywania się do innych usług, w tym adresu e-mail, numeru telefonu, danych identyfikacyjnych w sieciach społecznych, nazwy użytkownika i hasła.
    11.Administracja może zażądać wszelkich informacji potrzebnych do organizacji i przeprowadzania wydarzeń w Grze, jeżeli Użytkownik zarejestrował swoje uczestnictwo w takich wydarzeniach zainicjowanych przez Administrację.
    12.Administracja jest upoważniona do przechowywania wszelkiej korespondencji z Użytkownikiem (w tym także zgłoszeń o problemach z Grą lub Usługami Gry).
    13.Administracja może poprosić Użytkownika o wzięcie udziału w ankietach, w których konieczne będzie podanie niektórych informacji, jednakże nie jest to obowiązkowe i każdy Użytkownik może odmówić wzięcia udziału w takich ankietach.
    14.Administracja może gromadzić i przetwarzać szczegóły transakcji oraz dane dotyczące płatności Użytkownika, jeżeli Użytkownik korzysta z dowolnych Usług Płatnych.
    15.Przeglądarka lub inny program Użytkownika może przekazywać informacje dotyczące wizyt na stronach Gry i w Usługach Gry, w tym informacje dotyczące ruchu internetowego, logi, dane dotyczące położenia geograficznego komputera Użytkownika i związanych z tym możliwości, a także inne informacje. Użytkownik niniejszym potwierdza, że Administracja może używać tych informacji do celów i w procedurach ustalonych przez niniejszą Politykę.
    16.Administracja, w celu wykonania niektórych działań, może zażądać od Użytkownika informacji takich, jak płeć, wiek, data urodzenia oraz preferencje dotyczące gier.
    17.Administracja może gromadzić, przetwarzać i wykorzystywać inne informacje określone w Umowie, a także wszelkich dokumentach tworzących integralną część EULA.


    Zgoda Użytkownika

    18.Jeżeli w formularzu rejestracyjnym Usług Płatnych lub jakimkolwiek innym formularzu rejestracyjnym użytym w Grze lub Usługach Gry Użytkownik podaje Informacje Osobiste, oznacza to, że Użytkownik dał swoją bezpośrednią i wyraźną zgodę na stosowanie się do niniejszej Polityki, Umowy oraz wszelkich dokumentów tworzących część Umowy, a także dał swoją bezpośrednią i wyraźną zgodę na przetwarzanie, wykorzystywanie, gromadzenie, przechowywanie, ujawnianie, przekazywanie (w tym za granicę) oraz niszczenie wszelkich Informacji Osobowych w celach określonych przez niniejszą Politykę, Umowę oraz wszelkie dokumenty tworzące część Umowy.
    19. Informacje Osobowe zbiera się wyłącznie w dozwolonych przez prawo celach, a w szczególności w celu:
    a.weryfikacji informacji szczegółowych Użytkownika;
    b.rejestracji Konta w Spółce;
    c.promocji i działaniach marketingowych;
    d.stosowania się do obowiązujących przepisów prawa;
    e.zapewnienia Użytkownikowi wszelkich dodatkowych usług oferowanych przez Spółkę, takich jak wsparcie techniczne Gry; a także
    f.wykonania i wypełnienia Umowy oraz wszystkich dokumentów tworzących integralną jej część przez Spółkę, jej dostawców albo dowolne osoby trzecie działające w jej imieniu.
    20.Administracja ma prawo gromadzenia i wykorzystywania według uznania wszelkich informacji, które nie są uważane za Informacje Osobowe przez Obowiązujące Prawo, a Użytkownik niniejszym potwierdza, że Spółka może ujawnić wszelkim osobom trzecim takie informacje niebędące Informacjami Osobowymi.
    21.Użytkownik ma prawo sprzeciwić się przetwarzaniu i gromadzeniu swoich Informacji Osobowych, a także wycofać swoją zgodę w każdej chwili, chyba że Obowiązujące Prawo stanowi inaczej. W momencie wycofania swojej zgody Użytkownik rozumie i akceptuje to, że czynność ta może mieć negatywny wpływ na jakość Gry i Usług Internetowych, a także może spowodować niedostępność Gry albo Usług Gry, a także Użytkownik niniejszym potwierdza, że Spółka w takiej sytuacji nie będzie ponosiła żadnej odpowiedzialności za wszelkie straty albo zniszczenia Informacji Osobowych Użytkownika.

    Wykorzystanie i przetwarzanie Informacji Osobowych

    22.Użytkownik niniejszym potwierdza, że Spółka ma prawo przechowywać i przetwarzać podane Informacje Osobowe, które Spółka uważa za niezbędne do korzystania z Gry. Użytkownik rozumie i akceptuje to, że wszystkie czynności w Grze są rejestrowane.
