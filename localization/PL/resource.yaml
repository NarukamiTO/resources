    Polityka prywatności i ciasteczek

    APL Publishing Ltd, registration no. C 85285, registered under the laws of Malta, 157, Archbishop Street Valletta, VLT1440, Malta (odtąd nazywana ‘’Spółką’’ lub ‘’Administracją’’), posiadacz wyłącznych praw do Gry szanuje prawo Użytkowników do zachowania poufności Informacji Osobowych. Spółka rozumie wagę ochrony informacji otrzymanych od Użytkowników. Spółka zatwierdziła niniejszą Politykę Prywatności i Ciasteczek (odtąd nazywaną „Polityką”), aby poinformować Użytkowników o gromadzeniu i wykorzystywaniu ich Informacji Osobowych.

