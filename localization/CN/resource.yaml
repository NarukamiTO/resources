  GAME_RULES: |-
    简要规则
    游戏中禁止以下游戏内活动：
    - 使用机器人，使用第三方软件，错误;
    - 假装成为行政管理人员;
    - 平衡功能，为其他用户造成障碍;
    - 广告，政治宣传;
    - 违反法律，包括知识产权法;
    - 销售，购买，交换，转账，其他游戏价值;
    - 欺诈，其他不诚实的行为。
     游戏聊天和论坛禁止以下活动：
    - 使用侮辱，威胁，诽谤;
    - 淫秽语言，包括隐含形式;
    - 洪水，燃烧，垃圾邮件，以大写字母打印(CAPS LOCK);
    - 欺骗密码，其他账户信息;
    - 拖车;
    - 煽动他人违反游戏规则;
    - 公开讨论政府和主持人;
    - 公布法律禁止的信息;
    - 发布与第三方资源的链接;
    - 任何形式的歧视。
     游戏规则
    你在3D坦克游戏中，来自世界各地的人都喜欢操作巨大的战斗机器，参加激烈的战斗！玩家可以自己战斗，也可以团结一起争取胜利。他们也可以社交并找到新朋友。
    3D坦克一款易于学习的多人动作游戏，是一次严肃的战斗舞台，还有一个伟大的社交网络。
    完成注册过程后，用户将收到一个虚拟坦克和500个水晶(游戏币)。通过赢得战斗，用户增加他们的评级并获得新的等级和水晶。晶体可用于购买有用的弹药并购买或升级坦克，枪支和装甲。
    3D坦克不仅仅是一个令人兴奋的在线游戏。这是一个拥有共同兴趣的人群。我们鼓励相互尊重和礼貌，并强烈阻止冒犯行为和/或侵犯其他用户的权利。管理员有权限制用户的沟通能力，降低他们的评分和/或阻止他们的账户，如果他们违反这些游戏规则。
     一般条款
    游戏规则是最终用户许可协议(以下称为“协议”或EULA)以及游戏和游戏服务的其他文档的组成部分。相应地，协议，隐私和cookies政策以及在游戏和游戏服务中发布的其他文件是这些游戏规则的组成部分。
    游戏规则中使用的任何术语和概念都与协议中赋予它们的含义相同。
    任何使用游戏及其在线设施和/或在注册表单中点击“接受”意味着您熟悉并同意本游戏规则，并无条件接受其所有条款。
    游戏规则对所有用户都是强制性的。
    如果您不同意这些游戏规则的任何条件，您无权进一步使用游戏及其服务，请离开本网站并且不要使用游戏。
    1.禁止创建昵称(用户名)：
    1.1。包含不良或强烈的语言，对侮辱的侮辱/挑衅(以文字，缩写，表达或短语的形式);
    1.2。包含基于种族，民族或宗教认同的种族主义，法西斯主义，侮辱或绰号，或者煽动仇恨，不容忍，民族不和;
    1.3。包含要求暴力，恐怖主义，极端主义和/或大规模骚乱的要求;
    1.4。包含任何形式的政治招揽，宣传，政治广告;
    1.5。与政治组织(人)直接或间接相关，包括那些犯下政治罪或危害人类罪的恐怖主义行为;
    1.6。遏制性别，年龄，宗教或其他特征的歧视;
    1.7。 on保持直接或间接宣传，呼吁消费含酒精和含酒精的饮料，啤酒，烟草制品，毒品，毒性，精神药物和/或令人陶醉的物质及其前体，包含有关其生产地点和方法，采集，种植和使用;
    1.8。包含有关参与赌博游戏，卖淫，流浪乞讨，乞讨的信息;
    1.9。包含有关自杀方式，煽动自杀，暴力或其他威胁生命或健康的行为的信息;
    1.10。控制煽动非法行为，犯罪，暴力，残忍，煽动实施法律禁止的行为的伤害;
    1.11。包含部分管理员工的用户名称，或者包含可能导致用户错误地认为是管理代表的信息;
    1.12。包含对游戏，政府或版主的批评;
    1.13。与性交，侵犯，色情，恋童癖直接或间接有关;
    1.14。包含对身体及其较低生物功能或反射的描述;
    1.15。包含广告和超链接;
    1.16。包含引用作弊码，作弊网站，违反政府权利的资源;
    1.17。由不可发音的随机字母组成(超长用户名);
    1.18。完全或部分包含受版权和/或注册保护的商标元素;
    1.19。包含这些游戏规则，协议和/或有效法律禁止的其他信息。
    1.20。如果用户名称不符合上述要求，本游戏规则，协议或有效法律规定的其他要求，主管机关有权酌情决定：
    - 要求用户更改可接受用户名的用户名，并在更改用户名所需的时间段内阻止用户帐户;
    - 不可撤销地阻止用户帐户。
    2.以下活动被禁止，并会导致(根据管理层的判断)永久或临时用户账户被阻止，将用户的所有虚拟游戏值减少10％到100％(车库，水晶，游戏统计)或将用户账户设置为零，暂时或永久限制访问游戏聊天和论坛(禁令)：
    2.1。游戏中任何恶意或不礼貌的行为：
    2.1.1。 Botting(使用模仿游戏中用户行为的软件)，使用点击器程序，控制鼠标和键盘的宏，使用其他第三方软件获得游戏中的优势;
    2.1.2。应用或分发第三方软件或其他改进/自动化游戏可能性(机器人，作弊)的手段，以及可能会恶化游戏功能和/或第三方电子设备功能的程序;
    2.1.3。开发游戏的软件缺陷并将有关它们的信息转移给除政府之外的第三人;
    2.1.4。在'夺旗'，'控制点'或'团队死亡竞赛'模式或者'死亡竞赛'模式中的对手故意无所作为或帮助其他队员获得经验点(所谓的平衡）;
    2.1.5。同一用户拥有的账户之间的战斗;
    2.1.6。创建额外账户以对主账户进行权限设定;
    2.1.7。与其他用户作出安排，争取一半的权力以“权力平衡”为目的“半心半意”(政府将对此类安排的所有成员施加限制);
    2.1.8。任何旨在为用户所在团队制造障碍的行为或疏忽，包括CTF，TDM和CP模式，与您所参与的团队作战，损害/毁坏盟友坦克，对手球队的利益，以及与敌人的阴谋破坏;
    2.1.9。缺乏经验的玩家(新手)的歧视：错误信息，恐吓，嘲笑;
    2.1.10。侮辱，诽谤(传播误导性信息)与其他用户，行政管理人员，版主，其他人员有关的;
    2.1.11。游戏中的任何形式的操纵或阴谋;
    2.1.12。表现对游戏开发和形象有负面影响的任何行动;
    2.1.13。其他形式的妨碍正常游戏过程的恶意行为将被政府当局认可。
    2.2。任何形式的欺诈行为，特别是：
    2.2.1。使用游戏和/或游戏服务进行欺诈行为，包括但不限于欺诈性游戏内金融操作，交易过程中的欺诈行为，付款(包括任何退款，禁止的交易);
    2.2.2。将账户或其他游戏价值转移给第三方;出版任何出售，购买或转让账户或游戏价值的优惠，既免费又包括水晶或资金，以及对上述行为的鼓励;
    2.2.3。尝试从任何其他用户获取密码，其他帐户信息或其他个人信息，包括通过使用道德，物理或技术威胁进行勒索的形式;
    2.2.4。传播关于其他用户或关于第三人的任何个人信息(除非这些信息是可公开访问的);
    2.2.5。欺诈 - 使用任何欺诈手段接收游戏币;
    2.2.6。任何假装成为政府或项目助理(主持人，顾问等)的前任或现任雇员的企图，包括代表主管部门或主持人发送消息;
    2.2.7。以任何形式乞讨，包括转移资金，游戏价值或晶体的请求;
    2.2.8。伪装成游戏官方资源的外部资源链接发布。
    2.3。其他违规：
    2.3.1。使用不良或强烈的语言，其他不良或粗俗的单词(短语)不属于坏语言，包括隐含形式;
    2.3.2。公布有关性，色情或色情性质的信息和材料，描绘或描述男女之间的性关系;
    2.3.3。公布侮辱或羞辱信徒感受的信息或符号，会引起仇恨，仇恨，种族，国际或民族不和，不容忍(包括侮辱，根据种族，民族，种族，宗教特征提供绰号)，以及挑衅对方采取具体行动;
    2.3.4。宣传或示威纳粹标志，符号，缩写或名称，纳粹活动家的姓氏和姓氏;
    2.3.5。公布否定历史事件的信息;
    2.3.6。公布那些可以看到要求暴力，战争，恐怖主义，推翻权力的信息;极端主义活动和/或大规模骚乱;
    2.3.7。公布有关政治组织(政治领导人)犯下政治罪或危害人类罪，恐怖主义行为或以其他方式违反国际法的情报;
    2.3.8。公布包含政治招标，政治广告，任何形式的选举宣传的信息;
    2.3.9。讨论当今的政治问题是挑衅性的冲突;
    2.3.10。任何形式的性别，年龄，宗教或其他特征的歧视;
    2.3.11。与用户，管理人员或第三方相关的任何形式的威胁;
    2.3.12。公布包含自杀方式，呼吁自杀，暴力或其他对生命或健康构成威胁的行为的信息，危险作战技巧的描述，特技，武器制作方法，对身体改变方法的描述;
    2.3.13。公布描述，怂恿或证明非法或反社会行为，犯罪，暴力，残伤，对人，动物造成心理或肢体残忍的信息，并对他人的财产造成损害;
    2.3.14。公布导致儿童恐惧，恐怖或恐慌的信息，包括死亡，疾病，自杀，事故，突发事件或灾难和(或)其后果的图片或描述，可能损害未成年人健康或发育的其他信息;
    2.3.15。公布由于非法行为而遭受的未成年人信息(遗漏);
    2.3.16。公布包含直接或间接宣传，呼吁消费含酒精和含酒精的饮料，啤酒，烟草制品，吸烟配件，毒品，毒性，精神药物和/或令人陶醉的物质及其前体的信息，包含有关地点和方法的信息他们的生产，收购，种植和使用;
    2.3.17。公布可能引起参与赌博游戏，卖淫，流浪或乞丐的愿望的信息;
    2.3.18。未经权利持有人许可，使用知识产权物件(软件，艺术品，视频和其他物品或其零件，商标等)或其他材料;张贴盗版内容的链接;删除或更改知识产权信息，特别是与权利人，作者和其他知识产权确认的联系;
    2.3.19。未经政府批准，发布任何广告资料或信息;
    2.3.20。公布可能导致用户或主管机关损害/损失的信息;
    2.3.21。对游戏和/或其作者，业主的无建设性批评;
    2.3.22。对政府或主持人的表达或隐含的公开讨论;
    2.2.23。提供虚假或虚构的信息，文件或证据。政府警告用户有关此类活动的犯罪和其他责任;
    2.3.24。对这些游戏规则，协议和/或适用法律禁止的行为(不作为)进行委托或挑动(挑衅)。
    3.禁止在游戏聊天和/或论坛中启动主题和/或创建消息：
    3.1。重现现有的主题或信息，以及最近讨论的主题和/或信息部分(游戏规则，常见问题解答，计划等)中的答案。不要忘记使用搜索找到你的问题的答案。注意并确保在制作新的主题之前查看现有的主题。
    3.2。不符合该部分/类别的主题;
    3.3。在主题或消息的标题和/或内容中包含CAPS LOCK或大量的CATIER LeTTER;
    3.4。在标题和/或主题或消息的描述中包含不相关或重复的符号，字符，表情符号，主题或消息的描述，使主题或部分的理解复杂化或没有任何意义（Flood)，例如== - 我的主题 - = =;
    3.5。包含字体大小超过24的文字;
    3.6。缺乏信息，并不反映对该主题的标题或描述中的事件的感觉;
    3.7。引用以前的消息和/或图像的太大的文本，没有任何特殊的必要性(过度报价);
    3.8。继续讨论政府关闭或删除的主题(necroposting);
    3.9。对论坛或游戏聊天参与者具有个人吸引力。对于个人通信，请使用私人消息。与解决问题同时进行个人讨论。
