    23.用户披露的个人信息由政府当局收集和处理，以便为了发展和改进而向用户适当和定性地提供游戏服务，以执行协议和其他协议，游戏规则和本政策。个人信息的处理包括收集，记录，系统化，分类，存储，积累，更新，修改，分组，阻止，使用，披露，转移给第三方，传播，销毁，删除和其他必要的行为，协议。
    24.除本政策规定的情况外，本公司不出售用户的个人信息，也不向第三方披露此类信息。公司可能向业务合作伙伴或广告商披露一般人口统计信息。这与个人信息不直接相关，也不能识别特定的用户。
    25.为确保提供适当的服务，本公司有权将个人信息转让给其他提供托管服务，支付服务，发送电子邮件相关服务以及主持人的个人或组织。这些人员和组织有权将接收到的个人信息用于向用户提供服务的唯一目的，并受到确保正确使用个人信息的条款的约束。
    26.用户同意公司有权将提供给本公司任何关联公司的个人信息转移给适当和高质量的游戏服务提供和改进以及改进游戏服务，协议的履行，游戏规则和本政策。
    27.如果公司在未来通过重组和/或合并和/或销售和/或收购和/或清算和/或通过任何其他程序与另一家公司合并，则用户的个人信息可随公司或其部分一起转让，或可作为公司的一部分出售。
    28.用户同意公司有权并有义务披露个人信息，当其根据来自管辖法律和/或任何其他信誉良好的管辖区的决定和/或在命令监管机构和/或在数据保护专员的命令下和/或用户直接和/或间接参与任何涉及游戏和/或公司服务的任何犯罪的情况下命令这样做。
    29.用户同意，如果公司从第三方（版权所有者）收到有关用户侵犯游戏和/或游戏服务中的材料权利的请求，公司有权将此类信息用户向第三方（版权所有者）。
    30.如果用户通过第三方网站和/或通过本公司合作伙伴网站进入游戏和/或在游戏中注册，则此类人员可以为了适当的目的而要求，收集和处理用户的个人信息和优质的服务。第三方的隐私和cookies政策将适用于这种情况。用户同意公司有权将此用户的个人信息传输给此类人员，以便提供适当和高质量的游戏服务，执行协议，游戏规则和本政策。
    31.公司将根据本政策的条款采取一切必要措施，妥善安全地存储用户收集的个人信息。用户提供的所有信息都存储在公司的服务器上。
    32.公司应使用包括防火墙的标准技术来确保个人信息的安全。
    33.用户有义务不向第三方披露或转让其用于授权游戏的身份或账户信息。用户完全负责存储他的账户信息。
    34.如果用户发现他/她的账户信息被盗或者被第三方管理，用户应立即通知公司这些情况，以便公司采取必要的措施。在这种情况下，公司不能保证用户的个人信息的安全，并且用户在此接受公司对任何使用此个人信息不承担任何责任。
    35.当用户在游戏或游戏服务（使用聊天室，论坛等）进行通信时，用户理解此类通信是通过公司的服务器进行的，并同意可以收集，存储和研究此数据政府。对于用户通过游戏，游戏服务或与游戏相关的其他服务（通过聊天室，论坛，社交网络）向其他用户披露的个人信息和/或其他信息的保密性，主管部门概不负责。等），主管机关有权考虑在公有领域内提供这类信息。



    Cookies，IP地址和日志文件
    36.主管机关可收集和处理有关用户计算机的信息，日志文件，包括IP地址，操作系统类型，浏览器和电子邮件客户端，有关流量的信息，日期和时间，游览服务访问的详细信息，用户活动，关于访问，设置，系统通知的信息。为了系统管理的目的，这些关于用户在互联网网站上的行为的信息被收集和存储，以确保游戏和游戏服务正常运行，以保证安全并加强保护并确保系统完整性（防止黑客攻击，未授权访问。
    37.为了让游戏正常运作，行政部门利用cookies。 Cookies是为了与用户关联和识别活动（以下简称“Cookies”）而自动创建并存储在用户计算机/其他设备中的小记录保存文本信息。 Cookie通常不包括姓名和/或电子邮件地址和/或其他个人信息。实际上它们通常包含为了游戏和/或游戏服务的更好功能所需的匿名信息。
    38.存储在用户计算机/用户通过其使用游戏和/或其资料的任何其他设备中存储的Cookies除其他外，但不限于以下功能：
    一个。无法提供访问用户请求的安全区域，而无需使用这些Cookie，您所请求的安全登录区域等服务无法提供;
    湾访问Cookies - 记住用户所做的选择和/或设置，并在使用游戏时启用用户识别。没有这些Cookies，游戏的功能可能会受到影响;
    C。投票（调查）Cookies - 标记用户投票并阻止用户在同一次调查中再次投票的任何调查项目;
    d。加载平衡会话Cookie - 通过分散游戏服务的工作量和时间优化来提高游戏的加载时间。没有这些Cookies，游戏的功能可能会丢失;
    即用户界面自定义cookie可以保存用户的界面设置，以防重复进入游戏和游戏服务。
    F。 Cookie放置并用于与社交网络中的用户数据同步。
    G。 Performance（Analytics）Cookies - 收集用户如何使用游戏的匿名信息。
    H。广告Cookie - 为用户提供最相关的广告，并帮助提高广告活动的有效性。用户在此接受并同意公司可以将这些cookies用于自己的广告活动。
    39.主管机关还可允许某些第三方在用户的设备上放置和使用自己的网络性能（分析）和广告cookies，并从公司的Cookies中收集信息，以便存储和分析关于用户的偏好和提高服务质量。在这种情况下，此类第三方受本政策的约束。政府保证它应该专门允许有信誉的第三方进行这种使用。
    40.用户理解，通过任何社交网站（例如Facebook）使用游戏，用户可能被要求遵守特定的社交网站网站的Cookie政策，并且用户同意政府不对任何此类使用cookies。
    41.使用游戏和/或互联网设施或接受本协议（包括本政策）和/或点击“接受”用户已理解并接受本政策并表达其直接和明确同意，主管机关可以放置，存储并在用户的计算机/用户通过其使用游戏和/或其材料的任何其他设备上使用Cookie。主管机关可能会继续假设用户同意本政策，直至和/或除非用户已通过此处提供的浏览器设置禁用了Cookie。通过提供此项同意，用户可以让管理部门更好地了解用户及其偏好，随时考虑用户的兴趣来提高服务质量。用户在此同意，如果不启用Cookie，游戏可能无法正常运行。
    42.行政部门保证存储的cookies对于用户是安全的，并且对于游戏和游戏服务的正常运作以及主管机关向用户提供服务来说是绝对必要的。
    43.曲奇存放不超过一年。第三方存储cookies的条款应由第三方制定。
    44.用户可以随时拒绝接受cookies并通过更改其浏览器设置来禁用cookie。禁用Cookie可能会对游戏和在线设施的质量产生负面影响，也可能导致无法访问游戏，因此在线设施和用户特此同意公司不承担任何损失和/或损害在用户禁用了cookies的情况下的用户信息。


    获取和更改用户的个人信息
    45.用户有权随时与主管机关联系，以获取本公司存储的用户个人信息的副本，并在适当情况下更正任何不准确之处。用户有权要求删除，纠正，修改或完成其个人信息。有关用户的个人信息，请与政府部门联系。用户应通过help@tankionline.com发送电子邮件。

    拒绝提供任何个人信息

    46.用户向主管部门提供的任何个人信息都是在自愿的基础上提供的。然而，公司无法保证游戏和/或游戏服务应当正常运行，并且/或者应当在请求时未能提供任何个人信息的情况下起作用。

    社交网站

    47.用户在此确认，他理解并接受通过任何社交网站或第三方的其他网站使用游戏也可能使用户遵守其条款和条件。


    政策的变化
    48.本政策自截至上一版本之日起生效。 本政策可能以任何形式随时更改，修改或替换，恕不另行通知用户，因此我们建议不时查阅本政策以了解所有变更。 游戏和游戏服务的进一步使用意味着无条件接受本政策的修改版本。

    与管理部门联系

    49.如果您对本政策有任何疑问，评论，投诉或评论，请通过help@tankionline.com与我们联系。 我们会尽快考虑您的问题。
    50.行政部门可能会拒绝不合理频繁的请求，这些请求需要不成比例的技术努力，危害其他用户的隐私或极不切实际。
    51.如果用户与主管机关开始任何通信或提交有关游戏或游戏服务问题的报告，主管机关有权存储所有这些信件。
