  GAME_RULES: |-
    Lyhyet säännöt

    Seuraavat pelin sisäiset toiminnat ovat kiellettyjä pelissä, keskusteluissa, foorumeissa ja muissa virallisissa viestintäpaikoissa:
    - Bottien käyttö, kolmannen osapuolen ohjelmistojen käyttö, vikojen hyväksikäyttö;
    - virkamiehen tai sen avustajan jäsenen esittäminen;
    - luoda esteitä muille käyttäjille;
    - mainonta, poliittinen propaganda;
    - lakien rikkominen, mukaan lukien tekijänoikeuslaki;
    - tilien tai muun pelin omaisuuden myynti, osto, vaihto, siirto;
    - petoksia tai muita epärehellisiä toimia.
    - loukkaukset, uhkaukset, vääryys;
    - röyhkeä kieli, myös implisiittisessä muodossa;
    - tulvat, liekehtivä, roskaposti, isojen kirjainten tekstaaminen (CAPS LOCK);
    - väärennetyt salasanat tai muut tilitiedot;
    - yllyttää toiset rikkomaan pelisääntöjä;
    - lainsäädännön julkaisemisen kieltäminen;
    - linkkien julkaiseminen kolmansien osapuolten resursseille;
    - kaikenlainen syrjintä.

    Pelisäännöt

    Olet Tanki Online pelissä, jossa ihmiset ympäri maailmaa nauttivat valtavista taistelulaitteista ja osallistuvat hurjiin taisteluihin! Pelaajat voivat taistella itseään vastaan tai yhdistää joukkueet taistelemaan voitosta vierekkäin. He voivat myös seurustella ja löytää uusia ystäviä.

    Tanki Online on helppokäyttöinen moninpeli-toimintapeli, vakavan taistelun näyttämö ja suuri sosiaalinen verkosto.

    Rekisteröitymisen jälkeen Käyttäjä saa virtuaalisen tankin ja 500 kristallia (pelin valuutan). Voittelemalla taisteluita Käyttäjät lisäävät luokitustaan ​​ja ansaitsevat uusia rankkeja ja kristalleja. Kristalleja voidaan käyttää hankkimaan hyödyllisiä laitteita sekä ostaa tai päivittää aseita, runkoja tai maalitöitä.

    Tanki Online on enemmän kuin vain jännittävä online-peli. Se on ihmisten yhteisö, jolla on samat edut. Kehotamme molemminpuolista kunnioitusta ja kohteliaisuutta ja voimakkaasti loukkaavaa käyttäytymistä ja/tai muiden käyttäjien oikeuksien loukkaamista. Järjestelmänvalvojat pidättävät oikeuden rajoittaa käyttäjien viestintäkykyä, laskea heidän luokituksiaan ja/tai estää heidän tilinsä, jos he rikkovat näitä pelisääntöjä.

    Yleiset ehdot

    Pelisäännöt ovat erottamaton osa loppukäyttäjän lisenssisopimusta (jäljempänä ''sopimus'' tai EULA) ja muita peli- ja pelipalveluasiakirjoja. Sopimus, Yksityisyys ja evästeet sekä muut pelipalveluissa julkaistut asiakirjat ovat erottamaton osa näitä pelisääntöjä.

    Peliolosuhteissa käytetyillä termeillä ja käsitteillä on sama merkitys kuin niille on annettu sopimuksessa.

    Pelin ja sen online-tilojen käyttö ja/tai "Hyväksy" rekisteröitymislomakkeessa klikkaamalla tarkoittaa, että olet perehtynyt ja hyväksynyt nämä pelisäännöt ja hyväksyt ehdoitta kaikki ehdot.

    Pelisäännöt ovat pakollisia kaikille käyttäjille.

    Jos et ole samaa mieltä näiden pelisääntöjen ehtojen kanssa, sinulla ei ole oikeutta käyttää Peliä ja sen palveluita edelleen, ja jätä tämä sivusto ja pidättäydy pelin käyttämisestä.

    1. Lempinimiä koskevat vaatimukset (nimet)

    On kiellettyä luoda lempinimiä (käyttäjätunnuksia), klaani nimiä (tagit) sekä klaanin iskulauseita, jotka:
    1.1. Sisältää huonoa tai voimakasta kieltä, loukkauksia/provokaatioita loukkaukseksi (sanojen, lyhenteiden, ilmaisujen tai lauseiden muodossa);
    1.2. Sisältää rasismia, fasismia, loukkauksia tai lempinimiä, jotka perustuvat rodulliseen, kansalliseen tai uskonnolliseen identiteettiin tai jotka yllyttävät vihaa, suvaitsemattomuutta ja etnistä ristiriitaa;
    1.3. Sisältää väkivaltaa, terrorismia, ääriliikkeitä ja/tai suuria häiriöitä koskevia pyyntöjä;
    1.4. Sisältää poliittista pyyntöä, propagandaa, kaikenlaista poliittista mainontaa;
    1.5. Liittyvät suoraan tai epäsuorasti poliittisiin järjestöihin (henkilöihin), mukaan lukien poliittiset rikokset tai ihmiskuntaa vastaan ​​tehdyt rikokset, terroriteot;
    1.6. Sisältää sukupuolen syrjintää, iän, uskonnon tai muiden ominaispiirteiden mukaan;
    1.7. Suoran tai epäsuoran propagandan, alkoholipitoisten ja alkoholipitoisten juomien, oluen, tupakkatuotteiden, huumausaineiden, myrkyllisten, psykotrooppisten ja/tai päihtyvien aineiden, niiden esiasteiden, käyttäminen edellyttää tietoja niiden tuotanto-, hankinta-, viljely- ja käyttö;
    1.8. Sisältää tietoja osallistumisesta uhkapelipeleihin, prostituutioon, matkoihin, kerjäämiseen;
    1.9. Sisältää tietoa itsemurhien tekemisen menetelmistä, itsemurhien, väkivallan tai muiden uhkaavien toimien edistämisestä, jotka uhkaavat elämää tai terveyttä;
    1.10. Sisällytetään laittomaan käyttäytymiseen, rikollisuuteen, väkivaltaan, julmuuteihin, haittoihin kohdistuvaan yllykkeeseen, joka kannustaa laittomasti kiellettyjen toimien tekemiseen;
    1.11. Sisältää hallintomenojen nimeämisen osia tai sisältää tietoja, jotka voivat aiheuttaa virheellisen käsityksen käyttäjältä hallinnon edustajana;
    1.12. Sisältää kritiikkiä pelistä, hallinnosta tai valvojista;
    1.13. Ovat suoraan tai epäsuorasti yhteydessä seksuaaliseen kanssakäymiseen, loukkaukseen, pornografiaan, pedofiliaan ja mihin tahansa muuhun seksuaaliseen väkivaltaan tai käytäntöön, jotka ovat poikkeavia tai muuten;
    1.14. Sisältää ruumiinkuvaukset ja sen seksuaaliset biologiset toiminnot;
    1.15. Sisältää mainoksia ja hyperlinkkejä;
    1.16. Sisältää viittaukset huijauskoodeihin, huijauskohteisiin, resursseihin, jotka rikkoo hallinnon oikeuksia.
    1.17. Koostuvat käsittelemättömistä satunnaisista kirjasarjoista (Tulvien käyttäjätunnukset);
    1.18. Täysin tai osittain koostuvat tavaramerkkielementeistä, jotka on rekisteröity ja/tai jotka on suojattu tekijänoikeuslailla;
    1.19. Sisältää muita tietoja, joita nämä pelisäännöt, sopimus ja/tai tehokas lainsäädäntö kieltävät.
    1.20. Jos Käyttäjänimi ei täytä edellä mainittuja vaatimuksia, muita pelisääntöihin, sopimukseen tai tehokkaisiin lakeihin sisältyviä vaatimuksia, Hallinnolla on oikeus harkintansa mukaan:
    - vaatia Käyttäjää muuttamaan Käyttäjänimi hyväksyttäväksi ja estämään Käyttäjätilin käyttöoikeuden muuttamiseen tarvittavan ajan;
    - Käyttäjätilin peruuttaminen peruuttamattomasti.

    2. Toiminta ja käyttäytyminen, jotka ovat kiellettyjä pelin käyttäjille:

    2.1. Toimet, jotka johtavat Käyttäjän tilin pysyvään tai tilapäiseen estämiseen (hallinnon harkinnan mukaan):
    2.1.1. Pelien pelaamisen automatisointi, mukaan lukien pullotus (pelien Käyttäjien toimintaa jäljittelevä ohjelmisto), klikkausohjelmien käyttäminen, hiiren ja näppäimistön hallinnan makrot, kolmannen osapuolen ohjelmiston käyttöeduista pelissä;
    2.1.2. Kolmannen osapuolen ohjelmistojen tai muiden välineiden kehittäminen ja/tai pelien automatisointi (robotit, huijarit) tai ohjelmat, jotka voivat heikentää pelin toimintaa ja/tai kolmansien henkilöiden sähköisten laitteiden toimintaa;
    2.1.3. Ohjelmistovirheiden hyödyntäminen pelissä ja niiden siirtäminen kolmansille osapuolille, lukuun ottamatta hallintoa;
    2.1.4. Taistelut saman käyttäjän omistaman tilien välillä;
    2.1.5. Sabotointi - Kaikki teot tai laiminlyönnit, joiden tarkoituksena on luoda esteitä joukkueelle, jossa käyttäjä on jäsen, mukaan lukien LP-, TKM- ja VP-tiloissa, taistelussa sitä ryhmää vastaan, jonka jäsen olet (tahallinen heikkolaitteiden valinta, usein tauot, tai tahallinen epäonnistuminen kartan tai pelitilan vaatimusten noudattamisessa, Internetissä tapahtuvien ongelmien jäljittäminen), vahingoittaa/tuhota liittolaisen tankkia ja taistella vastustajan joukon eduksi (salaliitto);
    2.1.6. Peli- ja/tai pelipalvelujen käyttö vilpillisiin toimiin, mukaan lukien rajoituksetta petolliset pelin sisäiset rahoitustoimet, petokset liiketoimien aikana, maksut, mukaan lukien kaikki palautukset, kielletyt tapahtumat;
    2.1.7. Petokset - saavat pelin valuuttaa vilpillisin keinoin. Hallinto varoittaa käyttäjää siitä, että tällainen toiminta voi johtaa rikolliseen tai muuhun vastuuseen;
    2.1.8. Tilin tai muiden pelijaksojen siirtäminen kolmansiin henkilöihin; julkaista kaikki tarjoukset, joilla myydään, ostetaan tai siirretään tilille tai pelin omaisuudeksi, sekä ilmaiseksi että kristalleiksi tai rahastoiksi, sekä näiden toimien käynnistämiseen;

    2.2. Toimet, jotka johtavat (hallinnon harkinnan mukaan) pysyvällä rajoituksella pääsyyn pelin keskusteluihin ja foorumiin (kielto):
    2.2.1. Tietojenkalastelu - toimenpiteet, joiden tarkoituksena on päästä käsiksi Käyttäjien luottamuksellisiin tietoihin, kuten kirjautumisiin ja salasanoihin;
    2.2.2. Linkkien liittäminen kolmansien osapuolten resursseihin, jotka on naamioitu pelin virallisiksi voimavaroiksi;
    2.2.3. Liitetään linkkejä resursseihin, jotka lupaavat vapaita kristaleja, hallinnon antamia kristalleja tai selittävät tai kuvaavat kristallivikojen hyväksikäyttöä jne.;
    2.2.4. Kolmannen osapuolen ohjelmistoja (huijareita, ohjelmia, asiakkaita jne.) Sisältävien sivustojen linkittäminen, linkkien levittäminen sivustoihin, jotka sisältävät pelin toiminnallisuutta tai lupaa muutoksia;
    2.2.5. Muut petokset, joiden tarkoituksena on varastaa Käyttäjätilin tilit.

    2.3. Toimet, jotka johtavat (Hallinnon harkinnan mukaan) tilapäiseen rajoittamiseen pääsyn pelin keskusteluihin ja foorumiin enintään kuuden kuukauden ajan (kielto):
    2.3.1. Epärehellisyys pelaajille (aloittelijoille): väärää tietoa, pelottelua, pilkkaa;
    2.3.2. Loukkaukset, vääryys (harhaanjohtavien tietojen levittäminen) suhteessa muihin Käyttäjiin, hallintoon, valvojiin, muihin henkilöihin;
    2.3.3. Kaikki sellaiset toimet, joilla on kielteinen vaikutus pelin kehitykseen ja kuvaan;
    2.3.4. Muut käyttäytymismallit, jotka haittaavat normaalia peliprosessia, jonka hallinto tunnustaa sellaisiksi.
    2.3.5. Yritetään saada salasana, muut tilitiedot tai muut henkilökohtaiset tiedot mistä tahansa muusta käyttäjästä, mukaan lukien kiristys muodossa moraaliset, fyysiset tai tekniset uhat;
    2.3.6. Salasanan jakaminen omaan tiliin
    2.3.7. Muiden käyttäjien tai kolmansien henkilöiden henkilökohtaisten tietojen levittäminen (paitsi jos tällaiset tiedot ovat julkisesti saatavilla);
    2.3.8. Huono tai voimakas kieli, muut huonot tai epätyydyttävät sanat (lauseet), joita ei ole luokiteltu huonoksi kieleksi, myös implisiittisessä muodossa;
    2.3.9. Seksuaalisten, eroottisten tai pornografisten tietojen ja materiaalien julkaiseminen, seksuaalisten suhteiden kuvaaminen tai kuvaaminen tai poikkeukselliset seksuaaliset käytännöt sekä linkkien liittäminen tällaisia ​​tietoja sisältäviin resursseihin;
    2.3.10. Tietojen tai tunnusten julkaiseminen, jotka loukkaavat tai nöyryyttävät uskovien tunteita, herättävät vihaa, vihamielisyyttä, rodullista, kansainvälistä tai etnistä ristiriitaa, suvaitsemattomuutta (mukaan lukien loukkaukset, rotuun, kansallisiin, etnisiin, uskonnollisiin ominaisuuksiin perustuvat lempinimikkeet) ja myös provosoidaan keskustelukumppani sitoutumaan määriteltyihin toimiin;
    2.3.11. Propaganda tai esittely natsimerkkeistä, symboleista, lyhenteistä tai nimityksistä, natsivastaisten nimet ja sukunimet;
    2.3.12. Tietojen julkaiseminen, jossa voidaan nähdä väitteet, jotka vaativat väkivaltaa, sotaa, terrorismia, vallan kaatumista; ääri-aktiivisuus ja / tai massahäiriöt;
    2.3.13. Tietojen julkaiseminen poliittisista järjestöistä (poliittisista johtajista), jotka ovat syyllistyneet poliittisiin rikoksiin tai rikoksiin ihmiskuntaa vastaan, terrorismia vastaan ​​tai muutoin rikkoneet kansainvälisiä lakeja;
    2.3.14. Kaikenlainen syrjintä sukupuolen, iän, uskonnon tai muiden ominaisuuksien mukaan;
    2.3.15. Tietojen julkaiseminen, jotka sisältävät menetelmiä itsemurhan tekemiseen, kehottaa tekemään itsemurhaa, väkivaltaa tai muita toimia, jotka uhkaavat elämää tai terveyttä, kuvaavat vaarallisia taistelutekniikoita, tainnutuskohtia, aseiden tuotannon menetelmiä, kehonmuutostämismenetelmiä;
    2.3.16. Sellaisten tietojen julkaiseminen, jotka kuvaavat, vauhdittavat tai perustelevat laittomia tai epäsosiaalista käyttäytymistä, rikollisuutta, väkivaltaa, silpomista, psyykkistä tai fyysistä julmuutta ihmisille tai eläimille ja aiheuttavat vahinkoa muiden omaisuudelle;
    3.2.17. Lasten pelkoa, kauhua tai paniikkia aiheuttavien tietojen julkaiseminen, kuvien, tautien, itsemurhien, onnettomuuksien, hätätilanteiden tai katastrofien kuvaukset tai kuvaukset mukaan luettuina ja niiden seuraukset, muut tiedot, jotka voivat vahingoittaa terveyttä tai kehittää alaikäisiä;
    02.03.18. Alkoholi- ja alkoholipitoisten juomien, oluen, tupakkatuotteiden, tupakointituotteiden, huumeiden, myrkyllisten, psykotrooppisten ja/tai päihtyvien aineiden, niiden esiasteiden, kulutukseen tarkoitetun tiedon julkaiseminen sisältää tietoja paikoista ja menetelmistä, niiden tuotanto, hankinta, viljely ja käyttö;
    2.3.19. Sellaisten tietojen julkaiseminen, jotka voivat rohkaista halukkuutta osallistua rahapeleihin, prostituutioon, älykkyyttä tai lykkäämistä;
    2.3.20. Henkiseen omaisuuteen liittyvien esineiden (ohjelmistot, taideteokset, videot ja muut esineet tai niiden osat, tavaramerkit jne.) Käyttö tai muu aineisto ilman oikeudenhaltijan lupaa; viestien lähettäminen laittomaan sisältöön; teollis- ja tekijänoikeuksia koskevien tietojen poistaminen tai muuttaminen, erityisesti yhteydet oikeuksien haltijoihin, tekijöihin ja muuhun teollis- ja tekijänoikeuksien vahvistamiseen;
    2.3.21. Sellaisten tietojen julkaiseminen, jotka voivat aiheuttaa käyttäjille tai hallinnoimille haittaa/tappioita;
    02.03.22. Väärien tai fiktiivisten tietojen, asiakirjojen tai todisteiden antaminen. Hallinto varoittaa käyttäjää rikollisista ja muista vastuista tällaisesta toiminnasta.
    2.3.23. Aiheiden ja/tai viestien luominen pelin keskusteluissa ja/tai foorumeissa, jotka ovat Liekehtivät ("kiistelemisen tähden"), viestien vaihto, joka on pelkkää sanasotaa, joka ei useinkaan ole riippuvainen kiistan alkuperäisestä syystä.;
    2.3.24. Aiheiden ja/tai viestien luominen pelin keskusteluissa ja/tai foorumeissa, joiden tarkoituksena on saada aikaan muita käyttäjiä, hallintoa, valvojia sekä estää viestintä foorumissa tai pelikeskusteluissa;

    2.4. Toimet, jotka johtavat (hallinnon harkinnan mukaan) tilapäiseen rajoittamiseen pääsystä pelin keskusteluille ja foorumille enintään 24 tunniksi (kielto) tai viralliselle varoitukselle:
    2.4.1. Kaikki yritykset olettaa olevan entinen tai nykyinen hallinnon tai projektin avustajan (valvoja, konsultti jne.) Työntekijä, mukaan lukien viestien lähettäminen hallinnon puolesta tai valvojat;
    2.4.2. Lahjoittaminen missä tahansa muodossa, mukaan lukien rahastojen, pelin arvojen tai kristallien siirtopyynnöt;
    2.4.3. Historiallisten tapahtumien vastaisten tietojen julkaiseminen;
    2.4.4. Tietojen julkaiseminen, joka sisältää poliittista pyyntöä, poliittista mainontaa, kaikenlaista vaalipropagandaa;
    2.4.5. Keskustelu nykyisistä poliittisista kysymyksistä, jotka voivat aiheuttaa konflikteja millään tavalla;
    2.4.6. Käyttäjiin, hallintoon tai kolmansiin osapuoliin kohdistuvat uhat;
    2.4.7. Tietojen julkaiseminen laittomista toimista (laiminlyönneistä) aiheutuneen alaikäisen tiedon osalta;
    2.4.8. Mainosmateriaalin tai -tietojen julkaiseminen ilman hallinnon hyväksyntää;
    2.4.9. Peliä ja/tai sen kirjoittajia, omistajaa;
    2.4.10. Komission tai yllyttämisen (provokaation) toimille (toimettomuus), jotka ovat kiellettyjä näistä pelisäännöistä, sopimuksesta ja/tai sovellettavasta lainsäädännöstä.
    2.4.11. Aiheiden aloittaminen ja/tai viestien luominen pelikeskusteluissa ja/tai foorumissa, joka:
    2.4.11.1. Toista jo olemassa olevat aiheet tai viestit sekä aiheet, joista on äskettäin keskusteltu ja/tai vastaukset, jotka ovat saatavilla tietoryhmissä (pelisäännöt, usein kysytyt kysymykset, suunnitelmat jne.).
    2.4.11.2. Älä vastaa teemaa/luokka;
    2.4.11.3. Sisältää caps lockin tai paljon isoja kirjaimia aiheen tai viestin otsikossa ja/tai sisällössä.
    2.4.11.4. Sisältää aiheen tai viestin otsikossa ja/tai kuvauksessa seuraavat: merkityksettömiä tai toistuvat symbolit tai hahmot, hymiöt, viittauslinkit, huijauskoodit, tiedot, jotka vaikeuttavat aiheen tai osan ymmärtämistä tai joilla ei ole mitään merkitystä (Tulva), esimerkiksi == - Oma aihe - ==;
    2.4.11.5. Sisältää tekstiä, jonka kirjasimen koko on suurempi kuin 24;
    2.4.11.6. Puutteelliset tiedot eivätkä he kuvaile aiheen tunnetta otsikossa tai aiheen kuvauksessa;
    2.4.11.7. Lukea edellisten viestien osia, jotka ovat liian suuria, ja/tai kuvia, joilla ei ole erityistä tarvetta (päällekkäisyyksiä);
    2.4.11.8. Jatka keskustelua aiheista, jotka hallinto sulki tai poisti (pommitukset);
    2.4.11.9. Pyydä henkilökohtaista vetoomusta foorumin osallistujille. Henkilökohtaista viestintää varten käytä yksityisiä viestejä. Henkilökohtaiset keskustelut sallitaan samanaikaisesti ongelmien ratkaisemisen kanssa.
    2.4.11.10. Jätetään roskapostia, eli jakaa tietoja, joita vastaanottaja ei pyytänyt, eivät näytä kiinnostuneelta vastaanottamaan ja/tai eivät suostuneet vastaanottamaan;
    2.4.11.11. Sisältää muita tietoja tai rikkomuksia, jotka ovat kiellettyjä näistä pelisäännöistä, sopimuksesta ja / tai sovellettavista laeista.

    3. Rajoituksia käyttäjälle

    3.1. Jos käyttäjä rikkoo näitä pelisääntöjä, hallintoviranomaisella on oikeus soveltaa tätä sääntöä koskevissa osissa pelisääntöjä. Mahdolliset rajoitukset eivät rajoitu mainittuihin. Hallinto pidättää itsellään oikeuden soveltaa muita rajoituksia omalla harkinnallaan aina tilien pysyvän estämisen estämiseksi, mukaan lukien kaikkien Käyttäjän virtuaalisen omaisuuden osittainen tai täydellinen leikkaus Peliin (talli, kristallit, pelitilastot) .
    3.2. Rajoituksia valittaessa hallinto pitää käyttäjän loukkausten tyypin ja määrän sekä näiden pelisääntöjen aikaisemmat rikkomukset.
    3.3. Hallinnolla on oikeus oman harkintansa mukaan poistaa kaikki tiedot tai viestit; poista/siirrä aihe, joka on luotu väärässä Forum-osassa ilman ilmoitusta.
    3.4. Hallinnolla on oikeus omasta harkinnastaanan soveltaa yhtä tai useampaa rajoitusta samanaikaisesti käyttäjälle tai antaa varoitus.
    3.5. Näiden pelisääntöjen rikkominen tarkoittaa, että Käyttäjä voi välittömästi ilman ennakkoilmoitusta kieltää pelipalvelujen tarjoamista tai tällaisia ​​palveluja voidaan rajoittaa kokonaan tai osittain.
    3.6. Jos käyttäjä rikkoo pelisääntöjä useita kertoja tai integroidulla tavalla, hallintoviranomaisella on oikeus omien harkintansa mukaan toistaa Käyttäjälle asetetut rajoitukset.
    3.7. Koska pelisääntöjen tiettyjä rikkomuksia ei ole aina mahdollista tarkasti selvittää, lopullinen päätös pysyy aina hallinnon kanssa.
    3.8. Näitä rajoituksia voidaan soveltaa mille tahansa käyttäjälle, joka rikkoo näitä pelisääntöjä.
    3.9. Yksityisviestit on tarkoitettu käyttäjien henkilökohtaiseen viestintään pelipalveluissa ja foorumissa. Peli-sääntöjen rikkomista koskevien valitusten käsittelyssä hallinto ei saa ottaa huomioon yksityisiä viestejä koskevia valituksia, lukuun ottamatta pelisääntöjen rikkomuksia jäsenten tai avustajien yksityisissä viesteissä. Käyttäjä voi lopettaa vastaanottamasta yksityisiä viestejä toiselta käyttäjältä lisäämällä hänet mustalle listalle foorumin Käyttäjän profiilin asianmukaisessa osassa.
    3.10. Hallinto ei ole millään tavoin vastuussa välittömästä tai välillisestä menetyksestä tai vahingosta, jonka käyttäjä tai kolmas osapuoli olisi voinut kärsiä Käyttäjän käytön tai kolmannen osapuolen Internet-sivuston, pelin ja/tai Online-palvelut, mukaan lukien, mutta ei rajoittuen, aiheuttamat vahingot, jotka johtuvat pelien ja Online-palvelujen käytöstä tai Käyttäjän rajoitusten hallinnoinnista aiheutuneista vahingoista, välittömiä tai välillisiä vahingonkorvauksia, jotka aiheutuvat kolmannen osapuolen toimista. Peli, Internetin puute, varkaus, materiaalien tuhoutuminen, Käyttäjätiliin liittyvien tietojen menettäminen ja Käyttäjän kunniaa, arvokkuutta ja liiketoiminnan maineeseen liittyviä haittoja.

    4. Hallintoavustajat

    4.1. Käyttäjäkäyttäjät valitsevat Hallinnon avustajat.
    4.2. Hallintoavustaja on henkilö, joka toimii hallinnon puolesta ja sen edun mukaisesti. Hallintovirkamiehet ylläpitävät ja valvovat järjestystä peli- ja pelipalveluissa sekä foorumissa, keskusteluissa ja virallisissa sosiaalisen median sivuilla ja pelin tileillä.
    4.3. Hallinnon avustajan on oltava rehellinen ja objektiivinen päätöksenteossa ja hänen on myös noudatettava näiden pelisääntöjen ja sopimuksen määräyksiä, oltava kohtelias käyttäjille, suorittamaan tehtäviään tehokkaasti ja säännöllisesti. Hallintovirkamiehen tehtävät määräytyvät ja ohjaavat sisäiset ohjeet.
    4.4. On kiellettyä julkisesti keskustella hallinnollisten avustajien toiminnasta pelin foorumeissa, keskusteluissa, sosiaalisten medioiden virallisten ryhmien kanssa. Kaikki avustajien työtä koskevat valitukset on lähetettävä asianomaisen avustajaryhmän päällikölle.
    4.5. Valmentajien toiminta suoritetaan vapaaehtoisesti. Käyttäjällä ei ole oikeutta määrätä avustajaa asettamaan rajoituksia.

    5. Valitukset ja Muutoksenhaut

    5.1. Käyttäjällä on oikeus ilmoittaa pelisääntöjen rikkomuksista luomalla uusi keskusteluryhmä Aiheet-osiossa. On syytä määritellä rikkomuksen luonne selkeästi uudessa aiheessa ja liittää chat-kuvakaappaus tai video, joka selvästi osoittaa rikkomuksen.
    5.2. Käyttäjä voi lähettää kysymyksiä, kommentteja tai valituksia näistä pelisäännöistä osoitteeseen help@tankionline.com. Hallinto pyrkii kaikin keinoin käsittelemään tällaisia ​​pyyntöjä mahdollisimman pian.
    5.3. Valituksen lähettämisen yhteydessä Käyttäjän on kuvattava tilanteen luonne mahdollisimman tarkasti ja mahdollisimman selkeästi ja liitettävä näyttöön liittyvät seikat, kuvakaappaukset jne. Valituksia perusteettomista rajoituksista työskentelee yksinomaan sisäisen arvioinnin hallinto ja ohjaaja. Rajoitusten soveltamista koskevia päätöksiä ei voida tarkistaa.
    5.4. Jos käyttäjä aloittaa kirjeenvaihtoa hallinnon kanssa tai antaa raportin pelistä tai pelipalveluihin liittyvistä ongelmista, hallintovirastolla on oikeus tallentaa kaikki tällaiset kirjeet.

    6. Muut määräykset

    6.1. Hallinto hallinnoi peliä ja soveltaa näitä pelisääntöjä oman harkintansa mukaan, mutta ottaa huomioon yhteisön mielipiteen.
    6.2. Hallinto voi muuttaa näitä pelisääntöjä ilman ennakkoilmoitusta. Käyttäjän on tarkistettava nämä pelisäännöt vähintään kerran seitsemän päivän välein (eli viikoittain). Jos tällaista tarkistusta ei tehdä määräajassa ja käyttäjä jatkaa pelin käyttämistä, Käyttäjän katsotaan lukeneen ja hyväksynyt näiden pelisääntöjen muutetun version.
    6.3. Hallinto ylläpitää "nollatoleranssi" -politiikkaa huijausta ja petoksia vastaan. Jos hallinnon käsityksen mukaan käyttäjä on huijannut tai yrittänyt huijata hallintoa tai muuta käyttäjää tai toimittanut vääriä tai fiktiivisiä tietoja, asiakirjoja, todisteita ja muuten rikkoi sovellettavia lakeja, hallinto pidättää itsellään oikeuden estää käyttäjän tilit ja siirtää tällaiset tiedot (sekä Käyttäjän henkilötietojen kanssa) kolmannelle osapuolelle ja/tai lainvalvontaviranomaisille, jos hallinto katsoo sen tarpeelliseksi.
    6.4. Hallinto voi antaa muita määräyksiä ja rajoituksia eSports-sääntöihin, kilpailuihin, turnauksiin ja mestaruuskilpailuihin. Samaan aikaan nämä pelisäännöt ovat olennainen osa hallinnon hyväksymiä muita sääntöjä.
    6.5. Käyttäjän luodut pelitilat (kuten "Save the Gold") voidaan toistaa missä tahansa tilassa, kunhan se on Yksityinen Pro Taistelu. Kuitenkin kaikenlainen väärinkäyttö, kuten monimutkaisuus, sabotointi tai teho-tasoittaminen tällaisten taistelujen aikana, käsitellään normaalien pelisääntöjen mukaisesti.
