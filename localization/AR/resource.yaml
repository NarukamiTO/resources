  PAYMENT_SMS_DESCRIPTION_TEXT_INCLUDING_VAT: |-
    إختر بلدك و مُشغل الهاتف المحمول الخاص بك. حدد الكمية المطلوبة من الكريستالات ، و أرسل رسالة قصيرة في النص حسب العدد الذي تريده. و عادةً يتم تحديث الحساب في ثوان.

    تنبيه! وفقاً لقوانين الرسائل القصيرة نحن نُقدم مُتطلبات لمُكافحة الغش. لتجنب فُقدان الدُفعات الخاصة بك يُرجى مراعاة القواعد التالية:
    1. لا تُرسل رسائل قصيرة بمجموع أكثر من 13 دولاراً في غضون ساعة واحدة.
    2. لا تُرسل أكثر من ثلاثة رسائل قصيرة إلى أسم لاعب واحد و نفس العدد في غضون ساعة واحدة.

    تأكد من موافقة أولئك الذين يدفعون لشراء الكريستالات الخاصة بك!
