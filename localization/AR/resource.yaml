  NEED_OF_EMAIL_CONFIRMATION: |-
    أنت أدخلت البريد الإلكتروني الخاص بك ولكن لم يتم التحقق من ذلك بعد. مكافأة الكريستال سوف يتم إرسالها فور التحقق من البريد الإلكتروني الخاص بك.

    إذا لم تجد الرسالة التي تحتوي على رابط التحقق، الرجاء تفقد ملف الرسائل الغير مرغوب بها أو أدخل البريد الإلكتروني مرة أخرى. و نحن سوف نرسل لك رسالة جديدة تحتوي على رابط التحقيق.

    و تذكر بأنه عند إمتلاكك لبريد إلكتروني تم التحقق منه، سيُزيد ذلك من حماية حسابك و يسمح لك بالتواصل مع خدمة العملاء الخاصة بـتانكي أونلاين.
