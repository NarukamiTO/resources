  GAME_RULES: |
    نبذه عن القوانين

    الأفعال التالية هي محظورة تماماً في اللعبة و في المحادثة العامة و في المنتدى و أي أماكن رسمية أخرى من التواصل:
    - إستخدام برامج آلية، إستخدام برامج متطورة من الطرف الثالث، الكشف عن الثغرات؛
    - انتحال شخصية مشرف أو مدير أو أحد مساعديهم؛
    - مضايقة اللاعبين الآخرين؛
    - الإعلان و نشر الأكاذيب؛
    - إنتهاك القوانين، بما في ذلك قوانين الملكية الفكرية؛
    - تخفيضات وهمية، شراء، تبديل، نقل حسابات، أو أي ممتلكات أخرى خاصة باللعبة؛
    - الإحتيال، و أفعال أخرى غير لائقة؛
    - استخدام الشتائم، و التهديدات، و القذف؛
    - التكلم بقذارة؛
    - التكلم بكثرة، الإزعاج، كتابة أحرف كثيرة و غير مفهومة؛
    - كتابة كلمات مرور خادعة، أو معلومات أخرى عن الحسابات؛
    - تحريض الآخرين على إنتهاك قوانين اللعبة؛
    - نشر معلومات شرعية محظورة؛
    - نشر روابط لمواقع إختراق من الطرف الثالث؛
    - أي شكل من أشكال التمييز؛


    قوانين اللعبة
    أنت داخل لعبة تانكي أونلاين حيث هناك لاعبين من جميع أنحاء العالم يستمتعون في اللعب داخل معارك ميكانيكية ضخمة، و الدخول في
    معارك عنيفة! اللاعبين يُمكنهم المقاتلة لوحدهم أو يجتمعون في فريق للقتال من أجل النصر جنباً إلى جنب. هم يمكنهم أيضاً الإختلاط و البحث عن أصدقاء جُدد.
    تانكي أونلاين لعبة سهلة التعلم و هي لعبة إثارة متعددة اللاعبين، و منصة لمعارك خطيرة، وشبكة إجتماعية كبيرة.
    بعد إكمال عملية التسجيل في اللعبة، سيحصل اللاعب على دبابة عادية و 1000 كريستالة(العملة المتداولة داخل اللعبة). من خلال الفوز في المعارك، اللاعب يُزيد من التقييم الخاص به و يحصل على المزيد من الكريستال و الرُتب. يتم إستخدام الكريستال لشراء الأسلحة المُفيدة و تطوير الدبابات.
    تانكي أونلاين ليست لعبة إثارة فقط. إنها مُجتمع من الناس الذين يتشاركون نفس الإهتمامات. نحن نُشجع الإحترام المُتبادل و الإجتهاد و نرفض بقوة السلوك العدواني و/أو إنتهاك حقوق المستخدمين الآخرين. و يحق للمُدراء بتقليل إمكانية التواصل مع المستخدمين الآخرين لدى اللاعبين الذين يخالفون قوانين اللعبة.


    الشروط العامة
    قوانين اللعبة هي جزء من{نهاية إتفاقية ترخيص المستخدم} (المُشار إليها فيما بعد بإسم "الإتفاقية" EULA) و وثائق أخرى خاصة باللعبة أو خدمات اللعبة. و بدورها،"الإتفاقية"، وسياسة الخصوصية وملفات تعريف الإرتباط، و أيضاً عن وثائق أخرى نم الإفصاح عنها في خدمات اللعبة، هي جزء لا يتجزأ من قوانين اللعبة هذه.
    أي شروط  و المفاهيم المستخدمة في قوانين اللعبة لها نفس المعنى كما تم ذكرها لهم في "الإتفاقية".
    أي إستخدام للعبة و مرافقها على الإنترنت و/أو النقر على "قبول" في إستمارة التسجيل، يعني أنك قد قرأت وتوافق على تنفيذ قوانين اللعبة، وقبول جميع شروطها، دون إنتهاك أي قانون أو أي شرط. قوانين اللعبة إلزامية لجميع المستخدمين.
    إذا كنت لا توافق على أي قانون من قوانين اللعبة، ليس لديك الحق في إستخدام اللعبة وخدماتها، و يرجى ترك هذا الموقع وعدم إستخدام اللعبة.

    1. ممنوع إنشاء أسماء(الألقاب) التي تحتوي على التالي:
    1.1. تحتوي على لغة سيئة أو قوية، و الشتائم و الاستفزازات للإهانة (في شكل كلمات أو اختصارات أو عبارات)؛
    1.2. تحتوي على كلمات عنصرية أو فاشية أو الشتائم أو الألقاب القائمة على الهوية العرقية أو القومية أو الدينية أو تلك التي تُحرض على الكراهية والتعصب والخلافات العرقية؛
    1.3. تحتوي على دعوات للعنف والإرهاب والتطرف و/أو الإضطرابات الجماعية؛
    1.4. تحتوي على التماس سياسي، دعاية، إعلان سياسي من أي نوع؛
    1.5. ترتبط بشكل مباشر أو غير مباشر بالمنظمات السياسية (الأشخاص)، بمن فيهم أولئك الذين ارتكبوا جرائم سياسية أو جرائم ضد البشرية، و الأعمال الإرهابية؛
    1.6. تحتوي على التمييز حسب الجنس أو العمر أو الدين أو غير ذلك من الخصائص؛
    1.7. تحتوي على دعاية مباشرة أو غير مباشرة، و المكالمات التي تستهلك المشروبات الكحولية و الكحولية، و البيرة، و منتجات التبغ، و المخدرات، و المواد السامة، والمؤثرات العقلية و/أو المواد المسكرة، و أتباعها، تحتوي على معلومات عن أماكن وطرق إنتاجها واقتناءها وزراعتها و كيفية إستعمالها؛
    1.8. تحتوي على معلومات حول دعوات للمشاركة في ألعاب المقامرة، و الدعارة، جماعة متشردين، التسول.
    1.9. تحتوي على معلومات حول أساليب الإنتحار أو التحريض على الإنتحار أو العنف أو غير ذلك من الأعمال التي تشكل خطراً على الحياة أو الصحة؛
    1.10. التحريض على سلوك غير مشروع، و الجريمة، و العنف، و القسوة، وإلحاق الضرر الذي يُحرض على إرتكاب الأعمال التي تم حظرها من القانون؛
    1.11. تحتوي على أجزاء من أسماء المستخدمين لموظفي الإدارة أو تحتوي على المعلومات التي قد تنطوي على تصور خاطىء للمستخدم كممثل الإدارة؛
    1.12. تحتوي على إنتقاد لـ اللعبة، أو المُدراء أو المشرفين؛
    1.13. ترتبط بشكل مباشر أو غير مباشر مع الجماع، والإنتهاك، والمواد الإباحية، الولع الجنسي بالأطفال؛
    1.14. تحتوي على وصف للجسم ووظائفه البيولوجية أو ردود فعله و وظائفه؛
    1.15. تحتوي على الإعلان والروابط التشعبية؛
    1.16. تتضمن إشارات إلى رموز الغش ومواقع الغش والموارد التي تنتهك حقوق الإدارة؛
    1.17. تتكون من مجموعات عشوائية من الحروف غير المرغوب فيها (أحرف و أرقام غير مفهومة)؛
    1.18. تتألف كليا أو جزئيا من عناصر العلامات التجارية المحمية بحقوق الطبع والنشر و/أو المسجلة؛
    1.19. تحتوي على معلومات أخرى تحظرها قوانين اللعبة هذه، و/أو "الإتفاقية" و/أو القوانين الفعالة؛
    1.20. إذا كان أسم المستخدم لا يتوافق مع المتطلبات المذكورة أعلاه، أو المتطلبات الأخرى المحددة في قوانين اللعبة أو "الإتفاقية" أو القوانين الفعالة، يكون للإدارة الحق، بناء على ذلك عمل التالي:
    - مطالبة المستخدم بتغيير أسم المستخدم إلى أسم مستخدم مقبول و حظر حساب المستخدم للفترة المطلوبة لتغيير أسم المستخدم.
    - حظر حساب المستخدم بشكل مؤبد.
    2. الأنشطة والسلوكيات التي ممنوعة تماماً على مستخدمي اللعبة:
    2.1. إجراءات ستؤدي إلى (وفقاً لقرارات الإدارة) الحظر الدائم أو الحظر المؤقت لحساب المستخدم؛
    2.1.1. اللعب عن طريق روبوت مُبرمج، (إستخدام البرامج التي تقوم بتقليد أعمال المستخدمين في اللعبة)، و إستخدام برامج النقر المتكرر، و وحدات تحكم خاصة تقوم بالتحكم في الفأرة و/أو لوحة المفاتيح، و إستخدام برامج أخرى من الطرف ثالث للحصول على مزايا في اللعبة؛
    2.1.2. إستخدام أو توزيع برامج الطرف الثالث أو وسائل أخرى لتحسين إمكانيات اللعب (روبوتات، غش)، و أيضاً إستخدام البرامج التي قد تدهور في آداء اللعبة و/أو آداء الأجهزة الإلكترونية من الأشخاص الآخرين؛
    2.1.3. إستغلال الأخطاء البرمجية في اللعبة، ونقل المعلومات عنها إلى أشخاص آخرين، بإستثناء الإدارة؛
    2.1.4. الدخول في معركة خاصة بداخلها حسابات يمتلكها المستخدم نفسه؛
    2.1.5. التخريب - أو أي أعمال تقصير تهدف إلى خلق عوائق للفريق حيث أن اللاعب من نفس الفريق
    بما في ذلك في معارك الـ CTF، CP، TDM
    و القتال ضد الفريق الذي أنت بداخله (إختيار مقصود من المعدات الضعيفة، توقف متكرر، عدم النشاط أو التعمد في وضع متطلبات خاطئة
    لا تطلبها نمط الخريطة أو اللعبة، تقليد الأخطاء التي تحصل مع الإتصال بالإنترنت)، إلحاق الضرر/ تدمير دبابة عضو فريقك، القتال لصالح فريق العدو (المؤامرة)؛
    2.1.6. استخدام الخدمات الخاصة باللعبة لأعمال إحتيالية، أو الإعلان عن العمليات المالية الإحتيالية في اللعبة، والإحتيال في سياق المعاملات، والمدفوعات، بما في ذلك إسترجاع الأموال، والمعاملات المحظورة؛
    2.1.7. الإحتيال - تلقي الكريستال في اللعبة بإستخدام وسائل إحتيالية. وتُحذر الإدارة المستخدمين من أن مثل هذه الأنشطة قد تؤدي إلى مسؤولية جنائية أو غيرها؛
    2.1.8. مبادلة الحسابات أو معدات خاصة باللعبة إلى أشخاص آخرين. نشر أي عروض لبيع أو شراء أو نقل الحسابات في اللعبة، سواء مجاناً أو بالكريستال أو الأموال، و أيضاً التحريض على الإجراءات المذكورة أعلاه؛
    2.2. الإجراءات التي من شأنها أن تؤدي إلى (وفقاً لقرار الإدارة) حظر دائم من الوصول إلى محادثات اللعبة والمنتدى (حظر):
    2.2.1. التصيد الإحتيالي - الإجراءات التي تهدف إلى الوصول إلى البيانات السرية للمستخدمين، مثل البريد الإلكتروني و كلمات المرور؛
    2.2.2. نشر روابط لمواقع إحتيالية من الطرف الثالث التي يتم عملها بشبه مواقع اللعبة الرسمية؛
    2.2.3. نشر روابط إلى الموارد التي تدعي بإعطائك كريستالات مجانية، أو كريستالات تُصدرها الإدارة، أو تشرح أو تصف إستغلال الأخطاء في الكريستالات، إلخ...؛
    2.2.4. نشر روابط إلى مواقع إحتيالية تحتوي على برامج تابعة لجهات خارجية (غش، برامج الطرف الثالث، عملاء، إلخ)، ونشر روابط إلى مواقع تحتوي على برامج تغير من وظائف اللعبة أو تدعي بفعل ذلك؛
    2.2.5. حالات أخرى من الغش، التي تهدف إلى سرقة حسابات المستخدمين؛
    2.3. الإجراءات التي من شأنها أن تؤدي إلى (وفقا لقرار الإدارة) حظر مؤقت للحساب من الوصول إلى محادثات اللعبة والمنتدى
    لمدة تصل إلى 6 أشهر (حظر)؛
    2.3.1. التمييز ضد اللاعبين عديمي الخبرة (لاعبين جدد): و التضليل، و التخويف، والسخرية؛
    2.3.2. الإهانات و القذف (نشر المعلومات الكاذبة) فيما يتعلق بالمستخدمين الآخرين، والإدارة، والمشرفين، وغيرهم من الأشخاص؛
    2.3.3. آداء أي إجراءات لها تأثير سلبي على تطور اللعبة؛
    2.3.4. السلوكيات الأخرى التي تُعيق عملية اللعبة العادية التي سيتم الإعتراف بها من قبل الإدارة؛
    2.3.5. محاولات الحصول على كلمة المرور أو معلومات الحساب الأخرى أو غيرها من المعلومات الشخصية من أي مستخدم آخر، بما في ذلك في إبتزاز بإستخدام التهديدات الأخلاقية أو البدنية أو التقنية؛
    2.3.6. مشاركة كلمة المرور الخاصة بحسابك؛
    2.3.7. نشر أي معلومات شخصية عن لاعبين آخرين أو عن أشخاص آخرين (ما لم تكن هذه المعلومات متاحة للجميع)؛
    2.3.8. إستخدام اللغة السيئة أو القوية، والكلمات السيئة أو الفظيعة (العبارات) غير المصنفة كلغة سيئة، بما في ذلك التكلم بوقاحة؛
    2.3.9. نشر المعلومات والمواد ذات الطوابع الجنسية أو الإغراء أو الإباحية، أو تصوير أو وصف العلاقات الجنسية أو الممارسات الجنسية المنحرفة، و أيضاً نشر روابط بالمواقع التي تحتوي على هذه المعلومات؛
    2.3.10. نشر المعلومات أو الرموز التي تُهين أو تُذل مشاعر المؤمنين، وتثير الكراهية، والعداوة، والخلاف العرقي أو الدولي، والتعصب
    (بما في ذلك الإهانات، وإعطاء الألقاب على أساس الخصائص العرقية والوطنية والدينية)، وأيضا التحاور بإستفزازية على إرتكاب الإجراءات المحددة؛
    2.3.11. الدعاية أو عرض الشعارات النازية أو الرموز أو الاختصارات أو التسميات والأسماء وألقاب الناشطين النازيين؛
    2.3.12. نشر المعلومات التي يمكن أن يرى فيها عناصر الدعوة إلى العنف والحرب والإرهاب والإطاحة بالسلطة؛ والنشاط المُتطرف و/أو الإضطرابات الجماعية؛
    2.3.13. نشر المعلومات عن المُنظمات السياسية (القادة السياسيين) التي ارتكبت جرائم سياسية أو جرائم ضد البشرية أو أعمال إرهابية أو إنتهكت القوانين الدولية؛
    2.3.14. أي شكل من أشكال التمييز حسب الجنس أو العمر أو الدين أو أي خصائص أخرى؛
    2.3.15. نشر المعلومات التي تحتوي على أساليب الإنتحار أو دعاوي الإنتحار أو العنف أو غير ذلك من الأعمال التي تشكل خطراً على الحياة أو الصحة، أوصاف تقنيات القتال الخطيرة، والمثيرة، وأساليب إنتاج الأسلحة، و وصف أساليب التعديل على الجسم؛
    2.3.16. نشر المعلومات التي تصف السلوك الغير قانوني أو المُعادي للمجتمع أو الجريمة أو العنف أو التشويه أو القسوة النفسية أو الجسدية للأشخاص أو الحيوانات أو إلحاق الضرر بممتلكات الآخرين أو تحرض على ذلك أو تبريره؛
    2.3.17. نشر المعلومات التي تسبب الخوف أو الرعب أو الذعر لدى الأطفال، بما في ذلك الصور أو وصف الموت، والأمراض، والإنتحار، والحوادث، وحالات الطوارئ أو الكوارث و/ أو عواقبها، وغيرها من المعلومات التي قد تُضر بالصحة أو التنمية للقاصرين؛
    2.3.18. نشر المعلومات التي تحتوي على الدعاية المباشرة أو الغير مباشرة، دعوات لإستهلاك المشروبات الكحولية، والبيرة، منتجات التبغ، مُستلزمات التدخين، المخدرات، المواد السامة، المؤثرات العقلية و/أو المواد المسكرة، و أمثالها، ذِكر معلومات حول أماكن وطرق إنتاجها، و إقتناءها، وزراعتها و كيفية إستخدامها؛
    2.3.19. نشر المعلومات التي يمكن أن تُشجع الرغبة في المشاركة في ألعاب القمار، والدعارة، والتشرد والتسول؛
    2.3.20. أي إستخدام لأشياء الملكية الفكرية (برمجيات أو فن أو فيديو أو أشياء أخرى أو أجزائها أو علاماتها التجارية أو غيرها) أو غيرها من المواد دون إذن صاحب الحق؛ نشر روابط إلى محتوى مُقرصن؛ أو حذف أو تغيير المعلومات المُتعلقة بحقوق الملكية الفكرية، ولا سيما الروابط مع أصحاب الحقوق والمؤلفين وغير ذلك من التأكيدات على حقوق الملكية الفكرية؛
    2.3.21. نشر المعلومات التي قد تؤدي إلى ضرر أو خسارة للمستخدمين أو الإدارة؛
    2.3.22. تقديم معلومات أو وثائق أو أدلة كاذبة أو وهمية. وتُحذر الإدارة المستخدمين من المسؤولية الجنائية وغيرها من المسؤولية عن هذه الأنشطة؛
    2.3.23. إنشاء موضوعات و/ أو رسائل في محادثات اللعبة و/ أو المنتديات التي تُشعل ("الجدل من أجل الجدل"، وتبادل الرسائل التي هي مجرد حرب من الكلمات، وغالباً ليس لها علاقة بالسبب الأصلي للنزاع؛
    2.3.24. إنشاء مواضيع و/ أو رسائل في محادثات اللعبة و/ أو المنتديات، بهدف إستفزاز المستخدمين الآخرين والمُدراء والمشرفين و أيضاً
    إعاقة الإتصال في المنتدى أو مُحادثات الألعاب؛
    2.4. الإجراءات التي تؤدي إلى (وفقاً لقرار الإدارة) حظر مؤقت للدخول إلى المُحادثات و منتدى اللعبة لمدة تصل إلى 24 ساعة (حظر) أو تحذير رسمي؛
    2.4.1. أي محاولات للتظاهر بأنك موظف سابق أو حالي في الإدارة أو مُساعد في اللعبة (مشرف، مساعد، وما إلى ذلك)، بما في ذلك إرسال رسائل نيابة عن الإدارة أو المشرفين؛
    2.4.2. التوسل في أي شكل من الأشكال، بما في ذلك طلبات تحويل الأموال أو معدات في اللعبة أو طلب الكريستال؛
    2.4.3. نشر المعلومات التي تُلغي الفعاليات التاريخية؛
    2.4.4. نشر المعلومات التي تتضمن التماس سياسي، والإعلانات السياسية، والدعاية الإنتخابية من أي نوع؛
    2.4.5. مناقشة القضايا السياسية الراهنة التي يُمكن أن تُثير الصراع بأي شكل من الأشكال؛
    2.4.6. التهديدات بأي شكل من الأشكال المُتعلقة بالمستخدمين أو الإدارة أو الأشخاص الآخرين؛
    2.4.7. نشر معلومات عن قاصر عانى نتيجة لإجراءات غير مشروعة (الإغفالات)؛
    2.4.8. نشر أي مواد إعلانية أو معلومات خاصة دون موافقة الإدارة؛
    2.4.9. إنتقاد اللعبة و/ أو مؤلفيها، أو المالك؛
    2.4.10. التشجيع على عمل الإجراءات التي تم حظرها في قوانين اللعبة هذه، و/ أو "الاتفاقية" و/ أو القانون الساري؛
    2.4.11. بدء المواضيع و/ أو إنشاء رسائل في محادثات اللعبة و/ أو على المنتدى التي تضم التالي:
    2.4.11.1. إعادة إنتاج المواضيع أو الرسائل الموجودة بالفعل، بالإضافة إلى الموضوعات التي تمت مناقشتها مؤخرا و/ أو الإجابات المتوفرة في أقسام المعلومات (قوانين اللعبة، الأسئلة الشائعة، الخُطط، وما إلى ذلك)؛
    2.4.11.2. لا تتوافق مع موضوع القسم/ أو الفئة؛
    2.4.11.3. تحتوي على أحرف غير مفهومة أو الكثير من الأحرف الغير مرغوب بها في العنوان و/ أو محتوى الموضوع أو الرسالة؛
    2.4.11.4. تحتوي على ما يلي في العنوان و/ أو وصف الموضوع أو الرسالة: الرموز أو الرموز غير ذات الصلة أو المتكررة، والرموز الغير مفهومة، وصلات الإحالة، "رموز الغش"، والمعلومات التي تُعقّد فهم الموضوع أو القسم، أو ليس لها أي معنى، على سبيل المثال
    == - موضوعي - ==؛
    2.4.11.5. تحتوي على نص بحجم الخط أكبر من 24؛
    2.4.11.6. عدم وجود معلومات ولا تعكس الإحساس بالمسألة في عنوان الموضوع أو وصفه؛
    2.4.11.7. إقتباس أجزاء من الرسائل السابقة التي حجمها كبير جداً، و/ أو الصور دون أي ضرورة خاصة؛
    2.4.11.8. متابعة مُناقشة الموضوعات التي تم إغلاقها أو حذفها من قبل الإدارة؛
    2.4.11.9. أن تُنادي بالأسم الشخصي للمشاركين في المنتدى. للإتصال الشخصي يرجى إستخدام الرسائل الخاصة. وتسمح المناقشات الشخصية بالتوازي مع حل هذه القضايا؛
    2.4.11.10. تحتوي على محتوى غير مرغوب فيه، مما يعني؛ توزيع المعلومات التي لم يطلبها الُمرسل إليه، أو عدم إهتمامه بالتلقي، و/ أو عدم الموافقة على تلقيها؛
    2.4.11.11. تحتوي على معلومات أو إنتهاكات أخرى تم حظرها في قوانين اللعبة هذه و/ أو "الاتفاقية" و/ أو القوانين السارية؛
    3. القيود التي سيتم تنفيذها على المستخدم في حال مُخالفة أحد قوانين اللعبة:
    3.1. إذا إنتهك المستخدم أحد قوانين اللعبة، يحق للإدارة تطبيق القيود المنصوص عليها في قسم قوانين اللعبة لهذا المستخدم. القيود المُحتملة لا تقتصر على تلك المذكورة. و لكن لدى الإدارة الحق في تطبيق قيود أخرى وفقاً لتقرارها، مع ما يصل إلى حظر دائم للحساب، بما في ذلك حظر
    جُزئي أو حظر كامل لجميع الممتلكات الافتراضية للمستخدم، مثل الترتيب، والإنجازات والممتلكات في اللعبة (الكراج، الكريستالات، إحصاءات اللعبة).
    3.2. عند إختيار القيود، تنظر الإدارة في نوع وعدد الإنتهاكات، وكذلك الإنتهاكات السابقة لقوانين اللعبة من قبل المستخدم.
    3.3. ويحق للإدارة، وفقاً لقرارها الخاص، حذف/ نقل أي موضوع تم إنشاؤه في قسم المنتدى الخاطئ، دون إشعار المستخدم.
    3.4. يحق للإدارة، وفقاً لقرارها الخاص، تطبيق واحد أو عدة قيود في وقت واحد للمستخدم، أو إعطاء تحذير رسمي.
    3.5. إنتهاك قوانين اللعبة هذه يعني أن المستخدم قد يكون على الفور، و بدون أي إشعار مُسبق، قد رفض تقديم خدمات الللعبة أو قد تكون هذه الخدمات مُقيدة كلياً أو جزئياً.
    3.6. إذا إنتهك المستخدم قوانين اللعبة عدة مرات أو بطريقة مُتكاملة، يحق للإدارة، وفقا لقرارها الخاص، أن تُكرر القيود المُطبقة على المستخدم.
    3.7. وبما أنه ليس من المُمكن دائماً تحديد الإنتهاكات المُحددة لقوانين اللعبة على وجه التحديد، فإن القرار النهائي يعود دائماً إلى الإدارة.
    3.8. ويمكن تطبيق هذه القيود على أي حساب للمستخدم الذي ينتهك قوانين اللعبة هذه.
    3.9. وتهدف الرسائل الخاصة للإتصال الشخصي من المستخدمين في خدمات الألعاب وعلى المنتدى. عند معالجة الشكاوي المُتعلقة بإنتهاك قوانين اللعبة، لا تتجه إلى الإدارة في الشكاوى المُتعلقة بالرسائل الخاصة، بإستثناء إنتهاكات قوانين اللعبة في الرسائل الخاصة للأعضاء أو مساعدي الإدارة. قد يتوقف المستخدم عن تلقي رسائل خاصة من مستخدم آخر عن طريق إضافته إلى القائمة السوداء في القسم المناسب من الملف الشخصي للمستخدم في المنتدى.
    3.10. لا تتحمل الإدارة بأي حال من الأحوال المسؤولية عن أي خسارة أو ضرر مباشر أو غير مباشر قد يكون المستخدم أو طرف ثالث قد تعرض له نتيجة لإستخدام المستخدم أو إستخدام الطرف الثالث لمواقع الإنترنت أو لعبة و/ أو بما في ذلك الحصول على عدد لا نهائي من المُعدات الناجمة عن عدم القدرة على إستخدام اللعبة والمرافق عبر الإنترنت، أو الناجمة عن تطبيق الإدارة من القيود المفروضة على المستخدم، الأضرار المباشرة أو غير المباشرة الناشئة عن إجراءات طرف ثالث، بما في ذلك المستخدمين الآخرين من لعبة، وعدم الوصول إلى الإنترنت، والسرقة، وتدمير المواد، و فُقدان المعلومات المُتعلقة بحساب المستخدم وأي ضرر على شرف المستخدم والكرامة وسمعة الأعمال الناشئة في إتصال اللعبة.
    4 - مساعدو الإدارة
    4.1. مساعدو الإدارة يتم إختيارهم من قِبل الإدارة من بين المستخدمين.
    4.2. مساعد الإدارة هو شخص يتصرف بالنيابة عن الإدارة ويخدمها. يجب على مساعدي الإدارة الحفاظ والسيطرة على النظام في اللعبة وخدمات اللعبة، وكذلك على المنتدى، و مُحادثات اللعبة وصفحات وسائل الإعلام الإجتماعية الرسمية وحسابات اللعبة.
    4.3. ويجب أن يكون مساعد الإدارة صادقاً وموضوعياً في إتخاذ القرارات، وأن يكون يُمثل أحكام قوانين اللعبة و "الاتفاقية"، وأن يكون مهذباً للمستخدمين، وأن يؤدي واجباته بكفاءة و بإنتظام. ويُحدد أنشطة مساعدي الإدارة وتنظيم مبادئهم التوجيهية الداخلية.
    4.4. ممنوع تماماً مناقشة أنشطة مساعدي الإدارة في منتديات اللعبة علناً، والمُحادثات، والمجموعات الرسمية في وسائل الإعلام الإجتماعية. وينبغي إرسال جميع الشكاوي المُتعلقة بعمل المساعدين إلى مدير مجموعة المُساعدين المَعنيين؛
    4.5. يتم تنفيذ نشاط مُساعدي الإدارة على أساسات تطوعية. لا يحق للاعب فرض مساعد على تطبيق أحد قيود اللعبة.
    5. الشكاوي و المُطالبات
    5.1. يحق للمستخدم الإبلاغ عن إنتهاكات قوانين اللعبة من خلال إنشاء موضوع جديد في المنتدى داخل قسم الإنتهاكات الخاص. ومن الضروري تحديد طبيعة الإنتهاك بوضوح في الموضوع الجديد وإرفاق لقطات للشاشة و المحادثة أو فيديو يُظهر بها بوضوح نوع الإنتهاك.
    5.2. يمكن للمستخدم إرسال أي أسئلة أو تعليقات أو شكاوي بشأن قوانين اللعبة هذه لـ help@tankionline.com. وستبذل الإدارة قصارى جُهدها بالنظر في هذه الطلبات في أقرب وقت ممكن.
    5.3. عند إرسال شكوى، يجب على المستخدم وصف طبيعة الوضع بأكبر قدر مُمكن من التفاصيل وبأكبر قدر مُمكن من الوضوح وإرفاق حقائق الأدلة ،إرسال لقطات للشاشة، وما إلى ذلك. وتعتبر الشكاوي حول القيود التي لا أساس لها فقط لغرض التقييم الداخلي لعمل والإدارة ومدير الجلسة. ولا تخضع القرارات المُتعلقة بتطبيق القيود للمراجعة.
    5.4. إذا كان المستخدم يبدأ المُراسلات مع الإدارة أو يُقدم تقريراً عن المشاكل مع لعبة أوخدمات اللعبة، يحق للإدارة تخزين كل هذه المُراسلات.
    6. أحكام أخرى
    6.1. الإدارة تُدير اللعبة وتُطبق قوانين اللعبة هذه في تقريرها الخلص، ولكن يُؤخذ بعين الإعتبار رأي المجتمع.
    6.2. قد يتم تغيير قواعد اللعبة هذه من قِبل الإدارة دون أي إشعار مُسبق. المستخدم مُلزم بفحص قوانين اللعبة هذه مرة واحدة على الأقل كل سبعة أيام (على سبيل المثال أسبوعياً). إذا لم يتم إجراء مثل هذا الإختيار خلال الفترة المُحددة ويستمر المستخدم في إستخدام اللعبة، و يُعتبر المستخدم بأنه قد قرأ و يتفق مع نسخة القوانين المُعدلة الجديدة.
    6.3. تحتفظ الإدارة بسياسة "عدم التسامح إطلاقاً" مع الغش والإحتيال. إذا رأت الإدارة أن المستخدم قد خدع أو حاول خِداع الإدارة أو مستخدم آخر أو قدم معلومات و وثائق و أدلة كاذبة أو وهمية وغير ذلك من أشكال إنتهاك القوانين المُصنّعة بها، تحتفظ الإدارة بحقها في حظر حساب المستخدم ونقلها (وفقاً للبيانات الشخصية للمستخدم) إلى أي طرف ثالث و/ أو سُلطات تنفيذ القانون إذا رأت الإدارة ذلك ضرورياً.
    6.4. يجوز للإدارة إصدار أحكام وقيود أخرى في قواعد eSports وقواعد المُسابقة والبُطولات , والفعاليات. وفي الوقت نفسه، قوانين اللعبة هذه
    هي جزء لا يتجزأ من القوانين الأُخرى التي إعتمدتها الإدارة.
    6.5. يمكن أن تلعب معارك لمسابقات خاصة تم إنشاؤها من قِبل اللاعبين (مثل "إحمي الصندوق الذهبي") في أي نمط معركة طالما أنها معركة خاصة. ومع ذلك، سيتم التعامل مع أي إنتهاك مثل الثبات بدون تحرك، والتخريب أو الحصول على نقاط بطريقة غير قانونية خلال هذه المعارك الخاصة وفقاً لقوانين اللعبة العادية.
