  GAME_RULES: "In het kort\n\nDe volgende activiteiten zijn niet toegestaan in het spel, chats, fora en alle andere officiële plaatsen waar gecommuniceerd wordt: \n– gebruik van bots, gebruik van externe software, uitbuiten van bugs;\n– zich voordoen als een lid van de Administratie of een van de assistenten; \n– veroorzaken van obstructies voor andere gebruikers;\n– adverteren, politieke propaganda;\n– overtreden van wetten, inclusief intellectueel eigendomsrecht;\n– verkopen, kopen, uitwisselen, verplaatsen van Accounts of andere eigendommen in het spel;\n– fraude of andere onoprechte acties;\n– beledigingen, bedreigingen, laster;\n– obscene taal, inclusief in suggestieve vorm;\n– flooding (woordenstroom), flaming (uitlokken), spam, typen in hoofdletters (CAPS LOCK);\n– vragen naar wachtwoorden of andere accountinformatie;\n– anderen aanmoedigen tot het overtreden van de Spel Regels;\n– publicatie van bij de wet verboden informatie;\n– publicatie van links naar externe websites;\n– elke vorm van discriminatie.\n\nSpelregels\nJe bent in Tanki Online, een spel waar mensen van over de hele wereld genieten van het besturen van grote gevechtsvoertuigen en van het deelnemen aan vurige gevechten! Spelers kunnen individueel vechten of in een team strijden om de overwinning. Ze kunnen ook socialiseren en nieuwe vrienden maken.\nTanki Online is een gemakkelijk te leren multiplayer actie spel, een plaats voor serieuze gevechten en een geweldig sociaal netwerk.\nNa het voltooien van het registratie proces ontvangt de Gebruiker een virtuele tank en 1000 kristallen (de valuta in het spel). Door het winnen van gevechten, verhogen Gebruikers hun rating en verdienen nieuwe rangen en kristallen. Kristallen kunnen gebruikt worden om bruikbare uitrusting alsook wapens, rompen of verven te kopen.\nTanki Online is meer dan alleen een spannend online Spel. Het is een gemeenschap van mensen die dezelfde interesses delen. We moedigen wederzijds respect en beleefdheid aan en ontmoedigen beledigend gedrag en/of het schenden van de rechten van andere Gebruikers sterk. Het beheer behoudt zich het recht voor de communicatie mogelijkheden van gebruikers te beperken, hun ratings te verlagen en/of hun Accounts te blokkeren als ze deze Spelregels overtreden.\n\nAlgemene voorwaarden\n\nDe Spelregels zijn een integraal onderdeel van de Gebruikersvoorwaarden (hierna naar verwezen als de \"Overeenkomst\" of EULA) en andere documenten van het Spel en de Spel diensten. Op zijn beurt zijn de Overeenkomst, het Privacy en Cookies beleid, alsook andere documenten gepubliceerd in het Spel en Spel diensten een integraal onderdeel van deze Spelregels.\nAlle voorwaarden en begrippen gebruikt in de Spelregels hebben dezelfde betekenis als is aangegeven in de Overeenkomst.\nIeder gebruik van het Spel en diens Online Faciliteiten en/of het klikken op \"Accepteren\" bij het registratieformulier betekent dat je bekend en het eens bent met deze Spelregels en dat je alle voorwaarden onvoorwaardelijk accepteert.\nDe Spelregels zijn verplicht voor alle Gebruikers.\nAls je het niet eens bent met een aantal voorwaarden in deze Spelregels, heb je niet het recht verder gebruik te maken van het Spel en diens diensten en moet je deze Site verlaten en geen gebruik maken van het Spel.\n\n1. Vereisten voor gebruikersnamen\n\nHet is verboden gebruikersnamen, clan namen (tags) alsook clan slogans te maken die:\n1.1. Grof of sterk taalgebruik, beledigingen/uitdagingen tot beledigingen (in de vorm van woorden, afkortingen, uitdrukkingen of gezegden) bevatten;\n1.2. Elementen bevatten van racisme, fascisme, beledigingen of gebaseerd zijn op raciale, nationale of religieuze identiteit, of die haat, intolerantie, ethische onenigheid uitlokken;\n1.3. Oproepen tot geweld, terrorisme, extremisme en/of massa verstoringen bevatten;\n1.4. Politieke werving, propaganda, iedere vorm van politieke reclame bevatten;\n1.5. Direct of indirect gerelateerd zijn aan politieke organisaties (personen), inclusief diegenen die politieke misdrijven of misdrijven tegen de mensheid, terroristische handelingen hebben gepleegd;\n1.6. Discriminatie op geslacht, leeftijd, religie of andere eigenschappen bevatten;\n1.7. Directe of indirecte propaganda, oproepen tot het gebruiken van alcoholische en alcoholhoudende dranken, bier, tabak producten, giftige, psychotrope en/of bedwelmende middelen, hun precursoren, informatie over de plaatsen en methoden van hun productie, aankoop, teelt en gebruik bevatten;\n1.8. Informatie bevatten over oproepen tot het deelnemen aan gokspellen, prostitutie, landloperij, bedelen;\n1.9. Informatie bevatten over de methoden voor het plegen van zelfmoord, aanmoedigingen tot het plegen van zelfmoord, geweld of andere acties die een bedreiging vormen voor het leven of gezondheid;\n1.10. Aanmoedigingen bevatten tot onwettige gedragingen, misdrijven, geweld, wreedheid, toebrengen van schade die aanspoort tot het plegen van acties die verboden zijn bij de wet;\n1.11. Delen bevatten van Gebruikersnamen van Beheer medewerkers of informatie bevatten die een Gebruiker mogelijk foutief als Beheer vertegenwoordiger bestempelt;\n1.12. Kritiek bevatten op het Spel, de Beheerders of moderatoren;\n1.13. Direct of indirect zijn verbonden met seksuele interactie, geweld, pornografie, pedofilie en iedere andere vorm van seksueel geweld of beoefening, afwijkend of anderszins;\n1.14. Beschrijvingen bevatten van het lichaam en diens seksuele biologische functies;\n1.15. Reclame of hyperlinks bevatten;\n1.16. Referenties bevatten naar cheat codes, cheat sites, middelen die de rechten van het Beheer schenden;\n1.17. Uit onuitspreekbare willekeurige sets van letters (woordenstroom Gebruikersnamen) bestaan;\n1.18. Volledig of deels bestaan uit handelsmerk elementen die geregistreerd en/of beschermd zijn door auteursrecht;\n1.19. Andere informatie bevatten die verboden is door de Spelregels, de Overeenkomst en/of de effectieve wetgeving;\n1.20. Als een Gebruiker voldoet aan de eisen hierboven, andere vereisten vastgesteld in deze Spelregels, de Overeenkomst of effectieve wetgeving, heeft het Beheer het recht, naar eigen goeddunken om:\n- van de Gebruiker te eisen de Gebruikers naam te wijzigen naar een acceptabele naam en het Account van de Gebruiker te blokkeren gedurende de periode die nodig is om de Gebruikersnaam te wijzigen;\n- het Account van de Gebruiker onherroepelijk te blokkeren.\n\n2. Activiteiten en gedragingen die verboden zijn voor de Gebruikers van het Spel:\n\n2.1. Acties die zullen leiden tot (naar goeddunken van het Beheer) het permanent of tijdelijk blokkeren van het Account van een Gebruiker:\n2.1.1. Automatiseren van gameplay, inclusief botting (gebruik van software dat de acties van Gebruikers in het Spel imiteert), gebruik van klikker programma's, macro's die de muis en het toetsenbord beheersen, gebruik van andere derde-partij software voor het verkrijgen van voordelen in het Spel;\n2.1.2. Toepassing of verspreiding van derde-partij software of andere middelen voor verbetering/automatisering van spel mogelijkheden (bots, cheats), alsook programma’s die het functioneren van het Spel en/of het functioneren van elektronische apparaten van derde personen slechter maken;\n2.1.3. Uitbuiting van software bugs in het Spel en informatie erover overbrengen aan derde personen, het Beheer uitgezonderd;\n2.1.4. Gevechten tussen accounts die in het bezit zijn van de zelfde Gebruiker;\n2.1.5. Sabotage — Iedere actie of nalatigheid met als doel het creëren van obstructies voor het team waar de Gebruiker onderdeel van uitmaakt, inclusief VDV, TDM en CP modi, vechten tegen het team waar je onderdeel van uitmaakt (bewust gebruik van zwakke uitrusting, frequente pauzes, inactiviteit of bewust niet voldoen aan de vereisten van de map of spelmodus, imitatie van verbindingsproblemen met internet), beschadigen/verwoesten van teamgenoten, vechten in het voordeel van het tegenstanderteam (samenzwering);\n2.1.6. Gebruik van het Spel of Spel diensten voor frauduleuze acties, inclusief zonder beperking frauduleuze in-spel financiële operaties, fraude tijdens transacties, betalingen, inclusief terugbetaling, verboden transacties;\n2.1.7. Fraude — ontvangen van in-Spel valuta door het gebruiken van frauduleuze middelen. Het Beheer waarschuwt Gebruikers dat zulke acties kunnen leiden tot criminele of andere aansprakelijkheid;\n2.1.8. Overdracht van het Account of andere spel waarden aan derde personen; publicaties van aanbiedingen tot verkoop, koop of overdracht van het Account of in-spel eigendommen, zowel gratis en voor kristallen of geldmiddelen, alsook aansporingen tot de genoemde acties;\n\n2.2. Acties die zullen leiden tot (naar goeddunken van het Beheer) een permanente beperking van de toegang tot Spel Chats en Forum (ban):\n2.2.1. Phishing — acties die bedoeld zijn om toegang te verkrijgen tot vertrouwelijke informatie van Gebruikers, zoals logins en wachtwoorden;\n2.2.2. Plaatsen van links naar 3e partij middelen die vermomd zijn als officiële middelen van het Spel;\n2.2.3. Plaatsen van links naar middelen die gratis kristallen of kristallen verstrekt door beheer beloven of de uitbuiting van kristal bugs etc. uitleggen of beschrijven;\n2.2.4. Plaatsen van links naar sites/hostings die 3e partij software bevatten (cheats, programma’s, clients, etc.), verspreiden van links naar sites die software bevatten die de werking van het spel veranderen of beloven dat te doen;\n2.2.5. Andere vormen van fraude, bedoeld om accounts van Gebruikers te stelen.\n\n2.3. Acties die zullen leiden tot (naar goeddunken van het Beheer) een tijdelijke beperking van de toegang tot Spel Chats en Forum tot 6 maanden (ban):\n2.3.1. Discriminatie richting onervaren spelers (newbies): desinformatie, intimidatie, spot;\n2.3.2. Beledigingen, laster (verspreiding van misleidende informatie) in relatie tot andere Gebruikers, Beheer, moderatoren, andere personen;\n2.3.3. Uitvoering van elke actie die een negatieve invloed heeft op de ontwikkeling en het imago van het Spel;\n2.3.4. Andere gedragsvormen die het normale spelproces hinderen, welke zo beschouwd worden door het Beheer;\n2.3.5. Pogingen tot het verkrijgen wachtwoorden, andere Account informatie of andere persoonlijke informatie van iedere andere Gebruiker, inclusief in de vorm van afpersing door morele, fysieke of technische dreigingen te gebruiken;\n2.3.6. Delen van het wachtwoord van het eigen account;\n2.3.7. Verspreiden van iedere vorm van persoonlijke informatie over andere Gebruikers of derde personen (tenzij zulke informatie publiekelijk toegankelijk is);\n2.3.8. Gebruik van grof of sterk taalgebruik, andere grove of onbeleefde woorden (uitdrukkingen) die niet geclassificeerd zijn als grof taalgebruik, inclusief in impliciete vorm;\n2.3.9. Publicatie van informatie en materiaal van seksuele, erotische of pornografische aard, afbeelden of beschrijven van seksuele relaties of afwijkende seksuele praktijken, alsook het plaatsen van links naar middelen die zulke informatie bevatten;\n2.3.10. Publicatie van informatie of symbolen die de gevoelens van gelovers beledigen of vernederen, haat, vijandigheid, raciale, internationale of etnische verdeeldheid, intolerantie (inclusief beledigingen, bijnamen geven op basis van raciale, nationale, ethische, religieuze eigenschappen) veroorzaken, alsook uitdagen van de gesprekspartner tot het plegen van gespecificeerde acties;\n2.3.11. Propaganda of vertoning van Nazi emblemen, symbolen, afkortingen of aanduidingen, namen en achternamen van Nazi activisten;\n2.3.12. Publicatie van informatie waarin elementen gezien kunnen worden van de oproep tot geweld, oorlog, terrorisme, omverwerping van de macht; extremisten activiteit en/of massa verstoringen;\n2.3.13. Publicatie van informatie over politieke organisaties (politiek leiders) die politieke misdaden of misdaden tegen de mensheid, terroristische handelingen hebben begaan of op een andere manier de internationale wetgeving hebben overtreden;\n2.3.14. Iedere vorm van discriminatie op basis van geslacht, leeftijd, religie of andere eigenschappen;\n2.3.15. Publicatie van informatie die methoden voor het plegen van zelfmoord, oproepen tot het plegen van zelfmoord, geweld of andere acties die een bedreiging vormen voor het leven of gezondheid, beschrijvingen van gevaarlijke gevechtstechnieken, stunts, methoden voor wapen productie, beschrijving van lichaamsbewerkingsmethoden bevat;\n2.3.16. Publicatie van informatie die onwettig of asociaal gedrag, misdaad, geweld, mutilatie, mentale of fysische wreedheid naar mensen, dieren, toebrengen van schade aan het eigendom van anderen beschrijft;\n2.3.17. Publicatie van informatie die angst, afschuw of paniek bij kinderen veroorzaakt, inclusief afbeeldingen of beschrijvingen van dood, ziekten, zelfmoord, ongelukken, noodgevallen of rampen en/of hun gevolgen, andere informatie die de gezondheid of ontwikkeling van minderjarigen kan beschadigen;\n2.3.18. Publicatie van informatie die directe of indirecte propaganda, oproepen tot het gebruiken van alcoholische en alcoholhoudende dranken, bier, tabak producten, rook accessoires, drugs, giftige, psychotrope en/of bedwelmende middelen, hun precursoren, informatie over de plaatsen en methoden van hun productie, aankoop, teelt en gebruik bevat;\n2.3.19. Publicatie van informatie die het verlangen kan aanmoedigen om deel te nemen aan gokspellen, prostitutie, landloperij of bedelarij;\n2.3.20. Enig gebruik van intellectuele eigendommen (software, kunstwerken, video en andere objecten of hun onderdelen, handelsmerken etc.) of andere materialen zonder toestemming van de rechthebbende; plaatsen van links naar illegaal gekopieerde inhoud; verwijdering of wijziging van de informatie over intellectuele eigendomsrechten, in het bijzonder links naar de rechthebbenden, auteurs en andere bekrachtiging van intellectuele eigendomsrechten;\n2.3.21. Publicatie van informatie die in schade/verliezen voor Gebruikers of het Beheer kan leiden;\n2.3.22. Voorziening van onjuiste of fictieve informatie, documenten of bewijs. Het Beheer waarschuwt Gebruikers over de criminele en andere verantwoordelijkheid voor zulke activiteiten;\n2.3.23. Maken van topics en/of berichten in de Chats en/of Fora van het spel die Flaming zijn (“ruzie maken om het ruzie maken”, een uitwisseling van berichten die slechts een woordenoorlog zijn en vaak niet gerelateerd zijn aan de oorspronkelijke oorzaak van het geschil);\n2.3.24. Maken van topics en/of berichten in de Chats en/of Fora van het spel die bedoeld zijn om andere Gebruikers, het Beheer, moderatoren te provoceren, alsook de communicatie op het Forum of de spel chats te belemmeren;\n\n2.4. Acties die zullen leiden tot (naar goeddunken van het Beheer) een tijdelijke beperking van de toegang tot Spel Chats en Forum tot 24 huur (ban) of een officiële waarschuwing:\n2.4.1. Pogingen tot het zich voordoen als voormalig of huidig medewerker van het Beheer of project assistent (moderator, consultant etc.), inclusief het sturen van berichten in naam van het Beheer of moderatoren;\n2.4.2. Smeken in alle vormen, inclusief verzoeken tot het overdragen van fondsen, spel waarden of kristallen;\n2.4.3. Publicatie van de informatie die historische gebeurtenissen ontkent;\n2.4.4. Publicatie van informatie die politieke verzoeken, politieke reclame, verkiezingspropaganda van alle soorten bevat;\n2.4.5. Bespreken van hedendaagse politieke problemen die op enige manier conflicten kunnen uitlokken;\n2.4.6. Bedreigingen in alle vormen gericht aan Gebruikers, Beheer of derde personen;\n2.4.7. Publicatie van informatie over een minderjarige die geleden heeft als resultaat van onwettig handelen (nalatigheden);\n2.4.8. Publicatie van reclamemateriaal of informatie zonder toestemming van het Beheer;\n2.4.9. Onconstructieve kritiek op het Spel en/of diens auteurs, de Eigenaar;\n2.4.10. Het plegen of aanzetten tot plegen (provocatie) van handelingen (nalatigheden) die verboden zijn door de Spelregels, de Overeenkomst en/of toepasselijk recht.\n2.4.11. Het starten van topics en/of creëeren van berichten in spel chats en/of op het forum die:\n2.4.11.1. Al bestaande topics of berichten reproduceren, alsook topics die recent besproken zijn en/of waarvan de antwoorden beschikbaar zijn in de informatiesecties (de Spelregels, FAQ, Plannen etc.);\n2.4.11.2. Niet corresponderen met het thema van de sectie/categorie;\n2.4.11.3. Caps lock of veel hoofdletters bevatten in de titel en/of inhoud van het topic of bericht;\n2.4.11.4. Het volgende bevatten in de titel en/of beschrijving van het topic of bericht: irrelevante of herhaalde symbolen of karakters, emoticons, verwijzingslinks, “cheat codes”, informatie die het begrijpen van het topic of de sectie vermoeilijkt, of geen betekenis heeft (Woordenstroom), bijvoorbeeld == – Mijn topic – ==; \n2.4.11.5. Tekst bevatten met een lettergrootte van meer dan 24;\n2.4.11.6. Een gebrek aan informatie hebben en niet overeenkomen met de bedoeling van het onderwerp in de titel of beschrijving van het topic;\n2.4.11.7. Delen van vorige berichten citeren die te groot zijn en/of afbeeldingen bevatten zonder enige noodzaak (overciteren);\n2.4.11.8. Doorgaan met het bespreken van topics die gesloten of verwijderd zijn door het Beheer (necroposting);\n2.4.11.9. De aard hebben van een persoonlijke oproep aan de Forum deelnemers. Gebruik voor persoonlijke communicatie Privé Berichten. Persoonlijke discussies zijn toegestaan bij het oplossen van problemen.\n2.4.11.10. Spam bevatten, dat wil zeggen, informatie verspreiden waar de geadresseerde niet om heeft verzocht, geen interesse in het ontvangen ervan heeft getoond en/of geen toestemming voor heeft gegeven;\n2.4.11.11. Andere informatie of overtredingen bevatten de verboden zijn door deze Spelregels, de Overeenkomst en/of toepasselijk recht.\n\n3. Opleggen van beperkingen aan de Gebruiker\n\n3.1. Indien een Gebruiker deze Spelregels overtreedt, heeft het Beheer het recht om beperkingen die voorgeschreven zijn in de relevante secties van de Spelregels op te leggen aan deze Gebruiker. Mogelijke beperkingen zijn niet gelimiteerd tot de genoemde beperkingen. Het Beheer heeft het recht naar eigen goeddunken andere beperkingen op te leggen, met maximaal het permanent blokkeren van het Account, inclusief deels of volledige inbeslagname van alle virtuele eigendommen, rangen, prestaties en eigendommen in het Spel (garage, kristallen, spel statistieken) van de Gebruiker;\n3.2. Bij het bepalen van beperkingen, beschouwt het Beheer het soort en aantal overtredingen, alsook voorgaande overtredingen van deze Spelregels door de Gebruiker;\n3.3. Het Beheer is gerechtigd om, naar eigen goeddunken, alle informatie of berichten te verwijderen; het topic dat gemaakt is in de verkeerde sectie van het Forum te verwijderen/verplaatsen zonder berichtgeving;\n3.4. Het Beheer is gerechtigd om, naar eigen goeddunken, één of meerdere beperkingen tegelijkertijd op te leggen aan de Gebruiker, of een waarschuwing te geven.\n3.5. Overtreding van deze Spelregels betekent dat de Gebruiker onmiddellijk, zonder voorafgaande kennisgeving, de toegang tot de spel diensten geweigerd kan worden, of dat zulke diensten volledig of gedeeltelijk beperkt worden;\n3.6. Indien een Gebruiker de Spelregels herhaalde keren of op een complexe manier overtreedt, is het Beheer gerechtigd om, naar eigen goeddunken, de beperkingen opgelegd aan de Gebruiker te herhalen;\n3.7. Aangezien het niet altijd mogelijk is de specifieke overtredingen van de Spelregels exact aan te wijzen, blijft de uiteindelijke beslissing altijd voorbehouden aan het Beheer;\n3.8. Deze beperkingen kunnen opgelegd worden aan ieder Account van de Gebruiker dat deze Spelregels overtreedt;\n3.9. Privé berichten zijn bedoeld voor persoonlijke communicatie tussen Gebruikers in de spel diensten en op het Forum. Tijdens het verwerken van klachten over overtredingen van de Spelregels, zal het Beheer klachten over privé berichten niet in overweging nemen, met uitzondering van overtredingen van de Spelregels in privé berichten van leden of assistenten van het Beheer. Een gebruiker kan het ontvangen van privé berichten van een andere gebruiker stopzetten door hem/haar toe te voegen aan de Zwarte lijst in de betreffende sectie of het gebruikersprofiel op het Forum;\n3.10. Het Beheer is op geen enkele wijze verantwoordelijk voor verlies of schade, direct of indirect, die een Gebruiker of derde partij mogelijk heeft geleden als resultaat van het gebruik van de Internet Site, het Spel en/of de Online Faciliteiten inclusief, maar niet beperkt tot, schade veroorzaakt door het onvermogen het Spel en de Online Faciliteiten te gebruiken, of veroorzaakt door oplegging van beperkingen aan de Gebruiker door het Beheer, directe of indirecte schade voortgekomen uit derde partij handelingen, inclusief andere gebruikers van het Spel, gebrek aan internettoegang, diefstal, vernietiging van Materialen, verlies van informatie met betrekking tot het Account van de Gebruiker en beschadiging van de eer, waardigheid en zakelijke reputatie van de Gebruiker ontstaan in verband met het Spel.\n\n4. Assistenten van het Beheer\n\n4.1. Assistenten van het Beheer zijn door het Beheer geselecteerd uit Gebruikers;\n4.2. Een Assistant van het Beheer is een person die in naam en het belang van het Beheer handelt. Assistenten van het Beheer dienen op de orde in het Spel en spel diensten, alsook op het Forum, Chats en officiële sociale media pagina’s en accounts van het Spel toe te zien en deze te behouden;\n4.3. Een Assistant van het Beheer dient eerlijk en objectief te zijn in het maken van beslissingen en dient ook te voldoen aan de bepalingen van deze Spelregels en de Overeenkomst, beleeft te zijn tegen Gebruikers, zijn/haar werkzaamheden efficiënt en regelmatig uit te voeren. De activiteiten van Assistenten van het Beheer worden bepaald en gereguleerd door hun interne richtlijnen;\n4.4. Het is niet toegestaan de werkzaamheden van Assistenten van het Beheer in het openbaar te bespreken op de Fora, Chats, officiële groepen op sociale media van het Spel. Alle klachten over het werk van Assistenten dient naar een beheerder van de betreffende assistentengroep gestuurd te worden;\n4.5. De werkzaamheden van Assistenten van de Moderatie worden op vrijwillige basis uitgevoerd. Een Gebruiker heeft niet het recht bij een Assistent aan te dringen op het opleggen van een beperking.\n\n5. Klachten en Beroepen\n\n5.1. De gebruiker heeft het recht overtredingen van de Spelregels te melden door het maken van een nieuw forum topic in de Overtredingen sectie. Het is nodig de aard van de overtreding duidelijk te specificeren in het nieuwe topic en een schermafbeelding of een video toe te voegen waaruit de overtreding duidelijk blijkt;\n5.2. De gebruiker kan vragen, opmerkingen of klachten aangaande deze Spelregels sturen naar help@tankionline.com. Het beheer zal alles in het werk stellen om zulke verzoeken zo snel mogelijk in behandeling te nemen;\n5.3. Bij het versturen van een klacht dient de Gebruiker de aard van de situatie zo gedetailleerd en duidelijk mogelijk te beschrijven en feitelijke bewijzen, schermafbeeldingen etc. toe te voegen. Klachten over ongegronde beperkingen worden uitsluitend voor interne evaluatie van het werk van het Beheer en de moderator in behandeling genomen. Beslissingen over het opleggen van beperkingen zijn niet onderhevig aan herziening;\n5.4. Indien de gebruiker correspondentie met het Beheer start of een melding over problemen met het Spel of spel diensten maakt, heeft het Beheer het recht alle correspondentie op te slaan.\n \n6. Overige bepalingen\n\n6.1. Het Beheer bestuurt het Spel en past deze Spelregels toe naar eigen goeddunken, maar neemt de mening van de gemeenschap in overweging;\n6.2. Deze Spelregels kunnen zonder voorafgaand bericht door het Beheer gewijzigd worden. De Gebruiker is verplicht deze Spelregels te controleren op veranderingen ten minste eens in de zeven dagen (m.a.w. wekelijks). Indien een dergelijke controle niet gemaakt wordt binnen de vastgestelde periode en de Gebruiker het Spel blijft gebruiken, wordt de gewijzigde versie van deze Spelregels beschouwd als gelezen en geaccepteerd door de Gebruiker;\n6.3. Het Beheer voert een “nultolerantiebeleid” ten aanzien van bedrog en fraude. Indien een Gebruiker, naar de mening van het Beheer, het Beheer of een andere Gebruiker heeft bedrogen of een poging daartoe heeft gedaan, of onjuiste of fictieve informatie, documenten, bewijzen heeft verstrekt en op een andere manier het toepasselijk recht heeft overtreden, behoudt het Beheer zich het recht voor het Account van de Gebruiker te blokkeren en zulke informatie naar eigen goeddunken (samen met de persoonlijke gegevens van de Gebruiker) over te dragen aan een derde partij en/of wetshandhavingsinstanties indien het Beheer dat nodig acht;\n6.4. Het Beheer kan andere bepalingen en beperkingen opleggen in eSports Regels, de regels van competities, toernooien en kampioenschappen. Tegelijkertijd zijn deze Spelregels een integraal onderdeel van de andere regels opgelegd door het Beheer;\n6.5. Gebruiker-ontworpen spel modi (zoals “Red het Goud”) mogen gespeeld worden in iedere modus zolang het een Privé PRO gevecht is. Echter, alle misbruik zoals multing, sabotage of power-leveling tijdens zulke PRO gevechten wordt behandeld volgens de reguliere spelregels."
